# Checks the trip's flights and conditions, then publishes the sealed
# status.bin to the orphan "live" branch that the app reads.
# updater/run.py decides what a run does: inside a hot window (the hours before
# a departure) one job checks every minute until takeoff; in the travel windows
# a run checks once; on the other days around the trip, once an hour. Scheduled
# runs outside all of these end in seconds without any lookups.
# Logs carry counts and mode words only; flight details exist only inside the sealed file.
# run.py also pushes lock-screen alerts (updater/alerts.py) once the VAPID_PRIVATE_KEY
# and PUSH_SUBS secrets exist; without them it skips sending.
name: live status

on:
  schedule:
    # Deliberately generic (the repo is public, so no travel dates here):
    # run.py reads the sealed trip and ends at once outside the windows.
    - cron: "4-59/10 * * 10,11 *"   # every 10 min; travel windows check, hot windows start the minute loop
    - cron: "17 * * 10,11 *"        # hourly: slow mode in the days around the trip
  workflow_dispatch:
    inputs:
      force:
        description: Run even outside the travel windows
        type: boolean
        default: true
      test_alert:
        description: Send a test alert to every phone
        type: boolean
        default: false

permissions:
  contents: write   # push to the live branch

# One run at a time. While the minute loop runs, the next scheduled run waits
# (only the newest waiting run is kept) and takes over when the loop ends.
concurrency:
  group: live-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the minute loop; GitHub's limit for a job is 360
    env:
      # The slow cron is itself the hourly tick, so any minute of it counts
      # (Actions often starts scheduled runs late).
      SLOW: ${{ github.event.schedule == '17 * * 10,11 *' }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # "Alerts are on" to every phone (dispatch with test_alert). Counts only in the log.
      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        continue-on-error: true
        timeout-minutes: 2
        env:
          TRIP_KEY: ${{ secrets.TRIP_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: node updater/push.mjs test

      # hot | travel | slow | idle. A hot window starting within 15 min counts as hot.
      - name: Decide
        id: decide
        timeout-minutes: 5
        env:
          TRIP_KEY: ${{ secrets.TRIP_KEY }}
        run: |
          mode=$(python3 updater/run.py --mode) || mode=travel
          echo "mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Check flights and conditions
        id: once
        if: >-
          steps.decide.outputs.mode != 'hot' &&
          (steps.decide.outputs.mode == 'travel' || env.SLOW == 'true' || env.FORCE == 'true')
        timeout-minutes: 8
        env:
          TRIP_KEY: ${{ secrets.TRIP_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: |
          args=(--source actions)
          if [ "$SLOW" = "true" ]; then args+=(--slow --slow-minutes 60); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 updater/run.py "${args[@]}"

      - name: Publish status.bin
        if: steps.once.outcome == 'success'
        run: bash updater/publish.sh

      # Checks every minute and publishes each time until the window ends
      # (run.py stops itself after 330 min; the next scheduled run carries on).
      - name: Check every minute
        if: steps.decide.outputs.mode == 'hot'
        timeout-minutes: 340
        env:
          TRIP_KEY: ${{ secrets.TRIP_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: python3 updater/run.py --source actions --loop
