.na-nomap{position:absolute;top:30%;left:16px;right:16px;display:flex;gap:8px;align-items:center;justify-content:center;
  font-size:14px;color:var(--mu);text-align:center}

/* category colours for icons on the map and in lists */
.c-food{--c:#C46F24}.c-rest{--c:#3A72B0}.c-water{--c:#1F8CA5}.c-shop{--c:#8160AE}.c-go{--c:#2F8558}.c-sec{--c:#BD555A}
.c-svc{--c:#66706B}.c-lng{--c:#3E7C76}.c-bag{--c:#557287}.c-gate{--c:#4A706D}.c-me{--c:#2F7FD8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .c-food{--c:#E39A58}:root:not([data-theme="light"]) .c-rest{--c:#79A9E0}
  :root:not([data-theme="light"]) .c-water{--c:#5BBFD4}:root:not([data-theme="light"]) .c-shop{--c:#AE95D6}
  :root:not([data-theme="light"]) .c-go{--c:#68BC90}:root:not([data-theme="light"]) .c-sec{--c:#E3979A}
  :root:not([data-theme="light"]) .c-svc{--c:#A0AAA6}:root:not([data-theme="light"]) .c-lng{--c:#86C4BC}
  :root:not([data-theme="light"]) .c-bag{--c:#93AEC0}:root:not([data-theme="light"]) .c-gate{--c:#9CC0BC}
  :root:not([data-theme="light"]) .c-me{--c:#5AA2F0}
}
:root[data-theme="dark"] .c-food{--c:#E39A58}:root[data-theme="dark"] .c-rest{--c:#79A9E0}
:root[data-theme="dark"] .c-water{--c:#5BBFD4}:root[data-theme="dark"] .c-shop{--c:#AE95D6}
:root[data-theme="dark"] .c-go{--c:#68BC90}:root[data-theme="dark"] .c-sec{--c:#E3979A}
:root[data-theme="dark"] .c-svc{--c:#A0AAA6}:root[data-theme="dark"] .c-lng{--c:#86C4BC}
:root[data-theme="dark"] .c-bag{--c:#93AEC0}:root[data-theme="dark"] .c-gate{--c:#9CC0BC}
:root[data-theme="dark"] .c-me{--c:#5AA2F0}

/* top card */
.na-top{position:absolute;z-index:3;top:calc(10px + var(--na-strip));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  background:var(--sheet);color:var(--ink);border-radius:20px;box-shadow:var(--navs);padding:10px 10px 10px 14px}
.na-ey{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mu);min-width:0;min-height:22px}
.na-ey b{color:var(--ink);font-weight:800;letter-spacing:.06em;flex:none}
.na-ey span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* with a route showing: one line, tap for the rest */
.na-tc{display:flex;align-items:center;gap:8px;box-sizing:border-box;width:calc(100% + 24px);min-height:44px;margin:-6px -10px -6px -14px;padding:0 10px 0 14px;
  color:var(--ink);font-size:14px;font-weight:600;line-height:1.3;text-align:left;cursor:pointer}
.na-tc b{flex:none;font-size:13px;font-weight:800;letter-spacing:.06em}
.na-tc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-tc .i,.na-eyb .i{flex:none;font-size:20px;color:var(--mu)}
.na-eyb{box-sizing:border-box;width:calc(100% + 24px);min-height:44px;margin:-10px -10px -6px -14px;padding:0 10px 0 14px;text-align:left;cursor:pointer}
.na-cn{display:flex;flex-direction:column;gap:4px;margin:6px 4px 2px 0;padding:9px 11px;border-radius:14px;background:var(--cr)}
.na-cnt{font-size:16px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.na-cnb{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.35}
.na-cnb>span{flex:1;min-width:0}
.na-cnw{font-size:13px;font-weight:600;color:var(--mu);line-height:1.3}
.na-tone{flex:none;font-style:normal;font-size:13px;font-weight:800;line-height:1.5;padding:0 8px;border-radius:8px;background:var(--ok);color:var(--page)}
.na-tone.tight{background:var(--na-tight);color:var(--page)}
.na-tone.risk{background:var(--ro);color:var(--rog)}
.na-tone.info{background:var(--pill);color:var(--pillt)}
.na-wr{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:600;line-height:1.3}
.na-wr>.i{font-size:18px;color:var(--na-me)}
.na-wt{flex:1;min-width:0}
.na-pill{flex:none;display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:22px;background:var(--pill);color:var(--pillt);
  font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}

/* follow mode banner */
.na-fb{display:flex;gap:12px;align-items:flex-start;padding-right:4px}
.na-fbi{width:52px;height:52px;border-radius:17px;background:var(--na-route);color:var(--na-ic);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.na-fbt{flex:1;min-width:0}
.na-fbt b{display:block;font-size:19px;font-weight:800;line-height:1.22;letter-spacing:-.01em}
.na-fbt small{display:block;font-size:14px;color:var(--mu);line-height:1.3;margin-top:3px}
.na-fbm{display:block;font-size:13px;font-weight:700;color:var(--na-routet);margin-top:5px}
.na-fbn{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.na-fbc{font-size:13px;font-weight:700;color:var(--mu)}

.na-ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--cr);color:var(--ink);flex:none;cursor:pointer}
.na-ib[disabled]{opacity:.35;pointer-events:none}

/* floor switcher and map buttons: one rail on the right, stacked down to the sheet. Its bottom follows
   --na-sheeth, which the sheet's ResizeObserver sets every frame, so it needs no transition of its own. */
.na-rail{position:absolute;z-index:2;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--na-strip) + var(--na-toph) + 22px);
  bottom:calc(var(--na-sheeth) + 12px);display:flex;flex-direction:column;justify-content:flex-end;gap:8px;pointer-events:none;transition:opacity .2s}
.na-rail>*{pointer-events:auto}
/* on a short screen the floors scroll before anything overlaps */
.na-fl{flex:0 1 auto;min-height:88px;display:flex;flex-direction:column;background:var(--sheet);border-radius:16px;box-shadow:var(--navs);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.na-fl::-webkit-scrollbar{display:none}
.na-fl:empty{display:none}
.na-lv{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--mu);position:relative;cursor:pointer}
.na-lv+.na-lv{border-top:1px solid var(--ln)}
.na-lv.on{background:var(--ink);color:var(--page)}
.na-lv.rt::after{content:'';position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ro)}
.na-ctl{flex:none;display:flex;flex-direction:column;gap:8px}
.na-fab{width:44px;height:44px;border-radius:14px;background:var(--sheet);color:var(--ink);box-shadow:var(--navs);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.na-fab.on{color:var(--na-me)}
.na.full .na-rail{opacity:0}
.na.full .na-rail,.na.full .na-rail>*{pointer-events:none}
.na.full .na-map .leaflet-control-attribution{visibility:hidden}

/* bottom sheet */
.na-sh{position:absolute;z-index:4;left:0;right:0;bottom:0;height:min(288px,42%);display:flex;flex-direction:column;
  background:var(--sheet);color:var(--ink);border-radius:24px 24px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.16);
  transition:height .28s cubic-bezier(.32,.72,0,1)}
.na-sh.drag{transition:none}
.na-sh.rt{height:min(336px,48%)}
/* NV-05 short screens: a lower peek so the map keeps its room */
@media (max-height:700px){
  .na-sh{height:30vh}
  .na-sh.rt{height:min(336px,42vh)}
}
.na.full .na-sh{height:calc(100% - var(--na-strip) - 10px)}
.na-sh.auto,.na.full .na-sh.auto{height:auto;max-height:calc(100% - var(--na-strip) - var(--na-toph) - 24px)}
.na-grab{flex:none;display:flex;align-items:center;justify-content:center;height:44px;width:100%;cursor:pointer;touch-action:none}
.na-grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--gh)}
.na-sh.auto .na-grab{pointer-events:none}
.na-sh.auto .na-grab i{opacity:.5}
.na-shc{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* search and chips */
.na-qh{position:sticky;top:0;z-index:1;background:var(--sheet);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:0 max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.na-q{display:flex;align-items:center;gap:8px;height:48px;border-radius:16px;background:var(--cr);padding:0 2px 0 14px;font-size:19px;color:var(--mu)}
.na-q input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:16px;font-weight:500;color:var(--ink);-webkit-appearance:none;appearance:none}
.na-q input::placeholder{color:var(--mu)}
.na-q input::-webkit-search-cancel-button{display:none}
.na-qx{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mu);border-radius:14px;cursor:pointer}
.na-chips{display:flex;gap:8px;overflow-x:auto;margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 2px;padding:0 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.na-chips::-webkit-scrollbar{display:none}
.na-chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:var(--cr);color:var(--ink);
  font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.na-chip .i{font-size:18px}
.na-chip.on{background:var(--ink);color:var(--page)}

/* lists */
.na-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:16px 0 4px}
.na-row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:60px;padding:8px 0;border-bottom:1px solid var(--ln);color:var(--ink);cursor:pointer;text-decoration:none}
.na-row>.i{font-size:20px;color:var(--mu)}
.na-ri{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;background:var(--c,var(--na-route));color:var(--na-ic)}
.na-rtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.na-rtx b{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-rtx small{font-size:13px;color:var(--mu);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-min{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-size:19px;font-weight:800;line-height:1.05;min-width:36px}
.na-min small{font-size:13px;font-weight:600;color:var(--mu)}
.na-nr{color:var(--gh)}
.na-tips{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.45}
.na-tips li{margin:0 0 6px}
.na-cr{font-size:13px;color:var(--mu);margin:18px 0 0;line-height:1.4}
.na-empty{font-size:14px;color:var(--mu);margin:10px 0}

/* route header, summary and step cards */
.na-rh{display:flex;align-items:center;gap:10px;padding:0 0 8px}
.na-rt{flex:1;min-width:0;display:flex;flex-direction:column}
.na-to{font-size:19px;font-weight:800;line-height:1.2;letter-spacing:-.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.na-from{display:flex;align-items:center;gap:2px;max-width:100%;min-height:44px;margin:-8px 0 -10px;padding:0;font-size:14px;font-weight:600;color:var(--mu);
  text-align:left;cursor:pointer}
.na-from>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-from .i{flex:none;font-size:16px}
.na-sr{display:flex;align-items:center;gap:12px;margin:2px 0 8px}
.na-sm{flex:1;min-width:0;margin:0;display:flex;flex-direction:column}
.na-sm b{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.na-sm span{font-size:13px;font-weight:600;color:var(--mu);line-height:1.3;margin-top:2px}
.na-sr .na-go{flex:none;min-width:112px}
.na-note{margin:0 0 8px}
.na-cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain;
  margin:2px -16px 0;padding:4px 16px 8px}
.na-cards::-webkit-scrollbar{display:none}
.na-card{flex:0 0 84%;box-sizing:border-box;scroll-snap-align:start;display:flex;align-items:flex-start;gap:12px;min-height:96px;padding:12px 14px 12px 12px;
  border-radius:18px;background:var(--cr);color:var(--ink);border:2px solid transparent;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.na-cb{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;gap:3px}
.na-card.on{border-color:var(--na-hl);background:var(--sheet);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.na-ci{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;background:var(--na-route);color:var(--na-ic)}
.na-ci.k-arrive,.na-ci.k-via{background:var(--ro);color:var(--rog)}
.na-ci.k-security{background:var(--rob);color:var(--robt)}
.na-ci.k-vert{background:var(--na-vert);color:var(--na-ic)}
.na-ci.k-train{background:var(--na-train);color:var(--na-ic)}
.na-ct{font-size:16px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.na-cs{font-size:13px;color:var(--mu);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.na-cm{padding-top:3px;font-size:13px;font-weight:700;color:var(--na-routet)}
.na-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.na-acts .btn .i{font-size:20px}
.na-go{flex:1 1 auto;min-width:96px}
.na-acts .na-go{min-width:0}
.na-tg{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 13px;border-radius:22px;background:var(--cr);color:var(--ink);
  font-size:14px;font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer}
.na-tg .i{font-size:18px}
.na-tg[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.na-list{list-style:none;margin:0;padding:0}
.na-li{display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer;min-height:56px}
.na-lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.na-lt b{font-size:15px;font-weight:700;line-height:1.3}
.na-lt small{font-size:13px;color:var(--mu);line-height:1.35}
.na-lt em{font-style:normal;font-size:13px;font-weight:700;color:var(--mu)}
.na-li.on .na-lt b{color:var(--na-routet)}
.na-pn{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;margin:2px 0 6px}
.na-pn .i{font-size:18px;color:var(--mu);margin-top:1px}

/* follow mode sheet */
.na-fs{display:flex;align-items:center;gap:12px;padding:0 0 4px}
.na-fsx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.na-fsx b{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-fsx span{font-size:14px;font-weight:600;color:var(--mu)}

/* "I'm at..." picker */
.na-pk{position:absolute;inset:0;z-index:6;background:var(--sheet);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:calc(12px + var(--na-strip)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.na-pk[hidden]{display:none}
.na-pkh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.na-pkh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.na-gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin:6px 0 4px}
.na-gb{height:44px;border-radius:12px;background:var(--cr);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer}

/* no map for this airport */
.na-none{overflow-y:auto;background:var(--sheet)}
.na-nobox{padding:calc(24px + var(--na-strip)) max(20px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.na-noh{margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.na-nop{margin:0 0 14px;font-size:15px;color:var(--mu);line-height:1.45}
.na-nob{margin-top:22px}

/* map markers */
.na-mkw{display:flex;align-items:center;gap:6px;background:none;border:0}
.na-mk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px;
  background:var(--c);color:var(--na-ic);box-shadow:0 0 0 2px var(--sheet),0 2px 6px rgba(0,0,0,.25)}
.na-mkn{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 2px var(--sheet),0 0 3px var(--sheet),0 0 4px var(--sheet),0 0 5px var(--sheet)}
.na-gl{display:flex;align-items:center;justify-content:center;width:100%;height:22px;border-radius:8px;background:var(--na-gate);color:var(--na-gatec);
  font-size:13px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.na-al{display:block;width:100%;text-align:center;font-size:13px;font-weight:700;color:var(--mu);white-space:nowrap;opacity:.95;
  text-shadow:0 0 2px var(--na-air),0 0 4px var(--na-air)}
.na-vb{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px 0 6px;border-radius:14px;background:var(--ink);color:var(--page);
  font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.na-vb .i{font-size:17px}
.na-pin{display:flex;align-items:center;gap:6px}
.na-pin.lf{flex-direction:row-reverse}
.na-pin i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;font-size:18px;
  background:var(--ro);color:var(--rog);box-shadow:0 0 0 3px var(--sheet),0 3px 10px rgba(0,0,0,.3)}
.na-pin.a i{width:22px;height:22px;margin:5px;background:var(--sheet);box-shadow:inset 0 0 0 6px var(--na-route),0 0 0 2px var(--sheet),0 2px 8px rgba(0,0,0,.3)}
.na-pin.v i{background:var(--na-route);color:var(--na-ic)}
.na-pin.f i{background:var(--pill);color:var(--pillt)}
.na-pin.p i{background:var(--ink);color:var(--page)}
.na-pin b{flex:none;font-size:13px;font-weight:800;background:var(--sheet);color:var(--ink);padding:3px 8px;border-radius:9px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.na-pin.off{opacity:.5}
.na-flow{animation:na-flow .9s linear infinite}
@keyframes na-flow{to{stroke-dashoffset:-14}}

/* you are here */
.na-me{position:relative;display:block;width:24px;height:24px}
.na-dot{position:absolute;inset:4px;border-radius:50%;background:var(--na-me);box-shadow:0 0 0 3px #FFFFFF,0 2px 6px rgba(0,0,0,.35)}
.na-halo{position:absolute;inset:-14px;border-radius:50%;background:var(--na-me);opacity:0;animation:na-pulse 2.2s ease-out infinite}
@keyframes na-pulse{0%{transform:scale(.35);opacity:.5}100%{transform:scale(1.3);opacity:0}}
.na-cone{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:none;
  background:conic-gradient(from -32deg,var(--na-me) 0deg 64deg,transparent 64deg 360deg);opacity:.38;transform:rotate(var(--hd,0deg));
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 70%);mask:radial-gradient(circle,#000 18%,transparent 70%)}
.na-me.hd .na-cone{display:block}

@media (prefers-reduced-motion:reduce){
  .na-flow{animation:none}
  .na-halo{animation:none;opacity:.16;transform:scale(1)}
  .na-sh{transition:none}
}
/* short screens: a tighter top card */
@media (max-height:700px){
  .na-top{top:calc(8px + var(--na-strip));padding:8px 8px 8px 12px;border-radius:18px}
  .na-tc{width:calc(100% + 20px);margin:-4px -8px -4px -12px;padding:0 8px 0 12px}
  .na-eyb{width:calc(100% + 20px);margin:-8px -8px -6px -12px;padding:0 8px 0 12px}
  .na-cn{gap:2px;margin-top:4px;padding:7px 10px}
  .na-cnt{font-size:15px}
  .na-wr{margin-top:4px}
  .na-rail{top:calc(var(--na-strip) + var(--na-toph) + 16px)}
}

/* screens/place.css */
/* Place screen (#place/<alias>). Every selector starts with .pl- */

/* ---------- hero: photos ---------- */
.pl-hero{padding-top:2px}
.pl-galw{position:relative;margin:0 -20px}
.pl-gal{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pl-gal::-webkit-scrollbar{display:none}
/* lets the last photo snap to the left edge like the others */
.pl-gal::after{content:"";flex:0 0 calc(16% - 10px)}
.pl-ph{position:relative;display:block;flex:0 0 84%;height:clamp(170px,30vh,250px);border-radius:24px;overflow:hidden;scroll-snap-align:start;background:var(--onband2)}
.pl-ph.pl-one{flex-basis:100%}
.pl-gal:has(.pl-one)::after{display:none}
.pl-ph .pl-img,.pl-dimg .pl-img{display:block;width:100%;height:100%;object-fit:cover}
.pl-cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:15px;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:600}
.pl-cap span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl-cap b{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--eb);flex:none}
.pl-cnt{position:absolute;top:10px;left:30px;display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;
  background:var(--sheet);color:var(--ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
.pl-cnt .i{font-size:15px;color:var(--eb)}
.pl-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:120px;border-radius:24px;
  background:var(--onband2);color:var(--obt);font-size:14px;font-weight:600}
.pl-none .i{font-size:28px;opacity:.8}

/* a photo that could not load */
.pl-bad .pl-img{visibility:hidden}
.pl-badm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;
  text-align:center;font-size:13px;font-weight:600;color:var(--obt);background:var(--onband2)}
.pl-badm .i{font-size:24px;opacity:.8}
.pl-dimg .pl-badm{color:var(--mu);background:var(--cr)}
.pl-lb .pl-badm{background:transparent;font-size:15px;color:var(--ob)}

/* ---------- hero: title + status ----------
   Text on the translucent --onband fill uses --obt (as base .chip.ob does): white on it
   is about 2.2:1 in the light theme, --obt is over 7:1. */
.pl-ttl{margin-top:20px}
.pl-name{margin:12px 0 0;padding-top:2px;color:var(--ob);text-wrap:balance;overflow-wrap:break-word}
.pl-t60{font-size:60px}.pl-t50{font-size:50px}.pl-t42{font-size:42px}.pl-t36{font-size:36px}.pl-t30{font-size:30px}.pl-t26{font-size:26px}
.pl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:14px;font-size:15px;font-weight:600;color:var(--obm)}
.pl-meta>span{white-space:nowrap}
.pl-rate{display:inline-flex;align-items:center;gap:7px}
.pl-rate b{font-weight:800;color:var(--obt)}
.pl-stars{display:inline-flex;gap:1px;font-size:16px;color:var(--obt)}
.pl-sep{opacity:.7}
.pl-where{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:15px;font-weight:600;line-height:1.35;color:var(--obm)}
.pl-where .i{font-size:17px;margin-top:1px}
.pl-stat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.pl-chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:20px;font-size:14px;font-weight:700;
  background:var(--onband);color:var(--obt);white-space:nowrap;max-width:100%}
.pl-chip .i{font-size:17px}
.pl-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pl-ok{background:var(--sheet);color:var(--ink)}
.pl-ok .pl-dot{background:var(--ok)}
.pl-soon{background:var(--rob);color:var(--robt)}
.pl-shut .pl-dot,.pl-na .pl-dot{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
/* the Distance chip asks for your location; 40px to match its row, 44px to the finger */
button.pl-ask{position:relative}
button.pl-ask::after{content:"";position:absolute;inset:-2px 0}
button.pl-ask .i{color:var(--obt)}
button.pl-ask[disabled]{opacity:.7}

/* ---------- sheet ---------- */
.pl-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-acts.pl-n1{grid-template-columns:1fr}.pl-acts.pl-n2{grid-template-columns:repeat(2,1fr)}.pl-acts.pl-n3{grid-template-columns:repeat(3,1fr)}
.pl-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;border-radius:18px;background:var(--cr);
  color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;min-width:0}
.pl-act .i{font-size:23px;color:var(--eb)}
.pl-sec{margin-top:32px}
.pl-sec>.ey:first-child{margin:0 0 12px}
.pl-sum{margin:0;font-size:16px;line-height:1.5}
.pl-facts{margin-top:16px;border-radius:var(--r-lg);background:var(--cr);padding:2px 16px}
.pl-fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.pl-fact+.pl-fact{border-top:1px solid var(--ln)}
.pl-fact>div{min-width:0}
.pl-fact small{display:block;font-size:13px;font-weight:600;color:var(--mu)}
.pl-fact div>span{display:block;font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.pl-fi{width:34px;height:34px;border-radius:12px;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pl-good,.pl-also{margin-top:16px}
/* a label inside a section, quieter than the section head above it */
.pl-lbl{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:8px}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px}
.pl-tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 13px;border-radius:17px;background:var(--cr);color:var(--ink);
  font-size:14px;font-weight:600;line-height:1.2;max-width:100%}

/* what to order */
.pl-dishes{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.pl-dishes::-webkit-scrollbar{display:none}
.pl-dish{flex:0 0 148px;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;text-align:left;min-width:0;border-radius:18px}
.pl-dimg{position:relative;display:block;width:148px;height:148px;border-radius:18px;overflow:hidden;background:var(--cr);margin-bottom:7px}
.pl-dnone{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--mu)}
.pl-dish b{font-size:15px;font-weight:800;line-height:1.25}
.pl-dish small{font-size:13px;color:var(--mu);line-height:1.35}

/* people love / watch out / tips */
.pl-ops{display:grid;gap:10px}
.pl-h3{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:17px;font-weight:800}
.pl-h3 .i{font-size:20px;color:var(--eb)}
.pl-watch .pl-h3 .i,.pl-watch .pl-list .i{color:var(--sdt)}
.pl-list{list-style:none;margin:0;padding:0}
.pl-list li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:15px;line-height:1.4}
.pl-list li .i{font-size:17px;margin-top:2px;color:var(--eb);flex:none}
.pl-tips{list-style:none;margin:0;padding:0}
.pl-tips li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15px;line-height:1.45}
.pl-tips li:first-child{padding-top:0}
.pl-tips li+li{border-top:1px solid var(--ln)}
.pl-tips .pl-fi{background:var(--cr)}
.pl-tips li>span:last-child{padding-top:6px;min-width:0}

/* hours */
.pl-hrs{border-radius:var(--r-lg);background:var(--cr);padding:14px 16px 4px}
.pl-hnow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pl-hnow .pl-shut,.pl-hnow .pl-na{background:var(--sheet);color:var(--ink)}
.pl-tz{font-size:13px;color:var(--mu);font-weight:600}
.pl-tbl{width:100%;border-collapse:collapse;font-size:15px}
.pl-tbl th{text-align:left;font-weight:600;padding:8px 0;white-space:nowrap}
.pl-tbl td{text-align:right;padding:8px 0 8px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.pl-tbl tr+tr th,.pl-tbl tr+tr td{border-top:1px solid var(--ln)}
.pl-today th,.pl-today td{font-weight:800}
.pl-tdy{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:var(--ink);color:var(--page);font-size:12px;font-weight:800;vertical-align:1px}
.pl-off td{color:var(--mu)}
/* the rest of the week, folded away under today */
.pl-hall{border-top:1px solid var(--ln)}
.pl-hall>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;list-style:none;cursor:pointer;
  font-size:15px;font-weight:700;color:var(--eb);-webkit-tap-highlight-color:transparent}
.pl-hall>summary::-webkit-details-marker{display:none}
.pl-hall>summary:active{opacity:.7}
.pl-hall>summary .i{font-size:20px;transition:transform .2s var(--ease)}
.pl-hall[open]>summary .i{transform:rotate(180deg)}
.pl-hall .pl-tbl{margin:-4px 0 6px}
.pl-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding-top:10px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600}
.pl-note .i{font-size:16px;margin-top:1px}

/* details */
/* what Yelp knows about it, two to a row */
.pl-dets{list-style:none;margin:0 0 12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-radius:var(--r-lg);background:var(--cr)}
.pl-dets li{display:flex;gap:8px;align-items:flex-start;min-width:0;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pl-dets .i{font-size:18px;color:var(--eb);flex:none;margin-top:-1px}
.pl-dets .pl-warn .i{color:var(--warn)}
.pl-quiet{margin:0 0 12px;font-size:14px;color:var(--mu)}
.pl-loc{border-radius:var(--r-lg);overflow:hidden;background:var(--cr)}
.pl-map{position:relative;height:180px;background:var(--band)}
.pl-map.pl-nomap{display:none}
.pl-mapc{position:absolute;inset:0;z-index:0}
.pl-mapc.leaflet-container{background:var(--band);font-family:inherit}
.pl-map .pl-mapc .leaflet-control-attribution{margin:0 0 12px 12px;background:var(--sheet);color:var(--mu);font-size:10px;line-height:1.5;padding:1px 6px;border-radius:6px;opacity:.9}
.pl-map .pl-mapc .leaflet-control-attribution a{color:inherit;text-decoration:none}
.pl-mapa{position:absolute;inset:0;z-index:1}
.pl-mapa:focus-visible{outline-offset:-4px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.pl-pin{background:none;border:0}
.pl-pin span{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;
  background:var(--ink);color:var(--page);font-size:20px;box-shadow:0 0 0 3px var(--sheet)}
.pl-pin span::after{content:"";position:absolute;left:50%;top:100%;margin:1px 0 0 -6px;border-style:solid;border-width:8px 6px 0;border-color:var(--ink) transparent transparent}
.pl-addr{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px}
.pl-addr b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.pl-addr small{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.pl-copy{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.pl-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pl-link{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 14px;border-radius:16px;background:var(--cr);color:var(--ink);
  text-decoration:none;font-size:14px;font-weight:700;min-width:0}
.pl-link .i{font-size:18px;color:var(--eb);flex:none}
.pl-link .pl-ext{margin-left:auto;font-size:16px;color:var(--mu)}
.pl-link.pl-wide{grid-column:1/-1}
.pl-foot{display:flex;align-items:center;justify-content:center;gap:6px;margin:34px 0 0;font-size:13px;color:var(--mu);text-align:center}
.pl-foot .i{font-size:15px;flex:none}

/* not found */
.pl-miss{padding:14px 0 10px}

/* ---------- full-screen photo viewer ----------
   --robt is the near-black that stays dark in both themes; --ob stays light. The backdrop is a
   layer of its own so it can fade with a swipe down (--pl-fade) while the photo stays solid. */
.pl-lb{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;color:var(--ob);overscroll-behavior:contain}
.pl-lb::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--robt);opacity:var(--pl-fade,1);transition:opacity .28s var(--ease)}
.pl-lb-live::before{transition:none}
.pl-lb-in{animation:pl-fade .22s ease both}
@keyframes pl-fade{from{opacity:0}to{opacity:1}}
.pl-lb-top{flex:none;position:relative;z-index:1;transition:opacity .2s;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.pl-lb-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.pl-lb-x{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--ob) 16%,transparent);color:var(--ob)}
.pl-lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;
  touch-action:pan-x}
.pl-lb-track::-webkit-scrollbar{display:none}
.pl-lb-s{position:relative;flex:0 0 100%;min-width:0;margin:0;display:flex;flex-direction:column;scroll-snap-align:center;scroll-snap-stop:always;
  padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
.pl-lb-s .pl-img{flex:1 1 0;min-height:0;width:100%;object-fit:contain;display:block}
.pl-lb-s figcaption{flex:none;padding:14px 20px 0;transition:opacity .2s;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl-lb-s figcaption b{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:8px;opacity:.75}
.pl-lb-b{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:color-mix(in srgb,var(--robt) 62%,transparent);color:var(--ob);transition:opacity .2s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ob) 22%,transparent)}
.pl-lb-prev{left:max(10px,env(safe-area-inset-left,0px))}
.pl-lb-next{right:max(10px,env(safe-area-inset-right,0px))}
.pl-lb-b:disabled{opacity:0;pointer-events:none}
/* zoomed: the photo owns every touch and the arrows and caption step aside */
.pl-lb-z .pl-lb-track{overflow-x:hidden;touch-action:none}
.pl-lb-z :is(.pl-lb-b,figcaption),.pl-lb-bare :is(.pl-lb-top,.pl-lb-b,figcaption){opacity:0;pointer-events:none}
.pl-lb-done{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;min-width:96px;height:44px;
  padding:0 24px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ob);
  background:color-mix(in srgb,var(--robt) 62%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ob) 22%,transparent)}

/* screens/today.css */
/* Today (home). Every selector is .td-prefixed; colours are tokens only. */
.td>*+*{margin-top:12px}
.td-a{display:block;text-decoration:none;color:inherit}

/* Heading on the sheet */
.td-head{margin-bottom:6px}
.td-head .hl{font-size:36px;line-height:1.04;margin-top:6px;overflow-wrap:anywhere}
.td-head .hl b{display:inline}
.td-head .sub{flex-wrap:wrap;row-gap:2px;font-size:14px}
/* Status and meta lines: the dot sits on the first line; parts wrap whole. */
.td-st{align-items:flex-start;line-height:1.35}
.td-st>.dot{margin-top:calc(.675em - 4px)}
/* Each part brings its own leading "·"; the row is shifted left by one separator and
   clipped, so the separator that would start a wrapped line is hidden and none dangles. */
.td-mw{display:block;min-width:0;flex:1 1 auto;overflow:hidden}
.td-mt{display:flex;flex-wrap:wrap;margin-left:-16px}
.td-mt>span::before{content:'·';display:inline-block;width:16px;text-align:center}
.td-old{color:var(--rot);font-weight:600}
/* Status dot by status only: on time --eb, caution --warn, late or cancelled rose. */
.td .dot.td-dok{background:var(--eb)}
.td .dot.td-dcau{background:var(--warn)}
.td .dot.td-dbad{background:var(--ro)}

/* Ticket cards */
.td-tk{padding:18px 20px}
.td-tkc{position:relative}
.td-tkdp{font-size:52px;margin:10px 0 14px}
.td-tkr{display:flex;gap:12px;align-items:center;min-width:0}
.td-tkt{font-size:16px;font-weight:800;line-height:1.25}
.td-tks{font-size:14px;color:var(--mu);margin-top:2px}
.td-tk .td-st{margin-top:3px}
.td-sky{right:0;bottom:0;width:132px;height:168px}
.td-desert{right:0;bottom:0;width:156px;height:164px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%);mask-image:linear-gradient(90deg,transparent 8%,#000 52%)}
.td-moon{fill:var(--cr)}
/* On tickets the art sits beside the big codes and fades out above the time row. */
.td-tk .il{top:6px;bottom:auto;right:0;width:124px;height:150px;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.td-tk .td-desert{top:0;width:150px;height:156px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}

/* Sand plan cards */
.td-plan{padding:18px 20px}
.td-planh{display:flex;gap:10px;align-items:flex-start}
.td-big{font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.01em;margin-top:4px;overflow-wrap:anywhere;text-wrap:balance}
.td-lv{flex:none;margin-top:2px}
/* The chip drops under the title so the title keeps the full width. */
.td-planw{flex-wrap:wrap}
.td-planw>.grow{flex:1 0 100%;min-width:0}
.td-planw>.td-lv{order:3;margin-top:10px}
/* Tight connection: --warn outline, ink text (--warn text is too faint on cream). */
.chip.td-chipc{background:transparent;border:1.5px solid var(--warn);color:var(--ink)}
.td-plan .ic,.td-bags .ic,.td-food .ic{flex:none}
.td-cut{margin:12px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.td-nw{white-space:nowrap}
.td-rows{margin-top:12px}
.td-ln{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.td-ln>.i{font-size:17px;margin-top:2px;flex:none}
.td-ln>span{min-width:0;overflow-wrap:anywhere}
.td-ln+.td-ln{margin-top:9px}
.td-lnw{padding:12px 0 4px}
.td-more{display:flex;align-items:center;gap:4px;margin-top:14px;font-size:14px;font-weight:700;color:var(--eb)}
.td-more .i{font-size:16px}

/* Countdown cells */
.td-cn{margin-top:14px}
.td .td-cn>div{display:flex;flex-direction:column;gap:var(--sp-1);background:var(--sheet);padding:10px}
.td-cn small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .td-cn b{margin-top:0}
.td-cn span{font-size:13px}
.td-cn span span{display:inline}
/* The next deadline is ringed in ink; rose (.w) only when the connection is at risk. */
.td .td-cn .td-nx{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* Gate card */
.td-gtop{display:flex;gap:12px;align-items:flex-start}
.td-glbl{font-size:15px;font-weight:600;margin-top:10px}
.td-gnum{width:fit-content;max-width:100%;font-size:92px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:clip}
/* A long gate value (rare) gets a smaller size and wraps instead of being clipped. */
.td-gnum.td-glong{font-size:52px;line-height:1.05;white-space:normal;overflow:visible;overflow-wrap:anywhere}
.td-gnone{font-size:26px;font-weight:800;margin-top:8px}
.td-seat{flex:none;background:var(--sheet);border-radius:16px;padding:8px 12px;text-align:right;max-width:46%}
.td-seat small{display:block;font-size:13px;color:var(--mu)}
.td-seat b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.td-p{margin:10px 0 0;font-size:14px;line-height:1.4}
.td-p .i{font-size:16px;vertical-align:-3px}
.td-mu{color:var(--mu)}

/* Rows in line cards */
.td-line{padding:6px 16px}
.td-pad{padding:16px}
.td-row{display:flex;gap:12px;align-items:center;min-height:60px;padding:8px 0;min-width:0}
.td-row b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.td-row small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.td-row .grow{overflow-wrap:anywhere}
.td-chev{font-size:18px;color:var(--mu);flex:none}
.td-warn{color:var(--rot);font-weight:600}
.td-row small .td-warn{font-weight:700}
.td-ci{display:flex;align-items:center;gap:var(--sp-1);background:var(--cr);border-radius:20px;padding:6px 4px 6px 14px}
.td-ci>.td-row{flex:1 1 auto}
.td-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:22px;
  background:transparent;color:var(--mu);font-size:18px;padding:0;cursor:pointer}
.td-legr .td-st{margin-top:2px}

/* Mini tiles */
.td-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.td-tiles.td-one{grid-template-columns:1fr}
.td-mini{background:var(--cr);border-radius:20px;padding:12px 14px;min-height:80px;min-width:0}
.td-mini b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:800;line-height:1.25;margin-top:4px}
.td-mini small{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.3}
.td-ring{box-shadow:inset 0 0 0 2px var(--ro)}
.td-cau{box-shadow:inset 0 0 0 2px var(--warn)}
/* Weather caution: --warn icon, ink words. */
.td-mini .td-wc{display:flex;align-items:flex-start;gap:var(--sp-1);color:var(--ink);font-weight:600}
.td-wc .i{font-size:14px;color:var(--warn);flex:none;margin-top:1px}
.td-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Banners and callouts */
.td-bn .grow>span+span{margin-top:3px}
.td-got{display:inline-flex!important;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
.td-got .i{font-size:16px;margin:0}
.td-flag{display:flex;align-items:center;min-height:44px;text-decoration:none}
.td-flag>.i:last-child{font-size:18px;flex:none}
.td-stale{display:flex;align-items:center;width:100%;min-height:44px}
.td .co{font-size:14px;align-items:flex-start}
/* Icon centred on the first text line (14px × 1.45 line, 18px icon). */
.td .co>.i{margin-top:1px}

/* Return legs */
.td-legs{padding:10px 0 4px}
.td-leg{display:flex;align-items:center;gap:10px;padding:8px 0;min-width:0}
.td-leg b{display:block;font-size:15px;font-weight:800}
.td-leg small{display:block;font-size:13px;color:var(--mu)}
.td-leg>span{font-size:14px;font-weight:600;text-align:right}
.td-legs .td-more{margin-top:6px}
.td-line .td-legs{padding-top:12px}
.td-flagl{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:700;color:var(--rot);text-decoration:none}
.td-flagl .i{font-size:17px;flex:none}

/* Weather */
.td-wxnow{display:flex;align-items:center;gap:12px;margin-top:8px}
.td-temp{font-size:48px;font-weight:300;letter-spacing:-.03em;line-height:1}
.td-wxnow b{display:block;font-size:15px;font-weight:800}
.td-wxnow small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.3}
.td-wxi{font-size:34px;color:var(--eb);flex:none}
.td-hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:14px}
.td-hr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:14px;background:var(--sheet);min-width:0}
.td-hr small{font-size:13px;color:var(--mu);font-weight:600}
.td-hr .i{font-size:20px;color:var(--eb)}
.td-hr b{font-size:15px;font-weight:800}
.td-hr span{font-size:13px;color:var(--eb);font-weight:600}

/* After the trip */
.td-sum{min-height:150px}
.td-sumr{position:relative;display:flex;gap:28px}
.td-sumr b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.td-sumr small{display:block;font-size:14px;color:var(--mu);margin-top:4px;max-width:9em}
.td-btn{margin-top:16px;width:100%}
.td-route{display:flex;text-decoration:none}
.td-route>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td>.td-route{margin-top:var(--sp-3)}
.td-empty .td-p{color:var(--mu)}
.td-lnci{padding:4px 0 14px}
.td-lnci .td-ln{color:var(--ink)}
.td-line.td-legs{padding:10px 16px 12px}
/* .td-a resets link colour; banners and callouts that are links keep their own. */
.td-a.bn{color:var(--robt)}
.td-a.bn.neutral{color:var(--ink)}
.td-a.co{color:var(--sdt)}
.td-a.co.rose{color:var(--robt)}
.td-a.co.plain{color:var(--ink)}
.td-flag .td-chev{color:inherit}

/* screens/transit.css */
/* Transit, route and hotel screens. Every selector starts with .tr- and every
   colour is a token. */

/* ---------- hero ---------- */
.tr-hero{position:relative;padding-top:2px}
.tr-hero>*{position:relative}
.tr-hero>.tr-bridge{position:absolute;z-index:0}
/* The bridge sits in the band to the right of the direction pills, clear of the title and its
   subline, with its piers running under the sheet. Only the bottom 40% of the drawing has ink,
   so the box's empty top may overlap the subline. */
.tr-bridge{right:-20px;bottom:-30px;width:46%;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.tr-hero>[data-tr="head"],.tr-hero>.tr-ps{z-index:1}
.tr-ey{max-width:100%;line-height:1.35;overflow-wrap:anywhere}
.tr-dp{font-size:56px;margin:10px 0 0;color:var(--ob);overflow-wrap:anywhere}
.tr-hsub{margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.35;color:var(--obm);max-width:300px}
.tr-ps{margin-top:18px;border-radius:24px}
.tr-ps button{height:44px;padding:0 18px;border-radius:20px}

/* route hero */
.tr-rh{display:flex;align-items:center;gap:12px;margin-top:12px;max-width:calc(100% - 40px)}
.tr-rhi{width:48px;height:48px;border-radius:16px;background:var(--onband);color:var(--ob);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tr-rname{margin:0;min-width:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ob);overflow-wrap:anywhere}
.tr-lede{margin:12px 0 0;font-size:14px;font-weight:500;line-height:1.45;color:var(--obm);max-width:330px}
.tr-hl{margin-top:12px}
.tr-hl .tr-mta,.tr-hl .tr-rtag{background:var(--sheet);color:var(--ink)}
.tr-hl .tr-b{box-shadow:0 0 0 2px var(--sheet)}
.tr-hl.tr-lines{gap:6px}

/* hotel hero */
.tr-hn{line-height:.9;letter-spacing:-.02em}
.tr-addr{display:flex;align-items:center;gap:10px;margin-top:14px}
.tr-addr p{margin:0;flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35;color:var(--obm)}
.tr-ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--sheet);color:var(--ink)}
.tr-addr .tr-ib{background:var(--onband);color:var(--ob)}

/* ---------- body rhythm ---------- */
.tr-body>*+*{margin-top:12px}
.tr-body>.sec,.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr]>*{margin-top:12px}
.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr="top"]>:first-child,.tr-body>[data-tr="htop"]>:first-child{margin-top:0}
.tr-body>[data-tr="bot"]>:first-child{margin-top:22px}
.tr-note{margin:10px 2px 0;font-size:13px;line-height:1.4;color:var(--mu)}
.tr-wide{display:flex;width:100%;text-decoration:none}

/* hotel pill */
/* The hotel row and the traffic card under it share padding, radius and a 40px icon tile. */
.tr-pill{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px 12px 12px;border-radius:20px;background:var(--cr);text-decoration:none;color:var(--ink)}
.tr-pin-ic{width:40px;height:40px;border-radius:13px;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tr-pill b{display:block;font-size:15px;font-weight:800}
.tr-pill small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tr-chev{font-size:18px;color:var(--mu)}

/* leave-by card */
.tr-leave .ey{margin:0}
.tr-lrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}
.tr-big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:44px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tr-in{font-size:14px;font-weight:700}
.tr-lt{display:block;font-size:18px;font-weight:800;line-height:1.25;margin-top:6px}
.tr-lp{margin:8px 0 0;font-size:13px;line-height:1.45}

/* traffic and weather */
/* 1.5px border + 10.5px = the hotel row's 12px, so the icons and text line up */
.tr-body .tr-traffic{padding:10.5px 12.5px 10.5px 10.5px;border-radius:20px}
.tr-traffic .ic{background:var(--cr)}
.tr-traffic .rw b{font-size:16px}
.tr-traffic .tr-foot{margin-top:4px}
.tr-wx,.tr-wxa{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding-top:12px;border-top:1.5px solid var(--ln);font-size:13px;font-weight:600;line-height:1.4}
.tr-wx .i,.tr-wxa .i{font-size:18px;color:var(--eb);margin-top:-1px}
.tr-wxa{color:var(--rot)}
.tr-wxa .i{color:var(--rot)}

/* options */
/* icon | name and details | minutes | chevron; the best pick's note runs under the last three */
.tr-op{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;column-gap:12px;align-items:start;min-height:64px;padding:12px 10px 12px 12px;text-decoration:none;color:var(--ink)}
.tr-op.best{box-shadow:inset 0 0 0 2px var(--ink)}
.tr-op .ic{background:var(--sheet)}
.tr-op>.tr-chev{align-self:center;margin-left:-4px}
.tr-opm{display:block;min-width:0;padding-top:1px}
.tr-opn{display:block}
.tr-opn b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.tr-opm small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.tr-opm .tr-warn{display:flex;align-items:center;gap:5px;color:var(--rot);font-weight:600}
.tr-best{grid-column:2/-1;display:block;margin-top:10px}
.tr-best b{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 8px;border-radius:var(--r-pill);background:var(--ink);color:var(--page);font-size:12px;font-weight:800;white-space:nowrap}
.tr-best b .i{font-size:14px}
.tr-best>span{display:block;margin-top:6px;font-size:13px;line-height:1.4}
.tr-opt{flex:none;text-align:right;padding-top:1px}
.tr-opt b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:21px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr-opt small{display:block;font-size:13px;color:var(--mu)}
.tr-lines{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.tr-lines .tr-b{font-size:14.5px;vertical-align:0;flex:none}
.tr-mta{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;line-height:1;flex:none}
.tr-rtag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;flex:none;white-space:nowrap}

/* alerts */
.tr-alerts{display:grid;gap:8px}
.tr-sub{margin:14px 0 8px;color:var(--mu)}
.tr-alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:18px;background:var(--cr)}
.tr-alert .grow{min-width:0}
/* three lines, then More */
.tr-alert p{margin:1px 0 0;font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.tr-alert.open p{display:block;-webkit-line-clamp:unset;overflow:visible}
.tr-alert p .tr-mta{width:20px;height:20px;vertical-align:1px;margin:0 1px}
.tr-alert p .tr-b{font-size:13px;margin:0 1px}
.tr-af{display:flex;align-items:center;gap:8px;margin-top:4px}
.tr-alert small{display:block;font-size:13px;color:var(--mu)}
.tr-more{display:none;align-items:center;height:44px;margin:-12px -14px -11px auto;padding:0 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:700}
.tr-alert.cut .tr-more,.tr-alert.open .tr-more{display:inline-flex}

/* chips and link rows */
/* two equal columns (three on a route with no ride apps) so every chip is a big target */
.tr-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tr-links.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tr-links .tr-chip{justify-content:center;min-width:0;max-width:none}
.tr-links .tr-span{grid-column:1/-1}
.tr-after{margin-top:8px}
.tr-copy{width:100%}
.tr-copy .grow{min-width:0}
.tr-gap>*+*{margin-top:12px}
.tr-nofood{margin-top:12px}
.tr-chip{height:44px;padding:0 16px;border-radius:22px;font-size:14px}
.tr-chip .i{font-size:16px}
.tr-lk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;border-radius:16px;background:var(--sheet);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.tr-lk .i{font-size:18px;color:var(--eb)}
.tr-lk small{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-top:1px}
.tr-lkc{min-height:56px;background:var(--cr);border-radius:18px}
.tr-where .tr-lk{margin-top:12px}

/* tips */
.tr-tips ul{margin:0;padding-left:18px}
.tr-tips li{font-size:14px;line-height:1.45}
.tr-tips li+li{margin-top:8px}
.tr-tips li::marker{color:var(--eb)}

/* route detail */
.tr-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr-tiles .tile{background:var(--cr)}
.tr-tiles .tile b{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.tr-tiles .tile span{display:block;font-size:13px;color:var(--mu);line-height:1.3}
.tr-tiles .tile:nth-child(3){grid-column:1/-1}
.tr-co{text-decoration:none}
.tr-co.tr-alt{align-items:center;min-height:48px}
.tr-co.tr-alt>.i:last-child{font-size:16px;color:var(--mu)}
.tr-wr+.tr-wr{margin-top:12px}
.tr-where .ey,.tr-when .ey,.tr-conf .ey{margin:0 0 10px}

.tr-steps{list-style:none;margin:0;padding:0}
.tr-st{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:16px}
.tr-st:last-child{padding-bottom:0}
.tr-st:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;border-radius:1px;background:var(--ln)}
.tr-sti{width:40px;height:40px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.tr-st p{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.tr-st small{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:13px;color:var(--mu)}
.tr-stm{flex:none;margin-top:10px;font-size:13px;font-weight:700;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- maps ---------- */
/* The map on the page is a picture: a swipe on it scrolls the page, a tap opens the full map. */
.tr-mapc{position:relative;border-radius:22px;overflow:hidden;isolation:isolate}
.tr-mapc,.tr-mapc .tr-map{touch-action:pan-y}
.tr-map{--tr-land:var(--cr);--tr-park:var(--ok);--tr-road:var(--tile);--tr-edge:var(--ln);
  position:relative;height:280px;background:var(--tile);z-index:0}
.tr-hmap{height:300px}
.tr-map.leaflet-container{background:var(--band);font-family:inherit}
.tr-map.tr-nomap{height:120px;background:var(--cr)}
.tr-mapph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;text-align:center;font-size:13px;font-weight:600;color:var(--mu)}
.tr-mapph .i{font-size:18px}
.tr-map.tr-ready .tr-mapph{display:none}
.tr-map.leaflet-container .leaflet-control-attribution{margin:0 0 8px 8px;padding:1px 6px;border-radius:6px;background:var(--sheet);color:var(--mu);font-size:10px;line-height:1.5;opacity:.9}
.tr-map .leaflet-control-attribution a{color:inherit;text-decoration:none}
.tr-mapa{position:absolute;inset:0;z-index:1;display:block;width:100%;padding:0;border:0;border-radius:inherit;background:none;color:var(--ink);-webkit-tap-highlight-color:transparent}
.tr-mapa:active{scale:none;opacity:1}
.tr-mapa:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ink)}
.tr-mapx{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;font-size:20px;
  background:var(--sheet);color:var(--ink);box-shadow:0 2px 10px var(--gh);transition:scale .15s ease}
.tr-mapa:active .tr-mapx{scale:.92}
.tr-map.tr-nomap~.tr-mapa{display:none}
.tr-zb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--sheet);color:var(--ink);box-shadow:0 2px 10px var(--gh)}

/* Full-screen map: takes every gesture, held to the area around the trip. */
.tr-full{position:fixed;inset:0;z-index:15;background:var(--band);overscroll-behavior:contain}
.tr-full-in{animation:tr-fade .2s ease both}
@keyframes tr-fade{from{opacity:0}}
.tr-full .tr-fmap{position:absolute;inset:0;height:auto;touch-action:none}
.tr-full .tr-map.leaflet-container .leaflet-control-attribution{margin-left:calc(env(safe-area-inset-left) + 8px);margin-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.tr-fc{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);display:grid;gap:16px}
.tr-fz{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){.tr-full-in{animation:none}.tr-mapx{transition:none}}
.tr-mapbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:10px}
.tr-mapbar .tr-chip[aria-disabled="true"]{opacity:.6;pointer-events:none}
.tr-leg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
.tr-leg .i{font-size:16px;color:var(--eb)}
.tr-leg .i+.i,.tr-leg .i:not(:first-child){margin-left:6px}

.tr-pinw{background:none;border:0}
.tr-pinw.tr-fhit{display:flex;align-items:center;justify-content:center}
.tr-mpin{--tr-pc:var(--ink);--tr-pt:var(--page);position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  background:var(--tr-pc);color:var(--tr-pt);font-size:18px;box-shadow:0 0 0 3px var(--sheet),0 4px 12px var(--gh)}
.tr-mpin::after{content:"";position:absolute;left:50%;top:100%;margin:1px 0 0 -6px;border-style:solid;border-width:8px 6px 0;border-color:var(--tr-pc) transparent transparent}
.tr-mpin.ho,.tr-mpin.mid{--tr-pc:var(--eb);--tr-pt:var(--sheet)}
.tr-me{display:block;width:18px;height:18px;margin:2px;border-radius:50%;background:var(--eb);box-shadow:0 0 0 3px var(--sheet),0 0 0 9px var(--ht)}
.tr-fpin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:800;
  box-shadow:inset 0 0 0 2px var(--ink),0 3px 8px var(--gh)}

/* ---------- hotel ---------- */
.tr-conf .tr-cr{display:flex;align-items:center;gap:8px}
.tr-code{flex:1;min-width:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:24px;font-weight:800;letter-spacing:.1em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tr-cn{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--mu)}
.tr-dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tr-db{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:18px;background:var(--cr);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.tr-db .i{font-size:22px;color:var(--eb)}
.tr-places{display:grid;gap:8px;margin-top:12px}
.tr-place{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--cr);text-decoration:none;color:var(--ink)}
.tr-num{width:32px;height:32px;border-radius:50%;background:var(--sheet);box-shadow:inset 0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.tr-place b{display:block;font-size:15px;font-weight:800}
.tr-place small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tr-place .tr-hrs.open{color:var(--ok)}
.tr-place .tr-hrs.closing{color:var(--rot)}
.tr-pd{flex:none;text-align:right}
.tr-pd b{font-size:15px;white-space:nowrap}
.tr-dp.tr-he{font-size:44px}
.tr-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 20px 20px}
.tr-empty .ic{width:56px;height:56px;border-radius:18px;font-size:26px}
.tr-empty b{font-size:18px;font-weight:800}
.tr-empty p{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
.tr-empty .btn{margin-top:4px}

/* screens/unlock.css */
/* Unlock screen. No scrolling: the band takes the spare height and the
   sheet hugs the form at the bottom, in reach of the thumb. */
#view[data-screen="unlock"] #hero{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
#view[data-screen="unlock"] #body{flex:none;display:flex;flex-direction:column;padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom,0px))}
.unl-hero{padding-top:var(--sp-4)}
.unl-big{font-size:96px;margin:14px 0 16px;color:var(--ob)}
.unl-lede{margin:0;font-size:16px;line-height:1.4;max-width:30ch;color:var(--obt);text-wrap:pretty}
.unl{margin-top:auto}
.unl .fld>span{margin-left:0}
.unl-row{display:flex;gap:var(--sp-2);align-items:center}
.unl-row .inp{flex:1;min-width:0}
.unl-eye{width:50px;height:50px;border-radius:16px}
.unl .co{font-weight:400;line-height:1.45}

/* Dark: the default hairline and the cream eye button nearly vanish on the sheet. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .unl .inp{border-width:1px}
  :root:not([data-theme="light"]) .unl .inp:not(:focus):not(.bad){border-color:color-mix(in srgb,var(--mu) 60%,transparent)}
  :root:not([data-theme="light"]) .unl-eye{background:var(--onband2)}
}
:root[data-theme="dark"] .unl .inp{border-width:1px}
:root[data-theme="dark"] .unl .inp:not(:focus):not(.bad){border-color:color-mix(in srgb,var(--mu) 60%,transparent)}
:root[data-theme="dark"] .unl-eye{background:var(--onband2)}

@media (max-width:360px){
  .unl-big{font-size:80px}
}
/* Short phones (SE): keep the form on screen without scrolling. */
@media (max-height:700px){
  .unl-big{font-size:72px;margin:var(--sp-2) 0 var(--sp-3)}
}

/* screens/wallet.css */
/* Wallet, Settings, Data & offline, Add to Calendar */
/* Compact header on the task screens (Wallet, Settings, Data, Calendar, Alerts): eyebrow, a 28px title
   and an optional line, so the first control sits near the top. */
.wl-hero .wl-ey{display:flex;align-items:center;gap:var(--sp-1h)}
.wl-hero .wl-ey .i{font-size:15px}
.wl-hero .wl-hl{font-size:28px;line-height:1.1;margin-top:var(--sp-1)}
.wl-hero .wl-lede{margin:var(--sp-2) 0 0;font-size:15px;line-height:1.4;max-width:34ch;color:var(--obm);text-wrap:pretty}

.wl [hidden]{display:none!important}
.wl>.sec{margin-top:var(--sp-7)}
.wl>.sec:first-child{margin-top:0}
.wl .wl-sh{margin:0 0 var(--sp-3)}
.wl .help,.wl .wl-hint{font-size:13px;line-height:1.45;color:var(--mu);margin:var(--sp-2) 0 0 2px;text-wrap:pretty}
.wl .wl-col>.help{margin-top:0}
.wl .wl-p{font-size:15px;line-height:1.45;margin:0}
.wl .wl-p+.wl-p{margin-top:8px}
.wl .wl-ver{margin:var(--sp-7) 0 0 2px;font-size:12px;color:var(--mu)}
.wl .wl-gap{margin-top:12px}
.wl .wl-wide{display:flex;width:100%}
.wl a.btn,.wl .wl-link{text-decoration:none}
.wl .wl-col{display:flex;flex-direction:column;gap:8px}
.wl .wl-wide .i{font-size:19px}
.wl .wl-ib{width:44px;height:44px;border-radius:14px}
.wl .wl-ib[aria-disabled="true"]{opacity:.4;pointer-events:none}
.wl .wl-card{background:var(--cr);border-radius:22px;padding:16px}
.wl .wl-card .ic{background:var(--sheet)}
.wl .wl-empty b{display:block;font-size:17px;font-weight:800}
.wl .wl-empty p{margin:8px 0 0;font-size:14px;line-height:1.4;color:var(--mu)}
.wl .wl-rows{padding:6px 16px}
.wl .wl-rows>.wl-r{padding:10px 0}
.wl .wl-rows>.wl-r+.wl-r{border-top:1px solid var(--ln)}
.wl .wl-r .dot{margin-left:4px}
.wl .co .i{flex:none}

/* code tiles */
.wl .wl-code{display:flex;align-items:center;gap:var(--sp-2);background:var(--cr);border-radius:18px;padding:8px 6px 8px 16px;min-height:62px}
.wl .wl-code small{display:block;font-size:13px;font-weight:600;color:var(--mu)}
.wl .wl-cv{display:block;font-size:19px;font-weight:800;letter-spacing:.12em;margin-top:2px;overflow-wrap:anywhere}
.wl .wl-cb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--eb);flex:none}
.wl .wl-cb:active{background:var(--sheet)}
.wl .wl-cb[aria-pressed="true"]{background:var(--sheet)}
.wl .wl-addrow{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px 8px 10px;border-radius:18px;
  background:var(--cr);text-align:left;color:var(--ink);transition:background var(--press)}
.wl .wl-addrow:active{background:color-mix(in srgb,var(--ink) 6%,var(--cr))}
.wl .wl-addrow b{display:block;font-size:15px;font-weight:800}
.wl .wl-addrow small{display:block;font-size:13px;color:var(--mu);line-height:1.35;margin-top:1px}
.wl .wl-addrow>.i{font-size:20px;color:var(--eb)}
.wl .wl-addic{width:40px;height:40px;border-radius:13px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.wl .wl-inrow{display:flex;gap:8px;align-items:center}
.wl .wl-inrow .inp{flex:1;min-width:0}
.wl .wl-inrow .wl-ib{height:50px;width:50px;border-radius:16px}
.wl .wl-up{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wl .wl-up::placeholder{text-transform:none;letter-spacing:0;font-weight:400}
.wl .inp::placeholder{color:var(--mu);opacity:1}
.wl .wl-link{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:var(--sp-3);font-size:15px;font-weight:700;color:var(--eb)}
.wl .wl-link .i{font-size:18px}

/* travelers */
.wl .wl-name{display:flex;gap:8px;align-items:center}
.wl .wl-name .inp{flex:1;min-width:0}
.wl .wl-name .wl-ib{height:50px;width:50px;border-radius:16px;background:transparent;color:var(--mu)}
.wl .wl-add{margin-top:10px}

/* seats */
.wl .wl-leg{background:var(--cr);border-radius:22px;padding:14px}
.wl .wl-leg+.wl-leg{margin-top:10px}
.wl .wl-leg-h{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:2px;margin:0 2px 10px}
.wl .wl-leg-h b{font-size:15px;font-weight:800}
.wl .wl-leg-h span{font-size:13px;color:var(--mu)}
.wl .wl-leg-h .wl-tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.wl .wl-seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wl .wl-seat{display:block;background:var(--sheet);border-radius:16px;padding:8px 12px 4px}
.wl .wl-seat>span{display:block;font-size:13px;font-weight:600;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .wl-si{height:44px;border:0;padding:0;border-radius:0;background:transparent;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.wl .wl-si::placeholder{font-size:16px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--eb);opacity:1}
.wl .wl-seat:focus-within{box-shadow:inset 0 0 0 1.5px var(--eb)}
.wl .wl-seat:has(.bad){box-shadow:inset 0 0 0 1.5px var(--ro)}
.wl .wl-leg .err{margin-top:8px}

/* steppers */
.wl .wl-step{display:flex;align-items:center;gap:12px;background:var(--cr);border-radius:20px;padding:8px}
.wl .wl-step .wl-ib{background:var(--sheet);color:var(--ink)}
.wl .wl-step-v{flex:1;min-width:0;text-align:center}
.wl .wl-step-v b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.wl .wl-step-v span{display:block;font-size:13px;color:var(--mu)}

/* hotel, notes */
.wl .wl-th{background:var(--cr);border-radius:18px;padding:12px}
.wl .wl-th .ic{background:var(--sheet)}
.wl .wl-ta{display:block;height:auto;min-height:96px;padding:12px 14px;line-height:1.4;resize:none;field-sizing:content;max-height:320px;font-size:17px}
.wl .wl-info{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--mu);margin:10px 0 0 2px}
.wl .wl-info .i{font-size:16px;margin-top:1px;flex:none}

/* clear */
.wl .wl-clr{color:var(--rot)}
.wl .wl-clr .i{color:var(--rot)}

/* deep-link arrival (#wallet/hotel etc.): one soft flash, opacity only */
.wl .sec.wl-flash{position:relative}
.wl .sec.wl-flash::before{content:'';position:absolute;inset:-10px -10px -10px;border-radius:var(--r-lg);z-index:-1;pointer-events:none;
  background:color-mix(in srgb,var(--eb) 14%,transparent);opacity:0;animation:wl-flash 1.5s ease-out}
@keyframes wl-flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* confirm panels */
.wl .wl-confirm{background:var(--rob);color:var(--robt);border-radius:22px;padding:16px}
.wl .wl-confirm b{display:block;font-size:17px;font-weight:800}
.wl .wl-confirm p{margin:6px 0 14px;font-size:14px;line-height:1.4}
.wl .wl-confirm .btn{padding:0 12px}
.wl .wl-confirm .wl-cancel{background:transparent;color:var(--robt);box-shadow:inset 0 0 0 1.5px var(--robt)}
.wl .wl-confirm .btn.rose{background:var(--robt);color:var(--rob)}

/* saved indicator */
.wl .wl-saved{position:fixed;z-index:9;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);
  display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--ink);color:var(--page);
  font-size:13px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1)}
.wl .wl-saved.on{opacity:1;transform:translate(-50%,0)}
.wl .wl-saved.bad{background:var(--ro);color:var(--rog)}
.wl .wl-saved .i{font-size:16px}

/* settings */
.wl .wl-seg{display:flex;width:100%;gap:var(--sp-1h)}
.wl .wl-seg button{flex:1;justify-content:center;height:44px;border-radius:18px;font-size:15px;padding:0 8px}
.wl .wl-seg button .i{font-size:18px}
.wl .wl-lv{background:var(--cr);border-radius:18px;padding:12px 14px}
.wl .wl-lv b{display:block;font-size:15px;font-weight:800}
.wl .wl-lv span{display:block;font-size:14px;line-height:1.4;margin-top:4px;color:var(--mu)}
.wl .wl-lv b span{display:inline;font-size:inherit;margin:0;color:inherit}

/* data */
.wl .wl-list{list-style:none;margin:0;padding:6px 16px;background:var(--cr);border-radius:22px}
.wl .wl-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:15px;line-height:1.35}
.wl .wl-list li+li{border-top:1px solid var(--ln)}
.wl .wl-list li .i{font-size:18px;color:var(--ok);margin-top:1px;flex:none}
.wl .wl-list li.no{color:var(--mu)}
.wl .wl-list li.no .i{color:var(--mu)}
.wl .wl-job{background:var(--cr);border-radius:22px;padding:16px}
.wl .wl-job .ic{background:var(--sheet)}
.wl .wl-job .rw.c{align-items:flex-start}
.wl .wl-bar{height:8px;border-radius:4px;background:var(--sheet);overflow:hidden;margin-top:14px}
.wl .wl-bar i{display:block;height:100%;border-radius:4px;background:var(--eb);transition:width .3s}
.wl .wl-use{margin-top:12px;font-size:13px;line-height:1.4;color:var(--mu);padding:0 2px}
.wl .wl-use b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.wl .wl-use span{display:block}


</style>

    for (let j = 0; j < ns; j++, si++) {

    A: {g: new Float64Array(nN), st: new Int32Array(nN), cl: new Int32Array(nN), pr: new Int32Array(nN)},
    D: {g: new Float64Array(nN), st: new Int32Array(nN), cl: new Int32Array(nN)}};
}

// Nearest point on the street map within maxR metres (optionally inside one component).
// A bridge or footbridge deck (flag 2) is taken only when it is clearly the closest thing:
// within BR_SNAP m with no street or path within max(BR_SNAP, d + 25) m, or within 10 m with
// nothing else within d + 15 m. So a point under the Manhattan Bridge or beside the High Line
// snaps to the ground (same rule as tools/walk_build.py check()).
// -> {k edge, t metres along its geometry from node a, f fraction, x, y, d distance} | null
function snap(x, y, maxR, comp = -1) {

  const cx = Math.floor((x - x0) / CELL), cy = Math.floor((y - y0) / CELL);
  // [0] ground, [1] bridge deck (only looked for within BR_SNAP)
  const bd = [maxR * maxR, Math.min(maxR, BR_SNAP) ** 2], bp = [-1, -1], bu = [0, 0];
  for (let r = 0; ; r++) {
    const lim = (r - 1) * CELL;

    for (let yy = cy - r; yy <= cy + r; yy++) {
      if (yy < 0 || yy >= gh) continue;
      const full = yy === cy - r || yy === cy + r;
      for (let xx = cx - r; xx <= cx + r; xx += full ? 1 : 2 * r) {
        if (xx < 0 || xx >= gw) continue;
        const c = yy * gw + xx;
        for (let i = CS[c]; i < CS[c + 1]; i++) {
          const s = CL[i];
          if (comp >= 0 && CO[EA[PE[s]]] !== comp) continue;
          const ax = PX[s], ay = PY[s], dx = PX[s + 1] - ax, dy = PY[s + 1] - ay, L2 = dx * dx + dy * dy;
          let u = L2 > 0 ? ((x - ax) * dx + (y - ay) * dy) / L2 : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          const qx = ax + u * dx - x, qy = ay + u * dy - y, d2 = qx * qx + qy * qy, j = EF[PE[s]] & 2 ? 1 : 0;

}

// A* between two snaps (same component). -> {cost, end node | -2 (same edge)} or null
function astar(s, t) {

  let best = Infinity, end = -1;
  if (s.k === t.k) { best = EW[s.k] * Math.abs(s.f - t.f); end = -2; }
  const seed = (n, c) => {
    if (A.st[n] !== st || c < A.g[n]) { A.st[n] = st; A.g[n] = c; A.pr[n] = -1; hpush(n, c + 0.98 * Math.hypot(X[n] - tx, Y[n] - ty)); }
  };

    if (HTOP >= best) break;
    A.cl[u] = st;
    const gu = A.g[u];
    if (u === na && gu + ta < best) { best = gu + ta; end = u; }
    if (u === nb && gu + tb < best) { best = gu + tb; end = u; }

// Points of edge k from geometry distance t0 to t1 (either direction), flat [x,y,...]
function sub(k, t0, t1) {

        out.push(PX[p] + u * (PX[p + 1] - PX[p]), PY[p] + u * (PY[p + 1] - PY[p]));

  if (t0 <= t1) { for (let p = a; p <= b; p++) if (PC[p] > t0 && PC[p] < t1) out.push(PX[p], PY[p]); }

function pieces(s, t, res) {

    out.push({k, t0, t1, n0, n1, m, pts: sub(k, t0, t1)});

  let u = res.end;
  while (A.pr[u] !== -1) {

    chain.push([e, v, u]); u = v;
  }

const bearing = (dx, dy) => (Math.atan2(dx, dy) / RAD + 360) % 360;

function compass(b, x, y) {
  if (inPoly(x, y, GRID)) return ['north', 'east', 'south', 'west'][Math.round((((b - 29) % 360) + 360) % 360 / 90) % 4];
  return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(b / 45) % 8];

function labelOf(pc) {
  const {EF, EN, names} = G, f = EF[pc.k], ni = EN[pc.k], nm = names[ni];
  if (f & 4 && nm === 'steps') return 'steps';
  const bn = bridgeName(nm);

  if (f & 2 && ni === 0) return 'bridge:footbridge';
  if (f & 1) {
    const i = Math.floor(pc.pts.length / 4) * 2, x = pc.pts[i], y = pc.pts[i + 1];
    for (const [pn, pp] of PARKS) if (inPoly(x, y, pp)) return 'park:' + pn;
  }

const sameLab = (a, b) => a === b || (a.startsWith('st:') && b.startsWith('st:') && baseName(a.slice(3)) === baseName(b.slice(3)));

function buildSteps(P, dS, dT) {

      last.m += pc.m; last.pts.push(...pc.pts);

  // neighbour, then re-join equal neighbours

    let i = gs.findIndex(g => g.m < 20);
    if (i < 0) i = gs.findIndex((g, j) => j > 0 && j < gs.length - 1 && g.m < 60 && sameLab(gs[j - 1].lab, gs[j + 1].lab));
    if (i < 0) break;
    const g = gs[i];
    if (i === 0) { const n = gs[1]; n.m += g.m; n.pts = g.pts.concat(n.pts); }
    else { const p = gs[i - 1]; p.m += g.m; p.pts.push(...g.pts); }

        gs[j - 1].m += gs[j].m; gs[j - 1].pts.push(...gs[j].pts); gs.splice(j, 1);
      }

      else if (kind === 'bridge') { text = `Head ${c} across the ${br}`; icon = 'route'; }
      else if (kind === 'steps') { text = `Head ${c} up the steps`; icon = 'stairs'; }
      else if (kind === 'path') { text = `Head ${c} on the path`; icon = 'navigation'; }
      else if (kind === 'street') { text = `Head ${c}`; icon = 'navigation'; }

      if (kind === 'park') { text = `Enter ${nm} and follow the path`; icon = 'leaf'; }
      else if (kind === 'bridge') { text = `Cross the ${br}`; icon = 'route'; }
      else if (kind === 'steps') { text = 'Take the steps'; icon = 'stairs'; }
      else if (kind === 'path') { text = a < 25 ? 'Follow the path' : `${T} onto the path`; icon = ti; }
      else if (kind === 'street') { text = a < 25 ? 'Continue straight' : `${T} onto the side street`; icon = ti; }
      else { text = `${T} onto ${nm}`; icon = ti; }

// signalled avenue crossings: going straight through a node where a major street crosses
function crossings(P) {
  const {AS, AE, EN, EF, MJ, BN} = G;
  let n = 0;
  for (let i = 0; i < P.length - 1; i++) {
    const v = P[i].n1, a = P[i], b = P[i + 1];
    if (v < 0 || a.pts.length < 4 || b.pts.length < 4) continue;
    const pa = a.pts, pb = b.pts, la = pa.length;
    const d = Math.abs(turnD(bearing(pa[la - 2] - pa[la - 4], pa[la - 1] - pa[la - 3]), bearing(pb[2] - pb[0], pb[3] - pb[1])));

      const e = AE[j];

function offline(a, b, why) {
  const m = gd(a, b) * 1.3, sec = m / SPEED * 60;

  if (m > 1) {
    const c = compass(bearing(px(b.lon) - px(a.lon), py(b.lat) - py(a.lat)), px(a.lon), py(a.lat));
    out.steps = [{text: `Head ${c}${why ? ' · ' + why : ''}`, m: out.m, icon: 'compass'}];
  }
  return out;
}

// Walk between two points. A snap may be passed in for either end (station entrances).

  let s = sa || snap(ax, ay, SNAP_M), t = sb || snap(bx, by, SNAP_M);

    const t2 = snap(bx, by, SNAP_M, CO[EA[s.k]]), s2 = snap(ax, ay, SNAP_M, CO[EA[t.k]]);

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let nyF = null;
function nyClock(d) {

// trains per hour of pattern q at its stop index qi, at tAbs seconds after NY midnight of day wd0

// Frequency-based RAPTOR: exactly k rides in round k. -> journeys [{k, total, legs:[{p,bi,j,b,a}]}]
function raptor(acc, egr, T0, wd0, ban) {

const rinfo = id => {
  const r = (S && S.routes[id]) || FALLBACK[id] || null;

// MTA classic colours (same as tools/subway_build.py CLASSIC) for badges drawn before subway.json has loaded
const FALLBACK = (() => {
  const o = {}, put = (ids, color, text = 'FFFFFF') => ids.split(' ').forEach(i => { o[i] = {short: i, color, text}; });
  put('1 2 3', 'EE352E'); put('4 5 6', '00933C'); put('7', 'B933AD'); put('A C E', '0039A6'); put('B D F M', 'FF6319');
  put('G', '6CBE45'); put('J Z', '996633'); put('L', 'A7A9AC'); put('N Q R W', 'FCCC0A', '000000');
  o.GS = {short: 'S', color: '808183', text: 'FFFFFF'}; o.FS = o.GS; o.H = o.GS;

function hopPath(a, b) {

const stopRef = i => { const s = S.stops[i]; return {stop: s.id, name: dash(s.name), lat: s.lat, lon: s.lon}; };

// Platform direction label for a ride, or '' when it would not help: the per-route label

// pick station complexes at one end: up to 6 within 1.3 km, else up to 3 within 2 km
function pickEnds(ec) {

      if (lines.some((x, i) => i && x === lines[i - 1])) continue;
      const sig = J.legs.map(l => `${l.b}>${l.a}:${S.PG[l.p]}`).join('|');

function nearList(p, n, exit) {
  if (!S || !isPt(p) || gd(p, MID) > FAR_M) return [];

      const c = ec[e];

    const en = S.E.list[e], ep = {lat: en.lat, lon: en.lon}, cx = S.cx[c];
    const w = exit ? walkCore(ep, p, S.E.sn[e] || null, null) : walkCore(p, ep, null, S.E.sn[e] || null);

// Each time the trip passes through the airport.

// Guide hours text → {all} | {a, b} minutes after midnight (b may pass 1440) | null.

// ---------- tiles ----------

// ---------- callouts ----------

// ---------- steps ----------
// Guide text as sentences, so a sentence the data has already answered can be dropped.
const sentences = s => str(s).match(/[^.!?]+(?:[.!?]+|$)/g) || [];
const dropS = (s, re) => sentences(s).filter(x => !re.test(x)).join('').trim();
// Transit's pick for a direction when Transit shares it (N.bestRoute): {id, name, mins, leave}.
// Transit names its directions 'to-hotel' / 'to-lga'; the bare names are tried too.
function transitPick(kind) {
  if (typeof N.bestRoute !== 'function') return null;
  for (const k of [`to-${kind}`, kind]) {
    try { const r = N.bestRoute(k, N.now()); if (r && r.name) return r; } catch (e) { /* not a direction Transit knows */ }
  }
