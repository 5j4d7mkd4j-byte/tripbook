.pl-lb-s .pl-img{flex:1 1 0;min-height:0;width:100%;object-fit:contain;display:block}
.pl-lb-s figcaption{flex:none;padding:14px 20px 0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl-lb-s figcaption b{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:8px;opacity:.75}
.pl-lb-b{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:color-mix(in srgb,var(--robt) 62%,transparent);color:var(--ob);transition:opacity .2s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ob) 22%,transparent)}
.pl-lb-prev{left:max(10px,env(safe-area-inset-left,0px))}
.pl-lb-next{right:max(10px,env(safe-area-inset-right,0px))}
.pl-lb-b:disabled{opacity:0;pointer-events:none}

/* screens/today.css */
/* Today (home). Every selector is .td-prefixed; colours are tokens only. */
.td>*+*{margin-top:12px}
.td-a{display:block;text-decoration:none;color:inherit}

/* Heading on the sheet */
.td-head{margin-bottom:6px}
.td-head .hl{font-size:36px;line-height:1.04;margin-top:6px;overflow-wrap:anywhere}
.td-head .hl b{display:inline}
.td-head .sub{flex-wrap:wrap;row-gap:2px;font-size:14px}
.td-st{flex-wrap:wrap}
.td-old{color:var(--rot);font-weight:600}
.td-src{display:flex;align-items:center;min-height:44px;margin-top:2px;font-size:14px;line-height:1.35;color:var(--mu)}
.td-src u{text-decoration-color:var(--gh);text-underline-offset:2px}

/* Ticket cards */
.td-tk{padding:18px 20px}
.td-tkc{position:relative}
.td-tkdp{font-size:52px;margin:10px 0 14px}
.td-tkr{display:flex;gap:12px;align-items:center;min-width:0}
.td-tkt{font-size:16px;font-weight:800;line-height:1.25}
.td-tks{font-size:14px;color:var(--mu);margin-top:2px}
.td-tk .td-st{margin-top:3px}
.td-sky{right:0;bottom:0;width:132px;height:168px}
.td-desert{right:0;bottom:0;width:156px;height:164px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%);mask-image:linear-gradient(90deg,transparent 8%,#000 52%)}
.td-moon{fill:var(--cr)}
/* On tickets the art sits beside the big codes and fades out above the time row. */
.td-tk .il{top:6px;bottom:auto;right:0;width:124px;height:150px;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.td-tk .td-desert{top:0;width:150px;height:156px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}

/* Sand plan cards */
.td-plan{padding:18px 20px}
.td-planh{display:flex;gap:10px;align-items:flex-start}
.td-big{font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.01em;margin-top:4px;overflow-wrap:anywhere}
.td-lv{flex:none;margin-top:2px}
.td-plan .ic,.td-bags .ic,.td-food .ic{flex:none}
.td-cut{margin:12px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.td-nw{white-space:nowrap}
.td-rows{margin-top:12px}
.td-ln{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.td-ln>.i{font-size:17px;margin-top:2px;flex:none}
.td-ln>span{min-width:0;overflow-wrap:anywhere}
.td-ln+.td-ln{margin-top:9px}
.td-lnw{padding:12px 0 4px}
.td-more{display:flex;align-items:center;gap:4px;margin-top:14px;font-size:14px;font-weight:700;color:var(--eb)}
.td-more .i{font-size:16px}

/* Countdown cells */
.td-cn{margin-top:14px}
.td .td-cn>div{background:var(--sheet);padding:10px}
.td-cn small{font-size:13px}
.td-cn span{font-size:13px}
.td-cn span span{display:inline}

/* Gate card */
.td-gtop{display:flex;gap:12px;align-items:flex-start}
.td-glbl{font-size:15px;font-weight:600;margin-top:10px}
.td-gnum{width:fit-content;max-width:100%;font-size:92px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.td-gnone{font-size:26px;font-weight:800;margin-top:8px}
.td-seat{flex:none;background:var(--sheet);border-radius:16px;padding:8px 12px;text-align:right;max-width:46%}
.td-seat small{display:block;font-size:13px;color:var(--mu)}
.td-seat b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.td-p{margin:10px 0 0;font-size:14px;line-height:1.4}
.td-p .i{font-size:16px;vertical-align:-3px}
.td-mu{color:var(--mu)}

/* Rows in line cards */
.td-line{padding:6px 16px}
.td-pad{padding:16px}
.td-row{display:flex;gap:12px;align-items:center;min-height:60px;padding:8px 0;min-width:0}
.td-row b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.td-row small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.td-row .grow{overflow-wrap:anywhere}
.td-chev{font-size:18px;color:var(--mu);flex:none}
.td-warn{color:var(--rot);font-weight:600}
.td-row small .td-warn{font-weight:700}
.td-ci{background:var(--cr);border-radius:20px;padding:6px 14px}

/* Mini tiles */
.td-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.td-tiles.td-one{grid-template-columns:1fr}
.td-mini{background:var(--cr);border-radius:20px;padding:12px 14px;min-height:80px;min-width:0}
.td-mini b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:800;line-height:1.25;margin-top:4px}
.td-mini small{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.3}
.td-ring{box-shadow:inset 0 0 0 2px var(--ro)}
.td-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Banners and callouts */
.td-bn .grow>span+span{margin-top:3px}
.td-got{display:inline-flex!important;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
.td-got .i{font-size:16px;margin:0}
.td-flag{display:flex;align-items:center;min-height:44px;text-decoration:none}
.td-flag>.i:last-child{font-size:18px;flex:none}
.td-stale{display:flex;align-items:center;width:100%;min-height:44px}
.td .co{font-size:14px}

/* Return legs */
.td-legs{padding:10px 0 4px}
.td-leg{display:flex;align-items:center;gap:10px;padding:8px 0;min-width:0}
.td-leg b{display:block;font-size:15px;font-weight:800}
.td-leg small{display:block;font-size:13px;color:var(--mu)}
.td-leg>span{font-size:14px;font-weight:600;text-align:right}
.td-legs .td-more{margin-top:6px}
.td-line .td-legs{padding-top:12px}
.td-flagl{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:700;color:var(--rot);text-decoration:none}
.td-flagl .i{font-size:17px;flex:none}

/* Weather */
.td-wxnow{display:flex;align-items:center;gap:12px;margin-top:8px}
.td-temp{font-size:48px;font-weight:300;letter-spacing:-.03em;line-height:1}
.td-wxnow b{display:block;font-size:15px;font-weight:800}
.td-wxnow small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.3}
.td-wxi{font-size:34px;color:var(--eb);flex:none}
.td-hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:14px}
.td-hr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:14px;background:var(--sheet);min-width:0}
.td-hr small{font-size:13px;color:var(--mu);font-weight:600}
.td-hr .i{font-size:20px;color:var(--eb)}
.td-hr b{font-size:15px;font-weight:800}
.td-hr span{font-size:13px;color:var(--eb);font-weight:600}

/* After the trip */
.td-sum{min-height:150px}
.td-sumr{position:relative;display:flex;gap:28px}
.td-sumr b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.td-sumr small{display:block;font-size:14px;color:var(--mu);margin-top:4px;max-width:9em}
.td-btn{margin-top:16px;width:100%}
.td-empty .td-p{color:var(--mu)}
.td-lnci{padding:4px 0 14px}
.td-lnci .td-ln{color:var(--ink)}
.td-line.td-legs{padding:10px 16px 12px}
/* .td-a resets link colour; banners and callouts that are links keep their own. */
.td-a.bn{color:var(--robt)}
.td-a.bn.neutral{color:var(--ink)}
.td-a.co{color:var(--sdt)}
.td-a.co.rose{color:var(--robt)}
.td-a.co.plain{color:var(--ink)}
.td-flag .td-chev{color:inherit}

/* screens/transit.css */
/* Transit, route and hotel screens. Every selector starts with .tr- and every
   colour is a token. */

/* ---------- hero ---------- */
.tr-hero{position:relative;padding-top:2px}
.tr-hero>*{position:relative}
.tr-hero>.tr-bridge{position:absolute}
.tr-bridge{right:-20px;bottom:-30px;width:200px;height:136px}
.tr-ey{max-width:100%}
.tr-dp{font-size:56px;margin:10px 0 0;color:var(--ob);overflow-wrap:anywhere}
.tr-hsub{margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.35;color:var(--ob);max-width:300px}
.tr-ps{margin-top:18px;border-radius:24px}
.tr-ps button{height:44px;padding:0 18px;border-radius:20px}

/* route hero */
.tr-rh{display:flex;align-items:center;gap:12px;margin-top:12px;max-width:calc(100% - 40px)}
.tr-rhi{width:48px;height:48px;border-radius:16px;background:var(--onband);color:var(--ob);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tr-rname{margin:0;min-width:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ob);overflow-wrap:anywhere}
.tr-lede{margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--ob);max-width:330px}
.tr-hl{margin-top:12px}
.tr-hl .tr-mta{background:var(--sheet);color:var(--ink)}

/* hotel hero */
.tr-hn{line-height:.9;letter-spacing:-.02em}
.tr-addr{display:flex;align-items:center;gap:10px;margin-top:14px}
.tr-addr p{margin:0;flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35;color:var(--ob)}
.tr-ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--sheet);color:var(--ink)}
.tr-addr .tr-ib{background:var(--onband);color:var(--ob)}

/* ---------- body rhythm ---------- */
.tr-body>*+*{margin-top:12px}
.tr-body>.sec,.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr]>*{margin-top:12px}
.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr="top"]>:first-child{margin-top:0}
.tr-body>[data-tr="bot"]>:first-child{margin-top:22px}
.tr-note{margin:10px 2px 0;font-size:13px;line-height:1.4;color:var(--mu)}
.tr-wide{display:flex;width:100%;text-decoration:none}

/* hotel pill */
.tr-pill{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 8px;border-radius:22px;background:var(--cr);text-decoration:none;color:var(--ink)}
.tr-pin-ic{width:44px;height:44px;border-radius:50%;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tr-pill b{display:block;font-size:15px;font-weight:800}
.tr-pill small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tr-chev{font-size:18px;color:var(--mu)}

/* leave-by card */
.tr-leave .ey{margin:0}
.tr-lrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}
.tr-big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:44px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tr-in{font-size:14px;font-weight:700}
.tr-lt{display:block;font-size:18px;font-weight:800;line-height:1.25;margin-top:6px}
.tr-lp{margin:8px 0 0;font-size:13px;line-height:1.45}

/* traffic and weather */
.tr-traffic .rw b{font-size:16px}
.tr-traffic .tr-foot{margin-top:4px}
.tr-wx,.tr-wxa{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding-top:12px;border-top:1.5px solid var(--ln);font-size:13px;font-weight:600;line-height:1.4}
.tr-wx .i,.tr-wxa .i{font-size:18px;color:var(--eb);margin-top:-1px}
.tr-wxa{color:var(--rot)}
.tr-wxa .i{color:var(--rot)}

/* options */
.tr-op{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:12px 14px 12px 12px;text-decoration:none;color:var(--ink)}
.tr-op.best{box-shadow:inset 0 0 0 2px var(--ro)}
.tr-op .ic{background:var(--sheet)}
.tr-opm{display:block;padding-top:1px}
.tr-opn{display:block}
.tr-opn b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.tr-opm small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.tr-opm .tr-warn{display:flex;align-items:center;gap:5px;color:var(--rot);font-weight:600}
.tr-best{display:block;margin-top:8px;font-size:13px;line-height:1.4}
.tr-best b{display:inline-flex;align-items:center;gap:5px;color:var(--rot);font-weight:800}
.tr-opt{flex:none;text-align:right;padding-top:1px}
.tr-opt b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:21px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr-opt small{display:block;font-size:13px;color:var(--mu)}
.tr-lines{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tr-mta{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;line-height:1;flex:none}
.tr-rtag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;flex:none;white-space:nowrap}

/* alerts */
.tr-alerts{display:grid;gap:8px}
.tr-sub{margin:14px 0 8px;color:var(--mu)}
.tr-alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:18px;background:var(--cr)}
.tr-alert p{margin:1px 0 0;font-size:14px;font-weight:600;line-height:1.38}
.tr-alert p .tr-mta{width:20px;height:20px;vertical-align:1px;margin:0 1px}
.tr-alert small{display:block;font-size:13px;color:var(--mu);margin-top:3px}

/* chips and link rows */
.tr-links{gap:8px}
.tr-chip{height:44px;padding:0 16px;border-radius:22px;font-size:14px}
.tr-chip .i{font-size:16px}
.tr-lk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;border-radius:16px;background:var(--sheet);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.tr-lk .i{font-size:18px;color:var(--eb)}
.tr-lk small{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-top:1px}
.tr-lkc{min-height:56px;background:var(--cr);border-radius:18px}
.tr-where .tr-lk{margin-top:12px}

/* tips */
.tr-tips ul{margin:0;padding-left:18px}
.tr-tips li{font-size:14px;line-height:1.45}
.tr-tips li+li{margin-top:8px}
.tr-tips li::marker{color:var(--eb)}

/* route detail */
.tr-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr-tiles .tile{background:var(--cr)}
.tr-tiles .tile b{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.tr-tiles .tile span{display:block;font-size:13px;color:var(--mu);line-height:1.3}
.tr-tiles .tile:nth-child(3){grid-column:1/-1}
.tr-co{text-decoration:none}
.tr-co.tr-alt{align-items:center;min-height:48px}
.tr-co.tr-alt>.i:last-child{font-size:16px;color:var(--mu)}
.tr-wr+.tr-wr{margin-top:12px}
.tr-where .ey,.tr-when .ey,.tr-conf .ey{margin:0 0 10px}

.tr-steps{list-style:none;margin:0;padding:0}
.tr-st{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:16px}
.tr-st:last-child{padding-bottom:0}
.tr-st:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:4px;width:2px;border-radius:1px;background:var(--ln)}
.tr-sti{width:40px;height:40px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.tr-st p{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.tr-st small{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:13px;color:var(--mu)}
.tr-stm{flex:none;margin-top:10px;font-size:13px;font-weight:700;color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- maps ---------- */
.tr-mapc{position:relative;border-radius:22px;overflow:hidden;isolation:isolate}
.tr-map{--tr-land:var(--cr);--tr-park:var(--ok);--tr-road:var(--tile);--tr-edge:var(--ln);--tr-line:var(--ro);
  position:relative;height:280px;background:var(--tile);z-index:0}
.tr-hmap{height:300px}
.tr-map.leaflet-container{background:var(--band);font-family:inherit}
.tr-map.tr-nomap{height:120px;background:var(--cr)}
.tr-mapph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;text-align:center;font-size:13px;font-weight:600;color:var(--mu)}
.tr-mapph .i{font-size:18px}
.tr-map.tr-ready .tr-mapph{display:none}
.tr-mapc .tr-map .leaflet-control-attribution{margin:0;background:var(--sheet);color:var(--mu);font-size:13px;line-height:1.4;padding:1px 8px;border-radius:8px 0 0 0;opacity:.92}
.tr-mapc .tr-map .leaflet-control-attribution a{color:inherit;text-decoration:none}
.tr-zoom{position:absolute;z-index:500;right:10px;top:10px;display:grid;gap:6px}
.tr-zb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--sheet);color:var(--ink);box-shadow:0 2px 10px var(--gh)}
.tr-map.tr-nomap~.tr-zoom{display:none}
.tr-mapbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:10px}
.tr-mapbar .tr-chip[aria-disabled="true"]{opacity:.6;pointer-events:none}
.tr-leg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
.tr-leg .i{font-size:16px;color:var(--eb)}
.tr-leg .i+.i,.tr-leg .i:not(:first-child){margin-left:6px}

.tr-pinw{background:none;border:0}
.tr-mpin{--tr-pc:var(--ink);--tr-pt:var(--page);position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  background:var(--tr-pc);color:var(--tr-pt);font-size:18px;box-shadow:0 0 0 3px var(--sheet),0 4px 12px var(--gh)}
.tr-mpin::after{content:"";position:absolute;left:50%;top:100%;margin:1px 0 0 -6px;border-style:solid;border-width:8px 6px 0;border-color:var(--tr-pc) transparent transparent}
.tr-mpin.ho{--tr-pc:var(--ro);--tr-pt:var(--rog)}
.tr-mpin.mid{--tr-pc:var(--eb);--tr-pt:var(--sheet)}
.tr-me{display:block;width:18px;height:18px;margin:2px;border-radius:50%;background:var(--eb);box-shadow:0 0 0 3px var(--sheet),0 0 0 9px var(--ht)}
.tr-fpin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:800;
  box-shadow:inset 0 0 0 2px var(--ink),0 3px 8px var(--gh)}

/* ---------- hotel ---------- */
.tr-conf .tr-cr{display:flex;align-items:center;gap:8px}
.tr-code{flex:1;min-width:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:24px;font-weight:800;letter-spacing:.1em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tr-cn{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--mu)}
.tr-dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tr-db{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:18px;background:var(--cr);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.tr-db .i{font-size:22px;color:var(--eb)}
.tr-places{display:grid;gap:8px;margin-top:12px}
.tr-place{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--cr);text-decoration:none;color:var(--ink)}
.tr-num{width:32px;height:32px;border-radius:50%;background:var(--sheet);box-shadow:inset 0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.tr-place b{display:block;font-size:15px;font-weight:800}
.tr-place small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tr-place .tr-hrs.open{color:var(--ok)}
.tr-place .tr-hrs.closing{color:var(--rot)}
.tr-pd{flex:none;text-align:right}
.tr-pd b{font-size:15px;white-space:nowrap}
.tr-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 20px}
.tr-empty .ic{width:56px;height:56px;border-radius:18px;font-size:26px}
.tr-empty b{font-size:18px;font-weight:800}
.tr-empty p{margin:0;font-size:14px;line-height:1.45;color:var(--mu)}
.tr-empty .btn{margin-top:6px}

/* screens/unlock.css */
/* Unlock screen */
.unl-hero{padding-top:18px}
.unl-big{font-size:96px;margin:14px 0 16px;color:var(--ob)}
.unl-lede{margin:0;font-size:16px;line-height:1.4;max-width:30ch;opacity:.92}
.unl-row{display:flex;gap:8px;align-items:center}
.unl-row .inp{flex:1}
.unl-eye{width:50px;height:50px;border-radius:16px}

/* screens/wallet.css */
/* Wallet, Settings, Data & offline, Add to Calendar */
.wl-hero{padding-top:14px}
.wl-hero .wl-ey{display:flex;align-items:center;gap:6px}
.wl-hero .wl-ey .i{font-size:15px}
.wl-hero .wl-big{font-size:76px;margin-top:10px;color:var(--ob)}
.wl-hero .wl-big.wl-big-s{font-size:60px}
.wl-hero .wl-lede{margin:12px 0 0;font-size:15px;line-height:1.4;max-width:34ch;color:var(--ob)}

.wl [hidden]{display:none!important}
.wl .wl-sh{margin:0 0 10px}
.wl .wl-hint{font-size:13px;line-height:1.4;color:var(--mu);margin:8px 0 0 2px}
.wl .wl-p{font-size:15px;line-height:1.45;margin:0}
.wl .wl-p+.wl-p{margin-top:8px}
.wl .wl-p.wl-note{font-size:14px;color:var(--mu);padding:0 2px}
.wl .wl-p.wl-sm{font-size:13px;color:var(--mu);margin-top:10px}
.wl .wl-gap{margin-top:12px}
.wl .wl-wide{display:flex;width:100%}
.wl a.btn,.wl .wl-link{text-decoration:none}
.wl .wl-col{display:flex;flex-direction:column;gap:8px}
.wl .wl-wide .i{font-size:19px}
.wl .wl-ib{width:44px;height:44px;border-radius:14px}
.wl .wl-ib[aria-disabled="true"]{opacity:.4;pointer-events:none}
.wl .wl-card{background:var(--cr);border-radius:22px;padding:16px}
.wl .wl-card .ic{background:var(--sheet)}
.wl .wl-empty b{display:block;font-size:17px;font-weight:800}
.wl .wl-empty p{margin:8px 0 0;font-size:14px;line-height:1.4;color:var(--mu)}
.wl .wl-rows{padding:6px 16px}
.wl .wl-rows>.wl-r{padding:10px 0}
.wl .wl-rows>.wl-r+.wl-r{border-top:1px solid var(--ln)}
.wl .wl-r .dot{margin-left:4px}
.wl .co .i{flex:none}

/* code tiles */
.wl .wl-code{display:flex;align-items:center;gap:2px;background:var(--cr);border-radius:18px;padding:8px 6px 8px 16px;min-height:62px}
.wl .wl-code small{display:block;font-size:13px;font-weight:600;color:var(--mu)}
.wl .wl-cv{display:block;font-size:19px;font-weight:800;letter-spacing:.12em;margin-top:2px;overflow-wrap:anywhere}
.wl .wl-cb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--eb);flex:none}
.wl .wl-cb:active{background:var(--sheet)}
.wl .wl-cb[aria-pressed="true"]{background:var(--sheet)}
.wl .wl-addrow{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px 8px 10px;border-radius:18px;
  box-shadow:inset 0 0 0 1.5px var(--gh);text-align:left;color:var(--ink)}
.wl .wl-addrow b{display:block;font-size:15px;font-weight:800}
.wl .wl-addrow small{display:block;font-size:13px;color:var(--mu);line-height:1.35;margin-top:1px}
.wl .wl-addrow>.i{font-size:20px;color:var(--eb)}
.wl .wl-addic{width:40px;height:40px;border-radius:13px;background:var(--cr);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.wl .wl-inrow{display:flex;gap:8px;align-items:center}
.wl .wl-inrow .inp{flex:1;min-width:0}
.wl .wl-inrow .wl-ib{height:50px;width:50px;border-radius:16px}
.wl .wl-up{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.wl .wl-up::placeholder{text-transform:none;letter-spacing:0;font-weight:400}
.wl .inp::placeholder{color:var(--mu);opacity:.75}
.wl .wl-link{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:6px;font-size:15px;font-weight:700;color:var(--eb)}
.wl .wl-link .i{font-size:18px}

/* travelers */
.wl .wl-name{display:flex;gap:8px;align-items:center}
.wl .wl-name .inp{flex:1;min-width:0}
.wl .wl-name .wl-ib{height:50px;width:50px;border-radius:16px;background:transparent;color:var(--mu)}
.wl .wl-add{margin-top:10px}

/* seats */
.wl .wl-leg{background:var(--cr);border-radius:22px;padding:14px}
.wl .wl-leg+.wl-leg{margin-top:10px}
.wl .wl-leg-h{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:2px;margin:0 2px 10px}
.wl .wl-leg-h b{font-size:15px;font-weight:800}
.wl .wl-leg-h span{font-size:13px;color:var(--mu)}
.wl .wl-leg-h .wl-tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--rot)}
.wl .wl-seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wl .wl-seat{display:block;background:var(--sheet);border-radius:16px;padding:8px 12px 4px}
.wl .wl-seat>span{display:block;font-size:13px;font-weight:600;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .wl-si{height:40px;border:0;padding:0;border-radius:0;background:transparent;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.wl .wl-si::placeholder{font-size:16px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--rot);opacity:1}
.wl .wl-seat:focus-within{box-shadow:inset 0 0 0 1.5px var(--eb)}
.wl .wl-seat:has(.bad){box-shadow:inset 0 0 0 1.5px var(--ro)}
.wl .wl-leg .err{margin-top:8px}

/* steppers */
.wl .wl-step{display:flex;align-items:center;gap:12px;background:var(--cr);border-radius:20px;padding:8px}
.wl .wl-step .wl-ib{background:var(--sheet);color:var(--ink)}
.wl .wl-step-v{flex:1;min-width:0;text-align:center}
.wl .wl-step-v b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.wl .wl-step-v span{display:block;font-size:13px;color:var(--mu)}

/* hotel, notes */
.wl .wl-th{background:var(--cr);border-radius:18px;padding:12px}
.wl .wl-th .ic{background:var(--sheet)}
.wl .wl-ta{height:auto;min-height:112px;padding:12px 14px;line-height:1.4;resize:vertical;font-size:17px}
.wl .wl-info{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--mu);margin:10px 0 0 2px}
.wl .wl-info .i{font-size:16px;margin-top:1px;flex:none}

/* confirm panels */
.wl .wl-confirm{background:var(--rob);color:var(--robt);border-radius:22px;padding:16px}
.wl .wl-confirm b{display:block;font-size:17px;font-weight:800}
.wl .wl-confirm p{margin:6px 0 14px;font-size:14px;line-height:1.4}
.wl .wl-confirm .btn{padding:0 12px}
.wl .wl-confirm .wl-cancel{background:transparent;color:var(--robt);box-shadow:inset 0 0 0 1.5px var(--robt)}
.wl .wl-confirm .btn.rose{background:var(--robt);color:var(--rob)}

/* saved indicator */
.wl .wl-saved{position:fixed;z-index:9;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);
  display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--ink);color:var(--page);
  font-size:13px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1)}
.wl .wl-saved.on{opacity:1;transform:translate(-50%,0)}
.wl .wl-saved.bad{background:var(--ro);color:var(--rog)}
.wl .wl-saved .i{font-size:16px}

/* settings */
.wl .wl-seg{display:flex;width:100%}
.wl .wl-seg button{flex:1;justify-content:center;height:44px;border-radius:18px;font-size:15px;padding:0 8px}
.wl .wl-seg button .i{font-size:18px}
.wl .wl-lv{background:var(--cr);border-radius:18px;padding:12px 14px}
.wl .wl-lv b{display:block;font-size:15px;font-weight:800}
.wl .wl-lv span{display:block;font-size:14px;line-height:1.4;margin-top:4px;color:var(--mu)}
.wl .wl-lv b span{display:inline;font-size:inherit;margin:0;color:inherit}

/* data */
.wl .wl-fresh{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.wl .wl-fresh b{font-size:17px;font-weight:800}
.wl .wl-fresh .mu{font-size:14px}
.wl .wl-list{list-style:none;margin:0;padding:6px 16px;background:var(--cr);border-radius:22px}
.wl .wl-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:15px;line-height:1.35}
.wl .wl-list li+li{border-top:1px solid var(--ln)}
.wl .wl-list li .i{font-size:18px;color:var(--ok);margin-top:1px;flex:none}
.wl .wl-list li.no{color:var(--mu)}
.wl .wl-list li.no .i{color:var(--mu)}
.wl .wl-job{background:var(--cr);border-radius:22px;padding:16px}
.wl .wl-job .ic{background:var(--sheet)}
.wl .wl-job .rw.c{align-items:flex-start}
.wl .wl-bar{height:8px;border-radius:4px;background:var(--sheet);overflow:hidden;margin-top:14px}
.wl .wl-bar i{display:block;height:100%;border-radius:4px;background:var(--eb);transition:width .3s}
.wl .wl-use{margin-top:12px;font-size:13px;line-height:1.4;color:var(--mu);padding:0 2px}
.wl .wl-use b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.wl .wl-use span{display:block}

@media (max-width:360px){
  .wl-hero .wl-big{font-size:64px}
  .wl-hero .wl-big.wl-big-s{font-size:50px}
}

function foodHtml(code, v) {
  const g = guide(code);
  const list = arr(g && g.food).filter(obj);
  const head = h`<div class="ey">Food and coffee</div>`;
  if (!list.length) return h`<section class="sec ap-anc" id="ap-food">${head}<div class="co plain">${icon('info-circle')}<span>No food listed for ${code} yet.</span></div></section>`;

    return 60;

  const term = termShort(l.dep.terminal);

  const old = v => v ? h`<s class="fl-old tn">${v}</s>` : anyOld ? h`<span class="fl-old ph" aria-hidden="true">·</span>` : '';
  const lateCls = (est, sched) => est && sched && N.mins(sched, est) >= 5 ? 'late' : '';
  const unknown = !l.dep.time;
  const label = `${fno(l)}, ${l.from} to ${l.to}, ${s.text}`;
  return h`<a class="fl-tk rise ${l.canceled ? 'bad' : ''}" href="#flight/${l.id}" style="animation-delay:${i * 60}ms" aria-label="${label}">
    <div class="fl-top"><span class="fl-no">${fno(l)}<span class="mu"> · Leg ${l.seq || i + 1} of ${n}</span></span>${statusChip(l)}</div>
    <div class="fl-mid">
      <div class="fl-end">
        <span class="dp fl-code">${l.from}</span>
        ${old(depOld)}
        <b class="tn fl-t ${depOld ? lateCls(l.dep.est, l.dep.sched) : ''}" data-k="dt-${l.id}">${unknown ? 'Time TBC' : N.time(l.dep.time, l.from)}</b>
        <small>${city(l.from)}${!unknown && tzAbbr(l.from, l.dep.time) ? ' · ' + tzAbbr(l.from, l.dep.time) : ''}</small>
      </div>
      <div class="fl-path" aria-hidden="true"><span class="fl-pl"><span class="fl-line"></span>${icon('plane')}</span><small class="tn">${dur}</small></div>
      <div class="fl-end r">
        <span class="dp fl-code">${l.to}</span>
        ${old(arrOld)}
        <b class="tn fl-t ${arrOld ? lateCls(l.arr.est, l.arr.sched) : ''}" data-k="at-${l.id}">${!l.arr.time ? 'Time TBC' : N.time(l.arr.time, l.to)}</b>
        <small>${city(l.to)}${l.arr.time && tzAbbr(l.to, l.arr.time) ? ' · ' + tzAbbr(l.to, l.arr.time) : ''}</small>
      </div>
    </div>
    <div class="fl-meta">
      <div><small>Gate${term ? ' · ' + term : ''}</small><b data-k="dg-${l.id}">${gate || '—'}</b></div>
      <div><small>Seat${l.seats.length > 1 ? 's' : ''}</small><b class="${l.seats.length ? '' : 'mu'}">${l.seats.length ? l.seats.join(' ') : 'Not added'}</b></div>
      <div><small>Aircraft</small><b class="${p.short ? '' : 'mu'}">${p.short || 'Not known'}</b></div>
    </div>
  </a>`;
}

// A canceled or diverted leg makes the connection moot; say that instead of a level.
// Once the onward flight has left, the connection was made; the level no longer matters.
const cxMade = c => !!(c && c.b && !c.b.canceled && (c.b.dep && c.b.dep.actual || ['air', 'landed'].includes(c.b.state)));
const cxText = c => c && c.a && c.b && (c.a.canceled || c.b.canceled) ? 'Canceled' : c && c.a && c.a.diverted ? 'Diverted' : cxMade(c) ? 'Made it' : c ? c.text : '';
const cxLevel = c => cxMade(c) ? 'ok' : c ? c.level : 'neutral';

function connStrip(dir, legs) {
  if (legs.length < 2) return '';
  const c = conn(dir);
  const at = legs[0].to;
  if (!c) {
    return h`<a class="fl-cx neutral" href="#connect/${dir}">${icon('arrows-exchange')}<div class="grow"><b>Change planes in ${city(at)}</b><small>Connection time shows once times are confirmed</small></div>${icon('chevron-right')}</a>`;
  }
  const walk = c.walk.known ? `walk about ${c.walk.min} min` : 'gates not posted yet';
  return h`<a class="fl-cx ${cxLevel(c)}" href="#connect/${dir}">${icon('arrows-exchange')}<div class="grow">
      <b class="tn" data-k="cx-${dir}">${N.dur(c.ground)} in ${city(at)}</b>
      <small><span class="fl-lv">${cxText(c)}</span>${cxMade(c) ? '' : ` · ${walk}`}</small></div>${icon('chevron-right')}</a>`;
}

function dirNote(dir, legs) {
  const odd = legs.filter(l => l.route_ok === false);
  const unconf = legs.filter(l => !l.dep.time || l.confirmed === false && !l.live);
  if (odd.length) {
    return h`<div class="bn neutral fl-note">${icon('alert-circle')}<div class="grow">
      <b>Needs checking</b>
      ${odd.map(l => h`<span>${fno(l)} was last seen flying ${String(l.route_seen || 'a different route').replace(/-/g, '–')}, not ${l.from}–${l.to}.</span>`)}
      <span>Flight numbers often change when the winter schedule starts on 25 Oct. Check Trips in the AA app or on aa.com for the flights you’re actually booked on.</span>
      <div class="bx">${ext(AA_TRIPS, 'Trips on aa.com')}</div></div></div>`;
  }
  if (unconf.length) {
    return h`<div class="bn neutral fl-note">${icon('info-circle')}<div class="grow">
      <b>Not confirmed yet</b>
      <span>AA hasn’t published times for ${unconf.map(fno).join(' and ')} on ${dayLong(unconf[0].date)}. They usually appear about 3 days ahead. Your booking in the AA app or on aa.com has the times you were sold.</span>
      <div class="bx">${ext(AA_TRIPS, 'Trips on aa.com')}</div></div></div>`;
  }
  return '';
}

function dirSection(dir, done) {
  const legs = legsOf(dir);
  if (!legs.length) return '';
  const first = legs[0], last = legs[legs.length - 1];
  const total = first.dep.time && last.arr.time ? N.mins(first.dep.time, last.arr.time) : null;
  const via = legs.slice(0, -1).map(l => l.to).join(', ');
  const ci = checkin(legs);
  const tzD = tzAbbr(first.from, first.dep.time), tzA = tzAbbr(last.to, last.arr.time);
  return h`<section class="sec fl-dir ${done ? 'done' : ''}">
    <div class="fl-dh"><div class="grow"><div class="ey">${dir === 'out' ? 'Outbound' : 'Return'} · ${dayLong(first.date)}</div>
      <h2 class="h2">${N.dirLabel(dir)}</h2></div>${done ? h`<span class="chip cr">${icon('check')}Done</span>` : ''}</div>
    <div class="cn fl-sum">
      <div><small>Total</small><b class="tn">${total != null ? N.dur(total) : '—'}</b><span>${via ? `via ${via}` : 'Nonstop'}</span></div>
      <div><small>Leaves</small><b class="tn">${first.dep.time ? N.time(first.dep.time, first.from) : '—'}</b><span>${first.from}${tzD ? ' · ' + tzD : ''}</span></div>
      <div><small>Lands</small><b class="tn">${last.arr.time ? N.time(last.arr.time, last.to) : '—'}</b><span>${last.to}${tzA ? ' · ' + tzA : ''}</span></div>
    </div>
    ${dirNote(dir, legs)}
    <div class="fl-legs">
      ${legs.map((l, i) => h`${i ? connStrip(dir, legs) : ''}${ticket(l, i, legs.length)}`)}
    </div>
    ${ci && !done ? h`<div class="rw c fl-ci"><span class="ic">${icon(ci.state === 'open' ? 'circle-check' : 'ticket')}</span><div class="grow"><b class="tn">${ci.text}</b><small>${ci.sub}</small></div></div>` : ''}
  </section>`;
}

// Core's rerender() drops 'force' unless it is listed in `uses`.
const USES = ['trip', 'guide', 'status', 'force'];

N.screen('flights', {
  nav: 1,
  uses: USES,
  tone: 'band',
  title: 'Flights',
  render(ctx) {
    if (!N.data.trip) {
      return {hero: h`<div class="fl-hero"><div class="ey">Flights</div><h1 class="hl"><b>No trip data</b> on this phone yet</h1></div>`,
        body: h`<div class="fl"><div class="co plain">${icon('info-circle')}<span>Open the app once with a signal to load the trip. After that it works offline.</span></div></div>`};
    }
    const ph = N.phase();
    const doneOut = ['stay', 'ret', 'after'].includes(ph) && legsOf('out').every(l => l.state === 'landed' || l.state === 'past');
    const order = doneOut ? ['ret', 'out'] : ['out', 'ret'];
    return {
      hero: heroList(ctx),
      body: h`<div class="fl">${changesBanner()}${order.map(d => dirSection(d, d === 'out' && doneOut))}
        <div class="sec wrap fl-foot">
          <button class="chip cr fl-btn" data-act="go" data-arg="calendar">${icon('calendar-plus')}Add to Calendar</button>
          <button class="chip cr fl-btn" data-act="go" data-arg="wallet">${icon('wallet')}Seats in Wallet</button>
        </div></div>`,
    };
  },
  mount() { this._sig = legsSig(); },
  tick() { const s = legsSig(); if (this._sig && s !== this._sig) { this._sig = s; N.rerender(); } },
  actions: {
    seen() { try { N.markSeen(); } catch (e) { N.report(e, 'markSeen'); } N.rerender(); },
  },
});

// ---------- #flight/<legId> ----------
function legBanners(l, ch) {
  const out = [];
  const trips = ext(AA_TRIPS, 'Trips on aa.com');
  const call = h`<a class="chip fl-lk" href="tel:+18004337300">${icon('phone')}Call AA</a>`;
  if (l.canceled) {
    out.push(h`<div class="bn fx-bn">${icon('alert-triangle')}<div class="grow"><b>${fno(l)} is canceled</b>
      <span>AA usually rebooks you on its own. In the AA app a blue banner means AA is rebooking you; green means you can pick a new flight yourself. Checked bags follow the new booking.</span>
      <div class="bx">${trips}${call}</div></div></div>`);
  } else if (l.diverted) {
    out.push(h`<div class="bn fx-bn">${icon('alert-triangle')}<div class="grow"><b>Diverted to ${l.diverted}</b>
      <span>Stay with the plane and follow the crew. If you miss a connection, AA rebooks you and your bags follow. Watch the AA app for the new plan.</span>
      <div class="bx">${trips}${call}</div></div></div>`);
  }
  if (l.route_ok === false) {
    out.push(h`<div class="bn neutral fx-bn">${icon('alert-circle')}<div class="grow"><b>Needs checking</b>
      <span>On its last check ${fno(l)} was flying ${String(l.route_seen || 'a different route').replace(/-/g, '–')}, not ${l.from}–${l.to}. Flight numbers often change when the winter schedule starts on 25 Oct. Confirm this flight in Trips in the AA app or on aa.com.</span>
      <div class="bx">${trips}</div></div></div>`);
  } else if (!l.dep.time || l.confirmed === false && !l.live) {
    out.push(h`<div class="bn neutral fx-bn">${icon('info-circle')}<div class="grow"><b>Not confirmed yet</b>
      <span>AA hasn’t published times for ${fno(l)} on ${dayLong(l.date)}. They usually appear about 3 days ahead. Your booking in the AA app or on aa.com has the times you were sold.</span>
      <div class="bx">${trips}</div></div></div>`);
  }
  if (l.fetch_failed) {
    out.push(h`<div class="bn neutral fx-bn">${icon('wifi-off')}<div class="grow"><b>Couldn’t check this flight just now</b>
      <span>Showing the planned times${l.checked_at ? ` and the last good check from ${when(l.checked_at, l.from)}` : ''}. The AA app has the latest gate.</span></div></div>`);
  }
  if (!l.canceled && !l.diverted && l.live) {
    const lines = [];
    const gone = ['air', 'landed', 'past'].includes(l.state);
    if (gone) ch = ch.filter(c => c.k === 'ag' || c.k === 'bg');
    const late = !gone && l.delay_dep > 14 && l.dep.est;
    if (late) lines.push(`Departs ${N.dur(l.delay_dep)} late, now ${N.time(l.dep.est, l.from)}`);
    ch.forEach(c => { if (c.k !== 'd' || !late) lines.push(c.text.replace(fno(l).replace(' ', ''), '').trim().replace(/^./, m => m.toUpperCase())); });
    if (lines.length) {
      const cause = l.status_detail && !/^(on time|scheduled)$/i.test(l.status_detail) ? l.status_detail : '';
      out.push(h`<div class="bn fx-bn">${icon('alert-triangle')}<div class="grow"><b>${lines[0]}</b>
        ${lines.slice(1).map(t => h`<span>${t}</span>`)}${cause ? h`<span>${cause}</span>` : ''}</div></div>`);
    }
  }
  return out;
}

function inboundRow(l) {
  const ib = l.inbound;
  if (!ib || l.departed || l.state === 'air' || l.state === 'landed' || l.state === 'past' || l.canceled) return '';
  const st = String(ib.status || '');
  const here = /land|arriv/i.test(st);
  const t = ib.est && okT(ib.est) ? when(ib.est, l.from) : '';
  const from = !ib.from ? 'its last stop' : city(ib.from) && city(ib.from) !== ib.from ? `${city(ib.from)} (${ib.from})` : ib.from;
  const title = here ? 'Your plane is here' : `Your plane is on its way${ib.flight ? ` as ${ib.flight.replace(/^AA(\d)/, 'AA $1')}` : ''}`;
  const sub = here ? `Landed from ${from}${t ? ` at ${t}` : ''}` : `From ${from}${t ? ` · due ${t}` : ''}${st && !here ? ` · ${st}` : ''}`;
  return h`<div class="fx-row"><span class="ic">${icon(here ? 'circle-check' : 'plane-arrival')}</span><div class="grow"><b>${title}</b><small class="tn" data-k="ib-${l.id}">${sub}</small></div></div>`;
}

function connRow(l, legs) {
  if (legs.length < 2) return '';
  const c = conn(l.dir);
  const isFirst = l === legs[0] || l.id === legs[0].id;
  const at = legs[0].to;
  const other = isFirst ? legs[1] : legs[0];
  let title, sub;
  if (!c) {
    title = isFirst ? `Connect in ${city(at)} to ${fno(other)}` : `Connecting from ${fno(other)}`;
    sub = 'Connection time shows once both flights have times';
  } else {
    title = h`<span class="tn">${N.dur(c.ground)}</span> in ${city(at)} · <span class="fx-lv ${cxLevel(c)}">${cxText(c)}</span>`;
    const g = isFirst
      ? `${fno(other)} boards ${N.time(c.b.board, at)}${c.b.dep.gate ? ` at ${c.b.dep.gate}` : ''}`
      : `${fno(other)} lands ${N.time(c.a.arr.time, at)}${c.a.arr.gate ? ` at ${c.a.arr.gate}` : ''}`;
    sub = `${g} · walk ${c.walk.known ? `about ${c.walk.min} min` : 'time once gates post'}`;
  }
  return h`<a class="fx-row fx-go" href="#connect/${l.dir}"><span class="ic">${icon('arrows-exchange')}</span><div class="grow"><b>${title}</b><small class="tn">${sub}</small></div>${icon('chevron-right')}</a>`;
}

function arrivalRow(l, legs) {
  const last = l.id === legs[legs.length - 1].id;
  if (!last) return '';
  const term = termLabel(l.arr.terminal);
  const where = [term, l.arr.gate ? `Gate ${l.arr.gate}` : ''].filter(Boolean).join(' · ');
  if (l.arr.baggage) {
    return h`<div class="fx-row"><span class="ic">${icon('luggage')}</span><div class="grow"><b data-k="bg-${l.id}">Bags: carousel ${l.arr.baggage}</b><small data-k="ag-${l.id}">${[shortAp(l.to), where].filter(Boolean).join(' · ')}</small></div></div>`;
  }
  const note = l.state === 'landed' ? 'Carousel not posted yet. The AA app and the screens at claim show it.' : 'The carousel posts around landing. The AA app shows it.';
  return h`<div class="fx-row"><span class="ic">${icon('luggage')}</span><div class="grow"><b>Arrive ${shortAp(l.to)}</b><small>${where ? h`<span data-k="ag-${l.id}">${where}</span>. ` : ''}<span data-k="bg-${l.id}">${note}</span></small></div></div>`;
}

function eventsLog(l) {
  const ev = (l.events || []).filter(e => e && e.text).slice().sort((a, b) => (T(b.at) || 0) - (T(a.at) || 0));
  if (!ev.length) return l.live ? h`<div class="sec"><div class="ey">Changes</div><p class="small mu fx-none">No changes logged since checks began.</p></div>` : '';
  return h`<div class="sec"><div class="ey">Changes</div><div class="fx-log">
    ${ev.slice(0, 12).map(e => h`<span class="tn mu">${e.at ? when(e.at, l.from) : ''}</span><span>${e.text}</span>`)}
  </div></div>`;
}

function timesGrid(l) {
  const depOld = l.dep.est && l.dep.sched && Math.abs(N.mins(l.dep.sched, l.dep.est)) >= 5 ? N.time(l.dep.sched, l.from) : '';
  const arrOld = l.arr.est && l.arr.sched && Math.abs(N.mins(l.arr.sched, l.arr.est)) >= 5 ? N.time(l.arr.sched, l.to) : '';
  const div = l.diverted && !l.canceled && !l.arr.actual;
  const dur = div ? `To ${l.diverted}` : l.dep.time && l.arr.time ? N.dur(N.mins(l.dep.time, l.arr.time)) : 'Not confirmed';
  let pos = 50;
  if (l.state === 'air' && l.dep.time && l.arr.time) {
    pos = N.clamp((N.now() - T(l.dep.time)) / (T(l.arr.time) - T(l.dep.time)) * 100, 6, 94);
  } else if (l.state === 'landed' || l.state === 'past') pos = 94;
  else if (div && l.dep.actual) pos = 50;
  else pos = 6;
  const tzD = tzAbbr(l.from, l.dep.time || l.date + 'T16:00:00Z'), tzA = tzAbbr(l.to, l.arr.time || l.date + 'T16:00:00Z');
  const off = l.canceled && !l.dep.actual;
  const depWord = off ? 'Was to leave' : l.dep.actual ? 'Took off' : l.dep.est && depOld ? 'Now' : 'Departs';
  const arrWord = off || div ? 'Was to land' : l.arr.actual ? 'Landed' : l.arr.est && arrOld ? 'Now' : 'Arrives';
  return h`<div class="fx-times ${off ? 'off' : ''}">
    <div><small class="fx-tw">${depOld ? h`<s class="tn">${depOld}</s> ` : ''}${depWord}</small><div class="tn fx-t" data-k="dt-${l.id}">${l.dep.time ? N.time(l.dep.time, l.from) : '—'}</div><small class="fx-tz">${l.from}${tzD ? ' · ' + tzD : ''}</small></div>
    <div class="fx-mid" aria-hidden="true"><div class="fx-dash"><span style="left:${pos.toFixed(1)}%">${icon('plane-inflight')}</span></div><small class="tn">${dur}</small></div>
    <div class="r ${div ? 'fx-x' : ''}"><small class="fx-tw">${arrOld && !div ? h`<s class="tn">${arrOld}</s> ` : ''}${arrWord}</small><div class="tn fx-t" data-k="at-${l.id}">${l.arr.time ? N.time(l.arr.time, l.to) : '—'}</div><small class="fx-tz">${l.to}${tzA ? ' · ' + tzA : ''}</small></div>
  </div>`;
}

function tiles(l, ch) {
  const p = plane(l);
  const term = termLabel(l.dep.terminal);
  const gone = ['air', 'landed', 'past'].includes(l.state);
  const gateRing = ch.some(c => c.k === (gone ? 'ag' : 'dg') || !gone && c.k === 'dt');
  const timeRing = !gone && (ch.some(c => c.k === 'd') || l.delay_dep > 14);
  const conc = concourse(l.from, l.dep.gate);
  const gateSub = l.dep.gate ? conc || (term ? termLabel(l.dep.terminal) : '') : l.dep.time ? 'Posts closer to departure' : 'Not known yet';
  const seats = l.seats;
  const seatTile = seats.length
    ? h`<div class="tile"><small>Seat${seats.length > 1 ? 's' : ''}</small><b class="tn">${seats.join(' ')}</b><small>${icon('lock')} From Wallet</small></div>`
    : h`<a class="tile fx-tl" href="#wallet"><small>Seat</small><b>Add</b><small class="fx-ln">In Wallet ${icon('chevron-right')}</small></a>`;
  const acTile = p.short || p.info
    ? h`<a class="tile fx-tl" href="#seats/${l.id}"><small>Aircraft</small><b>${p.short || p.code}</b><small class="fx-ln">Seat map ${icon('chevron-right')}</small></a>`
    : h`<div class="tile"><small>Aircraft</small><b class="mu">—</b><small>Not known yet</small></div>`;
  const aTerm = termLabel(l.arr.terminal);
  const first = l.diverted && !l.canceled && l.dep.actual && !l.arr.actual
    ? h`<div class="tile ring"><small>Diverted to</small><b>${l.diverted}</b><small>${city(l.diverted) !== l.diverted ? city(l.diverted) : `Instead of ${l.to}`}</small></div>
      <div class="tile"><small>Took off</small><b class="tn">${l.dep.time ? N.time(l.dep.time, l.from) : '—'}</b><small>${l.from}${tzAbbr(l.from, l.dep.time) ? ' · ' + tzAbbr(l.from, l.dep.time) : ''}</small></div>`
    : gone
    ? h`<div class="tile ${gateRing ? 'ring' : ''}"><small>${l.to} gate${aTerm ? ' · ' + aTerm : ''}</small><b data-k="ag-${l.id}">${l.arr.gate || '—'}</b><small>${l.arr.gate ? concourse(l.to, l.arr.gate) || 'Arrival gate' : 'Not posted yet'}</small></div>
      <div class="tile"><small>${l.arr.actual ? 'Landed' : l.state === 'air' ? 'Lands' : 'Arrived'}</small><b class="tn">${l.arr.time ? N.time(l.arr.time, l.to) : '—'}</b><small class="tn">${l.dep.actual && l.dep.time ? `Took off ${N.time(l.dep.time, l.from)}` : l.to}</small></div>`
    : l.canceled
    ? h`<div class="tile fx-off"><small>Gate${term ? ' · ' + term : ''}</small><b data-k="dg-${l.id}">${l.dep.gate || '—'}</b><small>${l.dep.gate ? 'Was the gate' : 'No gate'}</small></div>
      <div class="tile fx-off"><small>Boards</small><b>—</b><small>Not boarding</small></div>`
    : h`<div class="tile ${gateRing ? 'ring' : ''}"><small>Gate${term ? ' · ' + term : ''}</small><b data-k="dg-${l.id}">${l.dep.gate || '—'}</b><small>${gateSub}</small></div>
      <div class="tile ${timeRing ? 'ring' : ''}"><small>Boards</small><b class="tn" data-k="bd-${l.id}">${l.board ? N.time(l.board, l.from) : '—'}</b><small class="tn">${l.doors ? `Doors close ${N.time(l.doors, l.from)}` : 'About 40 min before'}</small></div>`;
  return h`<div class="tiles fx-tiles">
    ${first}${seatTile}${acTile}
  </div>`;
}

N.screen('flight', {
  nav: 1,
  uses: USES,
  back: 'flights',
  tone: 'cream',
  title: ctx => { const l = findLeg(ctx.param); return l ? `${fno(l)} ${l.from}–${l.to}` : 'Flight'; },
  render(ctx) {
    const l = findLeg(ctx.param);
    if (!l) {
      return {body: h`<div class="fx"><div class="ey">Flight</div><h1 class="h2 fx-nf">That flight isn’t on this trip</h1>
        <p class="small mu">It may have been removed in a trip update.</p><a class="btn" href="#flights">${icon('plane')}All flights</a></div>`};
    }
    const legs = legsOf(l.dir);
    const idx = legs.findIndex(x => x.id === l.id);
    const last = idx === legs.length - 1;
    const ch = changesFor(l.id);
    const nc = nextCheck(l);
    const toLabel = !last ? 'Connect' : l.dir === 'out' ? 'Arrive' : 'Home';
    const from = lc(l.from), to = lc(l.to);
    const guides = [l.from, l.to].filter(c => N.guideFor(c));
    return {body: h`<div class="fx">
      <div class="ey">${N.dirLabel(l.dir)} · ${fno(l)} · Leg ${idx + 1} of ${legs.length}</div>
      <div class="fx-codes" aria-label="${l.from} to ${l.to}">
        <span class="dp fx-from">${l.from}</span>
        <div class="fx-to"><div class="ey">${toLabel}</div><span class="dp">${l.to}</span></div>
      </div>
      ${legBanners(l, ch).map(b => h`<div class="fx-gap">${b}</div>`)}
      <div class="fx-stat">${statusChip(l, true)}${nc ? h`<span class="small mu tn fx-nc">${nc}</span>` : ''}</div>
      ${timesGrid(l)}
      ${tiles(l, ch)}
      <div class="stack8 fx-rows">${inboundRow(l)}${connRow(l, legs)}${arrivalRow(l, legs)}</div>
      ${eventsLog(l)}
      <div class="sec wrap fx-links">
        ${guides.map((c, i) => h`<a class="chip fl-lk ${i ? 'cr2' : 'dk2'}" href="#airport/${lc(c)}">${icon('map')}${shortAp(c)} guide</a>`)}
        ${ext(flightAware(l), 'FlightAware', 'cr2')}
        ${ext(AA_STATUS, 'aa.com status', 'cr2')}
      </div>
      ${l.source_note && l.live ? h`<p class="small mu fx-src">Source note: ${l.source_note}</p>` : ''}
    </div>`};
  },
  mount(ctx) {
    // Viewing a leg counts as seeing its changes; the banner stays until the next render.
    const l = findLeg(ctx.param);
    if (l && l.live) { try { N.markSeen([l.id]); } catch (e) { N.report(e, 'markSeen'); } }
    let st = l && l.state;
    this._st = st;
  },
  tick(ctx) {
    const l = findLeg(ctx.param);
    if (l && this._st && l.state !== this._st) { this._st = l.state; N.rerender(); return; }
    // keep the plane marker moving while in the air
    if (l && l.state === 'air') {
      const m = document.querySelector('.fx-dash > span');
      if (m && l.dep.time && l.arr.time) m.style.left = N.clamp((N.now() - T(l.dep.time)) / (T(l.arr.time) - T(l.dep.time)) * 100, 6, 94).toFixed(1) + '%';
    }

});

// ---------- #connect/out|ret ----------
const HUB = {A: [18, 90], B: [54, 28], C: [126, 28], D: [162, 90], E: [126, 152]};
function hubSvg(arrG, depG) {
  const a = gateLetter(arrG), d = gateLetter(depG);
  const hot = new Set([a, d].filter(k => k && HUB[k]));
  const spokes = Object.entries(HUB).map(([k, [x, y]]) => `<path d="M90 90L${x} ${y}"${hot.has(k) ? ' class="cx-hot"' : ''}/>`).join('');
  const dots = Object.entries(HUB).map(([k, [x, y]]) =>
    `<circle cx="${x}" cy="${y}" r="13" class="${hot.has(k) ? 'cx-on' : 'cx-off'}"/><text x="${x}" y="${y + 5}" class="${hot.has(k) ? 'cx-ont' : ''}">${k}</text>`).join('');
  return raw(`<svg class="il cx-hub" viewBox="0 0 180 180" aria-hidden="true"><g class="lk" stroke-width="7" stroke-linecap="round">${spokes}</g>
    <circle cx="90" cy="90" r="22" class="cx-core"/><g class="cx-txt" text-anchor="middle">${dots}</g></svg>`);
}

function timeline(c) {
  const at = c.a.to;
  const land = c.a.arr.time, board = c.b.board, doors = c.b.doors, dep = c.b.dep.time;
  if (![land, board, doors, dep].every(okT)) return '';
  const t0 = Math.min(T(land), T(board)), t1 = Math.max(T(dep), T(land));
  const pct = t => N.clamp((T(t) - t0) / Math.max(1, t1 - t0) * 100, 0, 100);
  const pl = pct(land), pb = pct(board), pd = pct(doors);
  const bar = h`<div class="cx-barw"><div class="cx-bar">
      <span class="cx-s1" style="width:${pb.toFixed(1)}%"></span><span class="cx-s2" style="width:${Math.max(0, pd - pb).toFixed(1)}%"></span><span class="hatch cx-s3" style="width:${Math.max(0, 100 - pd).toFixed(1)}%"></span>
    </div><span class="cx-mk" style="left:${pd.toFixed(1)}%"></span>${pl > 1 ? h`<span class="cx-mk land" style="left:${pl.toFixed(1)}%"></span>` : ''}</div>`;
  const pts = [['Land', land], ['Board', board], ['Doors', doors], ['Dep', dep]];
  // Land and Doors above the bar, Board and Dep below, when they have room.
  const fits = pl <= 1 && pd >= 38 && pb <= 62;
  if (fits) {
    const lab = (i, st, below) => h`<span class="${i === 2 ? 'cx-doors' : ''}" style="${st}">${below ? '' : h`<small>${pts[i][0]}</small>`}<b class="tn">${N.time(pts[i][1], at)}</b>${below ? h`<small>${pts[i][0]}</small>` : ''}</span>`;
    return h`<div class="cx-tl">
      <div class="cx-up">${lab(0, 'left:0')}${lab(2, `left:${pd.toFixed(1)}%;transform:translateX(calc(-100% - 8px));text-align:right`)}</div>
      ${bar}
      <div class="cx-dn">${lab(1, `left:${pb.toFixed(1)}%;transform:translateX(${pb > 2 ? 6 : 0}px)`, 1)}${lab(3, 'right:0;text-align:right', 1)}</div>
    </div>`;
  }
  return h`<div class="cx-tl">${bar}<div class="cx-grid">${pts.map((p, i) => h`<div class="${i === 2 ? 'cx-doors' : ''}"><small>${p[0]}</small><b class="tn">${N.time(p[1], at)}</b></div>`)}</div></div>`;
}

function foodNear(ap, gate) {
  const g = N.guideFor(ap);
  const list = g && Array.isArray(g.food) ? g.food.filter(f => f && f.name) : [];
  const L = gateLetter(gate);
  const re = L ? new RegExp(`\\b${L}(\\d|\\b)`) : null;
  const score = f => { const t = `${f.near || ''} ${f.where || ''}`; return re && re.test(t) ? 0 : /atrium|central|food court/i.test(t) ? 1 : 2; };
  return list.map((f, i) => [score(f), i, f]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).slice(0, 3).map(x => x[2]);
}

// Weather and FAA at the connecting airport. Days ahead, the updater's forecast for the
// leg time (wx.legs, when present) beats "right now"; FAA only matters on the day or when not normal.
function wxChip(code, ids, dir) {
  const a = N.airportLive(code) || {};
  const wx = a.wx || {}, faa = a.faa || {};
  const parts = [];
  const fc = (Array.isArray(wx.legs) ? wx.legs : []).find(x => x && ids.includes(x.leg) && x.temp_f != null && okT(x.t));
  const useFc = fc && T(fc.t) - N.now().getTime() > 2 * 3600e3;
  const w = useFc ? fc : wx;
  if (w.temp_f != null && Number.isFinite(+w.temp_f)) {
    parts.push(`${useFc ? `Forecast for ${N.time(fc.t, code)}: ` : ''}${Math.round(+w.temp_f)}°${w.text ? ' ' + lc(w.text) : ''}${useFc && fc.precip_pct >= 30 ? ` (${fc.precip_pct}% rain)` : ''}`);
  }
  const fs = faa.status;
  let warn = false;
  if (fs === 'delay') { parts.push(`FAA delays${faa.avg_min ? ` · avg ${faa.avg_min} min` : ''}`); warn = true; }
  else if (fs === 'ground_stop') { parts.push('FAA ground stop'); warn = true; }
  else if (fs === 'closed') { parts.push('airport closed (FAA)'); warn = true; }
  else if (fs === 'normal' && N.travelWindow() === dir) parts.push('no FAA delays');
  if (!parts.length) return '';
  const t = parts.join(' · ');
  const ic = warn ? 'alert-triangle' : /rain|shower|storm/i.test(w.text || '') ? 'cloud-rain' : /sun|clear/i.test(w.text || '') ? 'sun' : 'cloud';
  return h`<span class="chip ${warn ? 'warn' : 'cr'} cx-wx">${icon(ic)}${t.charAt(0).toUpperCase() + t.slice(1)}</span>`;
}

function guidance(dir, legs, c, bad) {
  const a = legs[0], b = legs[1];
  const at = a.to;
  const g = N.guideFor(at) || {};
  const rows = [];
  rows.push(['shield-check', 'Stay airside', `Domestic to domestic, so no security again. Bags are checked through to ${b.to}.`]);
  const ag = a.arr.gate, bg = b.dep.gate;
  let gateT, gateS;
  if (bad) {
    gateT = 'Check your new gate first';
    gateS = `${bg ? `${fno(b)} was to leave from ${bg}. ` : ''}A rebooked flight often leaves from a different gate; the AA app shows it.`;
  } else if (bg) {
    gateT = `${fno(b)} leaves from ${bg}`;
    gateS = `${concourse(at, bg)}${ag ? ` · you land at ${ag}` : ''}. Gates can still move, so glance at a screen on the way.`;
  } else {
    gateT = N.travelWindow() === b.dir ? `${fno(b)}’s gate isn’t posted yet` : 'Your next gate posts on the day';
    gateS = `${ag ? `You land at ${ag}. ` : ''}Check the AA app or the first departures screen after you leave the plane. Don’t assume the usual gate.`;
  }
  rows.push(['door', gateT, gateS]);
  const w = bad ? N.walk(null, null) : c ? c.walk : N.walk(ag, bg);
  const wT = w.known ? (w.same ? `Same concourse, about ${w.min} min` : `About ${w.min} min on foot`) : 'Plan on about 15 min walking';
  const wS = w.known
    ? `${gateLetter(ag)} to ${gateLetter(bg)}${w.same ? '' : ' through the Atrium'}. There’s no train; it’s all walking.`
    : `${bad ? 'Until you know your new gate.' : 'Until both gates post.'} All concourses connect through the Atrium; there’s no train.`;
  rows.push(['walk', wT, wS]);
  const food = foodNear(at, bad ? null : bg);
  if (food.length) {
    rows.push(['tools-kitchen-2', bg && !bad ? `Food near ${gateLetter(bg) ? 'Concourse ' + gateLetter(bg) : 'the gate'}` : 'Food on the way',
      food.map(f => `${f.name}${f.where ? ` (${f.where})` : ''}`).join(' · ') + '. Find the gate first, then eat.']);
  }
  const wrong = (g.steps && g.steps.connect || []).find(s => s && /wrong|miss/i.test(s.title || ''));
  rows.push(['alert-triangle', 'If you miss it', wrong && wrong.detail || 'AA rebooks you on the next flight and your bags follow. The AA app shows the new flight; desks are on each concourse.']);
  return h`<div class="sec stack cx-rows">${rows.map(r => h`<div class="rw"><span class="ic">${icon(r[0])}</span><div class="grow"><b>${r[1]}</b><small>${r[2]}</small></div></div>`)}</div>`;
}

    const legRow = (l, word) => h`<a class="fx-row fx-go" href="#flight/${l.id}"><span class="ic">${icon(word === 'in' ? 'plane-arrival' : 'plane-departure')}</span><div class="grow">

// ---------- #seats/<legId> ----------
// Seat references in guide text: "13F", "25F–29F", "20A–D", "14–20 A/F", "Rows 34–36", "13A/F".
function seatRefs(text, rows) {
  const out = new Set();
  let s = String(text || '');
  const colon = s.indexOf(':');
  if (colon > 0 && /\d/.test(s.slice(0, colon))) s = s.slice(0, colon);
  const D = '[–-]';
  const add = (r, L) => out.add(`${r}${L}`);
  const range = (a, b) => { const o = []; for (let i = +a; i <= +b && o.length < 60; i++) o.push(i); return o; };
  const lets = (a, b) => { const o = []; for (let c = a.charCodeAt(0); c <= b.charCodeAt(0); c++) o.push(String.fromCharCode(c)); return o; };
  s = s.replace(new RegExp(`rows?\\s+(\\d{1,2})\\s*${D}\\s*(\\d{1,2})`, 'gi'), (m, a, b) => { range(a, b).forEach(r => out.add(`${r}*`)); return ' '; });
  s = s.replace(new RegExp(`\\brow\\s+(\\d{1,2})\\b`, 'gi'), (m, a) => { out.add(`${a}*`); return ' '; });
  s = s.replace(new RegExp(`\\b(\\d{1,2})([A-K])\\s*${D}\\s*(\\d{1,2})([A-K])\\b`, 'g'), (m, a, L1, b, L2) => { range(a, b).forEach(r => lets(L1 < L2 ? L1 : L2, L1 < L2 ? L2 : L1).forEach(L => add(r, L))); return ' '; });
  s = s.replace(new RegExp(`\\b(\\d{1,2})([A-K])\\s*${D}\\s*([A-K])\\b`, 'g'), (m, a, L1, L2) => { lets(L1, L2).forEach(L => add(a, L)); return ' '; });
  s = s.replace(new RegExp(`\\b(\\d{1,2})\\s*${D}\\s*(\\d{1,2})\\s+([A-K](?:\\/[A-K])*)\\b`, 'g'), (m, a, b, Ls) => { range(a, b).forEach(r => Ls.split('/').forEach(L => add(r, L))); return ' '; });
  s = s.replace(/\b(\d{1,2})([A-K](?:\/[A-K])*)\b/g, (m, a, Ls) => { Ls.split('/').forEach(L => add(a, L)); return ' '; });
  return out;
}
const hits = (set, r, L) => set.has(`${r}${L}`) || set.has(`${r}*`);

function layoutOf(info) {
  const cabins = info && info.layout && Array.isArray(info.layout.cabins) ? info.layout.cabins : [];
  return cabins.map(c => {
    const groups = String(c.letters || '').toUpperCase().split(/[-\s|]+/).map(g => g.replace(/[^A-K]/g, '').split('')).filter(g => g.length);
    const from = +c.from, to = +c.to;
    if (!groups.length || !Number.isFinite(from) || !Number.isFinite(to) || to < from || to - from > 80) return null;
    const missing = new Set((c.missing || []).map(Number));
    const gone = new Set((c.missing_seats || []).map(normSeat));
    const rows = [];
    for (let r = from; r <= to; r++) if (!missing.has(r)) rows.push(r);
    return {name: c.name || 'Cabin', groups, rows, exits: new Set((c.exits || []).map(Number)), gone, note: c.note || '',
      extra: /extra|comfort|plus/i.test(c.name || ''), first: /first|business/i.test(c.name || '')};
  }).filter(Boolean);
}
function seatPos(cab, L) {
  const g = cab.groups;
  const all = g.flat();
  if (L === all[0] || L === all[all.length - 1]) return 'Window';
  for (let i = 0; i < g.length; i++) {
    if ((i > 0 && L === g[i][0]) || (i < g.length - 1 && L === g[i][g[i].length - 1])) return 'Aisle';
  }
  return 'Middle';
}

N.screen('seats', {
  nav: 1,
  uses: USES,
  back: 'flights',
  tone: 'band',
  title: ctx => { const l = findLeg(ctx.param); return l ? `Seats · ${fno(l)}` : 'Seats'; },
  render(ctx) {
    const l = findLeg(ctx.param);
    if (!l) {
      return {hero: h`<div class="st-h"><div class="ey">Seat map</div><h1 class="hl"><b>Flight not found</b></h1></div>`,
        body: h`<div class="st"><a class="btn" href="#flights">${icon('plane')}All flights</a></div>`};
    }
    this.back = `flight/${l.id}`;
    const p = plane(l);
    const info = p.info;
    const cabins = layoutOf(info);
    const mine = l.seats.map(normSeat).filter(Boolean);
    const good = new Set(), avoid = new Set();
    const goodWhy = [], avoidWhy = [];
    (info && info.good || []).forEach(t => { const s = seatRefs(t); s.forEach(x => good.add(x)); goodWhy.push([s, t]); });
    (info && info.avoid || []).forEach(t => { const s = seatRefs(t); s.forEach(x => avoid.add(x)); avoidWhy.push([s, t]); });
    const swapped = l.live && l.aircraft_code && l.planned_code && l.aircraft_code !== l.planned_code;
    const hero = h`<div class="st-h">
      <div class="ey">Seat map · ${fno(l)} · ${l.from} → ${l.to}</div>
      <h1 class="hl">${p.maker ? h`${p.maker} ` : ''}<b>${p.short || 'Aircraft not known'}</b></h1>
      ${info && info.config ? h`<p class="st-cfg">${info.config}</p>` : ''}
    </div>`;
    if (!cabins.length) {
      return {hero, body: h`<div class="st">
        <div class="bn neutral">${icon('info-circle')}<div class="grow"><b>${p.short ? `No cabin layout saved for the ${p.short}` : 'Aircraft not known yet'}</b>
          <span>${p.short ? 'The AA app shows the seat map for your booking.' : 'AA assigns the plane closer to the day. The AA app shows the seat map for your booking.'}</span>
          ${l.seatmap || info && info.map_url ? h`<div class="bx">${ext(l.seatmap || info.map_url, 'Full seat map')}</div>` : ''}</div></div>
        ${mine.length ? h`<div class="sec"><div class="ey">Your seats</div><div class="wrap">${mine.map(s => h`<span class="chip cr tn">${icon('armchair')}${s}</span>`)}</div></div>` : ''}
      </div>`};
    }
    // Where each of your seats is, and anything the guide says about it.
    const known = new Map();
    cabins.forEach(c => c.rows.forEach(r => c.groups.flat().forEach(L => { if (!c.gone.has(`${r}${L}`)) known.set(`${r}${L}`, c); })));
    const mineRows = mine.map(s => {
      const m = s.match(/^(\d{1,2})([A-K])$/);
      const cab = m && known.get(s);
      if (!cab) return h`<div class="rw"><span class="ic st-ic">${icon('armchair')}</span><div class="grow"><b class="tn">${s}</b><small>Not on this layout. The plane may have been swapped; check the AA app.</small></div></div>`;
      const r = +m[1], L = m[2];
      const why = [...avoidWhy.filter(([set]) => hits(set, r, L)).map(([, t]) => ['avoid', t]), ...goodWhy.filter(([set]) => hits(set, r, L)).map(([, t]) => ['good', t])];
      const exit = cab.exits.has(r);
      return h`<div class="rw"><span class="ic st-ic">${icon('armchair')}</span><div class="grow"><b class="tn">${s} · ${seatPos(cab, L)}</b>
        <small>Row ${r} · ${cab.name}${exit ? ' · exit row' : ''}</small>
        ${why.slice(0, 2).map(([k, t]) => h`<small class="st-why ${k}">${icon(k === 'good' ? 'thumb-up' : 'alert-circle')}${t}</small>`)}</div></div>`;
    });

const canLocate = () => !!navigator.geolocation && !N.lastWhere();

// ---------- hours ----------
// Only well-formed [weekday, "HH:MM", "HH:MM"] rows count, for the chip and the table alike,
// so a bad row can't turn into "Closed" or "Open 24 hours".
const HHMM = /^([01]?\d|2[0-4]):[0-5]\d$/;
const validHours = p => arr(p && p.hours).filter(r => Array.isArray(r) && r.length >= 3 && Number.isInteger(r[0]) && r[0] >= 0 && r[0] <= 6
  && HHMM.test(String(r[1])) && HHMM.test(String(r[2])));
const NO_HOURS = {state: 'unknown', text: 'Hours not listed'};
const hoursOf = p => {
  const rows = validHours(p);
  if (!rows.length || !food().hours) return NO_HOURS;
  try { return food().hours({...p, hours: rows}, N.now()) || NO_HOURS; }
  catch { return NO_HOURS; }
};
// One weekday as text, with whole-day spans as "Open 24 hours".
function dayText(p, dd) {
  const rows = validHours(p).filter(r => r[0] === dd);
  if (!rows.length) return 'Closed';
  return rows.map(([, a, b]) => {
    const s = toMin(a); let e = toMin(b);
    if (e <= s) e += 1440;
    return e - s >= 1439 ? 'Open 24 hours' : `${N.clockText(s)}–${N.clockText(e)}`;
  }).join(', ');
}

// ---------- attributes → chips ----------
const ATTRS = [
  // [key, test(value) → [icon, text, warn?] | null]
  ['reservations', v => v === true ? ['calendar-check', 'Takes reservations'] : v === false ? ['calendar', 'No reservations'] : null],
  ['cards', v => v === false ? ['cash', 'Cash only', true] : v === true ? ['credit-card', 'Cards accepted'] : null],
  ['apple_pay', v => v === true ? ['device-mobile', 'Apple Pay'] : null],
  ['wheelchair', v => v === true ? ['wheelchair', 'Wheelchair accessible'] : v === false ? ['wheelchair', 'Not wheelchair accessible', true] : null],
  ['takeout', v => v === true ? ['shopping-bag', 'Takeout'] : v === false ? ['shopping-bag', 'No takeout'] : null],
  ['delivery', v => v === true ? ['scooter', 'Delivery'] : null],
  ['outdoor', v => v === true ? ['sun', 'Outdoor seating'] : null],
  ['noise', v => typeof v === 'string' && v ? ['volume', `${cap1(v)} noise`] : null],
  ['alcohol', v => typeof v === 'string' && v ? [/bar/i.test(v) ? 'glass-full' : 'beer', cap1(v)] : v === false ? ['glass-full', 'No alcohol'] : null],
  ['happy_hour', v => v === true ? ['clock', 'Happy hour'] : null],
  ['late_kitchen', v => v === true ? ['moon', 'Late kitchen'] : null],
  ['groups', v => v === true ? ['users', 'Good for groups'] : null],
  ['kids', v => v === true ? ['baby-carriage', 'Good for kids'] : null],
  ['vegan', v => v === true ? ['leaf', 'Vegan options'] : null],
  ['vegetarian', v => v === true ? ['salad', 'Vegetarian options'] : null],
  ['gluten_free', v => v === true ? ['bread', 'Gluten-free options'] : null],
  ['wifi', v => typeof v === 'string' && v && v !== 'no' ? ['wifi', `${cap1(v)} Wi-Fi`] : null],
  ['good_for_working', v => v === true ? ['briefcase', 'Laptop-friendly'] : null],
  ['dogs', v => v === true ? ['dog', 'Dogs allowed'] : null],
  ['ambience', v => typeof v === 'string' && v ? ['sparkles', cap1(v)] : null],
  ['attire', v => typeof v === 'string' && v ? ['user', `${cap1(v)} dress`] : null],
  ['best_nights', v => typeof v === 'string' && v ? ['moon-stars', `Busiest: ${v.split(/,\s*/).map(d => d.slice(0, 3)).join(', ')}`] : null],
  ['parking', v => typeof v === 'string' && v ? ['parking', `Parking: ${v}`] : null],
  ['health', v => typeof v === 'string' && v ? ['shield-check', /^[A-C]$/.test(v) ? `Health grade ${v}` : /pending/i.test(v) ? 'Health grade pending' : `Inspection: ${v}`] : null],
  ['gender_neutral_restrooms', v => v === true ? ['toilet-paper', 'Gender-neutral restrooms'] : null],
  ['lgbtq_friendly', v => v === true ? ['heart', 'LGBTQ+ friendly'] : null],
  ['corkage', v => v === 'free' ? ['bottle', 'Free corkage'] : null],
  ['catering', v => v === true ? ['tools-kitchen-2', 'Catering'] : null],
  ['private_events', v => v === true ? ['calendar-time', 'Private events'] : null],
];
function attrChips(a) {
  if (!a || typeof a !== 'object') return [];
  const out = [];
  for (const [k, fn] of ATTRS) {
    if (!(k in a)) continue;
    let r = null;
    try { r = fn(a[k]); } catch { r = null; }
    if (r) out.push(r);
  }
  return out;
}

// ---------- pieces ----------
function stars(r) {
  const v = Math.round(N.clamp(r, 0, 5) * 2) / 2;
  const s = [1, 2, 3, 4, 5].map(i => icon(v >= i ? 'star-filled' : v >= i - .5 ? 'star-half-filled' : 'star'));
  return h`<span class="pl-stars" role="img" aria-label="${`Rated ${r} out of 5`}">${s}</span>`;
}
// Display size for the name: big when short, smaller when long or a word is long.
function nameSize(name) {
  const len = name.length;
  const word = Math.max(...name.split(/\s+/).map(w => w.length), 1);
  const byLen = len <= 10 ? 60 : len <= 14 ? 50 : len <= 20 ? 42 : len <= 28 ? 36 : len <= 36 ? 30 : 26;
  const byWord = 350 / (word * .64);
  return [60, 50, 42, 36, 30, 26].find(s => s <= Math.min(byLen, byWord)) || 26;
}

function hoursChip(p) {
  const st = hoursOf(p);
  const tone = st.state === 'open' ? 'ok' : st.state === 'closing' ? 'soon' : st.state === 'closed' ? 'shut' : 'na';
  return h`<span class="${'pl-chip pl-' + tone}"><span class="pl-dot"></span>${st.text || 'Hours not listed'}</span>`;
}
function statusRow(p) {
  const bits = distBits(p);
  const ask = !bits.some(b => b.t.endsWith('from you')) && canLocate() && hasLL(p) && !N.lastWhere();
  return h`${hoursChip(p)}${bits.map(b => h`<span class="pl-chip pl-dist">${icon(b.i)}${b.t}</span>`)}${ask
    ? h`<button class="pl-chip pl-ask" data-act="locate">${icon('current-location')}How far from me?</button>` : ''}`;
}

function gallery(p) {

      return h`<button class="pl-ph pl-fig${list.length === 1 ? ' pl-one' : ''}" data-act="photo" data-arg="${i}" aria-label="${label}">
        <img class="pl-img" src="${photoUrl(x.id, 'l')}" alt="" ${i ? N.raw('loading="lazy"') : N.raw('fetchpriority="high"')} decoding="async">

function heroHtml(p) {
  const name = str(p.name) || 'Unnamed place';
  const cuisine = arr(p.cuisine).map(str).filter(Boolean).slice(0, 3).join(' · ');

  let rating = num(p.rating), reviews = num(p.reviews);
  if (rating != null && !(rating > 0 && rating <= 5)) rating = null;

  const price = str(p.price);
  const where = [str(p.located_in) ? `Inside ${str(p.located_in)}` : '', str(p.neighborhood), str(p.borough)].filter(Boolean).join(' · ');

      ${where ? h`<div class="pl-where">${icon('map-pin')}<span>${where}</span></div>` : ''}

function quickActs(p) {

function overview(p) {

function toOrder(p) {

function opinions(p) {

function detailsHtml(p) {

          [str(p.neighborhood), str(p.borough)].filter(Boolean).length ? h`<small>${[str(p.neighborhood), str(p.borough)].filter(Boolean).join(' · ')}</small>` : ''}</div>
        ${addr ? h`<button class="pl-copy" data-act="copy" data-arg="${addr}" aria-label="Copy address">${icon('copy')}</button>` : ''}

// ---------- full-screen photo viewer ----------
let lb = null;          // the open viewer
let reopen = null;      // {id, idx} kept across a same-page re-render
function lbHtml(p, list) {
  const inside0 = list.length - nInside(p);
  return h`<div class="pl-lb-top">
      <span class="pl-lb-n" aria-live="polite" data-pl="lbn"></span>
      <button class="pl-lb-x" data-act="lbClose" aria-label="Close photos">${icon('x')}</button>
    </div>
    <div class="pl-lb-track" data-hscroll>${list.map((x, i) => h`<figure class="pl-lb-s pl-fig">
      <img class="pl-img" alt="${str(x.cap) || `Photo ${i + 1}`}" data-src="${photoUrl(x.id, 'o')}" data-alt="${photoUrl(x.id, 'l')}" decoding="async">
      ${str(x.cap) || i >= inside0 ? h`<figcaption>${i >= inside0 ? h`<b>Inside</b>` : ''}${str(x.cap)}</figcaption>` : ''}
    </figure>`)}</div>
    <button class="pl-lb-b pl-lb-prev" data-act="lbStep" data-arg="-1" aria-label="Previous photo">${icon('chevron-left')}</button>
    <button class="pl-lb-b pl-lb-next" data-act="lbStep" data-arg="1" aria-label="Next photo">${icon('chevron-right')}</button>`;
}
function openLb(p, idx, instant = false) {
  closeLb(true);
  const list = photosOf(p);
  if (!list.length) return;
  idx = N.clamp(Math.round(+idx || 0), 0, list.length - 1);
  const app = N.$('#app') || document.body, view = N.$('#view'), nav = N.$('.nv');
  const el = document.createElement('div');
  el.className = 'pl-lb' + (instant || N.reduce ? '' : ' pl-lb-in');
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', `Photos of ${str(p.name) || 'this place'}`);
  el.innerHTML = String(lbHtml(p, list));
  app.appendChild(el);
  const track = N.$('.pl-lb-track', el), imgs = N.$$('img', track);
  const st = {p, el, track, imgs, n: list.length, idx: -1, prevFocus: document.activeElement, view, nav, off: []};
  lb = st;
  if (view) { view.style.overflow = 'hidden'; view.inert = true; }
  if (nav) nav.inert = true;
  const show = i => {
    i = N.clamp(i, 0, st.n - 1);
    for (const j of [i, i + 1, i - 1]) { const im = imgs[j]; if (im && !im.getAttribute('src') && im.dataset.src) im.src = im.dataset.src; }
    if (i === st.idx) return;
    st.idx = i;
    const n = N.$('[data-pl="lbn"]', el); if (n) n.textContent = `${i + 1} / ${st.n}`;
    N.$('.pl-lb-prev', el).disabled = i === 0;
    N.$('.pl-lb-next', el).disabled = i === st.n - 1;
  };
  st.show = show;
  track.scrollLeft = idx * track.clientWidth;
  show(idx);
  let raf = 0;
  const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => show(Math.round(track.scrollLeft / Math.max(1, track.clientWidth)))); };
  track.addEventListener('scroll', onScroll, {passive: true});
  // Keep the photo in place when the phone rotates or the window resizes.
  const onResize = () => { track.scrollLeft = st.idx * track.clientWidth; };
  window.addEventListener('resize', onResize);
  const onKey = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); closeLb(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); stepLb(1); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stepLb(-1); }
    else if (ev.key === 'Tab') {
      const f = N.$$('button', el).filter(b => !b.disabled);
      if (!f.length) return;
      const k = f.indexOf(document.activeElement);
      ev.preventDefault();
      f[(k + (ev.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  };

// One leg as a ticket card → #flight/<id>.
function legCard(l) {

// The whole outbound (or return) as one ticket → #flights.
function tripCard(legs, label) {

    </div></a>`;
}
// Bags close / Boards / Doors close (or Departs) as three cells; the next deadline is ringed.
function cutoffs(items, ring) {
  const t = nowMs();
  const live = items.filter(x => x && x.at);
  const next = ring ? live.find(x => T(x.at) > t) : null;
  return h`<div class="cn td-cn">${live.map(x => {
    const past = T(x.at) <= t;
    return h`<div class="${x === next ? 'w' : ''}"><small>${x.label}</small><b class="tn"${x.k ? h` data-k="${x.k}"` : ''}>${N.time(x.at, x.ap)}</b><span>${past ? (x.pastText || 'passed') : h`in ${until(x.at)}`}</span></div>`;
  })}</div>`;
}
// The sand card for the drive to the airport.
function planCard(S, phase) {
  const {lv, leg: l, dir} = S;
  const ap = l.from, t = nowMs();
  const leaving = S.mode === 'leave' || S.mode === 'leavenow';
  const eyeb = phase === 'before' ? `${N.date(l.dep.time, ap).split(' ')[0]} morning · ${placeOf(l)}`
    : S.mode === 'goto' ? `On the way · ${placeOf(l)}` : `${dir === 'out' ? 'Leave home' : 'Leave the hotel'} · ${placeOf(l)}`;
  const leaveTxt = T(lv.at) > t ? `Leave ${N.time(lv.at, ap)}` : `Leave by ${N.time(lv.at, ap)}`;
  const curb = stepBy(ap, 'depart', 'door');
  const secStep = stepBy(ap, 'depart', 'shield-check', /security/i);
  const drive = stepBy(ap, 'depart', 'car');
  const cps = checkpoints(ap);
  const cut = h`<span class="tn"><span class="td-nw">Bags close ${N.time(lv.bagdrop, ap)}</span> · <span class="td-nw">Boards ${N.time(l.board, ap)}</span> · <span class="td-nw">Doors close <span data-k="doors-${l.id}">${N.time(l.doors, ap)}</span></span></span>`;
  let rows;
  if (phase === 'before') rows = [];
  else {
    const tip = drive && dropFirst(drive.detail);
    rows = [
      ln('clock', cut),
      leaving && tip && tip !== drive.detail ? ln('car', tip) : '',
      !leaving && curb ? stepLn(curb, 1) : '',
      ln('shield-check', cps),
      secStep ? ln('info-circle', leaving ? sentences(dropFirst(secStep.detail), 1) : h`<b>${String(secStep.title || 'Security').replace(/\.$/, '')}:</b> ${sentences(secStep.detail, 2)}`) : '',
    ].filter(Boolean);
  }
  return h`<div class="card sand td-plan">
    <div class="td-planh"><div class="grow"><div class="ey">${eyeb}</div><div class="td-big tn">At ${termLabel(l)} by <span data-k="arrive-${dir}">${N.time(lv.arrive, ap)}</span></div></div>
      ${S.mode === 'goto' && phase !== 'before' ? '' : h`<span class="chip td-lv">${icon(dir === 'out' ? 'home' : 'building')}<span data-k="leave-${dir}">${leaveTxt}</span></span>`}</div>
    ${phase === 'before' ? h`<p class="td-cut">${cut}</p>` : ''}
    ${rows.length ? h`<div class="td-rows">${rows}</div>` : ''}
    ${phase !== 'before' && S.mode === 'leave' && T(lv.at) - t > 3 * HOUR ? h`<p class="td-cut">Leave in ${until(lv.at)}</p>` : ''}
  </div>`;
}
// Big gate number with boarding and door times.
