.fd-pw.fd-drag .fd-prev:active{background-image:none}
.fd-prev{display:flex;align-items:center;gap:12px;min-height:104px;padding:10px 44px 10px 10px;border-radius:22px;background:var(--sheet);color:var(--ink);text-decoration:none;box-shadow:var(--navs)}
.fd-pth{position:relative;flex:none;width:84px;height:84px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--fb) 24%,var(--cr));color:var(--fb);font-size:28px}
.fd-pbd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.fd-pch{position:absolute;right:14px;bottom:16px;font-size:20px;color:var(--mu)}
.fd-px{position:absolute;top:2px;right:2px;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mu)}
.fd-mmsg{position:absolute;z-index:2;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:46%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 18px;border-radius:22px;background:var(--sheet);box-shadow:var(--navs);text-align:center}
.fd-mmsg>b{font-size:17px;font-weight:800}
.fd-mmsg>span{font-size:14px;line-height:1.4;color:var(--mu)}
.fd-mmsg .fd-ebtns{display:flex}
/* the credits sit under the preview card's edge, so they step aside while it's open */
.fd-pvon .fd-attr,.fd-pvon .leaflet-control-attribution{display:none}
.fd-attr{position:absolute;z-index:1;left:8px;bottom:calc(82px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 16px);box-sizing:border-box;margin:0;padding:1px 6px;border-radius:6px;
  background:var(--sheet);opacity:.9;font-size:10px;line-height:1.5;color:var(--mu);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-attr:empty{display:none}
/* the no-map notice is for people, not a credit, so it stays readable */
.fd-nobase .fd-attr{font-size:13px}

/* pins: Leaflet divIcons with a zero-size anchor; the dot centres on the spot. One style: an ink dot with the food's
   icon, an --eb ring when it's open now; the picked one opens into a pill with its rating. 44px targets throughout. */
.fd-pin,.fd-clu,.fd-me,.fd-hpin{background:none;border:0}
.fd-pin:focus-visible,.fd-clu:focus-visible{outline:none}
.fd-pv{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;justify-content:center;gap:4px;width:26px;height:26px;border-radius:13px;
  background:var(--ink);color:var(--page);font-size:13px;font-weight:800;white-space:nowrap;line-height:1;
  box-shadow:0 0 0 2px var(--sheet),0 2px 6px color-mix(in srgb,var(--robt) 28%,transparent);transition:transform .18s var(--ease)}
.fd-pv::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;min-width:100%;transform:translate(-50%,-50%);border-radius:22px}
.fd-pv .i{font-size:15px}
.fd-pv b{display:none}
.fd-po .fd-pv{box-shadow:0 0 0 2px var(--sheet),0 0 0 4.5px var(--eb),0 2px 6px color-mix(in srgb,var(--robt) 28%,transparent)}
.fd-pin.on .fd-pv{width:auto;height:32px;padding:0 10px 0 8px;border-radius:16px;transform:translate(-50%,-50%) scale(1.06);
  box-shadow:0 0 0 2px var(--sheet),0 4px 12px color-mix(in srgb,var(--robt) 40%,transparent)}
.fd-pin.on.fd-po .fd-pv{box-shadow:0 0 0 2px var(--sheet),0 0 0 4.5px var(--eb),0 4px 12px color-mix(in srgb,var(--robt) 40%,transparent)}
.fd-pin.on .fd-pv b{display:inline}
.fd-pin:focus-visible .fd-pv,.fd-clu:focus-visible .fd-cl{outline:2px solid var(--eb);outline-offset:4px}
/* a bubble of nearby pins: tap to zoom in on them */
.fd-cl{position:absolute;left:0;top:0;width:36px;height:36px;transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);color:var(--page);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2px var(--sheet),0 3px 10px color-mix(in srgb,var(--robt) 30%,transparent)}
.fd-cl::before{content:"";position:absolute;inset:-4px;border-radius:50%}
.fd-me span{position:absolute;left:0;top:0;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:var(--eb);
  box-shadow:0 0 0 3px var(--sheet),0 0 0 10px color-mix(in srgb,var(--eb) 24%,transparent)}
.fd-hpin span{position:absolute;left:0;top:0;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:12px;background:var(--ink);color:var(--page);
  display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 0 2px var(--sheet)}

@media (prefers-reduced-motion:reduce){
  .fd-pv{transition:none}
}

/* screens/nav.css */
/* #nav hands off to the Airports tab map; this is the moment in between. */
.na-go{display:flex;align-items:center;gap:10px;min-height:120px;font:var(--t-meta);color:var(--mu)}
.na-sp{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);border-top-color:var(--eb);animation:na-sp .8s linear infinite}
@keyframes na-sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.na-sp{animation:none}}

/* screens/place.css */
/* Place screen (#place/<alias>). Every selector starts with .pl- */

/* ---------- hero: photos ---------- */
.pl-hero{padding-top:2px}
.pl-galw{position:relative;margin:0 -20px}
.pl-gal{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pl-gal::-webkit-scrollbar{display:none}
/* lets the last photo snap to the left edge like the others */
.pl-gal::after{content:"";flex:0 0 calc(16% - 10px)}
.pl-ph{position:relative;display:block;flex:0 0 84%;height:clamp(170px,30vh,250px);border-radius:24px;overflow:hidden;scroll-snap-align:start;background:var(--onband2)}
.pl-ph.pl-one{flex-basis:100%}
.pl-gal:has(.pl-one)::after{display:none}
.pl-ph .pl-img,.pl-dimg .pl-img{display:block;width:100%;height:100%;object-fit:cover}
.pl-cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:15px;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:600}
.pl-cap span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl-cap b{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--eb);flex:none}
.pl-cnt{position:absolute;top:10px;left:30px;display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;
  background:var(--sheet);color:var(--ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
.pl-cnt .i{font-size:15px;color:var(--eb)}
.pl-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:120px;border-radius:24px;
  background:var(--onband2);color:var(--obt);font-size:14px;font-weight:600}
.pl-none .i{font-size:28px;opacity:.8}

/* a photo that could not load */
.pl-bad .pl-img{visibility:hidden}
.pl-badm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;
  text-align:center;font-size:13px;font-weight:600;color:var(--obt);background:var(--onband2)}
.pl-badm .i{font-size:24px;opacity:.8}
.pl-dimg .pl-badm{color:var(--mu);background:var(--cr)}
.pl-lb .pl-badm{background:transparent;font-size:15px;color:var(--ob)}

/* ---------- hero: title + status ----------
   Text on the translucent --onband fill uses --obt (as base .chip.ob does): white on it
   is about 2.2:1 in the light theme, --obt is over 7:1. */
.pl-ttl{margin-top:20px}
.pl-name{margin:12px 0 0;padding-top:2px;color:var(--ob);text-wrap:balance;overflow-wrap:break-word}
.pl-t60{font-size:60px}.pl-t50{font-size:50px}.pl-t42{font-size:42px}.pl-t36{font-size:36px}.pl-t30{font-size:30px}.pl-t26{font-size:26px}
.pl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:14px;font-size:15px;font-weight:600;color:var(--obm)}
.pl-meta>span{white-space:nowrap}
.pl-rate{display:inline-flex;align-items:center;gap:7px}
.pl-rate b{font-weight:800;color:var(--obt)}
.pl-stars{display:inline-flex;gap:1px;font-size:16px;color:var(--obt)}
.pl-sep{opacity:.7}
.pl-where{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:15px;font-weight:600;line-height:1.35;color:var(--obm)}
.pl-where .i{font-size:17px;margin-top:1px}
.pl-stat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.pl-chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:20px;font-size:14px;font-weight:700;
  background:var(--onband);color:var(--obt);white-space:nowrap;max-width:100%}
.pl-chip .i{font-size:17px}
.pl-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pl-ok{background:var(--sheet);color:var(--ink)}
.pl-ok .pl-dot{background:var(--ok)}
.pl-soon{background:var(--sheet);color:var(--ink)}
/* closing soon is a caution: the amber dot carries it, the words stay ink */
.pl-soon .pl-dot{background:var(--warn)}
.pl-shut .pl-dot,.pl-na .pl-dot{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
/* the Distance chip asks for your location; 40px to match its row, 44px to the finger */
button.pl-ask{position:relative}
button.pl-ask::after{content:"";position:absolute;inset:-2px 0}
button.pl-ask .i{color:var(--obt)}
button.pl-ask[disabled]{opacity:.7}

/* ---------- sheet ---------- */
.pl-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-acts.pl-n1{grid-template-columns:1fr}.pl-acts.pl-n2{grid-template-columns:repeat(2,1fr)}.pl-acts.pl-n3{grid-template-columns:repeat(3,1fr)}
.pl-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;border-radius:18px;background:var(--cr);
  color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;min-width:0}
.pl-act .i{font-size:23px;color:var(--eb)}
.pl-sec{margin-top:32px}
.pl-sec>.ey:first-child{margin:0 0 12px}
.pl-sum{margin:0;font-size:16px;line-height:1.5}
.pl-facts{margin-top:16px;border-radius:var(--r-lg);background:var(--cr);padding:2px 16px}
.pl-fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.pl-fact+.pl-fact{border-top:1px solid var(--ln)}
.pl-fact>div{min-width:0}
.pl-fact small{display:block;font-size:13px;font-weight:600;color:var(--mu)}
.pl-fact div>span{display:block;font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.pl-fi{width:34px;height:34px;border-radius:12px;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pl-good,.pl-also{margin-top:16px}
/* a label inside a section, quieter than the section head above it */
.pl-lbl{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:8px}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px}
.pl-tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 13px;border-radius:17px;background:var(--cr);color:var(--ink);
  font-size:14px;font-weight:600;line-height:1.2;max-width:100%}

/* what to order */
.pl-dishes{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.pl-dishes::-webkit-scrollbar{display:none}
.pl-dish{flex:0 0 148px;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;text-align:left;min-width:0;border-radius:18px}
.pl-dimg{position:relative;display:block;width:148px;height:148px;border-radius:18px;overflow:hidden;background:var(--cr);margin-bottom:7px}
.pl-dnone{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--mu)}
.pl-dish b{font-size:15px;font-weight:800;line-height:1.25}
.pl-dish small{font-size:13px;color:var(--mu);line-height:1.35}

/* people love / watch out / tips */
.pl-ops{display:grid;gap:10px}
.pl-h3{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:17px;font-weight:800}
.pl-h3 .i{font-size:20px;color:var(--eb)}
.pl-watch .pl-h3 .i,.pl-watch .pl-list .i{color:var(--sdt)}
.pl-list{list-style:none;margin:0;padding:0}
.pl-list li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:15px;line-height:1.4}
.pl-list li .i{font-size:17px;margin-top:2px;color:var(--eb);flex:none}
.pl-tips{list-style:none;margin:0;padding:0}
.pl-tips li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15px;line-height:1.45}
.pl-tips li:first-child{padding-top:0}
.pl-tips li+li{border-top:1px solid var(--ln)}
.pl-tips .pl-fi{background:var(--cr)}
.pl-tips li>span:last-child{padding-top:6px;min-width:0}

/* hours */
.pl-hrs{border-radius:var(--r-lg);background:var(--cr);padding:14px 16px 4px}
.pl-hnow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pl-hnow .pl-shut,.pl-hnow .pl-na{background:var(--sheet);color:var(--ink)}
.pl-tz{font-size:13px;color:var(--mu);font-weight:600}
.pl-tbl{width:100%;border-collapse:collapse;font-size:15px}
.pl-tbl th{text-align:left;font-weight:600;padding:8px 0;white-space:nowrap}
.pl-tbl td{text-align:right;padding:8px 0 8px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.pl-tbl tr+tr th,.pl-tbl tr+tr td{border-top:1px solid var(--ln)}
.pl-today th,.pl-today td{font-weight:800}
.pl-tdy{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:var(--ink);color:var(--page);font-size:12px;font-weight:800;vertical-align:1px}
.pl-off td{color:var(--mu)}
/* the rest of the week, folded away under today */
.pl-hall{border-top:1px solid var(--ln)}
.pl-hall>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;list-style:none;cursor:pointer;
  font-size:15px;font-weight:700;color:var(--eb);-webkit-tap-highlight-color:transparent}
.pl-hall>summary::-webkit-details-marker{display:none}
.pl-hall>summary:active{opacity:.7}
.pl-hall>summary .i{font-size:20px;transition:transform .2s var(--ease)}
.pl-hall[open]>summary .i{transform:rotate(180deg)}
.pl-hall .pl-tbl{margin:-4px 0 6px}
.pl-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding-top:10px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600}
.pl-note .i{font-size:16px;margin-top:1px}

/* details */
/* what Yelp knows about it, two to a row */
.pl-dets{list-style:none;margin:0 0 12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-radius:var(--r-lg);background:var(--cr)}
.pl-dets li{display:flex;gap:8px;align-items:flex-start;min-width:0;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pl-dets .i{font-size:18px;color:var(--eb);flex:none;margin-top:-1px}
.pl-dets .pl-warn .i{color:var(--warn)}
.pl-quiet{margin:0 0 12px;font-size:14px;color:var(--mu)}
.pl-loc{border-radius:var(--r-lg);overflow:hidden;background:var(--cr)}
.pl-map{position:relative;height:180px;background:var(--band)}
.pl-map.pl-nomap{display:none}
.pl-mapc{position:absolute;inset:0;z-index:0}
.pl-mapc.leaflet-container{background:var(--band);font-family:inherit}
.pl-map .pl-mapc .leaflet-control-attribution{margin:0 0 12px 12px;background:var(--sheet);color:var(--mu);font-size:10px;line-height:1.5;padding:1px 6px;border-radius:6px;opacity:.9}
.pl-map .pl-mapc .leaflet-control-attribution a{color:inherit;text-decoration:none}
.pl-mapa{position:absolute;inset:0;z-index:1}
.pl-mapa:focus-visible{outline-offset:-4px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.pl-pin{background:none;border:0}
.pl-pin span{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;
  background:var(--ink);color:var(--page);font-size:20px;box-shadow:0 0 0 3px var(--sheet)}
.pl-pin span::after{content:"";position:absolute;left:50%;top:100%;margin:1px 0 0 -6px;border-style:solid;border-width:8px 6px 0;border-color:var(--ink) transparent transparent}
.pl-addr{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px}
.pl-addr b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.pl-addr small{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.pl-copy{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.pl-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pl-link{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 14px;border-radius:16px;background:var(--cr);color:var(--ink);
  text-decoration:none;font-size:14px;font-weight:700;min-width:0}
.pl-link .i{font-size:18px;color:var(--eb);flex:none}
.pl-link .pl-ext{margin-left:auto;font-size:16px;color:var(--mu)}
.pl-link.pl-wide{grid-column:1/-1}
.pl-foot{display:flex;align-items:center;justify-content:center;gap:6px;margin:34px 0 0;font-size:13px;color:var(--mu);text-align:center}
.pl-foot .i{font-size:15px;flex:none}

/* not found */
.pl-miss{padding:14px 0 10px}

/* ---------- full-screen photo viewer ----------
   --robt is the near-black that stays dark in both themes; --ob stays light. The backdrop is a
   layer of its own so it can fade with a swipe down (--pl-fade) while the photo stays solid. */
.pl-lb{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;color:var(--ob);overscroll-behavior:contain}
.pl-lb::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--robt);opacity:var(--pl-fade,1);transition:opacity .28s var(--ease)}
.pl-lb-live::before{transition:none}
.pl-lb-in{animation:pl-fade .22s ease both}
@keyframes pl-fade{from{opacity:0}to{opacity:1}}
.pl-lb-top{flex:none;position:relative;z-index:1;transition:opacity .2s;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.pl-lb-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.pl-lb-x{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--ob) 16%,transparent);color:var(--ob)}
.pl-lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;
  touch-action:pan-x}
.pl-lb-track::-webkit-scrollbar{display:none}
.pl-lb-s{position:relative;flex:0 0 100%;min-width:0;margin:0;display:flex;flex-direction:column;scroll-snap-align:center;scroll-snap-stop:always;
  padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
.pl-lb-s .pl-img{flex:1 1 0;min-height:0;width:100%;object-fit:contain;display:block}
.pl-lb-s figcaption{flex:none;padding:14px 20px 0;transition:opacity .2s;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl-lb-s figcaption b{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:8px;opacity:.75}
.pl-lb-b{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:color-mix(in srgb,var(--robt) 62%,transparent);color:var(--ob);transition:opacity .2s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ob) 22%,transparent)}
.pl-lb-prev{left:max(10px,env(safe-area-inset-left,0px))}
.pl-lb-next{right:max(10px,env(safe-area-inset-right,0px))}
.pl-lb-b:disabled{opacity:0;pointer-events:none}
/* zoomed: the photo owns every touch and the arrows and caption step aside */
.pl-lb-z .pl-lb-track{overflow-x:hidden;touch-action:none}
.pl-lb-z :is(.pl-lb-b,figcaption),.pl-lb-bare :is(.pl-lb-top,.pl-lb-b,figcaption){opacity:0;pointer-events:none}
.pl-lb-done{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;min-width:96px;height:44px;
  padding:0 24px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--ob);
  background:color-mix(in srgb,var(--robt) 62%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ob) 22%,transparent)}

/* screens/today.css */
/* Today (home). Every selector is .td-prefixed; colours are tokens only. */
.td>*+*{margin-top:12px}
.td-a{display:block;text-decoration:none;color:inherit}

/* Heading on the sheet */
.td-head{margin-bottom:6px}
.td-head .hl{font-size:36px;line-height:1.04;margin-top:6px;overflow-wrap:anywhere}
.td-head .hl b{display:inline}
.td-head .sub{flex-wrap:wrap;row-gap:2px;font-size:14px}
/* Status and meta lines: the dot sits on the first line; parts wrap whole. */
.td-st{align-items:flex-start;line-height:1.35}
.td-st>.dot{margin-top:calc(.675em - 4px)}
/* Each part brings its own leading "·"; the row is shifted left by one separator and
   clipped, so the separator that would start a wrapped line is hidden and none dangles. */
.td-mw{display:block;min-width:0;flex:1 1 auto;overflow:hidden}
.td-mt{display:flex;flex-wrap:wrap;margin-left:-16px}
.td-mt>span::before{content:'·';display:inline-block;width:16px;text-align:center}
/* Status dot by status only: on time --eb, caution --warn, late or cancelled rose. */
.td .dot.td-dok{background:var(--eb)}
.td .dot.td-dcau{background:var(--warn)}
.td .dot.td-dbad{background:var(--ro)}

/* Ticket cards */
.td-tk{padding:18px 20px}
.td-tkc{position:relative}
.td-tkdp{font-size:52px;margin:10px 0 14px}
.td-tkr{display:flex;gap:12px;align-items:center;min-width:0}
.td-tkt{font-size:16px;font-weight:800;line-height:1.25}
.td-tks{font-size:14px;color:var(--mu);margin-top:2px}
.td-tk .td-st{margin-top:3px}
.td-sky{right:0;bottom:0;width:132px;height:168px}
.td-desert{right:0;bottom:0;width:156px;height:164px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%);mask-image:linear-gradient(90deg,transparent 8%,#000 52%)}
.td-moon{fill:var(--cr)}
/* On tickets the art sits beside the big codes and fades out above the time row. */
.td-tk .il{top:6px;bottom:auto;right:0;width:124px;height:150px;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.td-tk .td-desert{top:0;width:150px;height:156px;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  mask-image:linear-gradient(90deg,transparent 8%,#000 52%),linear-gradient(180deg,#000 74%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}

/* Sand plan cards */
.td-plan{padding:18px 20px}
.td-planh{display:flex;gap:10px;align-items:flex-start}
.td-big{font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.01em;margin-top:4px;overflow-wrap:anywhere;text-wrap:balance}
.td-lv{flex:none;margin-top:2px}
/* The chip drops under the title so the title keeps the full width. */
.td-planw{flex-wrap:wrap}
.td-planw>.grow{flex:1 0 100%;min-width:0}
.td-planw>.td-lv{order:3;margin-top:10px}
/* Tight connection: --warn outline, ink text (--warn text is too faint on cream). */
.chip.td-chipc{background:transparent;border:1.5px solid var(--warn);color:var(--ink)}
.td-plan .ic,.td-bags .ic,.td-food .ic{flex:none}
.td-cut{margin:12px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.td-nw{white-space:nowrap}
.td-rows{margin-top:12px}
.td-ln{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.td-ln>.i{font-size:17px;margin-top:2px;flex:none}
.td-ln>span{min-width:0;overflow-wrap:anywhere;text-wrap:pretty}
.td-ln+.td-ln{margin-top:9px}
.td-lnw{padding:12px 0 4px}
.td-more{display:flex;align-items:center;gap:4px;margin-top:14px;font-size:14px;font-weight:700;color:var(--eb)}
.td-more .i{font-size:16px}

/* Countdown cells */
.td-cn{margin-top:14px}
.td .td-cn>div{display:flex;flex-direction:column;gap:var(--sp-1);background:var(--sheet);padding:10px}
.td-cn small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .td-cn b{margin-top:0}
.td-cn span{font-size:13px}
.td-cn span span{display:inline}
/* The next deadline is ringed in ink; rose (.w) only when the connection is at risk. */
.td .td-cn .td-nx{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* Gate card */
.td-gtop{display:flex;gap:12px;align-items:flex-start}
.td-glbl{font-size:15px;font-weight:600;margin-top:10px}
.td-gnum{width:fit-content;max-width:100%;font-size:92px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:clip}
/* A long gate value (rare) gets a smaller size and wraps instead of being clipped. */
.td-gnum.td-glong{font-size:52px;line-height:1.05;white-space:normal;overflow:visible;overflow-wrap:anywhere}
.td-gnone{font-size:26px;font-weight:800;margin-top:8px}
.td-seat{flex:none;background:var(--sheet);border-radius:16px;padding:8px 12px;text-align:right;max-width:46%}
.td-seat small{display:block;font-size:13px;color:var(--mu)}
.td-seat b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.td-p{margin:10px 0 0;font-size:14px;line-height:1.4}
.td-p .i{font-size:16px;vertical-align:-3px}
.td-mu{color:var(--mu)}

/* Rows in line cards */
.td-line{padding:6px 16px}
.td-pad{padding:16px}
.td-row{display:flex;gap:12px;align-items:center;min-height:60px;padding:8px 0;min-width:0}
.td-row b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.td-row small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.td-row .grow{overflow-wrap:anywhere}
.td-chev{font-size:18px;color:var(--mu);flex:none}
/* Caution: a --warn icon with ink words. Rose (.td-risk) only for a real risk. */
.td-warn{color:var(--ink);font-weight:600}
.td-warn .i{font-size:14px;color:var(--warn);margin-right:4px;vertical-align:-2px}
.td-risk{color:var(--rot);font-weight:700}
.td-row small .td-warn{font-weight:700}
.td-ci{display:flex;align-items:center;gap:var(--sp-1);background:var(--cr);border-radius:20px;padding:6px 4px 6px 14px}
.td-ci>.td-row{flex:1 1 auto}
.td-x{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;border-radius:22px;
  background:transparent;color:var(--mu);font-size:18px;padding:0;cursor:pointer}
.td-legr .td-st{margin-top:2px}

/* Mini tiles */
.td-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.td-tiles.td-one{grid-template-columns:1fr}
.td-mini{background:var(--cr);border-radius:20px;padding:12px 14px;min-height:80px;min-width:0}
.td-mini b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:800;line-height:1.25;margin-top:4px}
.td-mini small{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.3}
.td-ring{box-shadow:inset 0 0 0 2px var(--ro)}
.td-cau{box-shadow:inset 0 0 0 2px var(--warn)}
/* Weather caution: --warn icon, ink words. */
.td-mini .td-wc{display:flex;align-items:flex-start;gap:var(--sp-1);color:var(--ink);font-weight:600}
.td-wc .i{font-size:14px;color:var(--warn);flex:none;margin-top:1px}
.td-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Banners and callouts */
.td-bn .grow>span+span{margin-top:3px}
.td-got{display:inline-flex!important;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
.td-got .i{font-size:16px;margin:0}
.td-flag{display:flex;align-items:center;min-height:44px;text-decoration:none}
.td-flag>.i:first-child{color:var(--warn)}
.td-flag>.i:last-child{font-size:18px;flex:none}
/* Old data outside the travel window: core's strip in a callout, one tap to refresh. */
.td-stale{display:flex;width:100%;min-height:44px;font:inherit;text-align:left;border:0;cursor:pointer}
.td .co.td-stale{align-items:center;font-size:14px}
.td .co.td-stale>.i{margin-top:0}
.td-stale>b{flex:none;font-weight:800}
.td .co{font-size:14px;align-items:flex-start}
/* Icon centred on the first text line (14px × 1.45 line, 18px icon). */
.td .co>.i{margin-top:1px}

/* Return legs */
.td-legs{padding:10px 0 4px}
.td-leg{display:flex;align-items:center;gap:10px;padding:8px 0;min-width:0}
.td-leg b{display:block;font-size:15px;font-weight:800}
.td-leg small{display:block;font-size:13px;color:var(--mu)}
.td-leg>span{font-size:14px;font-weight:600;text-align:right}
.td-legs .td-more{margin-top:6px}
.td-line .td-legs{padding-top:12px}
.td-flagl{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.td-flagl .i{font-size:17px;flex:none}
.td-flagl .i:first-child{color:var(--warn)}
.td-flagl .i:last-child{color:var(--mu)}

/* Weather */
.td-wxnow{display:flex;align-items:center;gap:12px;margin-top:8px}
.td-temp{font-size:48px;font-weight:300;letter-spacing:-.03em;line-height:1}
.td-wxnow b{display:block;font-size:15px;font-weight:800}
.td-wxnow small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.3}
.td-wxi{font-size:34px;color:var(--eb);flex:none}
.td-hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:14px}
.td-hr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:14px;background:var(--sheet);min-width:0}
.td-hr small{font-size:13px;color:var(--mu);font-weight:600}
.td-hr .i{font-size:20px;color:var(--eb)}
.td-hr b{font-size:15px;font-weight:800}
.td-hr span{font-size:13px;color:var(--eb);font-weight:600}

/* After the trip */
.td-sum{min-height:150px}
.td-sumr{position:relative;display:flex;gap:28px}
.td-sumr b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.td-sumr small{display:block;font-size:14px;color:var(--mu);margin-top:4px;max-width:9em}
.td-btn{margin-top:16px;width:100%}
.td-route{display:flex;text-decoration:none}
.td-route>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td>.td-route{margin-top:var(--sp-3)}
.td-empty .td-p{color:var(--mu)}
.td-lnci{padding:4px 0 14px}
.td-lnci .td-ln{color:var(--ink)}
.td-line.td-legs{padding:10px 16px 12px}
/* .td-a resets link colour; banners and callouts that are links keep their own. */
.td-a.bn{color:var(--robt)}
.td-a.bn.neutral{color:var(--ink)}
.td-a.co{color:var(--sdt)}
.td-a.co.rose{color:var(--robt)}
.td-a.co.plain{color:var(--ink)}
.td-flag .td-chev{color:inherit}

/* screens/transit.css */
/* Transit, route and hotel screens. Every selector starts with .tr- and every
   colour is a token. */

/* ---------- hero ---------- */
.tr-hero{position:relative;padding-top:2px}
.tr-hero>*{position:relative}
.tr-hero>.tr-bridge{position:absolute;z-index:0}
/* The bridge sits in the band to the right of the direction pills, clear of the title and its
   subline, with its piers running under the sheet. Only the bottom 40% of the drawing has ink,
   so the box's empty top may overlap the subline. */
.tr-bridge{right:-20px;bottom:-30px;width:46%;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
.tr-hero>[data-tr="head"],.tr-hero>.tr-ps{z-index:1}
.tr-ey{max-width:100%;line-height:1.35;overflow-wrap:anywhere}
.tr-dp{font-size:56px;margin:10px 0 0;color:var(--ob);overflow-wrap:anywhere}
.tr-hsub{margin:12px 0 0;font-size:14px;font-weight:600;line-height:1.35;color:var(--obm);max-width:300px}
.tr-ps{margin-top:18px;border-radius:24px}
.tr-ps button{height:44px;padding:0 18px;border-radius:20px}

/* route hero */
.tr-rh{display:flex;align-items:center;gap:12px;margin-top:12px;max-width:calc(100% - 40px)}
.tr-rhi{width:48px;height:48px;border-radius:16px;background:var(--onband);color:var(--ob);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tr-rname{margin:0;min-width:0;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ob);overflow-wrap:anywhere}
.tr-lede{margin:12px 0 0;font-size:14px;font-weight:500;line-height:1.45;color:var(--obm);max-width:330px}
.tr-hl{margin-top:12px}
.tr-hl .tr-mta,.tr-hl .tr-rtag{background:var(--sheet);color:var(--ink)}
.tr-hl .tr-b{box-shadow:0 0 0 2px var(--sheet)}
.tr-hl.tr-lines{gap:6px}

/* hotel hero */
.tr-hn{line-height:.9;letter-spacing:-.02em}
.tr-addr{display:flex;align-items:center;gap:10px;margin-top:14px}
.tr-addr p{margin:0;flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.35;color:var(--obm)}
.tr-ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--sheet);color:var(--ink)}
.tr-addr .tr-ib{background:var(--onband);color:var(--ob)}

/* ---------- body rhythm ---------- */
.tr-body>*+*{margin-top:12px}
.tr-body>.sec,.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr]>*{margin-top:12px}
.tr-body>[data-tr]>.sec{margin-top:22px}
.tr-body>[data-tr="top"]>:first-child,.tr-body>[data-tr="htop"]>:first-child{margin-top:0}
.tr-body>[data-tr="bot"]>:first-child{margin-top:22px}
.tr-note{margin:10px 2px 0;font-size:13px;line-height:1.4;color:var(--mu)}
.tr-wide{display:flex;width:100%;text-decoration:none}

/* hotel pill */
/* The hotel row and the traffic card under it share padding, radius and a 40px icon tile. */
.tr-pill{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px 12px 12px;border-radius:20px;background:var(--cr);text-decoration:none;color:var(--ink)}
.tr-pin-ic{width:40px;height:40px;border-radius:13px;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tr-pill b{display:block;font-size:15px;font-weight:800}
.tr-pill small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.tr-chev{font-size:18px;color:var(--mu)}

/* leave-by card */
.tr-leave .ey{margin:0}
.tr-lrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}
.tr-big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:44px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tr-in{font-size:14px;font-weight:700}
.tr-lt{display:block;font-size:18px;font-weight:800;line-height:1.25;margin-top:6px}
.tr-lp{margin:8px 0 0;font-size:13px;line-height:1.45}
/* which way the time is for: the pick's line, then the other way's time under it */
.tr-lm{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:14px;line-height:1.4}
.tr-lm .i{font-size:18px;flex:none;margin-top:1px}
.tr-lm b{font-weight:800}
.tr-lalt{margin-top:4px}

/* traffic and weather */
/* 1.5px border + 10.5px = the hotel row's 12px, so the icons and text line up */
.tr-body .tr-traffic{padding:10.5px 12.5px 10.5px 10.5px;border-radius:20px}
.tr-traffic .ic{background:var(--cr)}
.tr-traffic .rw b{font-size:16px}
.tr-traffic .tr-foot{margin-top:4px}
.tr-wx,.tr-wxa{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding-top:12px;border-top:1.5px solid var(--ln);font-size:13px;font-weight:600;line-height:1.4}
.tr-wx .i,.tr-wxa .i{font-size:18px;color:var(--eb);margin-top:-1px}
/* a weather alert is a caution: ink words, amber sign */
.tr-wxa .i{color:var(--warn)}

/* options */
/* icon | name and details | minutes | chevron; the best pick's note runs under the last three */
.tr-op{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;column-gap:12px;align-items:start;min-height:64px;padding:12px 10px 12px 12px;text-decoration:none;color:var(--ink)}
.tr-op.best{box-shadow:inset 0 0 0 2px var(--ink)}
.tr-op .ic{background:var(--sheet)}
.tr-op>.tr-chev{align-self:center;margin-left:-4px}
.tr-opm{display:block;min-width:0;padding-top:1px}
.tr-opn{display:block}
.tr-opn b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.tr-opm small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.tr-opm .tr-warn{display:flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
.tr-warn .i{color:var(--warn)}
.tr-best{grid-column:2/-1;display:block;margin-top:10px}
.tr-best b{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px 0 8px;border-radius:var(--r-pill);background:var(--ink);color:var(--page);font-size:12px;font-weight:800;white-space:nowrap}
.tr-best b .i{font-size:14px}
.tr-best>span{display:block;margin-top:6px;font-size:13px;line-height:1.4}
.tr-opt{flex:none;text-align:right;padding-top:1px}
.tr-opt b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:21px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr-opt small{display:block;font-size:13px;color:var(--mu)}
.tr-lines{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.tr-lines .tr-b{font-size:14.5px;vertical-align:0;flex:none}
.tr-mta{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;line-height:1;flex:none}
.tr-rtag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;background:var(--ink);color:var(--page);font-size:13px;font-weight:800;flex:none;white-space:nowrap}

/* alerts */
.tr-alerts{display:grid;gap:8px}
.tr-sub{margin:14px 0 8px;color:var(--mu)}
.tr-alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:18px;background:var(--cr)}
.tr-alert .grow{min-width:0}
/* three lines, then More */
.tr-alert p{margin:1px 0 0;font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.tr-alert.open p{display:block;-webkit-line-clamp:unset;overflow:visible}
.tr-alert p .tr-mta{width:20px;height:20px;vertical-align:1px;margin:0 1px}
.tr-alert p .tr-b{font-size:13px;margin:0 1px}
.tr-af{display:flex;align-items:center;gap:8px;margin-top:4px}
.tr-alert small{display:block;font-size:13px;color:var(--mu)}
.tr-more{display:none;align-items:center;height:44px;margin:-12px -14px -11px auto;padding:0 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:700}
.tr-alert.cut .tr-more,.tr-alert.open .tr-more{display:inline-flex}

/* chips and link rows */
/* two equal columns (three on a route with no ride apps) so every chip is a big target */
.tr-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tr-links.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tr-links .tr-chip{justify-content:center;min-width:0;max-width:none}
.tr-links .tr-span{grid-column:1/-1}
.tr-after{margin-top:8px}
.tr-copy{width:100%}
.tr-copy .grow{min-width:0}
.tr-gap>*+*{margin-top:12px}
.tr-nofood{margin-top:12px}
.tr-chip{height:44px;padding:0 16px;border-radius:22px;font-size:14px}
.tr-chip .i{font-size:16px}

  if (pre === 'place') return KIND_LABEL[rest] || rest.replace(/_/g, ' ');
  if (pre === 'poi') { const q = P && P.poiById.get(rest); return q ? shortN(q.n) || 'Place' : 'Place'; }
  return s;
}

const sel = {};   // `${code}|${visit}` → {from, to, via} chosen on this phone (memory only)
// Everything the map, the hero and the route list need, worked out once per paint.
function plan(ctx) {
  const code = codeOf(ctx), list = visitsOf(code), v = curVisit(code, list);
  const P = Ps[code] || null, qG = qGate(ctx);
  let bags = 0;
  try { const w = N.wallet ? N.wallet() : null; bags = w && Number.isFinite(+w.bags) ? +w.bags : 0; } catch (e) { bags = 0; }
  const ex = exitPref(code, v);
  const d = defaults(P, code, v, qG, bags, ex);
  const k = `${code}|${v ? v.key : ''}`, s = sel[k] || {};
  const pf = tok(P, v, s.from), pt = tok(P, v, s.to);
  const userFrom = pf !== undefined, userTo = pt !== undefined;
  let from = userFrom ? pf : d.from;
  const to = userTo ? pt : d.to;
  let via = s.via ? arr(s.via).map(x => tok(P, v, x)).filter(Boolean) : userFrom || userTo ? [] : d.via;
  const shut = shutAt(P, code, v);
  let R = P ? routeFor(P, from, to, via, shut) : null;
  let you = null, fromHere = false;
  const w = here(10 * 60000);
  if (w && P && distTo(w, code) <= 3000) {
    const acc = Number.isFinite(+w.acc) ? +w.acc : 30;
    you = {lon: +w.lon, lat: +w.lat, acc, level: null};
    // At the airport and not choosing a start: the route starts where you are.
    if (!userFrom && to && !(v && overV(v)) && acc <= 150) {
      const lv = R ? R.from.l : P.data.defaultLevel;
      let nn = null;
      try { nn = N.airmap.nearest(P, [you.lon, you.lat], lv); } catch (e) { nn = null; }
      if (nn && nn.dist_m <= 400) {
        const p0 = {pt: [you.lon, you.lat], level: nn.level, label: 'Your location'};
        let R1 = routeFor(P, p0, to, via, shut);
        // Past check-in already (the route would leave the secure area to get back): skip it.
        if (R1 && via.length && !(v && v.role === 'arrive') && arr(R1.steps).some(x => x.kind === 'exit')) { via = []; R1 = routeFor(P, p0, to, via, shut); }
        // Landed with bags and still airside: the way out passes the carousels, so the route goes by them.
        if (R1 && !via.length && !userTo && !s.via && v && v.role === 'arrive' && bags > 0 && hasPlace(P, 'baggage')
          && arr(R1.steps).some(x => x.kind === 'exit')) {
          const bg = bagRef(P, v.inn.arr.baggage), R2 = routeFor(P, p0, to, [bg], shut);
          if (R2) { via = [bg]; R1 = R2; }
        }
        if (R1) { from = p0; R = R1; fromHere = true; you.level = nn.level; }
      }
    }
  }
  return {code, list, v, P, qG, bags, ex, d, from, to, via, R, you, k, fromHere, userFrom, userTo, shut};
}

// ---------- hero ----------
// Where you are going first: the gate (or the terminal and "Gate TBD"), the bags or the way out.
function heroHtml(code, v, list, auto, m) {
  const g = guide(code), P = m ? m.P : null, d = m ? m.d : {};
  const term = !v ? null : v.role === 'connect' ? v.out.dep.terminal || v.inn.arr.terminal : v.role === 'depart' ? v.out.dep.terminal : v.inn.arr.terminal;

  // The day is on the visit switch under the hero when there is more than one visit.

  // Status of the flight that matters here: rose only when the model says it is bad.

    else if (wantBags) { lab = 'Next'; val = 'Baggage claim'; long = true; }
    else {
      lab = m && m.ex.to === 'home' ? 'Way home' : 'Way out';
      const kind = typeof d.to === 'string' && d.to.startsWith('place:') ? d.to.slice(6) : '';
      const how = HOW.find(x => m && x[0] === m.ex.how);

    }

  // The line under it: where the gate is and how long the walk is.
  const sameTo = m && epKey(m.to) === epKey(d.to);
  const R = !m || !P ? null : sameTo && epKey(m.from) === epKey(d.from) || (sameTo && m.fromHere) ? m.R : routeFor(P, d.from, d.to, d.via, m.shut);
  const here2 = !!(m && m.fromHere && R === m.R);
  const walk = R && R.hops && R.hops.length ? `${R.mins} min${arr(R.steps).some(x => x.kind === 'security') ? ' with security' : ' walk'}${here2 ? ' from you' : ''}` : '';
  const gm = [];
  if (v && v.role !== 'arrive' || (!v && m && m.qG)) {

    else if (gate) {
      const ref = typeof d.to === 'string' && d.to.startsWith('gate:') ? d.to.slice(5) : '';
      const gx = P && ref ? P.gateByRef.get(ref) : null;
      if (gx && gx.c) gm.push(/^[A-Z]$/i.test(str(gx.c)) ? `Concourse ${str(gx.c).toUpperCase()}` : `${gx.c} concourse`);

  const showNow = !!m && (code !== auto || !!picked[code] || Object.keys(sel).some(x => x.startsWith(code + '|') && Object.keys(sel[x] || {}).length));
  return h`<div class="${N.cls('ap-hero ap-h2', long && 'ap-hl')}">
    <div class="ap-row">
      <div class="ps ap-ps" role="group" aria-label="Airport">${codes().map(c => h`<button type="button" data-act="ap" data-arg="${lc(c)}" aria-pressed="${c === code ? 'true' : 'false'}">${c}${c === auto ? h`<i class="ap-nd" aria-hidden="true"></i><span class="ap-vh">, now</span>` : ''}</button>`)}</div>

    </div>

  </div>`;
}
// ---------- tiles ----------
function tilesHtml(code, v) {
  const L = live(code), faa = obj(L.faa), tsa = obj(L.tsa) || {}, g = guide(code);
  const wx = wxFor(code, v);
  // The label says when (a forecast to the nearest hour), the subline says what.
  const wxT = wx
    ? {l: wx.fc ? `Weather at ${ct(new Date(Math.round(T(wx.at) / HR) * HR).toISOString(), code)}` : 'Weather now',
      b: `${Math.round(+wx.temp)}°`, s: shortWx(wx.text) || 'Forecast', c: /storm|snow|ice|sleet/i.test(str(wx.text)) || +wx.precip >= 60}
    : {l: 'Weather', b: '—', s: 'No reading'};
  const fs = faa && lc(faa.status);
  const faaT = !faa || !fs ? {b: '—', s: 'Not checked'}
    : fs === 'normal' ? {b: 'Normal', s: 'No delays'}
    : fs === 'ground_stop' || fs === 'ground stop' ? {b: 'Ground stop', s: faa.reason ? shortWx(faa.reason) : 'Flights held', w: true}
    : fs === 'closed' ? {b: 'Closed', s: str(faa.reason) || 'Airport closed', w: true}
    : /delay/.test(fs) ? {b: 'Delays', s: faa.avg_min ? `Avg ${faa.avg_min} min` : str(faa.reason) || 'Reported', w: true}
    : {b: str(faa.status).replace(/_/g, ' '), s: str(faa.text) || ''};
  // An old FAA reading says when it is from instead of sounding current.
  if (faa && fs && okT(faa.updated) && nowMs() - T(faa.updated) > 3 * HR) faaT.s = sameDay(faa.updated, N.now(), code) ? `As of ${N.time(faa.updated, code)}` : `As of ${N.date(faa.updated, code).split(' ')[0]}`;
  let third;
  if (v && v.role === 'connect') third = {l: 'Security', b: 'None', s: 'Stay airside'};
  else if (v && v.role === 'arrive') {
    const bag = v.inn.arr.baggage;
    third = bag ? {l: 'Carousel', b: str(bag), s: flightNo(v.inn)} : {l: 'Carousel', b: '—', s: 'After landing'};
  } else if (tsa.wait_min != null && Number.isFinite(+tsa.wait_min)) {
    third = {l: 'TSA wait', b: `${Math.round(+tsa.wait_min)} min`, s: str(tsa.text) || 'Standard lane', c: +tsa.wait_min >= 30};
  } else {
    const ck = arr(g && g.security).filter(obj)[0];
    const at = secTime(code, v);
    if (!ck) third = {l: 'Security', b: '—', s: 'Not in the guide'};
    else {
      const r = hoursRange(ck.hours);
      const m = at ? localMin(at, code) : localMin(N.now().toISOString(), code);
      const o = openAt(r, m);
      // Judged at your security time when there is one, else now.
      third = {l: 'Security',
        b: o == null ? '—' : o ? (r && r.all ? 'Open 24h' : 'Open') : r && !r.all ? `Opens ${clockTxt(r.a)}` : 'Closed',
        s: o == null ? 'Hours not listed' : str(ck.name) || 'Main checkpoint', c: o === false};
    }
  }
  // w: a real problem (rose ring). c: worth a look (amber dot on the subline).
  const cell = (k, label, t) => h`<div class="${t.w ? 'w' : t.c ? 'ap-cw' : ''}"><small>${label}</small><b data-k="${k}">${t.b}</b><span>${t.s}</span></div>`;
  const sfx = `-${code}-${v ? v.key : ''}`;
  return h`<div class="cn ap-cn">${cell('ap-wx' + sfx, wxT.l, wxT)}${cell('ap-faa' + sfx, 'FAA', faaT)}${cell('ap-3' + sfx, third.l, third)}</div>`;
}

// ---------- callouts ----------
function callouts(code, v) {
  const L = live(code), faa = obj(L.faa), wx = obj(L.wx) || {}, g = guide(code);
  const out = [];
  // Every callout leads with what it is in bold, then the detail.
  const co = (tone, ic2, lead, body) => out.push(h`<div class="co ${tone}">${icon(ic2)}<span><b>${lead}</b>${body ? h` ${body}` : ''}</span></div>`);
  const why = x => x ? ` (${x})` : '';
  const fs = faa && lc(faa.status);
  // Rose for what stops you (ground stop, closed, canceled, at risk); amber edge for what slows you.
  if (fs && /ground/.test(fs)) co('rose', 'alert-triangle', 'FAA ground stop.', `Flights at ${code} are being held${why(faa.reason)}.`);
  else if (fs && /delay/.test(fs)) co('ap-warn', 'clock', 'FAA delays.', `Flights at ${code} ${faa.avg_min ? `are averaging ${faa.avg_min} min late` : 'are running late'}${why(faa.reason)}.`);
  else if (fs === 'closed') co('rose', 'alert-triangle', `${code} closed.`, `The FAA lists the airport as closed${why(faa.reason)}.`);
  arr(wx.alerts).slice(0, 2).forEach(a => {
    const t = typeof a === 'string' ? a : obj(a) ? str(a.event || a.headline || a.title) : '';
    const ends = obj(a) && okT(a.ends) ? `Until ${when(a.ends, code)}.` : '';
    if (t) co('ap-warn', 'alert-triangle', `${t.replace(/\.\s*$/, '')}.`, ends);
  });
  const legs = v ? [v.inn, v.out].filter(Boolean) : [];
  legs.forEach(l => {
    if (l.canceled) co('rose', 'alert-triangle', `${flightNo(l)} canceled.`, h`Rebook in the AA app or at an AA counter. <a class="ap-il2" href="${AA_PHONE}" target="_blank" rel="noopener">Call AA</a>`);
    else if (l.diverted) co('rose', 'alert-triangle', `${flightNo(l)} diverted.`, `Now going to ${l.diverted}. Follow the AA app for the new plan.`);
    else if (l.route_ok === false) co('rose', 'alert-circle', 'Flight data mismatch.', `The data for ${flightNo(l)} doesn't match this route. Check the AA app.`);
  });
  // Connection: only when it is tight (amber edge) or at risk (rose), and only until you leave.
  // Same model and words as Flights and Today: spare = reaching the gate to its doors closing.
  let c = null;
  if (v && v.role === 'connect') { try { c = N.connection(v.dir); } catch (e) { c = null; } }
  if (c && c.level !== 'ok' && !v.inn.canceled && !v.out.canceled && !overV(v) && okT(v.inn.arr.time) && okT(v.out.dep.time)) {
    const gt = v.out.dep.gate ? `gate ${v.out.dep.gate}` : 'the next gate';
    const doors = N.time(N.addMin(v.out.dep.time, -N.AA.doors), code), reach = N.time(N.addMin(v.inn.arr.time, 10 + c.walk.min), code);
    co(c.level === 'risk' ? 'rose' : 'ap-warn', 'hourglass', `${c.label} connection.`, c.spare > 0
      ? `About ${N.dur(c.spare)} to spare before doors close at ${gt} (${doors}). Go straight there.`
      : c.spare === 0 ? `The usual walk reaches ${gt} just as doors close (${doors}). Go straight there and watch the AA app.`
      : `The usual walk reaches ${gt} ~${reach}, ${N.dur(-c.spare)} after doors close (${doors}). Go straight there and watch the AA app.`);
  }
  // Delays only while they still matter: the next flight until it leaves, the
  // flight in until it lands.
  if (v && v.out && !v.out.canceled && v.out.delay_dep > 14 && !departed(v.out)) co('ap-warn', 'clock', 'Running late.', `${flightNo(v.out)} is delayed ${N.dur(v.out.delay_dep)}; now departs ${tmz(v.out.dep.time, code)}.`);
  const inn = v && v.inn, late = inn ? +(inn.delay_arr != null ? inn.delay_arr : inn.delay_dep) || 0 : 0;
  if (inn && !inn.canceled && late > 14 && okT(inn.arr.time) && nowMs() < T(inn.arr.time)) co('ap-warn', 'clock', 'Running late.', `${flightNo(inn)} now lands ${tmz(inn.arr.time, code)}, ${N.dur(late)} late.`);
  // The guide's summary, minus what the page already says or the data has answered:
  // its connection length (the hero has it), PreCheck and the checkpoint (in the steps,
  // the Security tile and card), a gate guess once the gate is posted. Hidden once the
  // visit is over, on the return, and on a connection that isn't comfortable. Its first
  // sentence is the lead; a summary that is only the terminal (the hero has it) is dropped.
  const gate = gateOf(v);
  let summ = g && !(v && (overV(v) || (v.dir === 'ret' && v.role !== 'depart') || (c && c.level !== 'ok'))) ? fnoText(g.summary) : '';
  const guess = sentences(summ).find(x => /\busually\b/i.test(x)) || '';
  summ = dropS(summ, /precheck|\bcheckpoint\b|\busually\b|\brecent/i)
    .replace(/^\s*(?:about\s+)?\d+\s*(?:min(?:ute)?s?|h(?:ours?)?)\s+connection\s*[,;:.]\s*/i, '').replace(/^[a-z]/, x => x.toUpperCase());
  const ss = sentences(summ).map(x => x.trim());
  if (ss.length && !(ss.length === 1 && /^terminal\s+\w+\.?$/i.test(ss[0]))) co('', 'info-circle', ss[0], ss.slice(1).join(' '));
  // The hero and the route already say the gate isn't posted; this adds the guide's guess, when it has one.
  if (guess && v && v.role !== 'arrive' && !v.out.canceled && !overV(v) && !gate) co('plain', 'map-pin', 'Gate not posted.', `${guess.trim()} The actual gate shows here and on the map once AA posts it.`);
  return out;
}

        <small class="tn">${meta(bits)}</small>
        ${seats.length ? h`<small class="tn">Seats ${seats.join(', ')}</small>` : ''}</div>
      <span class="chip ${chip} ap-fc" data-k="ap-st-${l.id}" title="${st.text}"><span>${stT}</span></span></a>`;
  };
  if (v.inn) rows.push(row(v.inn, true));
  if (v.out) rows.push(row(v.out, false));
  return h`<div class="sec"><div class="ey">Your flights here</div><div class="stack8">${rows}</div></div>`;
}

// ---------- steps ----------
// Guide text as sentences, so a sentence the data has already answered can be dropped.
const sentences = s => str(s).match(/[^.!?]+(?:[.!?]+|$)/g) || [];
const dropS = (s, re) => sentences(s).filter(x => !re.test(x)).join('').trim();
// Transit's pick for a direction when Transit shares it (N.bestRoute): {id, name, mins: '45–60 min',
// range: [45, 60], leave}.
// Transit names its directions 'to-hotel' / 'to-lga'; the bare names are tried too.
function transitPick(kind) {
  if (typeof N.bestRoute !== 'function') return null;
  for (const k of [`to-${kind}`, kind]) {
    try { const r = N.bestRoute(k, N.now()); if (r && r.name) return r; } catch (e) { /* not a direction Transit knows */ }
  }
  return null;
}
const minsTxt = m => Array.isArray(m) ? (m[0] === m[1] ? `${m[0]} min` : `${m[0]}–${m[1]} min`)
  : Number.isFinite(+m) && m !== '' && m != null ? `${+m} min` : /^\d+(–\d+)? min$/.test(str(m)) ? str(m) : '';
function stepsHtml(code, v, m) {
  const g = guide(code);
  const title = !v ? 'Steps' : v.role === 'depart' ? `Leaving from ${code}` : v.role === 'connect' ? `Connecting at ${code}` : `Arriving at ${code}`;
  const head = h`<div class="ey">${title}</div>`;
  if (!v) return h`<section class="sec ap-anc" id="ap-steps">${head}<div class="co plain">${icon('info-circle')}<span><b>Not on your trip.</b> ${code} has no timed steps.</span></div></section>`;
  // A list written for this direction (connect_out / connect_ret) wins over the shared one.
  const gs = obj(g && g.steps) ? g.steps : {};
  const own = arr(gs[`${v.role}_${v.dir}`]).filter(obj);
  let steps = own.length ? own : arr(gs[v.role]).filter(obj);
  if (!steps.length) {
    const msg = v.role === 'arrive' ? 'Ground options are below.' : `The guide has no ${v.role === 'connect' ? 'connection' : 'departure'} steps for ${code} yet.`;
    return h`<section class="sec ap-anc" id="ap-steps">${head}<div class="co plain">${icon('info-circle')}<span><b>No steps saved.</b> ${msg}</span></div></section>`;
  }
  // Steps written for the other direction (CLT on the way home): swap in this
  // visit's flight numbers and drop details that quote the other day's times.
  const other = visitsOf(code).find(x => x.role === v.role && x.dir !== v.dir);
  const swap = [];
  if (other && v.dir === 'ret' && !own.length) {
    if (other.inn && v.inn && flightNo(other.inn) !== flightNo(v.inn)) swap.push([flightNo(other.inn), flightNo(v.inn)]);
    if (other.out && v.out && flightNo(other.out) !== flightNo(v.out)) swap.push([flightNo(other.out), flightNo(v.out)]);
  }
  const reused = swap.length > 0;
  const sub = s => swap.reduce((a, [x, y]) => a.split(x).join(y), fnoText(s));
  const hasClock = s => /\b\d{1,2}(:\d{2})?\s?[ap]\b|\b\d{1,2}\/\d{1,2}\b/i.test(str(s));
  const w = N.wallet ? N.wallet() : {};
  const bags = Number.isFinite(+w.bags) ? +w.bags : 0;
  const over = overV(v);
  const gIn = v.inn ? str(v.inn.arr.gate).toUpperCase() : '', gOut = v.out ? str(v.out.dep.gate).toUpperCase() : '';
  const board = v.out && okT(v.out.dep.time) ? T(N.addMin(v.out.dep.time, -N.AA.board)) : NaN;
  // On a connection, once AA posts the next gate: the walk to it (the map's figure, else a concourse guess).
  let wk = null, c = null;
  if (v.role === 'connect') { try { c = N.connection(v.dir); } catch (e) { c = null; } }
  if (v.role === 'connect' && gOut && typeof N.walk === 'function') { try { wk = N.walk(code, gIn || null, gOut); } catch (e) { wk = null; } }
  // A connection runs on the same clock as its rating (N.connection): the door opens ~10 min after
  // landing, then the walk; so the steps, the callout and Flights agree on when you reach the gate.
  const arrT = v.role === 'connect' && v.inn && okT(v.inn.arr.time) ? v.inn.arr.time : null;
  const walkMin = wk ? wk.min : c && c.walk ? c.walk.min : 15;
  const offAt = arrT ? N.addMin(arrT, 10) : null, reachAt = arrT ? N.addMin(arrT, 10 + walkMin) : null;
  const gateStep = s => v.role === 'connect' && (s.icon === 'device-mobile' || /\bfind\b.*\bgate\b/i.test(str(s.title)));
  // The checkpoint the route goes through (the map may pick another for your gate or the hour).
  const rcp = v.role === 'depart' && m && m.R ? str((arr(m.R.steps).find(x => x.kind === 'security') || {}).cp) : '';
  const walkStep = s => v.role === 'connect' && s.icon === 'route' && /\bwalk\b/i.test(str(s.title));
  const rows = steps.map(s => {
    const rel = obj(s.rel);
    let at = null;
    if (rel && Number.isFinite(+rel.min)) {
      const base = rel.to === 'arr' ? v.inn && v.inn.arr.time : v.out && v.out.dep.time;
      at = okT(base) ? N.addMin(base, +rel.min) : null;
    }
    const meal = s.icon === 'tools-kitchen-2' || s.icon === 'coffee';
    let min = +s.min || 0;
    if (arrT && rel) {
      if (/\bdeplane\b/i.test(str(s.title))) { at = arrT; min = 10; }
      else if (gateStep(s) || walkStep(s)) { at = offAt; if (gOut || walkStep(s)) min = walkMin; }
      else if (meal) at = reachAt;
    }
    // A meal that would start once boarding has is no longer a step.
    if (meal && okT(at) && T(at) >= board) return null;
    // The gate step below names the walk once the gate is known.
    if (walkStep(s) && wk && wk.known) return null;
    const extra = [];
    let t = sub(s.title) || 'Step', detail = reused && hasClock(s.detail) ? '' : sub(s.detail), link = '', hideMin = false;
    if (rcp && s.icon === 'shield-check' && /\bcheckpoint\s+\w+/i.test(t) && !lc(t).includes(lc(rcp))) {
      const ck = arr(g && g.security).filter(obj).find(x => lc(shortN(x.name)) === lc(rcp));
      t = `Security at ${rcp}`;
      detail = ck ? `${[str(ck.where), str(ck.hours) && `open ${apTime(ck.hours)}`].filter(Boolean).join(', ')}.` : '';
    }
    if (s.icon === 'car' && v.role === 'depart' && rel) {
      let lv = null; try { lv = N.leave(v.dir); } catch (e) { lv = null; }
      if (lv && okT(lv.at)) {
        at = lv.at;
        if (lv.source === 'traffic') extra.push(`Uses the latest traffic: about ${lv.drive} min drive`);
        if (lv.buffer) extra.push(`Includes your ${lv.buffer} min buffer`);
      }
    }
    if (s.icon === 'plane-arrival' && gIn) {
      t = `${t} at gate ${gIn}`;
      detail = dropS(detail, /scheduled|recent|gate/i);
    }
    if (gateStep(s) && gOut) {
      t = `Gate ${gOut}${gIn ? ` · from ${gIn}` : ''}${wk && wk.known ? ` · ~${wk.min} min` : ''}`;
      detail = '';
      if (wk && wk.known) hideMin = true;
      if (Ps[code] !== null) link = 'conn';
    }
    // When you reach the gate against its doors, rated like the connection (amber tight, rose at risk).
    if (gateStep(s) && gOut && c && reachAt && okT(v.out.dep.time)) {
      const sp = N.mins(reachAt, N.addMin(v.out.dep.time, -N.AA.doors));
      extra.push({t: meta([`At gate ~${N.time(reachAt, code)}`, `${sp >= 0 ? `${N.dur(sp)} before` : `${N.dur(-sp)} after`} doors close`]),
        cls: c.level === 'risk' ? 'ap-xr' : c.level === 'tight' ? 'ap-xw' : ''});
    }
    if (s.icon === 'luggage' && v.role === 'depart' && v.out && okT(v.out.dep.time)) {
      extra.push(meta([`Bag drop closes ${tmz(N.addMin(v.out.dep.time, -N.AA.bagdrop), code)}`, bags > 0 && `${N.plural(bags, 'checked bag')} in Wallet`]));
    }
    if (s.icon === 'luggage' && v.role === 'arrive' && v.inn.arr.baggage) {
      extra.push(`Carousel ${v.inn.arr.baggage}`);
      detail = dropS(detail, /\bshows the carousel\b/i);
    }
    // Into the city: Transit's best way right now, so both screens give the same minutes.
    if (s.icon === 'building-skyscraper' && v.role === 'arrive' && v.dir === 'out') {
      const r = transitPick('hotel');
      const m = r ? minsTxt(r.range || r.mins) : '';
      if (m) detail = `About ${m} by ${r.name} right now.`;
    }
    if (s.icon === 'plane-departure' && gOut) extra.push(`Gate ${gOut}`);
    return {s, at, title: t, detail, extra, min, hideMin, link};
  }).filter(Boolean);
  // In time order: a late arrival can put "Boarding" before "Land". A step with
  // no time keeps its place after the step before it.
  let last = -Infinity;
  rows.forEach((r, i) => { r.k = okT(r.at) ? (last = T(r.at)) : last; r.i = i; });
  rows.sort((a, b) => a.k - b.k || a.i - b.i);
  const now = nowMs();
  // A step that has started stays "Now" for as long as it takes ("Security
  // 3:30a, about 20 min" is still Now at 3:40a), or a minute if it has no
  // length, so the step in progress never shows as done.
  const endOf = r => T(r.at) + Math.max(r.min * 60000, 60000);
  let lastStarted = -1;
  rows.forEach((r, i) => { if (okT(r.at) && T(r.at) <= now) lastStarted = i; });
  const active = !over && lastStarted >= 0 && endOf(rows[lastStarted]) > now ? lastStarted : -1;
  const upI = over ? -1 : rows.findIndex((r, i) => i > lastStarted && okT(r.at) && T(r.at) > now);
  const nextI = active >= 0 ? active : upI;
  // When the next/now marker next needs to move (read by tick).
  const chg = nextI < 0 ? NaN
    : active >= 0 ? Math.min(endOf(rows[active]), upI >= 0 ? T(rows[upI].at) : Infinity)
    : T(rows[upI].at) - now > 60000 ? T(rows[upI].at) - 60000 : T(rows[upI].at);
  const html = rows.map((r, i) => {
    const next = i === nextI;
    const done = okT(r.at) && !next && (over || T(r.at) <= now);
    const warn = r.s.icon === 'alert-triangle';
    // A finished step is one quiet line: time, tick and title.
    if (done) return h`<li class="ap-st done">
      <div class="ap-tm tn">${N.time(r.at, code)}</div>
      <div class="ap-sd"><span class="ap-si">${icon('check')}</span></div>
      <div class="ap-sb"><b>${r.title}</b></div>
    </li>`;
    return h`<li class="${N.cls('ap-st', next && 'next', warn && 'wn')}"${next && Number.isFinite(chg) ? raw(` data-chg="${Math.round(chg)}"`) : ''}>
      <div class="ap-tm tn">${okT(r.at) ? N.time(r.at, code) : r.s.rel ? '—' : ''}</div>
      <div class="ap-sd"><span class="ap-si">${ic(r.s.icon, 'point')}</span></div>
      <div class="ap-sb"><b>${r.title}</b>
        ${next ? i === active || T(r.at) - now <= 60000 ? h`<span class="ap-in">Now</span>` : h`<span class="ap-in">in <span data-until="${r.at}">${N.until(r.at)}</span></span>` : ''}
        ${r.detail ? h`<small>${r.detail}</small>` : ''}
        ${r.extra.map(x => h`<small class="${N.cls('ap-x', x.cls)}">${x.t || x}</small>`)}
        ${r.min && !r.hideMin ? h`<small class="ap-mn">${icon('clock')}About ${N.dur(r.min)}</small>` : ''}
        ${r.link ? h`<button type="button" class="ap-tb ap-wk ap-sl" data-act="tomap" data-arg="conn">${ic('walk', 'route')}<span>Show on map</span></button>` : ''}</div>
    </li>`;
  });
  const notes = [];
  if (reused) notes.push(h`<p class="ap-note">These steps were written for the outbound connection. Times use your ${v.dir === 'ret' ? 'return' : ''} flights.</p>`);
  if (!okT(v.at)) notes.push(h`<p class="ap-note">Times show once ${flightNo(v.leg)} is confirmed.</p>`);
  return h`<section class="sec ap-anc" id="ap-steps">${head}${notes}<ol class="ap-steps">${html}</ol></section>`;
}

// ---------- lower sections ----------
// A reference section that starts closed: its title, a short note and a chevron.
const fold = (id, title, note, body) => h`<section class="sec ap-anc" id="ap-${id}"><details class="ap-fold">
  <summary><span class="grow"><span class="ey">${title}</span>${note ? h`<small>${note}</small>` : ''}</span>${icon('chevron-down', 'ap-chev')}</summary>
  <div class="ap-fb">${body}</div></details></section>`;
// The rest of a list, opened in place.
const more = (label, body) => h`<details class="ap-more"><summary><span class="grow">${label}</span>${icon('chevron-down', 'ap-chev')}</summary><div class="ap-mb">${body}</div></details>`;

function securityHtml(code, v) {
  const g = guide(code);
  const list = arr(g && g.security).filter(obj);
  const at = secTime(code, v);
  const m = at ? localMin(at, code) : null;
  const role = v ? v.role : '';
  // Through security on the way out (the step's length, at least 20 min, has passed): nothing left to choose.
  if (role === 'depart' && (departed(v.out) || (at && nowMs() >= T(at) + Math.max(+(secStep(code) || {}).min || 0, 20) * 60000))) return '';
  if (!list.length) return role === 'connect' || role === 'arrive' ? ''
    : h`<section class="sec ap-anc" id="ap-sec"><div class="ey">Security</div><div class="co plain">${icon('info-circle')}<span><b>No checkpoint details.</b> The guide has none saved for ${code}.</span></div></section>`;
  const card = s => {
    const r = hoursRange(s.hours);
    const o = m == null ? null : openAt(r, m);
    const state = o == null ? '' : o ? h`<span class="chip cr ap-ok">${icon('circle-check')}Open at ${N.time(at, code)}</span>`
      : h`<span class="chip cr ap-cw">${icon('clock')}${r && !r.all ? `Opens ${clockTxt(r.a)}` : 'Closed then'}</span>`;
    const fact = (label, val) => val ? h`<div><dt>${label}</dt><dd>${val}</dd></div>` : '';
    return h`<div class="ap-ck">
      <div class="rw"><span class="ic">${icon('shield-check')}</span><div class="grow"><b>${str(s.name) || 'Checkpoint'}</b>${s.where ? h`<small>${s.where}</small>` : ''}</div></div>
      ${state ? h`<div class="ap-cks">${state}</div>` : ''}
      <dl class="ap-dl">${fact('Hours', apTime(s.hours) || 'Not listed')}${fact('PreCheck', apTime(s.precheck))}${fact('CLEAR', apTime(s.clear))}</dl>
      ${s.note ? h`<p class="ap-cn2">${s.note}</p>` : ''}
    </div>`;
  };
  // Not going through security here: all of it, closed, for if you need it.
  if (role === 'connect') return fold('sec', 'Security', 'Only if you leave the secure area', h`<div class="stack8">${list.map(card)}</div>`);
  if (role === 'arrive') return fold('sec', 'Security', `For leaving from ${code}`, h`<div class="stack8">${list.map(card)}</div>`);
  // Leaving: the first checkpoint open at your security time, the others closed below it.
  const i = Math.max(0, list.findIndex(x => m == null || openAt(hoursRange(x.hours), m) !== false));
  const rest = list.filter((x, j) => j !== i);
  const lbl = rest.every(x => /checkpoint/i.test(str(x.name))) ? 'Other checkpoints' : 'More options';
  return h`<section class="sec ap-anc" id="ap-sec"><div class="ey">Security</div>
    ${card(list[i])}
    ${rest.length ? more(`${lbl} (${rest.length})`, h`<div class="stack8">${rest.map(card)}</div>`) : ''}</section>`;
}

function foodHtml(code, v) {
  const g = guide(code);
  const list = arr(g && g.food).filter(obj);
  const head = h`<div class="ey">Food and coffee</div>`;
  if (!list.length) return h`<section class="sec ap-anc" id="ap-food">${head}<div class="co plain">${icon('info-circle')}<span><b>No food listed.</b> The guide has none saved for ${code} yet.</span></div></section>`;
  const gate = v ? (v.role === 'arrive' ? v.inn.arr.gate : v.out.dep.gate || (v.inn && v.inn.arr.gate)) : null;
  const gm = normG(gate).match(/^([A-Z]*)(\d+)/);
  const land = f => /before security|landside|pre-?security|ticketing|check-?in|departures|checkpoints?\b/i.test(`${str(f.near)} ${str(f.where)}`) && !/after security|airside/i.test(str(f.where));
  const score = f => {
    if (!gm) return 50;
    const s = `${str(f.near)} ${str(f.where)}`.toUpperCase();
    const q = s.match(/\b([A-E])\s?(\d{1,2})\b/);
    if (gm[1] && q) return q[1] === gm[1] ? Math.abs(+q[2] - +gm[2]) : 100 + Math.abs(+q[2] - +gm[2]);
    const rg = s.match(/\b(\d{1,2})\s?[–-]\s?(\d{1,2})\b/);
    if (!gm[1] && rg) return +gm[2] >= +rg[1] && +gm[2] <= +rg[2] ? 3 : 150;
    if (gm[1] && new RegExp(`\\b${gm[1]}\\b|\\b${gm[1]} (GATES|CONCOURSE)|CONCOURSE ${gm[1]}\\b|${gm[1]} GATES`).test(s)) return 8;
    if (/AA GATES|AMERICAN/.test(s)) return 6;
    if (/ATRIUM|HUB|CENTER|BRIDGE|FOOD HALL|MAIN/.test(s)) return 30;
    return 60;
  };
  // When you'd eat, and never earlier than now: once off the plane on a connection, before
  // boarding on a departure, soon after landing on arrival.
  const role = v && v.role;
  const base = role === 'connect' && okT(v.inn.arr.time) ? N.addMin(v.inn.arr.time, 10)
    : role === 'depart' && okT(v.out.dep.time) ? N.addMin(v.out.dep.time, -N.AA.board - 10)
    : role === 'arrive' && okT(v.inn.arr.time) ? N.addMin(v.inn.arr.time, 20) : null;
  const isNow = !!base && nowMs() >= T(base);
  const eatAt = !base ? null : isNow ? N.now().toISOString() : base;
  const em = eatAt ? localMin(eatAt, code) : null;
  // No time to eat once that is at or past boarding: the list folds away under why.
  const board = role !== 'arrive' && v && v.out && okT(v.out.dep.time) ? T(N.addMin(v.out.dep.time, -N.AA.board)) : NaN;
  const late = !!eatAt && T(eatAt) >= board && !overV(v);
  const openInfo = f => {
    if (em == null) return {open: null};
    const hs = str(f.hours), r = hoursRange(hs);
    if (r) return {open: openAt(r, em), a: r.all ? null : r.a};
    const m = hs.match(/^\s*(?:from|opens?)\s+(\d{1,2}(?::\d{2})?\s*[ap])/i), a = m ? clockMin(m[1]) : null;
    return a == null ? {open: null} : {open: em >= a, a};
  };
  // Leaving: a place that only opens once your flight has gone is left out.
  const dm = v && v.role !== 'arrive' && v.out && okT(v.out.dep.time) ? localMin(v.out.dep.time, code) : null;
  const gone = x => em != null && dm != null && x.open === false && x.a != null && (x.a - em + 1440) % 1440 >= (dm - em + 1440) % 1440;
  const items = list.map((f, i) => Object.assign({f, i, land: land(f), sc: score(f)}, openInfo(f))).filter(x => !gone(x));
  // Near your gate first; places that won't be open in time go last.
  const air = items.filter(x => !x.land).sort((a, b) => (a.open === false) - (b.open === false) || a.sc - b.sc || a.i - b.i);
  const pre = items.filter(x => x.land);
  const row = x => {
    const f = x.f, near = gm && x.sc <= 4 && x.open !== false;
    // "At your gate" only when it is your gate; otherwise where it is ("Near your gate, at B1").
    const mine = h`<span class="ap-me">${!/^[A-Z]{0,2}\d{1,3}$/i.test(str(f.near)) ? 'Near your gate' : normG(f.near) === normG(gate) ? 'At your gate' : `Near your gate, at ${str(f.near).toUpperCase()}`}</span>`;
    const kind = /coffee|caf|espresso|tea\b|starbucks|peet|dunkin/i.test(`${str(f.kind)} ${str(f.name)}`) ? 'coffee' : 'tools-kitchen-2';
    // Where it is goes in the subline ("Near A7"); a gate-area "where" that only repeats the gate letter is dropped.
    const nr = str(f.near), gt = /^[A-Z]{0,2}\d{1,3}$/i.test(nr);
    const where = gt && /^airside,?\s+[A-Z] gates$/i.test(str(f.where)) ? '' : str(f.where);
    // Skip a landmark the location line already starts with ("Atrium · Atrium, upper level").
    const said = !gt && nr && where.toLowerCase().startsWith(nr.toLowerCase());
    const sub = [near || said ? '' : nr ? (gt ? `Near ${nr.toUpperCase()}` : nr) : '', where, apTime(f.hours)];
    // One status per row: open (green dot), opens later (amber dot) or closed (grey dot).
    const st = x.open == null ? '' : x.open ? h`<span class="ap-os on">Open</span>`
      : x.a != null ? h`<span class="ap-os soon">Opens ${clockTxt(x.a)}</span>` : h`<span class="ap-os off">Closed</span>`;
    return h`<div class="ap-fd">
      <span class="ic">${icon(kind)}</span>
      <div class="grow"><b>${str(f.name) || 'Food'}</b><small>${meta([near && mine, ...sub])}</small>${f.note ? h`<small class="ap-fn">${f.note}</small>` : ''}</div>
      ${st}
    </div>`;
  };
  const sortNote = `${gm ? `Nearest to gate ${str(gate).toUpperCase()} first.` : 'Sorted by your gate once AA posts it.'}${em == null ? ''
    : isNow ? ' Shows what’s open now.' : ` Shows what’s open at ${tmz(eatAt, code)}, ${role === 'connect' ? 'once you’re off the plane' : role === 'arrive' ? 'after landing' : 'before boarding'}.`}`;
  // The four nearest stay in view; the rest and anything outside security open below.
  const top = air.slice(0, 4), rest = air.slice(4);
  const preH = pre.length ? h`<div class="ap-subh">${role === 'connect' ? 'Outside security (means screening again)' : role === 'arrive' ? 'Outside security' : 'Before security'}</div><div class="ap-list">${pre.map(row)}</div>` : '';
  const body = h`<p class="ap-note">${sortNote}</p>
    <div class="ap-list">${top.map(row)}</div>

// US phone numbers in guide text become real call/text buttons (at 3am you
// want to tap "Call AA", not copy digits). "AA 800-433-7300 · TSA Cares
// 1-855-787-2227" gives two buttons; "or text 646-…" gives a text button.
function callChips(text) {
  const out = [], re = /(?:\+?1[-.\s])?\(?(\d{3})\)?[-.\s](\d{3})[-.\s](\d{4})\b/g;
  str(text).split(/\s+·\s+|;\s*/).forEach(seg => {
    let m, last = 0;
    while ((m = re.exec(seg))) {
      const before = seg.slice(last, m.index);
      last = re.lastIndex;
      const sms = /\btext\s*$/i.test(before);
      const name = before.replace(/\b(call|text|or|at)\b/gi, '').replace(/[:,()]/g, '').trim().slice(0, 24);
      out.push({href: `${sms ? 'sms' : 'tel'}:+1${m[1]}${m[2]}${m[3]}`, sms, label: `${sms ? 'Text' : 'Call'}${name ? ' ' + name : ''}`, num: `${m[1]}-${m[2]}-${m[3]}`});
    }
    re.lastIndex = 0;
  });
  return out.slice(0, 4);
}
function servicesHtml(code) {
  const g = guide(code);

  return h`<section class="sec ap-anc" id="ap-svc"><div class="ey">Services</div><div class="ap-list">${list.map(s => {

    const where = PH.test(str(s.label)) || PH.test(str(s.where)) ? '' : str(s.where);

// Keep "B16 310 m" and "C 5–9 min" whole in the narrow fact tiles so lines break at the

const keepUnit = v => str(v)

// An "M/D" date in guide text is a day of this trip's year (airport-local).
const mdPast = (s, code) => {
  const m = str(s).match(/\b(\d{1,2})\/(\d{1,2})\b/);
  if (!m) return false;
  const today = N.ymd(N.now(), code);
  return `${today.slice(0, 4)}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` < today;
};
// A fact that is only a clock time ("4:15a", "~4:20a") is about leaving from here:

const timePast = (f, code) => {
  const t = str(f.value).trim().match(/^~?\s*(\d{1,2}(?::\d{2})?\s*[ap])\.?m?\.?$/i);
  if (!t) return false;

  const md = str(f.label).match(/\b\d{1,2}\/\d{1,2}\b/);
  const day = md ? null : N.ymd(d.out.dep.time, code);

}

function headHtml(m, cos) {
  const {code, list, v} = m;
  const seg = list.length > 1 ? h`<div class="seg ap-seg" role="group" aria-label="Which visit">${list.map(x => h`<button type="button" data-act="visit" data-arg="${x.key}" aria-pressed="${x === v ? 'true' : 'false'}">${roleWord(x.role)} ${dayOf(x, code).split(' ').slice(0, 2).join(' ')}</button>`)}</div>` : '';
  const rose = cos.filter(isRose);

}
function belowHtml(m, cos) {
  const {code, v} = m, g = guide(code);

    ${rest.length ? h`<div class="sec stack8 ap-cos">${rest}</div>` : ''}
    ${stepsHtml(code, v, m)}
    ${flightsHtml(code, v)}
    ${groundHtml(code, v)}
    ${alongHtml(m)}
    ${foodHtml(code, v)}

    ${tilesHtml(code, v)}
    ${securityHtml(code, v)}
    ${servicesHtml(code)}
    ${infoHtml(code, v)}`;
}

function render(ctx) {
  const code = codeOf(ctx);
  const known = codes();
  pending = null;
  if (!/^[A-Z]{3}$/.test(code) || (!known.includes(code) && !guide(code))) {
    return {hero: emptyHero('Airport not on this trip', `“${str(ctx.param).replace(/\?.*$/, '').slice(0, 12)}” isn’t one of your airports.`),
      body: h`<div class="ap-pg"><div class="co plain">${icon('building-airport')}<span><b>Pick an airport.</b> Choose one of yours above, or open the one that matters now.</span></div>
        <div class="wrap ap-ml"><a class="chip cr ap-c44" href="#airports">${icon('current-location')}Airport for right now</a></div></div>`};
  }
  takeRoute(code);
  const auto = autoCode();
  const m = plan(ctx);
  const g = guide(code);
  if (!g && !N.data.trip) {
    return {hero: heroHtml(code, m.v, m.list, auto, m),
      body: h`<div class="ap-pg"><div class="co plain">${icon('info-circle')}<span><b>Guide not loaded.</b> Open the app once with signal to put it on this phone.</span></div></div>`};
  }
  const cos = callouts(code, m.v);
  // The blocks update() patches, kept as written so the first update compares like with like.
  const html = {hero: String(heroHtml(code, m.v, m.list, auto, m)), 'ap-head': String(headHtml(m, cos)), 'ap-ft': String(ftHtml(m)),
    'ap-mo': String(overHtml(m)), 'ap-ex': String(exHtml(m)), 'ap-below': String(belowHtml(m, cos))};
  pending = {code, html};
  const body = h`<div class="ap-pg">
    <div class="ap-head" id="ap-head">${raw(html['ap-head'])}</div>
    <section class="${N.cls('ap-mc ap-anc', Ps[code] === null && 'none')}" id="ap-mc" aria-label="${code} map">
      <div class="ap-ft" id="ap-ft">${raw(html['ap-ft'])}</div>
      <div class="ap-mw"><div class="ap-mh" id="ap-mh"></div><div class="ap-mo" id="ap-mo">${raw(html['ap-mo'])}</div></div>
    </section>
    <div class="ap-exw" id="ap-ex">${raw(html['ap-ex'])}</div>
    <div class="ap-below" id="ap-below">${raw(html['ap-below'])}</div>
  </div>`;
  return {hero: raw(html.hero), body};
}

// ---------- mount, update, teardown ----------
// Replace a block only when its markup changed (the string we last wrote, not the DOM's).
// The clock text ticks on its own (core's data-clock), so it never forces a rewrite.
const unclock = s => String(s || '').replace(/(data-clock="[A-Z]{3}">)[^<]*/g, '$1');
function setH(id, html) {
  const e = document.getElementById(id), s = String(html || '');
  if (!e || !S) return;

  S.html[id] = s;
  e.innerHTML = s;
}
const paintOverlay = () => { if (S && S.m) setH('ap-mo', overHtml(S.m)); };
function showMap(instant) {
  const mc = document.getElementById('ap-mc');

}
function attachMap(m) {
  const el = document.getElementById('ap-mh');
  if (!S || !el || !m.P || !N.airmap || S.M) return;
  try {
    S.M = N.airmap.mount(el, m.P, {route: m.R, chips: chipIds(), padding: PAD,
      cover: () => document.querySelectorAll('#ap-mo .ap-rl, #ap-mo .ap-tl, #ap-mo .ap-ch, #ap-mo .ap-pop'),
      onLevel: () => paintOverlay(),
      onPoi: q => { if (S) { S.pop = q; paintOverlay(); } },
      onReady: () => paintOverlay()});
    S.rkey = rkeyOf(m);
    S.ykey = ykeyOf(m);
    if (m.you) S.M.setYou(m.you);
  } catch (e) { N.report(e, 'airports map'); S.M = null; }
}
// Full screen: the card covers the page under the top bar; the tab bar steps aside.
function setFull(on) {
  on = !!on;
  const mc = document.getElementById('ap-mc'), view = document.getElementById('view'), app = document.getElementById('app');
  if (S) S.full = on;
  if (mc) {

    mc.classList.toggle('full', on);

}
function closePicker(refocus) {
  const had = document.querySelector('body > .ap-pk');
  document.querySelectorAll('body > .ap-pk').forEach(n => n.remove());
  const end = S && S.pk;
  if (S) S.pk = null;

}
function teardown() {
  closePicker();
  const view = document.getElementById('view'), app = document.getElementById('app');
  if (view) view.classList.remove('ap-mapfull');
  if (app) app.classList.remove('ap-mapfull');
  if (!S) return;
  const s = S;
  S = null;
  try { if (s.M) s.M.destroy(); } catch (e) { /* already gone */ }
  s.offs.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
