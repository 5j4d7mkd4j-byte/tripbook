try {
/* Place: one spot from the Yelp list. Photos (with a full-screen viewer),
   open now, how far, what to order, what people like and dislike, tips,
   hours, details and a small street map. Route: #place/<yelp alias>.
   Everything shown comes from food.bin, so the page works offline; photos
   and map tiles show a plain tile when they were never saved. */
(() => {
'use strict';
const {h, icon} = N;

// ---------- small, defensive readers (any field can be missing) ----------
const arr = v => Array.isArray(v) ? v.filter(x => x != null && x !== '') : [];
const str = v => typeof v === 'string' ? v.trim() : (typeof v === 'number' ? String(v) : '');
const num = v => (typeof v === 'number' && Number.isFinite(v)) ? v : null;
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const web = u => (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : null;
const food = () => N.food || {};
const placeFor = ctx => (ctx && ctx.param && food().place) ? food().place(ctx.param) : null;
const photosOf = p => {
  try { return (food().photos ? food().photos(p) : []).filter(x => x && typeof x.id === 'string' && x.id); }
  catch { return []; }
};
const nInside = p => arr(p && p.photos && p.photos.inside).length;
const photoUrl = (id, size) => food().photo ? food().photo(id, size) : '';
const hasLL = o => !!o && num(o.lat) != null && num(o.lon) != null;
// The name as the food list shows it (no " - New York" on the end), from food.js when it's loaded.
const nameOf = p => (typeof N.placeName === 'function' ? N.placeName(p) : '') || str(p && p.name);
// One section failing must never take the whole page down.
const safe = (fn, where) => { try { return fn(); } catch (e) { N.report(e, 'place ' + where); return ''; } };

const toMin = s => { const [a, b] = String(s || '').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const DAYS_ORDER = [1, 2, 3, 4, 5, 6, 0];

// ---------- links ----------
const ios = () => /iPhone|iPad|Macintosh/.test(navigator.userAgent);
// The place itself on a map (not directions).
const placeUrl = p => {
  const ll = `${p.lat},${p.lon}`;
  return ios() ? `https://maps.apple.com/?q=${encodeURIComponent(nameOf(p) || 'Place')}&ll=${ll}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ll)}`;
};
const destOf = p => str(p.address) || (hasLL(p) ? {lat: p.lat, lon: p.lon} : null);
const telOf = phone => {
  const d = String(phone || '').replace(/[^\d+]/g, '');
  if (!d) return null;
  return 'tel:' + (d.startsWith('+') ? d : d.length === 10 ? '+1' + d : d);
};

// ---------- distance ----------
const FAR = 60000;   // further than this (not in NYC yet) the "from you" chip is left out
// Same cut-offs as the food list, so a card and its page never disagree.
const walkText = m => {
  const w = N.walkMin(m);
  return w <= 30 ? `${w} min walk` : N.distText(m);
};
function distBits(p) {
  const out = [];
  if (!hasLL(p)) return out;
  const m = food().away ? food().away(p) : null;
  if (m != null && m <= FAR) out.push({i: m < 2400 ? 'walk' : 'current-location', t: `${walkText(m)} from you`});
  const ho = N.hotel ? N.hotel() : null;
  if (hasLL(ho)) out.push({i: 'bed', t: `${walkText(N.dist(ho, p))} from hotel`});
  return out;
}
const canLocate = () => !!navigator.geolocation && !N.lastWhere();

// ---------- hours ----------
// Only well-formed [weekday, "HH:MM", "HH:MM"] rows count, for the chip and the table alike,
// so a bad row can't turn into "Closed" or "Open 24 hours". A late night ends past midnight
// on the clock of the day it started ("25:45" is 1:45a), up to a day on.
const HHMM = /^([01]?\d|2[0-4]):[0-5]\d$/, END = /^([0-3]?\d|4[0-7]):[0-5]\d$/;
const validHours = p => arr(p && p.hours).filter(r => Array.isArray(r) && r.length >= 3 && Number.isInteger(r[0]) && r[0] >= 0 && r[0] <= 6
  && HHMM.test(String(r[1])) && END.test(String(r[2])));
const NO_HOURS = {state: 'unknown', text: 'Hours not listed'};
const hoursOf = p => {
  const rows = validHours(p);
  if (!rows.length || !food().hours) return NO_HOURS;
  try { return food().hours({...p, hours: rows}, N.now()) || NO_HOURS; }
  catch { return NO_HOURS; }
};
// One weekday as text, with whole-day spans as "Open 24 hours".
function dayText(p, dd) {
  const rows = validHours(p).filter(r => r[0] === dd);
  if (!rows.length) return 'Closed';
  return rows.map(([, a, b]) => {
    const s = toMin(a); let e = toMin(b);
    if (e <= s) e += 1440;
    return e - s >= 1439 ? 'Open 24 hours' : `${N.clockText(s)}–${N.clockText(e)}`;
  }).join(', ');
}

// ---------- attributes → chips ----------
const ATTRS = [
  // [key, test(value) → [icon, text, warn?] | null]
  ['reservations', v => v === true ? ['calendar-check', 'Takes reservations'] : v === false ? ['calendar', 'No reservations'] : null],
  ['cards', v => v === false ? ['cash', 'Cash only', true] : v === true ? ['credit-card', 'Cards accepted'] : null],
  ['apple_pay', v => v === true ? ['device-mobile', 'Apple Pay'] : null],
  ['wheelchair', v => v === true ? ['wheelchair', 'Wheelchair accessible'] : v === false ? ['wheelchair', 'Not wheelchair accessible', true] : null],
  ['takeout', v => v === true ? ['shopping-bag', 'Takeout'] : v === false ? ['shopping-bag', 'No takeout'] : null],
  ['delivery', v => v === true ? ['scooter', 'Delivery'] : null],
  ['outdoor', v => v === true ? ['sun', 'Outdoor seating'] : null],
  ['noise', v => typeof v === 'string' && v ? ['volume', `${cap1(v)} noise`] : null],
  ['alcohol', v => typeof v === 'string' && v ? [/bar/i.test(v) ? 'glass-full' : 'beer', cap1(v)] : v === false ? ['glass-full', 'No alcohol'] : null],
  ['happy_hour', v => v === true ? ['clock', 'Happy hour'] : null],
  ['late_kitchen', v => v === true ? ['moon', 'Late kitchen'] : null],
  ['groups', v => v === true ? ['users', 'Good for groups'] : null],
  ['kids', v => v === true ? ['baby-carriage', 'Good for kids'] : null],
  ['vegan', v => v === true ? ['leaf', 'Vegan options'] : null],
  ['vegetarian', v => v === true ? ['salad', 'Vegetarian options'] : null],
  ['gluten_free', v => v === true ? ['bread', 'Gluten-free options'] : null],
  ['wifi', v => typeof v === 'string' && v && v !== 'no' ? ['wifi', `${cap1(v)} Wi-Fi`] : null],
  ['good_for_working', v => v === true ? ['briefcase', 'Laptop-friendly'] : null],
  ['dogs', v => v === true ? ['dog', 'Dogs allowed'] : null],
  ['ambience', v => typeof v === 'string' && v ? ['sparkles', cap1(v)] : null],
  ['attire', v => typeof v === 'string' && v ? ['user', `${cap1(v)} dress`] : null],
  ['best_nights', v => typeof v === 'string' && v ? ['moon-stars', `Busiest: ${v.split(/,\s*/).map(d => d.slice(0, 3)).join(', ')}`] : null],
  ['parking', v => typeof v === 'string' && v ? ['parking', `Parking: ${v}`] : null],
  ['health', v => typeof v === 'string' && v ? ['shield-check', /^[A-C]$/.test(v) ? `Health grade ${v}` : /pending/i.test(v) ? 'Health grade pending' : `Inspection: ${v}`] : null],
  ['gender_neutral_restrooms', v => v === true ? ['toilet-paper', 'Gender-neutral restrooms'] : null],
  ['lgbtq_friendly', v => v === true ? ['heart', 'LGBTQ+ friendly'] : null],
  ['corkage', v => v === 'free' ? ['bottle', 'Free corkage'] : null],
  ['catering', v => v === true ? ['tools-kitchen-2', 'Catering'] : null],
  ['private_events', v => v === true ? ['calendar-time', 'Private events'] : null],
];
function attrChips(a) {
  if (!a || typeof a !== 'object') return [];
  const out = [];
  for (const [k, fn] of ATTRS) {
    if (!(k in a)) continue;
    let r = null;
    try { r = fn(a[k]); } catch { r = null; }
    if (r) out.push(r);
  }
  return out;
}

// ---------- pieces ----------
function stars(r) {
  const v = Math.round(N.clamp(r, 0, 5) * 2) / 2;
  const s = [1, 2, 3, 4, 5].map(i => icon(v >= i ? 'star-filled' : v >= i - .5 ? 'star-half-filled' : 'star'));
  return h`<span class="pl-stars" role="img" aria-label="${`Rated ${r} out of 5`}">${s}</span>`;
}
// Display size for the name: big when short, smaller when long or a word is long.
function nameSize(name) {
  const len = name.length;
  const word = Math.max(...name.split(/\s+/).map(w => w.length), 1);
  const byLen = len <= 10 ? 60 : len <= 14 ? 50 : len <= 20 ? 42 : len <= 28 ? 36 : len <= 36 ? 30 : 26;
  const byWord = 350 / (word * .64);
  return [60, 50, 42, 36, 30, 26].find(s => s <= Math.min(byLen, byWord)) || 26;
}

function hoursChip(p) {
  const st = hoursOf(p);
  const tone = st.state === 'open' ? 'ok' : st.state === 'closing' ? 'soon' : st.state === 'closed' ? 'shut' : 'na';
  return h`<span class="${'pl-chip pl-' + tone}"><span class="pl-dot"></span>${st.text || 'Hours not listed'}</span>`;
}
function statusRow(p) {
  const bits = distBits(p);
  const ask = !bits.some(b => b.t.endsWith('from you')) && canLocate() && hasLL(p) && !N.lastWhere();
  return h`${hoursChip(p)}${bits.map(b => h`<span class="pl-chip pl-dist">${icon(b.i)}${b.t}</span>`)}${ask
    ? h`<button class="pl-chip pl-ask" data-act="locate" aria-label="Distance from me">${icon('current-location')}<span>Distance</span></button>` : ''}`;
}

function gallery(p) {
  const list = photosOf(p);
  if (!list.length) {
    return h`<div class="pl-none">${icon('photo')}<span>No photos saved for this place</span></div>`;
  }
  const inside0 = list.length - nInside(p);
  const name = nameOf(p) || 'this place';
  return h`<div class="pl-galw">
    <div class="pl-gal" data-hscroll role="region" aria-label="${`Photos of ${name}`}">${list.map((x, i) => {
      const cap = str(x.cap);
      const label = `Photo ${i + 1} of ${list.length}${cap ? ': ' + cap : ''}${i >= inside0 ? ' (inside)' : ''}. Opens full screen.`;
      return h`<button class="pl-ph pl-fig${list.length === 1 ? ' pl-one' : ''}" data-act="photo" data-arg="${i}" aria-label="${label}">
        <img class="pl-img" src="${photoUrl(x.id, 'l')}" alt="" ${i ? N.raw('loading="lazy"') : N.raw('fetchpriority="high"')} decoding="async">
        ${cap || i >= inside0 ? h`<span class="pl-cap">${i >= inside0 ? h`<b>Inside</b>` : ''}${cap ? h`<span>${cap}</span>` : ''}</span>` : ''}
      </button>`;
    })}</div>
    ${list.length > 1 ? h`<span class="pl-cnt" aria-hidden="true">${icon('photo')}<span data-pl="cnt">1 / ${list.length}</span></span>` : ''}
  </div>`;
}

function heroHtml(p) {
  const name = nameOf(p) || 'Unnamed place';
  const cuisine = arr(p.cuisine).map(str).filter(Boolean).slice(0, 3).join(' · ');
  // A 0 (or out-of-range) rating and a 0 review count mean "no rating", not "rated zero".
  let rating = num(p.rating), reviews = num(p.reviews);
  if (rating != null && !(rating > 0 && rating <= 5)) rating = null;
  if (reviews != null && !(reviews >= 1)) reviews = null;
  if (reviews != null) reviews = Math.round(reviews);
  const price = str(p.price);
  const where = [str(p.located_in) ? `Inside ${str(p.located_in)}` : '', str(p.neighborhood), str(p.borough)].filter(Boolean).join(' · ');
  const meta = [
    rating != null ? h`<span class="pl-rate">${stars(rating)}<b>${rating.toFixed(1)}</b></span>` : '',
    reviews != null ? h`<span>${N.plural(reviews, 'review').replace(/^\d+/, reviews.toLocaleString('en-US'))}</span>` : '',
    price ? h`<span class="pl-price">${price}</span>` : '',
  ].filter(Boolean);
  return h`<div class="pl-hero">
    ${safe(() => gallery(p), 'gallery')}
    <div class="pl-ttl">
      ${cuisine ? h`<div class="ey">${cuisine}</div>` : ''}
      <h1 class="${`dp pl-name pl-t${nameSize(name)}`}">${name}</h1>
      ${meta.length ? h`<div class="pl-meta">${meta.map((m, i) => h`${i ? h`<span class="pl-sep" aria-hidden="true">·</span>` : ''}${m}`)}</div>` : ''}
      ${where ? h`<div class="pl-where">${icon('map-pin')}<span>${where}</span></div>` : ''}
    </div>
    <div class="pl-stat" data-pl="stat">${safe(() => statusRow(p), 'status')}</div>
  </div>`;
}

// The big buttons under the hero: [href, icon, label, aria].
function actList(p) {
  const dest = destOf(p);
  const tel = telOf(p.phone), site = web(p.website), yelp = web(p.yelp), menu = web(p.menu);
  const acts = [];
  if (dest) acts.push([N.mapsUrl(dest, 'w'), 'walk', 'Walk', `Walking directions to ${nameOf(p)}`]);
  if (dest) acts.push([N.mapsUrl(dest, 'r'), 'train', 'Transit', `Transit directions to ${nameOf(p)}`]);
  if (tel) acts.push([tel, 'phone', 'Call', `Call ${nameOf(p)}`]);
  if (site) acts.push([site, 'world', 'Website', `${nameOf(p)} website`]);
  else if (menu) acts.push([menu, 'receipt', 'Menu', `${nameOf(p)} menu`]);
  else if (yelp) acts.push([yelp, 'star', 'Yelp', `${nameOf(p)} on Yelp`]);
  return acts;
}
function quickActs(p) {
  const acts = actList(p);
  if (!acts.length) return '';
  return h`<div class="${'pl-acts pl-n' + acts.length}">${acts.map(([href, i, t, aria]) =>
    h`<a class="pl-act" href="${href}" ${href.startsWith('tel:') ? '' : N.raw('target="_blank" rel="noopener"')} aria-label="${aria}">${icon(i)}<span>${t}</span></a>`)}</div>`;
}

function overview(p) {
  const sum = str(p.summary);
  const facts = [
    ['sparkles', 'Vibe', cap1(str(p.vibe))],
    ['hourglass', 'Wait', cap1(str(p.wait))],
    ['cash', 'Per person', str(p.price_per_person)],
  ].filter(f => f[2]);
  const good = arr(p.good_for).map(str).filter(Boolean);
  if (!sum && !facts.length && !good.length) return '';
  return h`<section class="sec pl-sec">
    <h2 class="ey">Overview</h2>
    ${sum ? h`<p class="pl-sum">${sum}</p>` : ''}
    ${facts.length ? h`<div class="pl-facts">${facts.map(([i, k, v]) => h`<div class="pl-fact"><span class="pl-fi">${icon(i)}</span><div><small>${k}</small><span>${v}</span></div></div>`)}</div>` : ''}
    ${good.length ? h`<div class="pl-good"><span class="pl-lbl">Good for</span><div class="pl-chips">${good.map(g => h`<span class="pl-tag">${cap1(g)}</span>`)}</div></div>` : ''}
  </section>`;
}

function toOrder(p) {
  const pop = arr(p.popular).filter(x => typeof x === 'object' && str(x.name));
  const names = new Set(pop.map(x => norm(x.name)));
  const more = arr(p.order).map(str).filter(Boolean).filter(n => !names.has(norm(n)));
  if (!pop.length && !more.length) return '';
  const list = photosOf(p);
  const at = id => list.findIndex(x => x.id === id);
  return h`<section class="sec pl-sec">
    <h2 class="ey">What to order</h2>
    ${pop.length ? h`<div class="pl-dishes" data-hscroll>${pop.map(d => {
      const id = typeof d.photo === 'string' && d.photo ? d.photo : null;
      const i = id ? at(id) : -1;
      const pic = id
        ? h`<span class="pl-dimg pl-fig"><img class="pl-img" src="${photoUrl(id, '348s')}" alt="" loading="lazy" decoding="async"></span>`
        : h`<span class="pl-dimg pl-dnone">${icon('tools-kitchen-2')}</span>`;
      const inner = h`${pic}<b>${str(d.name)}</b>${str(d.note) ? h`<small>${cap1(str(d.note))}</small>` : ''}`;
      return i >= 0
        ? h`<button class="pl-dish" data-act="photo" data-arg="${i}" aria-label="${`${str(d.name)}. Opens photo.`}">${inner}</button>`
        : h`<div class="pl-dish">${inner}</div>`;
    })}</div>` : ''}
    ${more.length ? h`<div class="pl-also"><span class="pl-lbl">${pop.length ? 'Also worth ordering' : 'Most ordered'}</span><div class="pl-chips">${more.map(n => h`<span class="pl-tag">${n}</span>`)}</div></div>` : ''}
  </section>`;
}

function opinions(p) {
  const loved = arr(p.loved).map(str).filter(Boolean);
  const watch = arr(p.watch).map(str).filter(Boolean);
  const tips = arr(p.tips).map(str).filter(Boolean);
  if (!loved.length && !watch.length && !tips.length) return '';
  const list = (items, i) => h`<ul class="pl-list">${items.map(t => h`<li>${icon(i)}<span>${cap1(t)}</span></li>`)}</ul>`;
  return h`${loved.length || watch.length ? h`<section class="sec pl-sec pl-ops">
      ${loved.length ? h`<div class="card tight pl-love"><h2 class="pl-h3">${icon('thumb-up')}People love</h2>${list(loved, 'check')}</div>` : ''}
      ${watch.length ? h`<div class="card tight sand pl-watch"><h2 class="pl-h3">${icon('alert-triangle')}Watch out</h2>${list(watch, 'point')}</div>` : ''}
    </section>` : ''}
    ${tips.length ? h`<section class="sec pl-sec"><h2 class="ey">Tips</h2><ul class="pl-tips">${tips.map(t => h`<li><span class="pl-fi">${icon('bulb')}</span><span>${cap1(t)}</span></li>`)}</ul></section>` : ''}`;
}

// The week as rows, with runs of days that share hours joined ("Mon–Thu"), or one "Every day" row.
function weekRows(p) {
  const out = [];
  for (const d of DAYS_ORDER) {
    const t = dayText(p, d), last = out[out.length - 1];
    if (last && last.t === t) last.days.push(d); else out.push({t, days: [d]});
  }
  if (out.length === 1) return [{t: out[0].t, label: 'Every day', days: out[0].days}];
  const short = out.some(r => r.days.length > 1);
  return out.map(r => ({...r, label: r.days.length > 1
    ? `${N.dayName(r.days[0])}–${N.dayName(r.days[r.days.length - 1])}` : N.dayName(r.days[0], !short)}));
}
function hoursHtml(p) {
  const rows = validHours(p);
  const note = str(p.hours_note);
  if (!rows.length) {
    return h`<section class="sec pl-sec"><h2 class="ey">Hours</h2>
      <div class="co plain">${icon('clock')}<span>Yelp doesn’t list hours for this place${note ? ` (${note})` : ''}. Call or check its website before you go.</span></div></section>`;
  }
  const today = N.nyNow().day;
  const week = weekRows(p);
  const tr = (cls, label, t) => h`<tr class="${N.cls(cls, t === 'Closed' && 'pl-off')}"><th scope="row">${label}</th><td>${t}</td></tr>`;
  const head = week.length === 1
    ? tr('pl-today', week[0].label, week[0].t)
    : tr('pl-today', h`${N.dayName(today, true)}<span class="pl-tdy">Today</span>`, dayText(p, today));
  return h`<section class="sec pl-sec"><h2 class="ey">Hours</h2>
    <div class="pl-hrs">
      <div class="pl-hnow" data-pl="hnow">${hoursChip(p)}<span class="pl-tz">New York time</span></div>
      <table class="pl-tbl"><tbody>${head}</tbody></table>
      ${week.length > 1 ? h`<details class="pl-hall"><summary><span>All hours</span>${icon('chevron-down')}</summary>
        <table class="pl-tbl"><tbody>${week.map(r => tr(r.days.includes(today) && 'pl-today', r.label, r.t))}</tbody></table>
      </details>` : ''}
      ${note ? h`<p class="pl-note">${icon('info-circle')}<span>${note}</span></p>` : ''}
    </div></section>`;
}

function detailsHtml(p) {
  const chips = attrChips(p.attrs);
  const addr = str(p.address);
  const site = web(p.website), menu = web(p.menu), yelp = web(p.yelp);
  const a = p.attrs && typeof p.attrs === 'object' ? p.attrs : {};
  const reserve = web(a.reserve_url), order = web(a.order_url);
  const tel = telOf(p.phone);
  // anything already a button under the hero (Call, Website…) isn't repeated here
  const shown = new Set(actList(p).map(a => a[0]));
  const links = [
    tel ? [tel, 'phone', str(p.phone), false] : null,
    menu ? [menu, 'receipt', 'Menu', true] : null,
    reserve ? [reserve, 'calendar-check', 'Reserve', true] : null,
    order ? [order, 'shopping-bag', 'Order online', true] : null,
    site ? [site, 'world', 'Website', true] : null,
    yelp ? [yelp, 'star', 'Open in Yelp', true] : null,
  ].filter(l => l && !shown.has(l[0]));
  // Two to a row; a long phone number gets a row of its own, and an odd one out at the end
  // fills its row rather than leaving a half-width button and a gap.
  const wide = links.map(([href, , t]) => href.startsWith('tel:') && t.length > 15);
  const halves = wide.map((w, i) => w ? -1 : i).filter(i => i >= 0);
  if (halves.length % 2) wide[halves[halves.length - 1]] = true;
  const ll = hasLL(p);
  return h`<section class="sec pl-sec"><h2 class="ey">Details</h2>
    ${chips.length ? h`<ul class="pl-dets">${chips.map(([i, t, warn]) => h`<li class="${N.cls(warn && 'pl-warn')}">${icon(i)}<span>${t}</span></li>`)}</ul>`
      : h`<p class="pl-quiet">Yelp lists no extras (reservations, seating, payment) for this place.</p>`}
    <div class="pl-loc">
      ${ll ? h`<div class="pl-map">
        <div class="pl-mapc" data-pl="map" aria-hidden="true"></div>
        <a class="pl-mapa" href="${placeUrl(p)}" target="_blank" rel="noopener" aria-label="${`Show ${nameOf(p)} in Maps`}"></a>
      </div>` : ''}
      <div class="pl-addr">
        <span class="pl-fi">${icon('map-pin')}</span>
        <div class="grow"><b>${addr || (str(p.located_in) ? `Inside ${str(p.located_in)}` : 'No street address listed')}</b>${
          [str(p.neighborhood), str(p.borough)].filter(Boolean).length ? h`<small>${[str(p.neighborhood), str(p.borough)].filter(Boolean).join(' · ')}</small>` : ''}</div>
        ${addr ? h`<button class="pl-copy" data-act="copy" data-arg="${addr}" aria-label="Copy address">${icon('copy')}</button>` : ''}
      </div>
    </div>
    ${links.length ? h`<div class="pl-links">${links.map(([href, i, t, ext], k) =>

// ---------- failed photos ----------
// Swap to the smaller size once, then show a plain tile saying why.

  const alt = im.dataset.alt;

// ---------- map ----------

  const map = L.map(box, {zoomControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, tap: false, inertia: false, zoomSnap: .25, fadeAnimation: false, zoomAnimation: false});

  map.setView([p.lat, p.lon], tiles ? 15.75 : 15);
  map.panBy([0, -22], {animate: false}); // the pin stands above its point, so nudge it to look centred
  const pane = map.createPane('plBase');
  pane.style.zIndex = 150;
  pane.style.pointerEvents = 'none';

  // nothing, so the map is left out and the address card stands alone.
  const blank = () => { if (!tiles && alive() && box.isConnected && box.parentElement) box.parentElement.classList.add('pl-nomap'); };
  getBasemap().then(gj => {

      body: h`<div class="pl-body">
        ${safe(() => quickActs(p), 'actions')}
        ${safe(() => overview(p), 'overview')}
        ${safe(() => toOrder(p), 'order')}
        ${safe(() => opinions(p), 'opinions')}

// The same flight as one row, for the hour before leaving when the drive card leads.
function legRow(l) {

}
// The whole outbound (or return) as one ticket → #flights.
function tripCard(legs, label) {

  const total = N.mins(a.dep.time, z.arr.time);

    <div class="td-tkc">

    </div></a>`;

// Bags close / Boards / Doors close (or Departs) as three cells; the next deadline is ringed

function cutoffs(items, ring, risk = false) {
  const t = nowMs();
  const live = items.filter(x => x && x.at);
  const next = ring ? live.find(x => T(x.at) > t) : null;
  return h`<div class="cn td-cn">${live.map(x => {
    const past = T(x.at) <= t;
    return h`<div class="${x === next ? (risk ? 'w' : 'td-nx') : ''}"><small>${x.label}</small><b class="tn"${x.k ? h` data-k="${x.k}"` : ''}>${N.time(x.at, x.ap)}</b><span>${past ? (x.pastText || 'passed') : h`in ${until(x.at)}`}</span></div>`;
  })}</div>`;
}
// One line for security: "Checkpoint A, Level 3 NW · open 24h · PreCheck from 5a".
// The checkpoint is the one the guide's security step sends you to, else one open all night.
const COMPASS = {north: 'N', south: 'S', east: 'E', west: 'W'};
// "5a" / "4:15p" → minutes after midnight; local minutes of a moment at an airport
// (the trip's zones are whole hours off UTC, so UTC minutes are local minutes).
const clockMin = m => (+m[1] % 12 + (/p/i.test(m[3]) ? 12 : 0)) * 60 + (+m[2] || 0);
const dayMin = (iso, code) => N.hour(iso, code) * 60 + new Date(iso).getUTCMinutes();
const caution = text => h`<span class="td-warn">${icon('alert-triangle')}${text}</span>`;
// PreCheck as it applies at `at` (when you reach security): a lane that opens later, or has
// closed, is a caution, never "PreCheck from 5a" for a flight whose doors close before 5a.
function preCheck(pc, code, at) {
  pc = String(pc || '');
  if (/^yes\b/i.test(pc)) return 'PreCheck';
  const o = pc.match(/^\s*(\d{1,2})(?::(\d\d))?\s*([ap])/i);
  if (!o) return '';
  const from = o[0].replace(/\s+/g, '').toLowerCase();
  const c = pc.slice(o[0].length).match(/^\s*[–-]\s*(\d{1,2})(?::(\d\d))?\s*([ap])/i);
  if (!okT(at)) return /closed/i.test(pc) ? caution('No PreCheck for this flight') : `PreCheck from ${from}`;
  const m = dayMin(at, code), om = clockMin(o), cm = c ? clockMin(c) : null;
  if (m < om) return caution(`No PreCheck before ${from}`);
  if (cm != null && cm > om && m >= cm) return caution(`No PreCheck after ${c[0].replace(/^[\s–-]+/, '').replace(/\s+/g, '').toLowerCase()}`);
  return `PreCheck from ${from}`;
}
function secLine(code, st, at) {
  const list = ((N.guideFor(code) || {}).security || []).filter(s => s && s.name);
  if (!list.length) return st ? ln('shield-check', sentences(st.detail, 1)) : '';
  const named = st && list.find(s => new RegExp(`\\b${String(s.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i').test(`${st.title || ''} ${st.detail || ''}`));
  const cp = named || list.find(s => /24\s*h/i.test(s.hours || '')) || list[0];
  const loc = String(cp.where || cp.location || cp.level || '');
  const first = loc.split(/[,;(]/)[0].trim();
  // "northwest corner" → "NW", "south side" → "S".
  const cm = loc.toLowerCase().match(/\b(?:(north|south)[\s-]?(east|west)?|(east|west))(?:ern)?\b/);
  const cmp = cm ? [cm[1], cm[2] || cm[3]].filter(Boolean).map(w => COMPASS[w]).join('') : '';
  const where = first && first.length <= 18 ? `${first}${cmp && !new RegExp(`\\b${cmp}\\b`).test(first) ? ` ${cmp}` : ''}` : '';
  const hrs = String(cp.hours || '');
  const open = /24\s*h/i.test(hrs) ? 'open 24h' : /^\s*\d/.test(hrs) ? `open ${hrs.trim().replace(/\.$/, '')}` : '';
  return ln('shield-check', meta([`${cp.name}${where ? `, ${where}` : ''}`, open, preCheck(cp.precheck, code, at)]));
}
// The sand card for the drive to the airport. On the travel morning the heading already
// gives the leave time, so the card gives the arrival time and the cutoffs; the days
// before, it carries the leave time as a chip under the title.
function planCard(S, phase) {
  const {lv, leg: l, dir} = S;
  const ap = l.from, t = nowMs();
  const leaving = S.mode === 'leave' || S.mode === 'leavenow';
  const eyeb = phase === 'before' ? `${N.date(l.dep.time, ap).split(' ')[0]} morning · ${placeOf(l)}`
    : S.mode === 'goto' ? `On the way · ${placeOf(l)}` : `${dir === 'out' ? 'Leave home' : 'Leave the hotel'} · ${placeOf(l)}`;
  const curb = stepBy(ap, 'depart', 'door');
  const secStep = stepBy(ap, 'depart', 'shield-check', /security/i);
  const drive = stepBy(ap, 'depart', 'car');
  const cut = h`<span class="tn">${meta([`Bags close ${N.time(lv.bagdrop, ap)}`, `Boards ${N.time(l.board, ap)}`, h`Doors close <span data-k="doors-${l.id}">${N.time(l.doors, ap)}</span>`])}</span>`;
  let rows;
  if (phase === 'before') rows = [];
  else {
    const tip = drive && dropFirst(drive.detail), byTr = /^by (transit|subway|train|bus)/i.test(tip || '');
    // On the way back Transit times the train itself, so the guide's rule of thumb gives way to it:
    // the car time sits under the pick's, as on Transit.
    const alt = lv.pick ? ln('car', h`Or <b class="tn">${N.time(lv.at, ap)}</b> by car${lv.drive ? h` · <span class="nw">${lv.drive}\u00a0min drive</span>` : ''}`)
      : tip && tip !== drive.detail && !(byTr && dir === 'ret' && typeof N.bestRoute === 'function') ? ln(byTr ? 'train' : 'car', glue(tip)) : '';
    rows = [
      ln('clock', cut),
      leaving ? alt : '',
      !leaving && curb ? stepLn(curb, 1) : '',
      sec(() => secLine(ap, secStep, new Date(Math.max(t, T(lv.arrive))).toISOString())),
    ].filter(Boolean);
  }
  const chip = phase === 'before' ? h`<span class="chip td-lv">${icon(dir === 'out' ? 'home' : 'building')}<span data-k="leave-${dir}">Leave ${N.time(lv.at, ap)}</span></span>` : '';
  return h`<div class="card sand td-plan">
    <div class="${N.cls('td-planh', chip && 'td-planw')}"><div class="grow"><div class="ey">${eyeb}</div><div class="td-big tn">At ${termLabel(l)} by <span data-k="arrive-${dir}">${N.time(lv.arrive, ap)}</span></div></div>${chip}</div>
    ${phase === 'before' ? h`<p class="td-cut">${cut}</p>` : ''}
    ${rows.length ? h`<div class="td-rows">${rows}</div>` : ''}
    ${phase !== 'before' && S.mode === 'leave' && T(goAt(lv)) - t > 3 * HOUR ? h`<p class="td-cut">Leave in ${until(goAt(lv))}</p>` : ''}
  </div>`;
}
// Big gate number with boarding and door times. The whole card opens the airport map.
// Airports reads ?gate= (AP-13) when it says so; until then the plain map link is used,
// since an unknown query would end up in the airport code.
const gateHref = (code, gate) => `#airport/${code.toLowerCase()}${gate && N.airportGateLinks ? `?gate=${encodeURIComponent(gate)}` : ''}`;
function gateCard(l, opts = {}) {

      {label: 'Boards', at: l.board, ap: l.from, pastText: 'started'},

// Two-up tiles.
// Connection words and colour come from the model's level: ink when comfortable,
// --warn when tight, rose only when at risk.
const LEVEL_TXT = {ok: 'Comfortable', tight: 'Tight', risk: 'At risk'};
const levelOf = c => c && LEVEL_TXT[c.level] ? c.level : 'ok';
const levelTxt = c => c.label || LEVEL_TXT[levelOf(c)] || c.text || '';
// Minutes between reaching the gate and doors closing; Number.isFinite guards an older model.
const spareOf = c => Number.isFinite(c.spare) ? c.spare : null;
const spareTxt = c => { const s = spareOf(c); return s == null ? '' : s >= 0 ? `${s}\u00a0min before doors close` : 'doors may close before you reach the gate'; };
function connTile(dir) {
  const c = N.connection(dir);
  if (!c) return null;
  const tone = {ok: '', tight: 'td-cau', risk: 'td-ring'}[levelOf(c)];
  // A delay can push the landing past the next departure: say that, never "-15 min".
  if (missed(c)) return h`<a class="td-mini td-a td-ring" href="#connect/${dir}"><div class="ey">${city(c.at)}</div><b>Lands after ${fno(c.b)} leaves</b><small>At risk · the AA app shows rebooking</small></a>`;
  return h`<a class="${N.cls('td-mini td-a', tone)}" href="#connect/${dir}"><div class="ey">${city(c.at)}</div><b>${dur(c.ground)} on the ground</b><small>${[levelTxt(c), spareTxt(c)].filter(Boolean).join(' · ')}</small></a>`;
}
// The first leg is due to land at or after the second one's departure.
const missed = c => !!c && Number.isFinite(c.ground) && c.ground <= 0;
function faaWords(f) {

// Weather at an airport: temperature and sky in ink; rain or FAA delays as a caution line

function wxTile(code, iso) {

function hotelTile() {

// ---------- callouts ----------
// Model text names the flight with no space ("AA1234"); Today writes "AA 1234" everywhere else.
const chgText = c => { const t = String(c && c.text || ''), f = c && c.leg && c.leg.flight; return f && t.startsWith(f) ? fno(c.leg) + t.slice(f.length) : t; };

  const ch = N.changes() || [];

}
function alertsFor(codes) {
  const out = [];
  [...new Set(codes.filter(Boolean))].forEach(code => {
    const a = N.airportLive(code) || {};
    const f = a.faa;
    if (f && f.status && f.status !== 'normal') {
      const bad = f.status === 'ground_stop' || f.status === 'closed';
      // The check time is relative ("checked 5 min ago"), so it never needs a time zone.
      out.push(h`<div class="${N.cls('co', bad && 'rose')}" role="status">${icon('alert-triangle')}<span><b>${code} · ${faaWords(f)}.</b> ${f.text || ''}${f.updated ? h` · checked ${ago(f.updated)}` : ''}</span></div>`);
    }

      const txt = typeof x === 'string' ? x : x && (x.event || x.headline || x.text) || '';
      if (txt) out.push(h`<div class="co" role="status">${icon('umbrella')}<span><b>${city(code)} weather:</b> ${txt}</span></div>`);
    });
  });

}
function legAlerts(legs) {
  return legs.map(l => {

    if (l.diverted) return h`<div class="bn" role="alert">${icon('alert-triangle')}<div class="grow"><b>${fno(l)} diverted to ${l.diverted}</b><span>Stay with the plane and follow crew instructions. The AA app shows rebooking.</span><a class="td-got td-a" href="${AA_TRIPS}" target="_blank" rel="noopener">${icon('external-link')}Open AA Trips</a></div></div>`;

// Check-in reminder until the leave time (after that you're on the way), with a dismiss

const CI_KEY = 'nyc.ciDismiss';

function retFlag() {

// ---------- views ----------
function vBefore() {
  const legs = N.dirLegs('out');
  const a = legs[0];
  if (!a) return [vNoTrip()];
  const ap = a.from;
  const lv = N.leave('out');
  const S = lv ? {lv, leg: a, dir: 'out', mode: 'before'} : null;
  const ci = checkin('out');
  const ret = N.dirLegs('ret');
  const unconf = ret.some(l => l.confirmed === false && !l.dep.time);
  return [
    head(`${longDate(ap)} · ${city(ap)}`,
      a.dep.time ? h`Departs in<br><b>${until(a.dep.time)}.</b>` : h`Flying to<br><b>New York.</b>`,

// ---------- deep links: #wallet/hotel, #wallet/seats[/<leg id>], #wallet/clear ----------
// Scroll the section under the top bar, flash it once and focus its first empty field.
const DEEP = {hotel: 'wl-hotel', seats: 'wl-seats', clear: 'wl-clear'};
function jumpField(box, kind, leg) {
  if (kind === 'clear') return N.$('button', box);
  const all = N.$$(kind === 'seats' ? 'input[data-f="seat"]' : 'input', box);
  const mine = leg ? all.filter(i => i.dataset.leg === leg) : [];
  const pool = mine.length ? mine : all;
  return pool.find(i => !i.value) || pool[0] || N.$('button', box);
}
function jumpTo(param, view) {
  const [kind, leg] = str(param).split('/');
  const box = DEEP[kind] && document.getElementById(DEEP[kind]);
  const part = box && box.closest('section');
  if (!part || !view) return;
  // offsetTop ignores the entrance transforms that getBoundingClientRect would include.
  let y = 0;
  for (let n = part; n && n !== view; n = n.offsetParent) y += n.offsetTop;
  const head = ['.tb', '#strip'].reduce((a, q) => a + ((N.$(q, view) || {}).offsetHeight || 0), 0);
  const top = Math.max(0, Math.min(y - head - 12, view.scrollHeight - view.clientHeight));
  try { view.scrollTo({top, behavior: N.reduce ? 'auto' : 'smooth'}); } catch (e) { view.scrollTop = top; }
  const f = jumpField(box, kind, leg);
  if (f) f.focus({preventScroll: true});
  part.classList.remove('wl-flash'); void part.offsetWidth; part.classList.add('wl-flash');
  clearTimeout(W.timers.flash);
  W.timers.flash = setTimeout(() => part.classList.remove('wl-flash'), 1600);
}

const walletDef = {
  back: 'today', nav: false, static: true, uses: ['trip'], title: 'Wallet',
  render(ctx) {
    const rise = firstPaint();
    if (rise) W.jump = ctx && ctx.param || '';

      hero: bar('Codes, seats and notes', 'lock', 'Wallet', 'Saved only on this phone.'),

    };
  },
  mount(ctx, view) {

  },

// =====================================================================
// Data & offline
// =====================================================================
const JOBS = {photos: {running: false}, tiles: {running: false}};
const PLAN_KEY = 'nyc.offline';   // when photos/maps were last saved (no Wallet data)
const TILE_CAP = 2500;
const STALL_MS = 60000;      // no progress for this long and a save is treated as stopped
// Areas to keep, as [south, west, north, east] and a zoom range.
const AREAS = [
  {b: [40.63, -74.09, 40.835, -73.85], z: [11, 13]},     // all of NYC, zoomed out (matches data/basemap.json)
  {b: [40.698, -74.022, 40.882, -73.906], z: [14, 15]},  // Manhattan
  {b: [40.738, -73.955, 40.79, -73.852], z: [14, 15]},   // LaGuardia and the drive into Manhattan
];
const lon2x = (lon, z) => Math.floor((lon + 180) / 360 * 2 ** z);
const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z); };
const okLL = p => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lon) && Math.abs(+p.lat) < 85;
function addBox(set, [s, w, n, e], z0, z1) {
  for (let z = z0; z <= z1; z++) {
    for (let x = lon2x(w, z); x <= lon2x(e, z); x++) for (let y = lat2y(n, z); y <= lat2y(s, z); y++) set.add(`${z}/${x}/${y}`);
  }
}
function addAround(set, lat, lon, z, r) {
  const x0 = lon2x(lon, z), y0 = lat2y(lat, z);
  for (let x = x0 - r; x <= x0 + r; x++) for (let y = y0 - r; y <= y0 + r; y++) set.add(`${z}/${x}/${y}`);
}
// Carto's tiles need a key: without one every tile is an "API key required"
// card, so the maps draw land, parks and main roads from data/basemap.json
// and never ask for tiles (the same rule as place.js, food.js and transit.js).
// Only offer to save tiles once a map would actually show them.
const tilesOk = t => !!(t && typeof t.url === 'string' && t.url && (!/basemaps\.cartocdn\.com/.test(t.url) || /[?&](api_?key|key|token)=/i.test(t.url)));
const tilesUsable = () => safe(() => tilesOk(N.tiles(false)), false);
// The same URLs Leaflet asks for: N.tiles() template, its subdomain rule and the @2x retina suffix.
function tileUrl(key, dark) {
  const [z, x, y] = key.split('/').map(Number);
  const t = N.tiles(dark), subs = (t.opts && t.opts.subdomains) || 'abc';
  const retina = (window.devicePixelRatio || 1) > 1 ? '@2x' : '';
  return t.url.replace('{s}', subs[Math.abs(x + y) % subs.length]).replace('{z}', z).replace('{x}', x).replace('{y}', y).replace('{r}', retina);
}
let tileMemo = null;
function tilePlan() {
  const dark = N.isDark();
  const hotel = safe(() => N.hotel(), null);
  const places = safe(() => N.food.places(), []);
  const key = `${dark}|${okLL(hotel) ? hotel.lat + ',' + hotel.lon : ''}|${places.length}`;
  if (tileMemo && tileMemo.key === key) return tileMemo;
  const per = dark ? Math.floor(TILE_CAP / 2) : TILE_CAP;
  const set = new Set();
  AREAS.forEach(a => addBox(set, a.b, a.z[0], a.z[1]));
  if (okLL(hotel)) { addAround(set, +hotel.lat, +hotel.lon, 15, 2); addAround(set, +hotel.lat, +hotel.lon, 14, 1); }
  let food = 0;
  for (const p of places) {
    if (!okLL(p)) continue;
    const trial = new Set(set);
    addAround(trial, +p.lat, +p.lon, 15, 1);
    addAround(trial, +p.lat, +p.lon, 14, 0);
    if (trial.size > per) break;
    trial.forEach(k => set.add(k));
    food++;
  }
  const keys = [...set];
  const urls = keys.map(k => tileUrl(k, false)).concat(dark ? keys.map(k => tileUrl(k, true)) : []);
  // Rough sizes of Carto @2x PNGs in Manhattan: about 30 KB light, 20 KB dark.
  const bytes = keys.length * 30e3 + (dark ? keys.length * 20e3 : 0);
  tileMemo = {key, urls, count: urls.length, bytes, dark, food, hotel: okLL(hotel)};
  return tileMemo;
}
function photoPlan() {
  const urls = safe(() => N.food.offlineUrls(6), []);
  const places = safe(() => N.food.places(), []).length;
  const thumbs = urls.filter(u => /\/348s\.jpg$/.test(u)).length;
  return {urls, count: urls.length, places, bytes: thumbs * 20e3 + (urls.length - thumbs) * 70e3};
}
function jobHtml(k) {
  const j = JOBS[k];
  const tiles = k === 'tiles';
  // Without a tile key the maps draw from a file shipped with the app, so there is nothing to save.
  if (tiles && !tilesUsable()) return '';
  const plan = tiles ? tilePlan() : photoPlan();
  const last = (N.get(PLAN_KEY, {}) || {})[k];
  const z = zone();
  const desc = tiles
    ? `Street detail for ${[ 'Manhattan', 'LaGuardia', 'the drive between them', plan.hotel && 'your hotel’s blocks', plan.food && 'the food list’s neighborhoods' ].filter(Boolean).join(', ').replace(/, ([^,]*)$/, ' and $1')}, plus all of NYC zoomed out. ${fmtN(plan.count)} map tiles, about ${mbText(plan.bytes)}.`
    : plan.count ? `${fmtN(plan.count)} photos from ${N.plural(plan.places, 'place')}, about ${mbText(plan.bytes)}.` : 'The food list hasn’t loaded on this phone yet.';
  const extra = tiles ? (plan.dark ? 'Includes the dark map.' : 'Light map only. Save again in dark mode to add the dark map.') : '';
  let status = '', pct = null;
  if (j.running) {
    pct = j.total ? j.done / j.total : 0;
    status = `Saving ${fmtN(j.done)} of ${fmtN(j.total)}…`;
  } else if (j.msg === 'nosw') {
    status = 'Open nyc. from your Home Screen to save for offline.';
  } else if (j.msg === 'none') {
    status = 'Nothing to save yet.';
  } else if (j.msg === 'stalled') {
    const got = Math.max(0, j.done - j.failed);
    pct = j.total ? got / j.total : 0;
    status = `Stopped at ${fmtN(got)} of ${fmtN(j.total)} when the connection dropped. What’s saved stays saved.`;
  } else if (last && last.total) {

    status = `Saved ${when(last.at, z)}: ${fmtN(got)} of ${fmtN(last.total)}.${last.failed ? ` ${fmtN(last.failed)} missed. Try again with better signal.` : ''}`;
  }
  const off = !N.online();

  const label = j.running ? 'Saving…' : off ? 'Needs a connection' : j.msg === 'stalled' ? 'Carry on saving' : last ? (tiles ? 'Save maps again' : 'Save photos again') : (tiles ? 'Save NYC street maps' : 'Save food photos');
  return h`<div class="wl-job" id="wl-job-${k}">
    <div class="rw c"><span class="ic">${icon(tiles ? 'map-2' : 'photo')}</span><div class="grow"><b>${tiles ? 'NYC street maps' : 'Food photos'}</b><small>${desc}</small></div></div>
    ${extra ? h`<p class="help">${extra}</p>` : ''}
    ${pct != null ? h`<div class="wl-bar" role="progressbar" aria-label="${tiles ? 'Map tiles saved' : 'Photos saved'}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}"><i style="width:${Math.round(pct * 100)}%"></i></div>` : ''}
    ${status ? h`<p class="help" role="status">${status}</p>` : ''}
    <button class="btn wl-wide wl-gap" data-act="dsave" data-arg="${k}"${attr(disabled, ' aria-disabled="true"')}>${icon(off ? 'wifi-off' : 'download')}${label}</button>

}
const jobFrame = {};
function paintJob(k) {
  if (jobFrame[k]) return;
  const go = () => {
    jobFrame[k] = 0;
    const el = document.getElementById('wl-job-' + k);
    if (el) { try { el.outerHTML = String(jobHtml(k)); } catch (e) { N.report(e, 'wallet.js job'); } }
  };
  jobFrame[k] = window.requestAnimationFrame ? requestAnimationFrame(go) : setTimeout(go, 16);
}
async function paintUsage() {
  let u = null, bytes = null;
  try { u = N.sw && N.sw.usage ? await N.sw.usage() : null; } catch (e) { u = null; }
  if (u && u.usage != null) bytes = u.usage;
  if (bytes == null && navigator.storage && navigator.storage.estimate) {
    try { bytes = (await navigator.storage.estimate()).usage; } catch (e) { bytes = null; }
  }
  const el = document.getElementById('wl-d-use');

  const c = u && u.counts || null;
  const maps = tilesUsable() || !!(c && c['nyc-tiles']);
  const counts = c ? ` · ${maps ? `${fmtN(c['nyc-tiles'] || 0)} map tiles and ` : ''}${fmtN(c['nyc-photos'] || 0)} photos saved` : '';
  el.innerHTML = String(bytes == null
    ? h`<span>This browser doesn’t say how much storage the app uses.</span>`
    : h`<b>Using ${mbText(bytes)} on this phone</b><span>${counts ? counts.slice(3) + '. ' : ''}The phone keeps up to ${maps ? '3,000 map tiles and ' : ''}1,600 photos; the oldest go first when that fills up.</span>`);
}

// The hero line: when flights were last checked, and a warning once that's old.
function dataSub() {
  const f = safe(() => N.fresh(), {level: 'stale'});
  if (!f.at) return 'Flight status hasn’t been checked yet.';
  const late = f.level === 'stale' && safe(() => N.phase(), 'stay') !== 'after';
  return h`Last checked ${when(f.at, zone())} (<span data-ago="${f.at}">${N.ago(f.at)}</span>).${late ? ' Gates and times may have changed.' : ''}`;
}
function freshHtml() {
  const at = safe(() => N.data.status.checked_at, null);
  const f = safe(() => N.fresh(), {level: 'stale', window: null});
  const ms = N.meta.status || {};
  const off = !N.online();
  // Same cadence the strip uses (the cloud's own run.cadence_s when it is slower): 1, 10 or 60 min.
  const due = at ? T(at) + (+f.cadence || (f.window ? 600 : 3600)) * 1000 : 0;
  const next = due > N.now().getTime() ? ` Next check about ${N.time(new Date(due).toISOString(), zone())}.` : '';
  return h`${ms.error ? h`<div class="co rose">${icon('alert-triangle')}<span><b>Update failed.</b> Couldn’t reach the update service (${ms.error}). Showing what this phone saved.</span></div>` : ''}
    ${off ? h`<div class="co plain${ms.error ? ' wl-gap' : ''}">${icon('wifi-off')}<span><b>You’re offline.</b> Checks start again when you have signal.</span></div>` : ''}
    <button class="btn wl-wide${ms.error || off ? ' wl-gap' : ''}" data-act="refresh"${attr(off, ' aria-disabled="true"')}>${icon('refresh')}Check now</button>
    <p class="help">Flights are checked every minute in the 3 hours before takeoff, every 10 minutes on travel days and hourly otherwise.${next}</p>`;
}
const FILE_ROWS = [
  ['trip', 'plane', 'Flights & hotel', d => N.mline(N.plural((d.legs || []).length, 'flight'), d.updated_at && `updated ${N.date(d.updated_at, 'NYC')}`)],
  ['guide', 'building-airport', 'Airport guide', d => N.mline(N.plural(Object.keys(d.airports || {}).length, 'airport'), d.updated && `updated ${N.date(String(d.updated).length === 10 ? d.updated + 'T16:00:00Z' : d.updated, 'NYC')}`)],
  ['food', 'tools-kitchen-2', 'Food list', d => N.mline(N.plural((d.places || []).length, 'place'), d.collected_at && `collected ${N.date(d.collected_at, 'NYC')}`)],
];
function filesHtml() {
  const z = zone();
  return h`<div class="wl-card wl-rows">${FILE_ROWS.map(([n, ic, title, fn]) => {
    const d = N.data[n], m = N.meta.files[n], err = N.meta.files[n + '_error'];
    let detail = '', src = '';
    if (d) {
      detail = safe(() => fn(d), 'Loaded');
      src = m && m.source === 'network' ? `Downloaded ${when(m.at, z)}` : m && m.source === 'saved' ? 'Opened from this phone’s copy' : '';
      if (err) src = `Latest download failed (${err}); using the saved copy`;
    } else {
      detail = 'Not on this phone yet';
      src = err ? `Download failed (${err})` : !N.online() ? 'Needs a connection to download' : 'Downloading when the app next checks';
    }
    return h`<div class="rw c wl-r"><span class="ic">${icon(ic)}</span><div class="grow"><b>${title}</b><small>${detail}</small>${src ? h`<small>${src}</small>` : ''}</div><span class="dot${d ? (err ? ' neutral' : '') : ' stale'}" aria-label="${d ? 'Saved' : 'Missing'}"></span></div>`;
  })}</div>`;
}
// What works offline depends on which trip files this phone actually has; a file that never
// downloaded is listed as missing rather than promised.
const FILE_WORKS = [['trip', 'Flights, gates and leave times, as last checked'], ['guide', 'Airport guides and transit steps'], ['food', 'Food list and opening hours']];
const hasFile = n => !!safe(() => N.data[n], null);
const WORKS = () => [...FILE_WORKS.filter(([n]) => hasFile(n)).map(([, t]) => t),
  ...(tilesUsable() ? ['Food photos and street maps you’ve saved below or already viewed']
    : ['Maps of land, parks and main roads', 'Food photos you’ve saved below or already viewed']), 'Wallet, seats and notes'];
const MISSING = () => FILE_WORKS.filter(([n]) => !hasFile(n)).map(([, t]) => t.replace(/, as last checked$/, ''));
const NEEDS = ['New gate, delay and traffic checks', 'Directions in Apple Maps'];
const lc = t => t.charAt(0).toLowerCase() + t.slice(1);
function offHtml() {
  return h`<ul class="wl-list">${WORKS().map(t => h`<li>${icon('check')}<span>${t}</span></li>`)}${MISSING().map(t => h`<li class="no">${icon('alert-triangle')}<span>Not on this phone yet: ${lc(t)}</span></li>`)}${NEEDS.map(t => h`<li class="no">${icon('wifi-off')}<span>Needs signal: ${lc(t)}</span></li>`)}</ul>
    <p class="help">For directions with no signal, download New York in Apple Maps first: tap your picture, then Offline Maps.</p>`;
}
function saveHtml() {
  return h`<div class="stack">${jobHtml('photos')}${jobHtml('tiles')}</div>
    <div class="wl-use" id="wl-d-use"><span>Checking storage…</span></div>`;
}
N.screen('data', {
  back: 'today', nav: false, uses: ['trip', 'guide', 'food', 'status'], title: 'Data & updates', keepScroll: true,
  render() {
    const rise = firstPaint();
    return {
      hero: bar('This phone', 'refresh', 'Data & updates', dataSub(), 'wl-d-sub'),
      body: h`<div class="wl wl-d">
        ${sec('wl-d-fresh', '', freshHtml(), 0, rise)}
        ${sec('wl-d-files', 'Trip files', filesHtml(), 1, rise)}
        ${sec('wl-d-off', 'With no signal', offHtml(), 2, rise)}
        ${sec('wl-d-save', 'Save for offline', saveHtml(), 3, rise)}
      </div>`,
    };
  },
  mount() {
    paintUsage();
    const off = N.on('net', () => {
      fill('wl-d-sub', dataSub);
      fill('wl-d-fresh', freshHtml);
      fill('wl-d-files', filesHtml);
      Object.keys(JOBS).forEach(k => { if (!JOBS[k].running) paintJob(k); });
    });
    return off;
  },
  update() {
    fill('wl-d-sub', dataSub);
    fill('wl-d-fresh', freshHtml);
    fill('wl-d-files', filesHtml);
    fill('wl-d-off', offHtml);
    Object.keys(JOBS).forEach(k => { if (!JOBS[k].running) paintJob(k); });
  },
  actions: {
    async dsave(el, ev, ctx, k) {
      const j = JOBS[k];
      if (!j || j.running) return;
      if (k === 'tiles' && !tilesUsable()) return;
      if (!N.online()) { N.toast('Needs a connection'); return; }
      const urls = k === 'tiles' ? tilePlan().urls : photoPlan().urls;
      if (!urls.length) { j.msg = 'none'; paintJob(k); return; }
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
      const gen = (j.gen || 0) + 1;
      Object.assign(j, {running: true, done: 0, failed: 0, total: urls.length, msg: '', gen});
      paintJob(k);
      const record = (done, failed, total) => {
        const all = N.get(PLAN_KEY, {}) || {};
        all[k] = {at: N.now().toISOString(), done, failed, total};
        N.set(PLAN_KEY, all);
      };
      // The service worker posts progress as files arrive and has no timeout of its
      // own. If nothing arrives for a minute (signal gone, or iOS stopped the worker
      // while the app was in the background), stop showing "Saving…" so the button
      // works again. What it saved stays saved, and the next tap skips those files.
      let quiet = 0;
      const stall = () => {
        if (j.gen !== gen || !j.running) return;
        j.running = false; j.msg = 'stalled';
        const got = Math.max(0, j.done - j.failed);
        record(j.total, j.total - got, j.total);
        paintJob(k); paintUsage();
        N.toast('Saving stopped: the connection went quiet');
      };
      const arm = () => { clearTimeout(quiet); quiet = setTimeout(stall, STALL_MS); };
      arm();
      let res = null;
      try {
        res = N.sw && N.sw.prefetch ? await N.sw.prefetch(urls, k, m => {
          if (j.gen !== gen) return;   // a newer tap took over
          if (m && m.final) return;    // handled once the promise settles
          j.done = +m.done || 0; j.failed = +m.failed || 0; j.total = +m.total || j.total;
          if (!j.running && j.msg === 'stalled') { j.running = true; j.msg = ''; } // it picked up again
          arm();
          paintJob(k);
        }) : null;
      } catch (e) { res = null; }
      if (j.gen !== gen) return;
      clearTimeout(quiet);
      j.running = false;
      if (!res) { j.msg = 'nosw'; paintJob(k); return; }
      j.msg = '';
      const done = +res.done || j.done, failed = +res.failed || 0, total = +res.total || j.total;
      record(done, failed, total);
      paintJob(k);
      paintUsage();
      N.toast(failed ? `Saved ${fmtN(done - failed)} of ${fmtN(total)}` : k === 'tiles' ? 'Street maps saved for offline' : 'Food photos saved for offline');
    },
  },
});

// =====================================================================
// Add to Calendar
// =====================================================================
const AP = {PHX: ['Phoenix Sky Harbor International Airport', 'Phoenix'], CLT: ['Charlotte Douglas International Airport', 'Charlotte'],
  LGA: ['LaGuardia Airport', 'New York']};
const apName = c => { const g = safe(() => N.guideFor(c), null); return (g && g.name) || (AP[c] && AP[c][0]) || c; };
const apCity = c => (AP[c] && AP[c][1]) || c;
const termText = t => t && /^[A-Z0-9]{1,3}$/i.test(String(t)) ? `Terminal\u00a0${String(t).toUpperCase()}` : '';
const icsTime = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsEsc = s => str(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
// RFC 5545 line folding: at most 75 octets per line, continuation lines start with a space.
function fold(line) {
  const enc = new TextEncoder();
  const out = [];
  let cur = '', n = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (n + b > 75) { out.push(cur); cur = ' '; n = 1; }
    cur += ch; n += b;
  }
  out.push(cur);
  return out.join('\r\n');
}
function calPlan() {
  const now = N.now().getTime();
  const inc = [], out = [];
  // A flight whose day has gone by at its airport, for flights with no times to go on.
  const past = l => !!l.date && l.date < N.ymd(N.now(), l.from || 'NYC');
  for (const l of legs()) {
    const dep = l.dep && l.dep.sched, arr = l.arr && l.arr.sched;
    const timed = dep && arr && Number.isFinite(T(dep)) && Number.isFinite(T(arr));
    const gone = timed ? T(arr) < now : past(l);
    if (gone) out.push({l, why: timed && l.confirmed !== false ? 'flown' : 'past'});
    else if (l.confirmed === false) out.push({l, why: 'unconfirmed'});
    else if (!timed) out.push({l, why: 'notimes'});
    else inc.push(l);
  }
  return {inc, out};
}
// One event per flight. Only flight facts go in: never names, codes or seats.
const fno = l => N.flightNo(l).replace(/\u00a0/g, ' ');
function buildIcs(list) {
  const stamp = icsTime(N.now());
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//nyc.//Trip flights//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for (const l of list) {
    const dT = termText(l.dep.terminal).replace(/\u00a0/g, " "), aT = termText(l.arr.terminal).replace(/\u00a0/g, " ");
    const desc = [
      `American Airlines ${fno(l)}, ${apCity(l.from)} (${l.from}) to ${apCity(l.to)} (${l.to}).`,
      `Departs ${N.time(l.dep.sched, l.from)} ${apCity(l.from)} time${dT ? ` from ${dT}` : ''}. Arrives ${N.time(l.arr.sched, l.to)} ${apCity(l.to)} time${aT ? ` at ${aT}` : ''}.`,
      'Gates change often: check the nyc. app or the American Airlines app before you head to the gate.',
    ].join('\n');
    L.push('BEGIN:VEVENT',
      `UID:${icsEsc(`${l.id}-${N.ymd(l.dep.sched, l.from).replace(/-/g, '')}-${l.flight}`)}@nyc-trip`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${icsTime(l.dep.sched)}`,
      `DTEND:${icsTime(l.arr.sched)}`,
      `SUMMARY:${icsEsc(`${fno(l)} ${l.from} → ${l.to}`)}`,
      `LOCATION:${icsEsc(`${apName(l.from)} (${l.from})${dT ? `, ${dT}` : ''}`)}`,
      `DESCRIPTION:${icsEsc(desc)}`,
      'STATUS:CONFIRMED', 'TRANSP:OPAQUE',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`${fno(l)} to ${l.to} leaves in 24 hours`)}`, 'TRIGGER:-PT24H', 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`${fno(l)} to ${l.to} leaves in 3 hours. Check the gate in nyc.`)}`, 'TRIGGER:-PT3H', 'END:VALARM',
      'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}
const listText = a => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`;
// Why flights are missing from the file. Each line opens with a bold lead and names
// flights by number; the list above already shows their routes.
function leftOutLines(out) {
  const by = why => out.filter(o => o.why === why).map(o => o.l);
  const un = by('unconfirmed'), nt = by('notimes'), fl = by('flown'), gone = by('past');
  const nos = ls => listText(ls.map(N.flightNo));
  const days = ls => listText([...new Set(ls.map(legDay))].filter(d => d && d !== '—'));
  const one = ls => ls.length === 1;
  const rows = [];
  if (fl.length) rows.push(['Left out:', `${nos(fl)} already flew.`]);
  if (gone.length) {
    const d = days(gone);
    rows.push(['Left out:', `${nos(gone)} ${d ? `${one(gone) ? 'was' : 'were'} on ${d}` : `${one(gone) ? 'is' : 'are'} in the past`}.`]);
  }
  if (un.length) {
    const d = days(un);
    const who = !one(un) && un.every(l => l.dir === 'ret') ? `The flights home (${nos(un)}${d ? `, ${d}` : ''})` : `${nos(un)}${d ? ` (${d})` : ''}`;
    rows.push(['Not included yet:', `${who} ${one(un) ? 'isn’t' : 'aren’t'} confirmed. Come back once ${one(un) ? 'it is' : 'they are'}.`]);
  }
  if (nt.length) rows.push(['Left out:', `${nos(nt)} ${one(nt) ? 'has' : 'have'} no scheduled times yet.`]);
  return rows.map(([b, t]) => h`<b>${b}</b> ${t}`);
}
const leftOutHtml = out => leftOutLines(out).map(t => h`<div class="co plain">${icon('info-circle')}<span>${t}</span></div>`);
let CAL = {text: ''};
N.screen('calendar', {
  back: 'today', nav: false, uses: ['trip', 'guide', 'status'], title: 'Add to Calendar',
  render() {
    const rise = firstPaint();
    const hasTrip = !!N.data.trip;
    const {inc, out} = calPlan();
    CAL = {text: inc.length ? safe(() => buildIcs(inc), '') : '', n: inc.length};
    const t = N.data.trip;
    const asOf = t && t.updated_at ? N.date(t.updated_at, 'NYC') : null;
    const events = inc.map(l => h`<div class="rw c wl-r"><span class="ic">${icon('plane-departure')}</span><div class="grow">
      <b>${legName(l)}</b><small>${N.mline(legDay(l), `${N.time(l.dep.sched, l.from)} → ${N.time(l.arr.sched, l.to)} local`)}</small>
      <small>${apName(l.from)}${termText(l.dep.terminal) ? `, ${termText(l.dep.terminal)}` : ''}</small></div></div>`);
    const add = !hasTrip
      ? h`<div class="co plain">${icon('info-circle')}<span><b>Trip not loaded yet.</b> Your flights appear here once it has loaded on this phone.</span></div>`
      : inc.length
        ? h`<div class="wl-card wl-rows">${events}</div><p class="help">Each flight gets an alert the day before and 3 hours before.</p>`
        : h`<div class="wl-card wl-empty"><b>Nothing to add right now</b>${(out.length ? leftOutLines(out) : ['There are no upcoming flights with scheduled times.']).map(t => h`<p>${t}</p>`)}</div>`;
    return {
      hero: bar('Flights', 'calendar-plus', 'Add to Calendar'),
      body: h`<div class="wl wl-c">
        ${inc.length ? h`<section class="sec${rise ? ' rise' : ''}">
          <a class="btn wl-wide" id="wl-ics" href="#calendar" download="nyc-flights.ics" type="text/calendar" aria-disabled="true">${icon('calendar-plus')}Add ${N.plural(inc.length, 'flight')} to Calendar</a>
          <button class="btn alt wl-wide wl-gap" id="wl-ics-share" data-act="cshare" hidden>${icon('share')}Share the calendar file</button>
          <p class="help">When Calendar opens, tap Add All. If a file downloads instead, open nyc-flights.ics in the Files app.</p>
        </section>` : ''}
        ${sec('wl-c-what', 'What gets added', add, 1, rise)}
        ${out.length && inc.length ? h`<div class="stack8 wl-gap${rise ? ' rise' : ''}" style="animation-delay:90ms">${leftOutHtml(out)}</div>` : ''}
        ${inc.length ? sec('wl-c-know', 'Good to know', h`<div class="wl-card wl-rows">
          <div class="rw c wl-r"><span class="ic">${icon('alert-triangle')}</span><div class="grow"><b>Calendar won’t update itself</b><small>Gate changes and delays show here, not in Calendar.</small></div></div>
          <div class="rw c wl-r"><span class="ic">${icon('calendar')}</span><div class="grow"><b>Scheduled times${asOf ? ` as of ${asOf}` : ''}</b><small>If the schedule changes, delete these events and add them again.</small></div></div>
        </div>`, 3, rise) : ''}
      </div>`,
    };
  },
  mount(ctx, view) {
    const a = N.$('#wl-ics', view);
    if (!a || !CAL.text) return null;
    let url = null;
    try { url = URL.createObjectURL(new Blob([CAL.text], {type: 'text/calendar;charset=utf-8'})); } catch (e) { url = null; }
    if (!url) return null;
    a.href = url;
    a.removeAttribute('aria-disabled');
    const share = N.$('#wl-ics-share', view);
    try {
      const file = new File([CAL.text], 'nyc-flights.ics', {type: 'text/calendar'});
      if (share && navigator.canShare && navigator.canShare({files: [file]})) share.hidden = false;
    } catch (e) { /* sharing files not supported */ }

  },
  actions: {
    async cshare() {

  },
});
})();
