<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/intertight.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format("woff2");font-weight:800;font-display:swap}
/* tokens.css */
/* Colour tokens. Light on :root, dark under the system preference unless the
   viewer forced light, and dark again when the viewer forced dark. */
:root{
  color-scheme:light;
  --page:#FDFDFD;--sheet:#FDFDFD;--band:#779995;--cr:#F2EEE1;--sd:#EDDBC6;--sdt:#16191A;
  --ro:#C4686B;--rog:#FDFDFD;--rot:#A4474B;--ink:#16191A;--mu:#5F6764;
  --gh:rgba(22,25,26,.28);--ln:rgba(22,25,26,.10);--ok:#2F7D5B;--tile:#FDFDFD;
  --nav:#FDFDFD;--navb:rgba(22,25,26,.06);--navs:0 10px 30px rgba(22,25,26,.12);--navi:#5F6764;
  --pill:#4A706D;--pillt:#FDFDFD;--eb:#4A706D;--ob:#FDFDFD;--obt:#16191A;--ht:rgba(22,25,26,.13);
  --s1:#E4D3BC;--s2:#CDB89C;--s3:#A9916F;--s4:#7E6A50;
  --rob:#C4686B;--robt:#16191A;--onband:rgba(253,253,253,.24);--onband2:rgba(253,253,253,.2);
  --scrim:rgba(22,25,26,.0);
  --warn:#B7791F;--obm:rgba(22,25,26,.86);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#121514;--sheet:#1A1E1D;--band:#2E4A47;--cr:#25241F;--sd:#3A3127;--sdt:#F3E2CC;
    --ro:#E3979A;--rog:#16191A;--rot:#E3979A;--ink:#EEEBE2;--mu:#A4ACA9;
    --gh:rgba(238,235,226,.20);--ln:rgba(255,255,255,.08);--ok:#63C496;--tile:#2B2E2A;
    --nav:#222826;--navb:rgba(255,255,255,.06);--navs:0 10px 30px rgba(0,0,0,.4);--navi:#A9B2AF;
    --pill:#9CC0BC;--pillt:#121514;--eb:#9CC0BC;--ob:#EEEBE2;--obt:#EEEBE2;--ht:rgba(238,235,226,.16);
    --s1:#4A4134;--s2:#6B5D49;--s3:#8E7B60;--s4:#B49F80;
    --rob:#E3979A;--robt:#16191A;--onband:rgba(253,253,253,.14);--onband2:rgba(253,253,253,.12);
    --warn:#E0B25C;--obm:rgba(238,235,226,.74);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121514;--sheet:#1A1E1D;--band:#2E4A47;--cr:#25241F;--sd:#3A3127;--sdt:#F3E2CC;
  --ro:#E3979A;--rog:#16191A;--rot:#E3979A;--ink:#EEEBE2;--mu:#A4ACA9;
  --gh:rgba(238,235,226,.20);--ln:rgba(255,255,255,.08);--ok:#63C496;--tile:#2B2E2A;
  --nav:#222826;--navb:rgba(255,255,255,.06);--navs:0 10px 30px rgba(0,0,0,.4);--navi:#A9B2AF;
  --pill:#9CC0BC;--pillt:#121514;--eb:#9CC0BC;--ob:#EEEBE2;--obt:#EEEBE2;--ht:rgba(238,235,226,.16);
  --s1:#4A4134;--s2:#6B5D49;--s3:#8E7B60;--s4:#B49F80;
  --rob:#E3979A;--robt:#16191A;--onband:rgba(253,253,253,.14);--onband2:rgba(253,253,253,.12);
  --warn:#E0B25C;--obm:rgba(238,235,226,.74);
}

/* Colour rules: rose (--ro/--rot) only means at risk, late, cancelled, closed or
   destructive. Positive, open and "now" use --eb; caution and "opens later" use
   --warn; selected or recommended uses ink or band. On the band, primary text is
   --ob, secondary --obm, tertiary --obt; no white text under 18px on the band. */

/* Spacing, type, radius and icon scales. Snap to these in any selector you
   touch; there is no sweeping migration. */
:root{
  --sp-1:4px;--sp-1h:6px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;--sp-9:48px;
  --gutter:20px;
  /* font shorthands: font:var(--t-body) */
  --t-cap:800 12px/1.3 Inter,system-ui,sans-serif;--t-meta:600 13px/1.35 Inter,system-ui,sans-serif;--t-body:400 15px/1.45 Inter,system-ui,sans-serif;
  --t-row:800 17px/1.25 Inter,system-ui,sans-serif;--t-sec:800 22px/1.2 Inter,system-ui,sans-serif;--t-hl:300 32px/1.1 Inter,system-ui,sans-serif;
  --d1:96px;--d2:64px;--d3:44px;
  --r-sm:12px;--r-md:16px;--r-lg:24px;--r-sheet:28px;--r-pill:999px;
  --i-sm:16px;--i-md:20px;--i-lg:24px;
  --ease:cubic-bezier(.32,.72,0,1);--press:.12s;
}

/* base.css */
/* Shell, type and shared components. Visual spec: the approved Compound-style
   mockups (widget_v4). Sizes are px to match the spec at 390pt wide. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--band);color:var(--ink);font:15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--eb);outline-offset:2px}
/* Long-pressing a control never selects its text or opens the iOS callout. */
:is(button,a,.chip,.tile,.op,.nv){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Icons: inline sprite, <svg class="i"><use href="#i-name"/></svg> */
.i{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.125em;overflow:visible}

/* ---------- Shell ---------- */
#app{position:fixed;inset:0;background:var(--band);overflow:hidden}
#view{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:manipulation;
  background:var(--page);transform-origin:50% 0;
  transition:transform .56s cubic-bezier(.32,.72,0,1),border-radius .56s cubic-bezier(.32,.72,0,1),background .3s}
#view[data-tone="cream"]{background:var(--cr)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.tb{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  flex:none;background:var(--band);color:var(--ob);transition:background .3s,color .3s,opacity .3s,box-shadow .2s}
/* Pulling down at the top shows more top-bar colour, never the page behind it. */
.tb::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:100vh;background:inherit;pointer-events:none}
#view[data-tone="cream"] .tb{color:var(--ink)}
.tbb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:14px}
.tb :is(.tbb,.av){transition:opacity .2s,scale var(--press) var(--ease)}
.wm{font-family:Figtree,Inter,system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:inherit;padding:7px 10px;margin:-7px -10px;border-radius:14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;position:relative}
.tb .av::after{content:'';position:absolute;inset:-3px}
/* Holds the wallet button's place on Wallet itself, so the wordmark stays centred. */
.av-sp{width:38px;height:38px;flex:none}
#view[data-tone="cream"] .av{background:var(--sheet)}

#strip:empty{display:none}
/* 6px here plus the 6px under the 44px top-bar buttons keeps the strip 12px clear of them. */
#strip{flex:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--band);color:var(--obt);padding-top:6px;padding-bottom:8px}
#view[data-tone="cream"] #strip{color:var(--ink)}
.strip{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 14px;border-radius:14px;background:var(--onband);
  color:inherit;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap}
.strip .i{font-size:16px}
.strip b{flex:none;font-weight:800}
.strip.off .i{color:var(--rot)}
#strip button::after{content:'';position:absolute;inset:0 0 -8px}
/* Once content runs under the top bar it gets an edge, under the strip when one shows. */
#strip{transition:box-shadow .2s}
#view.scrolled:has(#strip:empty) .tb,#view.scrolled #strip:not(:empty){box-shadow:0 1px 0 rgb(0 0 0/.06),0 10px 16px -14px rgb(0 0 0/.35)}

.hero{position:relative;flex:none;background:var(--band);color:var(--ob);min-height:40px;padding-bottom:48px;overflow:hidden}
.hero:empty{min-height:40px;padding-bottom:0}
.sheet{position:relative;z-index:1;flex:1 0 auto;min-height:0;background:var(--sheet);border-radius:28px 28px 0 0;margin-top:-28px;padding-top:22px;
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
/* Sheet top to first content is always the 22px padding. */
.sheet>:first-child,.sheet>.sec:first-child,.sheet>:first-child>.sec:first-child{margin-top:0}
#view[data-tone="cream"] .hero{display:none}
#view[data-tone="cream"] .sheet{background:transparent;margin-top:0;border-radius:0;padding-top:16px}
#view.nonav .sheet{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
/* Content fades out under the floating tab bar instead of showing around and below it. */
#view::after{content:'';position:fixed;z-index:7;left:0;right:0;bottom:0;height:calc(90px + env(safe-area-inset-bottom,0px));pointer-events:none;
  background:linear-gradient(to top,var(--sheet) 35%,transparent);transition:opacity .3s}
#view[data-tone="cream"]::after{background:linear-gradient(to top,var(--cr) 35%,transparent)}
/* A full-bleed map (Food's map view) runs to the bottom edge and keeps its own colour there. */
#view.nonav::after,#view.fd-mapon::after,#app.mo #view::after{opacity:0}

/* Floating nav */
.nv{position:fixed;z-index:8;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;max-width:520px;margin:0 auto;background:var(--nav);border-radius:33px;
  border:1px solid var(--navb);box-shadow:var(--navs);padding:6px;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s}
.nv.off{transform:translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
.nvi{position:relative;display:flex;height:100%}
.nvp{position:absolute;top:0;bottom:0;left:0;right:80%;border-radius:27px;background:var(--pill)}
.nvp.none{opacity:0}
.nv button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--navi);position:relative;z-index:1;transition:color .3s,scale var(--press) var(--ease),opacity var(--press);border-radius:27px}
.nv button .i{font-size:22px}
.nv button[aria-current]{color:var(--pillt)}

/* Side menu (sits on the band behind the view) */
#menu{position:absolute;inset:0;color:var(--obt);padding-top:env(safe-area-inset-top,0px);overflow-y:auto;visibility:hidden;touch-action:pan-y;
  pointer-events:none;transition:visibility 0s .3s}
#app.mo #menu{visibility:visible;pointer-events:auto;transition:none}
#app.mo #view{transform:translateY(calc(100% - 132px - env(safe-area-inset-bottom,0px)));border-radius:28px 28px 0 0;overflow:hidden;cursor:pointer;
  box-shadow:0 -12px 40px rgba(0,0,0,.12);touch-action:none}
#app.mo #view .tb{opacity:1;pointer-events:none}
#app.mo #view .tb :is(.tbb,.av){opacity:0}
#app.mo #view #strip>*{visibility:hidden}
#app.mo .nv{transform:translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
.mhd{display:flex;align-items:center;justify-content:space-between;height:56px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbody{padding-top:14px}
.mme{display:flex;align-items:center;gap:var(--sp-4)}
.mme .av{width:64px;height:64px;font-size:28px}
.mme b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.mme small{display:block;margin-top:2px;font-size:15px;color:var(--obm)}
.mrows{margin-top:var(--sp-5)}
.smr{opacity:0;transform:translateX(-18px);transition:opacity .3s,transform .56s cubic-bezier(.32,.72,0,1)}
#app.mo .smr{opacity:1;transform:none}
.mr{display:flex;align-items:center;gap:14px;min-height:56px;width:calc(100% + 20px);margin:0 -10px;padding:0 10px;border-radius:16px;color:var(--obt)}
.mi{width:36px;height:36px;border-radius:12px;background:var(--onband2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.mt{flex:1;font-size:17px;font-weight:600;line-height:1.2}.mt small{display:block;font-size:13px;font-weight:400;color:var(--obm)}
.mr>.i{font-size:18px}

/* ---------- Type ---------- */
.ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eb);font-weight:800}
.hero .ey,.on-band .ey{color:var(--obt)}
.dp{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.02em}
.tn,.chip,.tile b,small time,[data-k]{font-variant-numeric:tabular-nums}
.ey .tn{text-transform:none}
.hl{margin:6px 0 0;font-size:32px;line-height:1.06;font-weight:300;letter-spacing:-.02em}.hl b{font-weight:800}
.h2{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin-top:6px}
.mu{color:var(--mu)}
.small{font-size:13px}
.help{font-size:13px;color:var(--mu)}
.tbd{font-size:15px;font-weight:600;color:var(--mu)}
.sec{margin-top:22px}
.sec>.ey:first-child{margin-bottom:10px}
.stack>*+*{margin-top:12px}
.stack8>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Line breaks: headings balance and body text avoids a one-word last line. Wrap each
   ' · ' meta part in .nw so a separator never ends a line. */
h1,h2,h3,.dp,.hl,.h2,.cx-sum,[class$=-ttl]{text-wrap:balance}
p,small,.mu,.sub{text-wrap:pretty}
.nw{white-space:nowrap}

/* ---------- Components ---------- */
.card{border-radius:26px;padding:20px;position:relative;overflow:hidden;background:var(--cr)}
.card.sand{background:var(--sd);color:var(--sdt);--eb:var(--sdt);--mu:var(--sdt)}
.card.line{background:transparent;border:1.5px solid var(--ln)}
.card.rose{background:var(--rob);color:var(--robt);--eb:var(--robt);--mu:var(--robt)}
.card.tight{padding:14px 16px;border-radius:20px}
.il{position:absolute;pointer-events:none}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.lk{stroke:var(--ob);stroke-opacity:.34;fill:none}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;font-size:13px;font-weight:600;background:var(--sheet);color:var(--ink);white-space:nowrap;text-decoration:none;max-width:100%}
.chip .i{font-size:16px}
.chip.warn{background:transparent;border:1.5px solid var(--warn);color:var(--ink)}.chip.warn .i{color:var(--warn)}
.chip.rose{background:var(--rob);color:var(--robt)}
.chip.dk2{background:var(--ink);color:var(--page)}
.chip.cr{background:var(--cr)}
.chip.ghost{background:transparent;border:1.5px solid var(--ln)}
.chip.ob{background:var(--onband);color:var(--obt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.neutral{background:var(--mu)}.dot.stale,.dot.warn{background:var(--ro)}

.fab{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tile{background:var(--tile);border-radius:18px;padding:11px 13px;min-width:0;position:relative}
.tile small{display:block;font-size:13px;color:var(--mu)}
.tile b{display:block;font-size:22px;font-weight:800;margin:2px 0 1px}
.tile.ring{box-shadow:inset 0 0 0 2px var(--ro)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.rw{display:flex;gap:12px;align-items:flex-start;min-width:0}
.rw.c{align-items:center}
.rw>div{min-width:0}
.ic{width:40px;height:40px;border-radius:13px;background:var(--cr);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.card .ic{background:var(--sheet)}
.rw b{display:block;font-size:15px;font-weight:800}
.rw small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.box{background:var(--sheet);border-radius:18px;padding:10px 12px}

.cn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cn>div{background:var(--cr);border-radius:16px;padding:10px 11px;min-width:0}
.cn small{display:block;font-size:12px;color:var(--mu);font-weight:600}
.cn b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .w{box-shadow:inset 0 0 0 1.5px var(--ro)}.cn .w b{color:var(--rot)}

.ps{display:inline-flex;padding:4px;border-radius:22px;background:var(--onband);gap:2px}
.ps button{height:34px;padding:0 16px;border-radius:17px;font-size:14px;font-weight:800;color:var(--obt);display:flex;align-items:center;transition:background .3s,color .3s,scale var(--press) var(--ease),opacity var(--press)}
.ps button[aria-pressed="true"]{background:var(--sheet);color:var(--ink)}
.seg{display:inline-flex;padding:4px;border-radius:22px;background:var(--cr);gap:2px;white-space:nowrap}
.seg button{height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:700;color:var(--mu);display:flex;align-items:center;gap:6px;transition:background .3s,color .3s,scale var(--press) var(--ease),opacity var(--press)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

/* Callouts read as text: regular weight, with any lead phrase in <b>. */
.co{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:11px 14px;font-size:13px;font-weight:400;line-height:1.45;background:var(--sd);color:var(--sdt)}
.co b{font-weight:700}
.co .i{font-size:18px;margin-top:0}
.co.rose{background:var(--rob);color:var(--robt)}
.co.plain{background:var(--cr);color:var(--ink)}
.op{background:var(--cr);border-radius:20px;padding:9px 12px}
.mta{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.hatch{background:repeating-linear-gradient(135deg,var(--ht) 0 4px,transparent 4px 8px)}

/* Sideways rows stop at their ends instead of dragging the page, settle on an item and
   show no scrollbar. The snap inset matches each row's left padding so it rests where
   it starts. Screen CSS may restyle these rows but should keep this. */
:is(.fd-chips,.ap-jump,.na-chips,.pl-dishes,.fd-acs){scroll-snap-type:x proximity;overscroll-behavior-x:contain;scrollbar-width:none;scroll-padding-inline:20px}
:is(.fd-chips,.ap-jump,.na-chips,.pl-dishes,.fd-acs)::-webkit-scrollbar{display:none}
:is(.fd-chips,.ap-jump,.na-chips,.pl-dishes,.fd-acs)>*{scroll-snap-align:start}
:is(.fd-chips,.fd-acs){scroll-padding-inline:calc(max(20px,env(safe-area-inset-left,0px)) - 3px)}
.fd-mtop .fd-chips{scroll-padding-inline:13px}
.na-chips{scroll-padding-inline:16px}

/* Banners */
.bn{border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--rob);color:var(--robt)}
.bn .i{font-size:20px;margin-top:1px}
.bn b{display:block;font-size:15px;font-weight:800}
.bn span{display:block;font-size:13px;font-weight:600}
.bn .bx{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.bn .bx .chip{height:30px;background:rgba(22,25,26,.12);color:inherit}
.bn.neutral{background:var(--cr);color:var(--ink)}
.bn.neutral .bx .chip{background:var(--sheet)}

/* Forms */
.fld{display:block}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
.inp{display:block;width:100%;height:50px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sheet);padding:0 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--eb)}
.inp.bad{border-color:var(--ro)}
.err{font-size:13px;font-weight:600;color:var(--rot);margin:6px 0 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;background:var(--ink);color:var(--page);font-weight:700;font-size:15px}
.btn.alt{background:var(--cr);color:var(--ink)}
.btn.rose{background:var(--ro);color:var(--rog)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--cr);color:var(--ink);flex:none}

/* Toast */
#toast{position:fixed;z-index:20;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;
  background:var(--ink);color:var(--page);font-size:14px;font-weight:600;padding:10px 16px;border-radius:18px;pointer-events:none;
  transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1);width:max-content;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Pressed states. Controls shrink and dim slightly; rows and cards tint instead so
   wide things never visibly shrink. Maps, drag tracks and scrims keep their own
   feedback. iOS only applies :active because core.js listens for touchstart. */
:where(button,a[href],[data-act]){transition:scale var(--press) var(--ease),opacity var(--press)}
:where(button,a[href],[data-act]):not(:where(.leaflet-container *,.ap-mv,.ap-mv *,.pl-lb-track,.pl-lb-track *,.fd-scrim,.na-grab,.tr-mapa,.pl-mapa,[disabled],[aria-disabled="true"])):active{scale:.97;opacity:.82}
:is(button,a[href]):is(.op,.tr-op,.na-row,.na-li,.na-card,.fd-card,.td-mini,.td-row,.td-legs,.td-stale,.wl-cb,.wl-card,.wl-addrow,.wl-link,.ap-step,.ap-gr,.ap-fl,.ap-lk,.ap-tr,.ap-call,.tr-pill,.tr-place,.tr-lk,.fx-row,.fl-tk,.fl-cx,.fl-tbc,.card,.bn,.co,.tile,.mr,.strip):active{
  scale:none;opacity:1;background-image:linear-gradient(color-mix(in srgb,var(--ink) 6%,transparent),color-mix(in srgb,var(--ink) 6%,transparent))}
/* Gallery photos sit in a sideways snap row: they dim but never shrink, so a swipe
   that starts on one doesn't make it jump. */
.pl-ph:active{scale:none}

/* Motion helpers */
.sw{transition:transform .56s cubic-bezier(.32,.72,0,1),opacity .26s ease}
/* A value that just changed gets a soft tint that fades. */
@keyframes flash{0%,40%{background-color:color-mix(in srgb,var(--eb) 18%,transparent)}100%{background-color:transparent}}
.chg{animation:flash 2.4s ease-out 1;border-radius:6px;padding:0 3px;margin:0 -3px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.32,.72,0,1) both}
.skel{background:var(--cr);border-radius:12px;color:transparent!important}

#__err{position:fixed;z-index:99;left:8px;right:8px;top:8px;background:#B00020;color:#fff;font:12px/1.3 ui-monospace,monospace;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
  :where(button,a[href],[data-act]):active{scale:none}
  .chg{animation:none;background-color:color-mix(in srgb,var(--eb) 18%,transparent)}
}

/* screens/_illo.css */
/* Airport hero art from N.airportIllo (_illo.js). Roots: .ax (the art) and
   .ap-hero (placement). Strokes and fills are the band mixed toward the
   on-band white: --a1 62%, --a2 34%, --a3 17%. Fixed hex first; color-mix
   (iOS 16.2+) replaces it where supported, so older phones never get an
   unresolvable var() and lose the drawing. */
.ax{--a1:#CAD7D5;--a2:#A5BBB8;--a3:#8EAAA7}
@supports not (color:color-mix(in srgb,red 50%,blue)){
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ax{--a1:#A5AEA7;--a2:#6F817C;--a3:#4F6561}}
  :root[data-theme="dark"] .ax{--a1:#A5AEA7;--a2:#6F817C;--a3:#4F6561}
}
@supports (color:color-mix(in srgb,red 50%,blue)){
  .ax{--a1:color-mix(in srgb,var(--ob) 62%,var(--band));--a2:color-mix(in srgb,var(--ob) 34%,var(--band));--a3:color-mix(in srgb,var(--ob) 17%,var(--band))}
}
.ax .p{stroke:var(--a1)}
.ax .s{stroke:var(--a2)}
.ax .pk{stroke:var(--a1);fill:var(--band)}
.ax .f1{fill:var(--a3)}

/* Beside the big code, ground line (y=88 of 100) on the code's baseline. Overrides
   the older .ap-il size cap; the frame bleeds into the right gutter. */
.ap-hero .ap-il.ax{top:108px;right:-16px;width:130px;height:83px;max-width:none;aspect-ratio:auto;overflow:hidden}

/* screens/_route.css */
/* N.route: MTA route bullets and the station labels N.route.draw() puts on a map */
.rt-b{position:relative;display:inline-grid;place-items:center;flex:none;box-sizing:border-box;width:1.5em;height:1.5em;border-radius:50%;
  background:var(--rb,#7C858C);color:var(--rt,#FFF);font-weight:700;font-size:.8em;line-height:1;letter-spacing:-.02em;vertical-align:-.35em;
  font-variant-numeric:tabular-nums}
.rt-b>span{position:relative}
.rt-bw{width:auto;min-width:1.5em;padding:0 .42em;border-radius:.75em;font-size:.72em;height:1.66em}
.rt-bd{background:none}
.rt-bd::before{content:"";position:absolute;inset:.22em;border-radius:.12em;background:var(--rb,#7C858C);transform:rotate(45deg)}
.rt-bs{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}

/* map labels: Leaflet divIcons with a zero-size anchor, the pill sits beside the station dot */
.rt-lblw{background:none;border:0}
.rt-lbl{position:absolute;left:11px;top:0;transform:translateY(-50%);display:inline-flex;align-items:center;gap:5px;max-width:190px;
  padding:3px 9px 3px 3px;border-radius:999px;background:var(--sheet);color:var(--ink);font-size:12px;font-weight:650;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.1)}
.rt-lbl .rt-b{font-size:13px;vertical-align:0}
.rt-lbl-l{left:auto;right:11px}
.rt-lbl-ur,.rt-lbl-ul{top:auto;bottom:8px;transform:none}
.rt-lbl-dr,.rt-lbl-dl{top:8px;transform:none}
.rt-lbl-ur,.rt-lbl-dr{left:6px}
.rt-lbl-ul,.rt-lbl-dl{left:auto;right:6px}
.rt-lbl-t{padding:4px 9px}
.rt-ln{overflow:hidden;text-overflow:ellipsis;min-width:0}

/* screens/airmap.css */
/* airmap: the airport map card. The map paints its own floors; this styles the frame, attribution and the Leaflet fallback. */
.am{position:relative;overflow:hidden;isolation:isolate;background:var(--page);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
.am>.am-map{position:absolute;inset:0;background:inherit}
.am[data-theme="light"]{background:#E6E9E4}
.am[data-theme="dark"]{background:#121514}
.am .maplibregl-canvas{outline:none}
.am .maplibregl-canvas-container.maplibregl-interactive{cursor:default}
.am-attr{position:absolute;right:4px;bottom:3px;z-index:5;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--mu);padding:1px 5px;border-radius:6px;
  background:rgba(230,233,228,.86)}
.am[data-theme="dark"] .am-attr{background:rgba(18,21,20,.86)}
.am-attr:empty{display:none}

/* Leaflet fallback (no WebGL): DOM labels, 12px minimum */
.am-lf{font-family:Inter,system-ui,sans-serif;z-index:0}
.am-lf.leaflet-container{background:transparent;outline:0}
.am-lf .leaflet-div-icon{background:none;border:0}
.am-m{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap}
.am-gt{display:block;font:600 12px/1 Inter,system-ui,sans-serif;color:var(--am-label);letter-spacing:-.01em;
  text-shadow:0 0 2px var(--am-halo),0 0 2px var(--am-halo),0 0 3px var(--am-halo),0 0 4px var(--am-halo)}
.am-al{display:block;transform:translate(-50%,-50%);font:500 12px/1.15 Inter,system-ui,sans-serif;color:var(--am-label-mu);
  text-align:center;max-width:100px;white-space:normal;text-shadow:0 0 2px var(--am-halo),0 0 3px var(--am-halo)}
.am-cl{display:block;transform:translate(-50%,-50%);font:700 22px/1 Inter,system-ui,sans-serif;color:var(--am-conc);
  text-shadow:0 0 3px var(--am-halo),0 0 4px var(--am-halo)}
.am-cl.sm{font-size:12px;letter-spacing:.12em}
.am-poi{position:relative;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--c);pointer-events:auto;
  box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.am-poi svg{width:14px;height:14px}
.am-poi b{position:absolute;left:28px;top:5px;font:500 12px/1 Inter,system-ui,sans-serif;color:var(--am-label);
  text-shadow:0 0 2px var(--am-halo),0 0 3px var(--am-halo)}
.am-pl{position:absolute;width:var(--am-plane,40px);height:var(--am-plane,40px);left:calc(var(--am-plane,40px) / -2);
  top:calc(var(--am-plane,40px) / -2)}
.am-pl svg{width:100%;height:100%;display:block}
.am-pin{position:relative;transform:translate(-50%,calc(-100% - 6px));font:650 13.5px/28px Inter,system-ui,sans-serif;height:28px;
  padding:0 10px;border-radius:14px;background:var(--am-pin);color:var(--am-pin-t);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.am-pin:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;
  border-top-color:var(--am-pin)}
.am-dot{position:relative;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);border-radius:50%;
  background:#fff;box-shadow:inset 0 0 0 var(--r) var(--am-route),0 1px 3px rgba(0,0,0,.25)}
.am-dot b{position:absolute;left:calc(var(--s) + 6px);top:50%;transform:translateY(-50%);font:600 12px/1 Inter,system-ui,sans-serif;
  color:var(--am-label);text-shadow:0 0 2px var(--am-halo),0 0 3px var(--am-halo),0 0 4px var(--am-halo)}
.am-dot.am-lL b{left:auto;right:calc(var(--s) + 6px)}
.am-dot.am-lB b,.am-dot.am-lT b{left:50%;transform:translateX(-50%)}
.am-dot.am-lB b{top:calc(var(--s) + 4px)}
.am-dot.am-lT b{top:auto;bottom:calc(var(--s) + 4px)}
.am-tr{display:flex;align-items:center;gap:5px;height:28px;padding:0 9px 0 6px;border-radius:14px;background:var(--am-chip);
  box-shadow:inset 0 0 0 1.5px var(--am-route),0 1px 3px rgba(0,0,0,.22);transform:translate(-50%,-50%);pointer-events:auto;
  font:650 12.5px/1 Inter,system-ui,sans-serif;color:var(--am-label)}
.am-tr.am-tri{padding:0 5px;pointer-events:none}
.am-tr svg{width:17px;height:17px}
.am-off{opacity:.6}
/* The end on another floor: solid outline, not faded (a faded pin reads as disabled). */
.am-pin.am-off{opacity:1;background:var(--am-chip);color:var(--am-label);
  box-shadow:inset 0 0 0 1.5px var(--am-pin),0 1px 4px rgba(0,0,0,.25)}
.am-you{width:13px;height:13px;margin:-9.5px 0 0 -9.5px;border-radius:50%;background:#0A84FF;border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3)}
.am-you.away{opacity:.45}
.am-hide{display:none!important}

/* screens/airports.css */
/* Airports screens (#airports, #airport/<code>). Roots: .ap-hero (hero), .ap-pg
   (body) and .ap-pk (the From/To picker, on body); the full-screen map also
   marks #view and #app with .ap-mapfull. Colours are tokens. */

/* ---------- hero ---------- */
/* Where you are going first: the gate (or the terminal until it posts), big. */
.ap-hero{position:relative;padding-top:4px;min-height:0}
.ap-hero .ap-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ap-hero .ap-ps{position:relative;z-index:1}
.ap-hero .ap-ps button{height:44px;min-width:58px;padding:0 15px;border-radius:22px;justify-content:center;gap:6px;font-size:15px;letter-spacing:.02em}
/* The "now" dot: band text colour on the band, band green on the selected pill. */
.ap-hero .ap-nd{width:7px;height:7px;border-radius:50%;background:var(--obt);flex:none}
.ap-hero .ap-ps button[aria-pressed="true"] .ap-nd{background:var(--eb)}
.ap-hero .ap-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Back to the airport, visit and route the clock and your location pick. */
.ap-hero .ap-now{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 13px;border-radius:22px;flex:none;
  background:var(--onband);color:var(--obt);font-size:14px;font-weight:800}
.ap-hero .ap-now .i{font-size:18px}
.ap-hero .ap-top{position:relative;z-index:1;margin-top:12px}
.ap-hero .ap-ey{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Label, then the big line: TERMINAL / MAIN, NEXT GATE / B12, WAY OUT / Bus stop. */
.ap-hero .ap-lab{margin-top:8px;font-size:13px;line-height:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--obt)}
.ap-hero .ap-big{font-size:72px;line-height:.9;margin:4px 0 0 -3px;color:var(--ob);letter-spacing:-.035em;max-width:calc(100% - 120px);overflow-wrap:anywhere}
/* Words (Baggage claim, Rideshare pickup) instead of a gate: smaller, and they may wrap. */
.ap-hero .ap-big.long{font-size:40px;line-height:.95;letter-spacing:-.02em;margin:6px 0 0 -2px;max-width:calc(100% - 120px);text-wrap:balance}
/* Body text on the band uses --obt: white (--ob) is under 4.5:1 on the light band. */
.ap-hero .ap-gm{margin:8px 0 0;font-size:15px;font-weight:700;line-height:1.35;color:var(--obt)}
.ap-hero .ap-sub{margin:12px 0 0;color:var(--obt)}
.ap-hero .ap-sub b{display:block;font-size:15px;font-weight:700;line-height:1.3;text-wrap:balance}
.ap-hero .ap-sub>span{display:block;margin-top:3px;font-size:13px;font-weight:600}
/* The flight's status sits with its boarding time and the local clock. */
.ap-hero .ap-s2{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:13px;font-weight:600;line-height:1.35}
.ap-hero .ap-s2 .chip{height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;flex:none}
.ap-hero .ap-s2>span{min-width:0}
/* The art stands on the big line's baseline, right of it. */
.ap-hero.ap-h2 .ap-il.ax{top:103px;right:-16px;width:118px;height:76px}
/* Words are smaller (and may wrap): the art stands on the first line. */
.ap-hero.ap-h2.ap-hl .ap-il.ax{top:80px}
.ap-hero.ap-e{min-height:0}
.ap-hero.ap-e .hl{color:var(--ob)}
.ap-hero.ap-e .ap-top{margin-top:18px}

/* ---------- body: shared bits ---------- */
/* Sections land just under the top bar. */
.ap-pg .ap-anc{scroll-margin-top:calc(56px + env(safe-area-inset-top,0px) + 12px)}
.ap-pg .ap-note{margin:0 0 10px;font-size:13px;color:var(--mu);line-height:1.4}
.ap-pg .ap-subh{margin:18px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.ap-pg .ap-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;min-width:0}
.ap-pg .ap-sh .ey{flex:none}
.ap-pg .ap-c44{height:44px;border-radius:22px;padding:0 16px;font-size:14px}
.ap-pg .ap-ml{margin-top:12px}
.ap-pg .ap-chev{font-size:20px;color:var(--mu);flex:none;align-self:center}
/* Amber ring: worth a look, not a problem (rose stays for risk). */
.ap-pg .chip.ap-cw{box-shadow:inset 0 0 0 1.5px var(--warn)}
.ap-pg .chip.ap-cw .i{color:var(--warn)}
/* Reference sections start closed: a cream row with the title, a short note and a chevron. */
.ap-pg .ap-fold>summary,.ap-pg .ap-more>summary{display:flex;align-items:center;list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ap-pg .ap-fold>summary::-webkit-details-marker,.ap-pg .ap-more>summary::-webkit-details-marker{display:none}
.ap-pg .ap-fold>summary{gap:12px;min-height:56px;padding:10px 16px;border-radius:20px;background:var(--cr)}
.ap-pg .ap-fold>summary .ey{display:block}
.ap-pg .ap-fold>summary small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:3px;line-height:1.35}
.ap-pg .ap-fb{padding-top:14px}
.ap-pg .ap-more{margin-top:10px}
.ap-pg .ap-more>summary{gap:10px;min-height:44px;padding:0 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--ln);font-size:14px;font-weight:700;color:var(--ink)}
.ap-pg .ap-mb{padding-top:10px}
.ap-pg details>summary .ap-chev{transition:transform .2s}
.ap-pg details[open]>summary .ap-chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.ap-pg details>summary .ap-chev{transition:none}}
.ap-pg .ic .i{font-size:20px}

/* visit switch */
.ap-pg .ap-seg{display:flex;width:100%;margin-bottom:14px}
.ap-pg .ap-seg button{flex:1;height:44px;border-radius:20px;justify-content:center;font-size:14px;white-space:nowrap;padding:0 8px}

/* tiles */
/* The value stays on one line; the subline wraps to two rather than ellipsizing ("Hours not
   listed"). Amber dot = worth a look, rose ring (.w) = a real problem. */
.ap-pg .ap-cn>div>span{font-size:13px;margin-top:2px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ap-pg .ap-cn .ap-cw span{color:var(--ink)}
.ap-pg .ap-cn .ap-cw span::before{content:'';display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--warn);vertical-align:1px}
.ap-pg .ap-cos{margin-top:14px}
/* Caution (a tight connection, a delay, a weather alert): cream with an amber edge and icon, ink
   text. Rose is kept for what stops you: at risk, canceled, a ground stop. */
.ap-pg .co.ap-warn{background:var(--cr);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--warn)}
.ap-pg .co.ap-warn .i{color:var(--warn)}
.ap-pg .co .ap-il2{display:flex;align-items:center;width:fit-content;min-height:44px;margin-top:8px;padding:0 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}

/* your flights here */
/* Grid: the status chip sits beside the flight line only; time and gate run the full width under
   both, so a wide chip never pushes the meta onto extra lines. */
.ap-pg .ap-fl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:center;min-height:64px;
  padding:12px;border-radius:20px;background:var(--cr);color:var(--ink);text-decoration:none;min-width:0}
.ap-pg .ap-fl .grow{display:contents}
.ap-pg .ap-fl .ic{grid-row:1/span 3;background:var(--sheet)}
.ap-pg .ap-fl b{grid-column:2;display:block;font-size:15px;font-weight:800;line-height:1.25}
.ap-pg .ap-fl small{grid-column:2/4;display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
/* The status chip caps its width and ellipsizes its label instead of clipping. */
.ap-pg .ap-fc{grid-column:3;grid-row:1;min-width:0;max-width:150px}
.ap-pg .ap-fc>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ap-pg .ap-fl .chip.cr{background:var(--sheet)}
.ap-pg .ap-ng{margin-top:16px}

/* ---------- steps ---------- */
.ap-pg .ap-steps{list-style:none;margin:0;padding:0}
.ap-pg .ap-st{display:grid;grid-template-columns:50px 34px minmax(0,1fr);column-gap:10px}
.ap-pg .ap-tm{font-size:14px;font-weight:800;text-align:right;padding-top:8px;white-space:nowrap}
.ap-pg .ap-sd{position:relative}
.ap-pg .ap-sd::before{content:'';position:absolute;left:16px;top:36px;bottom:2px;width:2px;border-radius:1px;background:var(--ln)}
.ap-pg .ap-st:last-child .ap-sd::before{display:none}
.ap-pg .ap-si{position:relative;width:34px;height:34px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:17px}
.ap-pg .ap-sb{padding:6px 0 18px;min-width:0}
.ap-pg .ap-sb b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-sb small{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.4}
.ap-pg .ap-sb .ap-x{color:var(--ink);font-weight:600}
/* Reaching the gate on a tight (amber) or at-risk (rose) connection: a dot, the text stays ink. */
.ap-pg .ap-sb .ap-x:is(.ap-xw,.ap-xr)::before{content:'';display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--warn);vertical-align:1px}
.ap-pg .ap-sb .ap-x.ap-xr::before{background:var(--ro)}
.ap-pg .ap-mn{display:flex!important;align-items:center;gap:5px}
.ap-pg .ap-in{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:var(--eb)}
.ap-pg .ap-sl{margin-top:10px;width:fit-content}
/* Finished steps: one quiet 44px line (time, tick, title). */
.ap-pg .ap-st.done{min-height:44px}
.ap-pg .ap-st.done .ap-tm{padding-top:12px;font-size:13px;font-weight:700;color:var(--mu)}
.ap-pg .ap-st.done .ap-si{width:28px;height:28px;margin:8px 0 0 3px;font-size:15px;background:var(--eb);color:var(--sheet)}
.ap-pg .ap-st.done .ap-sd::before{top:40px;bottom:0;background:var(--eb);opacity:.5}
.ap-pg .ap-st.done .ap-sb{padding:12px 0 8px}
.ap-pg .ap-st.done .ap-sb b{font-size:14px;font-weight:700;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The step in progress or next: band green, never rose (rose means risk). */
.ap-pg .ap-st.next .ap-si{background:var(--eb);color:var(--sheet);box-shadow:0 0 0 4px var(--cr)}
.ap-pg .ap-st.next .ap-tm{color:var(--eb)}
.ap-pg .ap-st.wn .ap-si{background:var(--sd);color:var(--sdt)}

/* ---------- head: visit switch and what stops you ---------- */
.ap-pg .ap-head:empty{display:none}
.ap-pg .ap-head{margin-bottom:14px}
.ap-pg .ap-head>.ap-seg:last-child{margin-bottom:0}
.ap-pg .ap-head .ap-cos{margin-top:0}

/* ---------- the map card ---------- */
/* Cream card: From and To on top, the map under it; tools float on the map. */
.ap-pg .ap-mc{position:relative;border-radius:22px;background:var(--cr);overflow:hidden}
.ap-pg .ap-ft{padding:8px}
.ap-pg .ap-ft:empty{display:none}
.ap-pg .ap-fts{display:flex;align-items:center;gap:6px}
.ap-pg .ap-frs{position:relative;flex:1;min-width:0;border-radius:16px;background:var(--sheet)}
/* A dotted line joins the two dots, like a route. */
.ap-pg .ap-frs::before{content:'';position:absolute;left:19px;top:31px;bottom:31px;border-left:2px dotted var(--mu);opacity:.6}
.ap-pg .ap-fr{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 10px 6px 14px;color:var(--ink);text-align:left;min-width:0}
.ap-pg .ap-fr+.ap-fr{box-shadow:inset 0 1px 0 var(--ln)}
.ap-pg .ap-fr small{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);line-height:1.2}
.ap-pg .ap-fr b{display:block;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-pg .ap-fr .ap-chev{font-size:18px}
.ap-pg .ap-dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;flex:none;box-sizing:border-box}
.ap-pg .ap-dot.fr{border:3px solid var(--ink);background:var(--sheet)}
.ap-pg .ap-dot.you{background:var(--eb);box-shadow:0 0 0 3px color-mix(in srgb,var(--eb) 28%,transparent)}
.ap-pg .ap-dot.to{border-radius:3px;background:var(--ink)}
.ap-pg .ap-sw{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:var(--sheet);color:var(--ink);flex:none}
.ap-pg .ap-sw .i{font-size:20px}
/* Arrivals: Hotel or Home, and how you leave. */
/* Leaving an arrival airport: Hotel or Home and How, under the map. */
.ap-pg .ap-exw{margin-top:12px;padding:12px 8px 10px;border-radius:22px;background:var(--cr)}
.ap-pg .ap-exw:empty{display:none}
.ap-pg .ap-ex{display:flex;flex-direction:column;gap:8px}
.ap-pg .ap-exh{margin:0 6px 2px}
.ap-pg .ap-xto{display:flex;width:100%;background:var(--sheet)}
.ap-pg .ap-xto button{flex:1;height:44px;border-radius:20px;justify-content:center;font-size:14px}
.ap-pg .ap-xto .i{font-size:18px}
.ap-pg .ap-how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ap-pg .ap-hw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px 2px;border-radius:14px;
  background:var(--sheet);color:var(--ink);font-size:13px;font-weight:700;text-align:center;min-width:0}
.ap-pg .ap-hw span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-pg .ap-hw .i{font-size:20px;color:var(--eb)}
.ap-pg .ap-hw[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.ap-pg .ap-hw[aria-pressed="true"] .i{color:var(--page)}
.ap-pg .ap-eta{display:flex;align-items:center;gap:6px;margin:0 4px;font-size:13px;font-weight:600;line-height:1.35;color:var(--ink)}
.ap-pg .ap-eta .i{font-size:16px;color:var(--eb);flex:none}

/* The map and what floats on it. The overlay lets touches through except on its controls. */
.ap-pg .ap-mw{position:relative;height:clamp(300px,54vh,560px);background:var(--page)}
.ap-pg .ap-mh{position:absolute;inset:0}
/* Floating controls: a hairline and a short shadow (a long one would be cut off by the chip row's scroll box). */
.ap-pg .ap-mc{--ap-fl:0 0 0 1px var(--ln),0 2px 6px var(--ln)}
.ap-pg .ap-mo{position:absolute;inset:0;z-index:6;pointer-events:none}
.ap-pg .ap-mo>*{pointer-events:auto}
.ap-pg .ap-mo>.ap-chips{pointer-events:none}
.ap-pg .ap-chips>*{pointer-events:auto}
.ap-pg .ap-chips{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px 24px 12px 8px;overflow-x:auto;scrollbar-width:none}
.ap-pg .ap-chips::-webkit-scrollbar{display:none}
/* A chip cut by the edge fades out, so the row reads as one you can scroll. */
.ap-pg .ap-chips{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.ap-pg .ap-ch{height:44px;padding:0 13px 0 11px;border-radius:22px;flex:none;font-size:14px;font-weight:700;background:var(--sheet);color:var(--ink);
  box-shadow:var(--ap-fl)}
.ap-pg .ap-ch .i{font-size:18px;color:var(--eb)}
.ap-pg .ap-ch[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.ap-pg .ap-ch[aria-pressed="true"] .i{color:var(--page)}
.ap-pg .ap-tl{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:var(--sheet);color:var(--ink);
  box-shadow:var(--ap-fl)}
.ap-pg .ap-tl .i{font-size:21px}
.ap-pg .ap-tools2{position:absolute;right:8px;bottom:28px;display:flex;flex-direction:column;gap:8px}
/* Full screen, where I am and the whole route stack bottom right, in thumb reach; the chips get the full width. */
/* Floors, top first, like a lift panel; a dot marks the ones your route uses. */
.ap-pg .ap-rl{position:absolute;right:8px;top:60px;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:25px;background:var(--sheet);
  box-shadow:var(--ap-fl);max-height:calc(100% - 244px);overflow-y:auto;scrollbar-width:none}
.ap-pg .ap-rl::-webkit-scrollbar{display:none}
.ap-pg .ap-rl button{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;flex:none;
  font-size:15px;font-weight:800;color:var(--ink)}
.ap-pg .ap-rl button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.ap-pg .ap-rl i.on{position:absolute;right:8px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--eb)}
.ap-pg .ap-rl button[aria-pressed="true"] i.on{background:var(--page)}
/* A tapped place: what it is and Route here. */
.ap-pg .ap-pop{position:absolute;left:8px;right:60px;bottom:28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;
  padding:8px 4px 8px 10px;border-radius:18px;background:var(--sheet);color:var(--ink);box-shadow:var(--ap-fl)}
.ap-pg .ap-pop .ic{width:36px;height:36px;border-radius:12px}
.ap-pg .ap-pop .ic .i{font-size:18px}
.ap-pg .ap-pop b{display:block;font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-pg .ap-pop small{display:block;font-size:13px;color:var(--mu);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-pg .ap-pgo{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;margin-right:6px;border-radius:22px;
  background:var(--ink);color:var(--page);font-size:14px;font-weight:700}
.ap-pg .ap-pgo .i{font-size:18px}
.ap-pg .ap-px{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:var(--mu)}
.ap-pg .ap-px .i{font-size:20px}
.ap-pg .ap-ml2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 0 0 1px var(--ln)}
.ap-pg .ap-sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--ln);border-top-color:var(--eb);animation:ap-spin .8s linear infinite;flex:none}
@keyframes ap-spin{to{transform:rotate(360deg)}}
/* No map on this phone: the card holds the way out (on an arrival) and a note. */
.ap-pg .ap-mc.none{padding:8px}
.ap-pg .ap-mc.none .ap-ft{padding:0 0 8px}
.ap-pg .ap-mc.none .ap-mw{height:auto;background:none}
.ap-pg .ap-mc.none .ap-mh{display:none}
.ap-pg .ap-mc.none .ap-mo{position:static}
.ap-pg .ap-mc.none .ap-nomap{background:var(--sheet)}

/* Full screen: the card covers the page under the top bar; the tab bar steps aside. */
.ap-pg .ap-mc.full{position:fixed;z-index:3;left:0;right:0;bottom:0;top:calc(56px + env(safe-area-inset-top,0px) + var(--ap-strip,0px));
  border-radius:0;margin:0}
.ap-pg .ap-mc.full .ap-ft{display:none}
.ap-pg .ap-mc.full .ap-mw{position:absolute;inset:0;height:auto}
.ap-pg .ap-mc.full .ap-tools2,.ap-pg .ap-mc.full .ap-pop{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#view.ap-mapfull{overflow:hidden!important}
#view.ap-mapfull::after{opacity:0}
#app.ap-mapfull .nv{transform:translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}

/* ---------- the route, step by step ---------- */
.ap-pg .ap-rt{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap}
.ap-pg .ap-rs{list-style:none;margin:0;padding:0}
.ap-pg .ap-rr{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 0;color:var(--ink);text-align:left;min-width:0}
.ap-pg .ap-rs li+li .ap-rr{box-shadow:inset 0 1px 0 var(--ln)}
.ap-pg .ap-ri{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--cr);color:var(--eb);flex:none}
.ap-pg .ap-ri .i{font-size:19px}
.ap-pg .ap-rr b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.ap-pg .ap-rr small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.ap-pg .ap-rs li:last-child .ap-ri{background:var(--eb);color:var(--sheet)}
.ap-pg .ap-rn{margin:10px 0 0;font-size:13px;color:var(--mu);line-height:1.4}
.ap-pg .ap-sh+.ap-rn{margin-top:0}
.ap-pg .ap-rn b{color:var(--ink)}
/* No route yet: a cream card that says what it waits on (like the no-map card). */
.ap-pg .ap-re{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--cr);color:var(--ink);font-size:14px;font-weight:500;line-height:1.4}
.ap-pg .ap-re>.i{font-size:22px;color:var(--eb);flex:none;margin-top:-1px}
.ap-pg .ap-re b{font-weight:800}

/* ---------- along the route ---------- */
.ap-pg .ap-als{display:flex;flex-direction:column}
.ap-pg .ap-al{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;color:var(--ink);text-align:left;min-width:0}
.ap-pg .ap-als>*+*{box-shadow:inset 0 1px 0 var(--ln)}
.ap-pg .ap-al b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-al small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}

/* ---------- From / To picker (a sheet on body) ---------- */
.ap-pk{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end}
.ap-pk [hidden]{display:none!important}
.ap-pk .ap-pkb{position:absolute;inset:0;background:color-mix(in srgb,var(--robt) 48%,transparent);cursor:default;animation:ap-fade .2s ease-out}
.ap-pk .ap-pks{position:relative;display:flex;flex-direction:column;max-height:82vh;max-height:82dvh;border-radius:28px 28px 0 0;background:var(--sheet);color:var(--ink);
  padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));outline:none;animation:ap-up .32s var(--ease)}
.ap-pk .ap-pkh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.ap-pk .ap-pkh b{font-size:20px;font-weight:800}
.ap-pk .ap-pkx{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-8px;border-radius:22px;color:var(--ink)}
.ap-pk .ap-pkx .i{font-size:22px}
.ap-pk .ap-pkq{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:16px;background:var(--cr);color:var(--mu)}
.ap-pk .ap-pkq .i{font-size:18px;flex:none}
/* 16px keeps iOS from zooming the page on focus. */
.ap-pk .ap-pkq input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:600 16px/1.2 Inter,system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.ap-pk .ap-pkq input::placeholder{color:var(--mu)}
.ap-pk .ap-pkq:focus-within{box-shadow:inset 0 0 0 2px var(--eb)}
.ap-pk .ap-pkl{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 0 calc(20px + env(safe-area-inset-bottom,0px))}
.ap-pk .ap-pkg{padding-top:14px}
.ap-pk .ap-pkg>.ey{margin-bottom:4px}
.ap-pk .ap-po{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;color:var(--ink);text-align:left;min-width:0}
.ap-pk .ap-po+.ap-po{box-shadow:inset 0 1px 0 var(--ln)}
.ap-pk .ap-po .ic{width:36px;height:36px;border-radius:12px}
.ap-pk .ap-po .ic .i{font-size:18px}
.ap-pk .ap-po b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.ap-pk .ap-po small{display:block;font-size:13px;color:var(--mu);margin-top:1px;line-height:1.3}
.ap-pk .ap-po[aria-current="true"] b{font-weight:800}
.ap-pk .ap-pkc{font-size:20px;color:var(--eb);flex:none}
.ap-pk .ap-gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-top:4px}
.ap-pk .ap-gb{display:flex;align-items:center;justify-content:center;height:44px;border-radius:14px;background:var(--cr);color:var(--ink);font-size:15px;font-weight:700}
.ap-pk .ap-gb.mine{box-shadow:inset 0 0 0 2px var(--eb);color:var(--eb);font-weight:800}
.ap-pk .ap-gb[aria-current="true"]{background:var(--ink);color:var(--page);box-shadow:none}
.ap-pk .ap-pke{margin:18px 0 0;font-size:14px;color:var(--mu);text-align:center}
@keyframes ap-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes ap-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .ap-pk .ap-pkb,.ap-pk .ap-pks{animation:none}
  .ap-pg .ap-sp{animation:none;border-top-color:var(--ln)}
}

/* ---------- buttons under a step ---------- */
.ap-pg .ap-tb{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;min-width:44px;border-radius:22px;
  background:var(--cr);color:var(--ink);font-size:14px;font-weight:700;flex:none;transition:opacity .2s}
.ap-pg .ap-tb .i{font-size:20px}
.ap-pg .ap-wk{padding:0 16px 0 13px;text-decoration:none;min-width:0;flex:0 1 auto}
.ap-pg .ap-wk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-pg .ap-tb[disabled]{opacity:.38;cursor:default}
.ap-pg .ap-nomap{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--cr)}
.ap-pg .ap-nomap>.i{font-size:24px;color:var(--eb);margin-top:2px}
.ap-pg .ap-nomap b{display:block;font-size:15px;font-weight:800}
.ap-pg .ap-nomap small{display:block;font-size:13px;color:var(--mu);margin-top:2px}

/* ---------- security ---------- */
.ap-pg .ap-ck{padding:14px;border-radius:20px;background:var(--cr)}
.ap-pg .ap-ck .ic{background:var(--sheet)}
.ap-pg .ap-cks{margin-top:10px}
.ap-pg .ap-cks .chip.cr{background:var(--sheet)}
.ap-pg .ap-ok .i{color:var(--ok)}
.ap-pg .ap-dl{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.ap-pg .ap-dl>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:baseline}
.ap-pg .ap-dl dt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.ap-pg .ap-dl dd{margin:0;font-size:14px;font-weight:600;line-height:1.35}
.ap-pg .ap-cn2{margin:8px 0 0;font-size:13px;color:var(--mu);line-height:1.4}

/* ---------- food, services, links ---------- */
.ap-pg .ap-list{display:flex;flex-direction:column}
.ap-pg .ap-fd,.ap-pg .ap-sv{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln);min-width:0}
.ap-pg .ap-list>:first-child{border-top:0}
.ap-pg .ap-fd b,.ap-pg .ap-sv b,.ap-pg .ap-lk b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-fd small,.ap-pg .ap-sv small,.ap-pg .ap-lk small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.4}
.ap-pg .ap-fd .ap-fn{color:var(--ink)}
/* One status per place; the dot says open (green), opens later (amber) or closed (grey). */
.ap-pg .ap-os{display:inline-flex;align-items:center;gap:6px;flex:none;margin-top:1px;padding:4px 10px;border-radius:12px;background:var(--cr);
  font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.ap-pg .ap-os::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mu);flex:none}
.ap-pg .ap-os.on::before{background:var(--eb)}
.ap-pg .ap-os.soon::before{background:var(--warn)}
.ap-pg .ap-fd .ap-me{color:var(--eb);font-weight:700}
/* One 44px row per number; the number never wraps. */
.ap-pg .ap-calls{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ap-pg .ap-call{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--cr);
  color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;line-height:1.2;min-width:0}
.ap-pg .ap-call .i{font-size:18px;color:var(--eb);flex:none}
.ap-pg .ap-call .tn{flex:none;white-space:nowrap;font-weight:600;color:var(--mu)}
.ap-pg .ap-lk{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-top:1px solid var(--ln);color:var(--ink);text-decoration:none}

/* ---------- ground ---------- */
.ap-pg .ap-gr{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:20px;background:var(--cr);color:var(--ink);text-decoration:none;min-width:0}
.ap-pg .ap-list>.ap-gr+.ap-gr{margin-top:8px}
.ap-pg .ap-gr .ic{background:var(--sheet)}
.ap-pg .ap-gr b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-gr small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.4}
.ap-pg .ap-gr .ap-gd,.ap-pg .ap-gr .ap-bd{display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.ap-pg .ap-gd .i{color:var(--ok);margin-top:2px;flex:none}
.ap-pg .ap-bd .i{color:var(--warn);margin-top:2px;flex:none}
.ap-pg .ap-tr{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px;margin-bottom:10px;border-radius:20px;background:var(--sd);color:var(--sdt);text-decoration:none}
.ap-pg .ap-tr .ic{background:var(--sheet)}
.ap-pg .ap-tr b{display:block;font-size:15px;font-weight:800}
.ap-pg .ap-tr small{display:block;font-size:13px;margin-top:2px;opacity:.85}
.ap-pg .ap-tr .ap-chev{color:var(--sdt)}

/* ---------- facts, tips ---------- */
.ap-pg .ap-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.ap-pg .ap-fact.long{grid-column:1/-1}
.ap-pg .ap-fact{background:var(--cr);border-radius:18px;padding:11px 13px;min-width:0}
.ap-pg .ap-fact small{display:block;font-size:13px;color:var(--mu);font-weight:600;text-wrap:balance}
.ap-pg .ap-fact b{display:block;font-size:17px;font-weight:800;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
.ap-pg .ap-fact span{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35}
.ap-pg .ap-tips{list-style:none;margin:6px 0 0;padding:0}
.ap-pg .ap-tips li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:6px 0}
.ap-pg .ap-tips .i{font-size:17px;color:var(--eb);flex:none;margin-top:2px}
.ap-pg .ap-cav .i{color:var(--warn)}

/* screens/alerts.css */
/* Lock-screen alerts (#alerts). Built on the Settings styles in wallet.css (.wl-*). */
.wl-al .al-steps{list-style:none;margin:0}
.wl-al .al-steps .rw small{margin-top:1px}
.wl-al .al-st small{text-wrap:pretty}

/* status */
.wl-al .al-st .rw small{margin-top:3px}
.wl-al .al-st.ok .ic{color:var(--ok)}
.wl-al .al-st.bad .ic{color:var(--rot)}
.wl-al .al-st.warn .ic{color:var(--warn)}
.wl-al .al-again{margin-top:var(--sp-3)}
.wl-al .al-st+.wl-link{margin-top:var(--sp-1)}

/* code */
.wl-al .al-code{background:var(--cr);border-radius:18px;padding:14px 16px;font:500 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mu)}
.wl-al .al-code span{overflow-wrap:anywhere;word-break:break-all;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
/* opened in full when the clipboard is refused, so the whole code can be selected by hand */
.wl-al .al-code span.all{display:block;-webkit-line-clamp:none;line-clamp:none}
.wl-al .al-code ::selection{background:var(--pill);color:var(--pillt)}
.wl-al .al-btns{display:flex;gap:var(--sp-2)}
.wl-al .al-btns .btn{flex:1;min-width:0;padding:0 12px}
.wl-al .al-btns .i{font-size:19px}

/* what's sent */
.wl-al .al-kinds li .i{color:var(--eb)}

/* one-time card on Flights */
.fl .bn.al-nudge{margin-bottom:6px}
.fl .bn.al-nudge>.i{color:var(--eb)}
.fl .bn.al-nudge b{text-wrap:balance}
.fl .bn.al-nudge span{line-height:1.35;margin-top:2px;text-wrap:pretty}
.fl .bn.al-nudge .bx{gap:8px}
.fl .bn.al-nudge .bx .fl-btn.al-go{background:var(--ink);color:var(--page)}

/* Alerts row in Settings */
.wl .al-row{text-decoration:none;color:var(--ink);padding:12px 10px 12px 14px;min-height:68px}
.wl .al-row>.i{font-size:18px;color:var(--mu);flex:none}
.wl .al-w{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mu);flex:none}
.wl .al-w::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mu)}
.wl .al-w.on{color:var(--ink)}
.wl .al-w.on::before{background:var(--ok)}
.wl .al-w.waiting::before{background:var(--eb)}
.wl .al-w.stopped{color:var(--rot)}
.wl .al-w.stopped::before{background:var(--ro)}
.wl .al-w.off::before{display:none}

/* screens/flights.css */
/* Flights screens. Roots: .fl (#flights), .fx (#flight/<leg>), .cx (#connect/<dir>),
   .st (#seats/<leg>); hero roots .fl-hero, .cx-h, .st-h. Every selector starts with one. */

/* ---------- shared bits ---------- */
/* Amber that reads as text and icons on light and dark surfaces (caution, never rose). */
.fl,.fx,.cx,.cx-h,.st{--amt:color-mix(in srgb,var(--warn) 70%,var(--ink))}
.fl .fl-lk,.fx .fl-lk,.cx .fl-lk,.st .fl-lk,
.fl .bn .bx .fl-lk,.fx .bn .bx .fl-lk,.cx .bn .bx .fl-lk,.st .bn .bx .fl-lk{height:44px;border-radius:22px;padding:0 15px}
.fl .fl-lk .i,.fx .fl-lk .i,.cx .fl-lk .i,.st .fl-lk .i{font-size:16px}
.fl .fl-lk.cr2,.cx .fl-lk.cr2,.st .fl-lk.cr2{background:var(--cr)}
.fl .fl-btn{height:44px;border-radius:22px;padding:0 16px}
.fl .bn .bx .fl-btn{height:44px;background:var(--sheet);color:var(--ink)}

/* Row card used for links and facts (cream on white sheets, white on the cream detail page). */
.fx .fx-row,.cx .fx-row,.st .fx-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:12px;border-radius:20px;
  background:var(--sheet);color:var(--ink);text-decoration:none;min-width:0}
.cx .fx-row,.st .fx-row{background:var(--cr)}
.cx .fx-row .ic,.st .fx-row .ic{background:var(--sheet)}
.fx .fx-row b,.cx .fx-row b,.st .fx-row b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.fx .fx-row small,.cx .fx-row small,.st .fx-row small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.fx .fx-go>.i:last-child,.cx .fx-go>.i:last-child,.st .fx-go>.i:last-child{font-size:20px;color:var(--mu);flex:none}

/* ---------- #flights hero ---------- */
.fl-hero{padding-top:6px}
.fl-hero .hl{max-width:340px}
.fl-hero .fl-hchips{margin-top:16px}

/* ---------- #flights body ---------- */
.fl .fl-chg{margin-bottom:6px}
.fl .fl-chg span+span{margin-top:3px}
.fl .fl-dir:first-of-type{margin-top:8px}
.fl .fl-dir+.fl-dir{margin-top:34px}
.fl .fl-dh{display:flex;align-items:flex-end;gap:10px}
.fl .fl-dh .ey{margin-bottom:4px}
.fl .fl-sum{margin-top:12px}
.fl .fl-note{margin-top:12px}
.fl .fl-note span+span{margin-top:6px}
.fl .fl-legs{margin-top:12px}

/* ticket */
.fl .fl-tk{display:block;position:relative;overflow:hidden;background:var(--cr);color:var(--ink);text-decoration:none;
  border-radius:24px;padding:14px 16px 14px}
.fl .fl-tk.bad{box-shadow:inset 0 0 0 2px var(--ro)}
/* A long status ("In the air · 41 min late") drops to its own line rather than squeezing the flight number. */
.fl .fl-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--sp-2);min-width:0}
.fl .fl-no{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fl .fl-no .mu{font-weight:600;white-space:nowrap}
.fl .fl-top .chip{flex:none}
.fl .fl-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;margin-top:12px}
.fl .fl-end{min-width:0}
.fl .fl-end.r{text-align:right}
.fl .fl-code{display:block;font-size:46px;line-height:1}
.fl .fl-old{display:block;font-size:13px;line-height:18px;color:var(--mu);margin-top:6px}
.fl .fl-old.ph{visibility:hidden}
.fl .fl-t{display:block;font-size:20px;font-weight:800;margin-top:6px;white-space:nowrap}
.fl .fl-old+.fl-t{margin-top:0}
.fl .fl-t.late{color:var(--rot)}
.fl .fl-end small{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-path{display:flex;flex-direction:column;align-items:center;width:76px;padding-top:12px}
.fl .fl-pl{position:relative;display:flex;justify-content:center;width:100%;height:24px}
.fl .fl-line{position:absolute;left:0;right:0;top:11px;border-top:2px dashed var(--gh)}
.fl .fl-pl .i{position:relative;font-size:22px;width:34px;padding:0 6px;color:var(--eb);background:var(--cr)}
.fl .fl-path small{font-size:13px;color:var(--mu);white-space:nowrap;font-weight:700;margin-top:6px}
/* The first column is wider so "Gate · Terminal N" fits. */
.fl .fl-meta{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--ln)}
.fl .fl-meta::before,.fl .fl-meta::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--sheet)}
.fl .fl-meta::before{left:-26px}
.fl .fl-meta::after{right:-26px}
.fl .fl-meta div{min-width:0}
.fl .fl-meta small{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-meta b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-meta b.mu{font-weight:600;font-size:15px}

/* connection strip between tickets */
.fl .fl-cx,.fx .fl-cx{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;margin:14px 0;padding:var(--sp-3) 14px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink);text-decoration:none;min-width:0}
.fx .fl-cx{margin:0}
.fl .fl-cx.tight,.fx .fl-cx.tight{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.fl .fl-cx.risk,.fx .fl-cx.risk{background:color-mix(in srgb,var(--ro) 14%,transparent)}
.fl .fl-cx .ic,.fx .fl-cx .ic{background:var(--sheet)}
.fl .fl-cx.tight .ic,.fx .fl-cx.tight .ic{color:var(--amt)}
.fl .fl-cx.risk .ic,.fx .fl-cx.risk .ic{color:var(--rot)}
.fl .fl-cx b,.fx .fl-cx b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.fl .fl-cx small,.fx .fl-cx small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.fl .fl-cx .cx-lv,.fx .fl-cx .cx-lv{font-weight:800;color:var(--ok)}
.fl .fl-cx.tight .cx-lv,.fx .fl-cx.tight .cx-lv{color:var(--amt)}
.fl .fl-cx.risk .cx-lv,.fx .fl-cx.risk .cx-lv{color:var(--rot)}
.fl .fl-cx.neutral .cx-lv,.fx .fl-cx.neutral .cx-lv{color:var(--mu)}
.fl .fl-cx>.i:last-child,.fx .fl-cx>.i:last-child{font-size:20px;color:var(--mu);flex:none}

/* A direction with no published times yet: one ticket-shaped card instead of dashes and TBCs. */
.fl .fl-tbc{display:flex;align-items:center;gap:var(--sp-3);min-height:44px;margin-top:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-lg);
  background:var(--cr);color:var(--ink);text-decoration:none;min-width:0}
.fl .fl-tbc .ic{background:var(--sheet)}
.fl .fl-tbc b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.fl .fl-tbc small{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.fl .fl-tbc>.i:last-child{font-size:20px;color:var(--mu);flex:none}

.fl .fl-ci{margin-top:14px}
.fl .fl-ci b{font-size:15px}
.fl .fl-dir.done .fl-tk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ln)}
.fl .fl-dir.done .fl-path .i{background:var(--sheet)}
.fl .fl-dir.done .fl-meta::before,.fl .fl-dir.done .fl-meta::after{display:none}
.fl .fl-foot{margin-top:30px}

/* ---------- #flight/<leg> ---------- */
.fx-h{padding-top:4px}
.fx-h .fx-codes{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);min-width:0}
.fx-h .fx-codes .dp{font-size:min(17vw,76px);color:var(--ob);flex:none}
.fx-h .fx-codes>.i{font-size:28px;color:var(--obm);flex:none}
.fx-h .fx-lede{margin:var(--sp-2) 0 0;font-size:15px;font-weight:600;line-height:1.35;color:var(--obm)}
.fx-h .fx-stat{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3);margin-top:var(--sp-4)}
.fx .fx-gap{margin-bottom:var(--sp-3)}
.fx .fx-bn span+span{margin-top:4px}
.fx .tile,.fx .fx-row,.fx .fx-log{background:var(--cr)}
.fx .fx-row .ic{background:var(--sheet)}

/* Equal side columns keep the duration centred under the line. */
.fx .fx-times{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-2);align-items:end;margin-top:var(--sp-1)}
.fx .fx-times .r{text-align:right}
.fx .fx-tw{display:block;font-size:13px;color:var(--mu);font-weight:600}
.fx .fx-tw s{color:var(--mu)}
.fx .fx-t{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.fx .fx-tz{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.fx .fx-mid{text-align:center;padding-bottom:4px;min-width:84px}
.fx .fx-mid small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:4px;white-space:nowrap}
.fx .fx-dash{position:relative;height:24px}
.fx .fx-dash::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--gh)}
.fx .fx-dash>span{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;padding:0 4px;background:var(--sheet);color:var(--ink);font-size:22px;transition:left .6s ease}

.fx .fx-tiles{margin-top:var(--sp-5)}
.fx .fx-tiles .tile b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .fx-tiles .tile small .i{font-size:13px;vertical-align:-2px}
.fx .fx-tl{display:block;color:var(--ink);text-decoration:none}
.fx .fx-tl .fx-ln{display:flex;align-items:center;gap:2px;color:var(--eb);font-weight:700}
.fx .fx-tl .fx-ln .i{font-size:15px}
.fx .fx-rows{margin-top:var(--sp-3)}
.fx .fx-log{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.35;border-radius:20px;padding:14px 16px}
.fx .fx-log .mu{font-weight:600;white-space:nowrap}
.fx .fx-none{margin:0}
.fx .fx-links{margin-top:26px}
.fx .fx-src{margin-top:14px}
.fx .fx-nf{margin:10px 0 8px}
.fx .btn{margin-top:16px}

/* ---------- #connect/<dir> ---------- */
.cx-h{position:relative;padding-top:4px}
.cx-h.has-hub{min-height:196px}
.cx-h .cx-hub{right:-14px;top:6px;width:156px;height:156px}
.cx-h .cx-hub .cx-hot{stroke:var(--ob);stroke-opacity:1}
.cx-h .cx-core{fill:var(--onband2)}
.cx-h .cx-off{fill:var(--onband)}
.cx-h .cx-on{fill:var(--ink)}
.cx-h .cx-txt text{fill:var(--ob);font:800 14px Inter,system-ui,sans-serif}
.cx-h .cx-txt .cx-ont{fill:var(--sheet)}
.cx-h .ey,.cx-h .cx-big,.cx-h .cx-lvl{position:relative}
.cx-h .cx-big{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.cx-h .cx-big .dp{font-size:112px}
.cx-h .cx-big .cx-u{font-size:32px;letter-spacing:0}
.cx-h .cx-big .cx-gt{display:flex;align-items:baseline;gap:8px}
.cx-h .cx-big .cx-gt .tn~.tn{margin-left:10px}
/* Over an hour reads "1h 15m", each number tight to its unit. */
.cx-h .cx-big.hm .dp{font-size:84px}
.cx-h .cx-big.hm .cx-u{font-size:28px}
.cx-h .cx-big.hm .cx-gt{gap:4px}
/* With the concourse diagram beside it the figure steps down, so it never meets the A gate. */
.cx-h.has-hub .cx-big .tn{font-size:100px}
.cx-h.has-hub .cx-big.hm .tn{font-size:70px}
.cx-h.has-hub .cx-big.hm .cx-u{font-size:24px}
.cx-h .cx-big .cx-unk{color:var(--onband)}
.cx-h .cx-big.was .dp{opacity:.5}
.cx-h .cx-big.was .tn{text-decoration:line-through;text-decoration-thickness:6px}
.cx-h .cx-lvl{margin-top:16px}
.cx-h .chip.cx-lvl:not(.rose){background:var(--sheet);color:var(--ink)}
.cx-h .chip.amb{box-shadow:inset 0 0 0 1.5px var(--warn)}
.cx-h .dot.amb{background:var(--warn)}

.cx .cx-bn{margin-bottom:14px}
.cx .cx-sum{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.cx .cx-tl{margin-top:14px}
.cx .cx-barw{position:relative;margin:6px 0}
.cx .cx-bar{display:flex;height:26px;border-radius:13px;overflow:hidden;background:var(--cr)}
.cx .cx-bar span{display:block;height:100%}
.cx .cx-s1{background:var(--pill)}
.cx .cx-s2{background:var(--sd)}
.cx .cx-s3{background-color:var(--cr)}
.cx .cx-mk{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.cx .cx-mk.land{background:var(--eb)}
.cx .cx-tl.risk .cx-mk:not(.land){background:var(--ro)}
.cx .cx-up,.cx .cx-dn{position:relative;height:40px}
.cx .cx-up>span,.cx .cx-dn>span{position:absolute;white-space:nowrap}
.cx .cx-up>span{bottom:0}
.cx .cx-dn>span{top:0}
.cx .cx-up small,.cx .cx-dn small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--eb)}
.cx .cx-up b,.cx .cx-dn b{display:block;font-size:16px;font-weight:800}
.cx .cx-doors small,.cx .cx-doors b{color:var(--ink)}
.cx .cx-tl.risk .cx-doors small,.cx .cx-tl.risk .cx-doors b{color:var(--rot)}
.cx .cx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cx .cx-grid small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--eb)}
.cx .cx-grid b{display:block;font-size:16px;font-weight:800}
.cx .cx-th{margin:12px 0 0;line-height:1.4}
.cx .cx-key{margin-top:6px}
.cx .cx-rows .rw b{line-height:1.25}
.cx .cx-chips{margin-top:22px}
.cx .cx-wx{white-space:normal;height:auto;min-height:32px;padding-top:6px;padding-bottom:6px}

/* ---------- #seats/<leg> ---------- */
.st-h{padding-top:6px}
.st-h .st-cfg{margin:10px 0 0;font-size:14px;font-weight:600;line-height:1.35;color:var(--obm);max-width:340px}
.st .st-gap{margin-bottom:14px}
.st .st-mine .st-ic{background:var(--ink);color:var(--cr)}
.st .st-mine .rw b{font-size:17px}
.st .st-why{display:flex !important;align-items:flex-start;gap:6px;margin-top:6px !important}
.st .st-why .i{font-size:15px;flex:none;margin-top:1px}
.st .st-why.good .i{color:var(--ok)}
.st .st-why.avoid .i{color:var(--amt)}
