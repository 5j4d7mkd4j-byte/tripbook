<title>nyc.</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"Inter Tight";src:url(fonts/intertight.woff2) format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:Figtree;src:url(fonts/figtree.woff2) format("woff2");font-weight:800;font-display:swap}
/* tokens.css */
/* Colour tokens. Light on :root, dark under the system preference unless the
   viewer forced light, and dark again when the viewer forced dark. */
:root{
  color-scheme:light;
  --page:#FDFDFD;--sheet:#FDFDFD;--band:#779995;--cr:#F2EEE1;--sd:#EDDBC6;--sdt:#16191A;
  --ro:#C4686B;--rog:#FDFDFD;--rot:#A4474B;--ink:#16191A;--mu:#5F6764;
  --gh:rgba(22,25,26,.28);--ln:rgba(22,25,26,.10);--ok:#2F7D5B;--tile:#FDFDFD;
  --nav:#FDFDFD;--navb:rgba(22,25,26,.06);--navs:0 10px 30px rgba(22,25,26,.12);--navi:#5F6764;
  --pill:#4A706D;--pillt:#FDFDFD;--eb:#4A706D;--ob:#FDFDFD;--obt:#16191A;--ht:rgba(22,25,26,.13);
  --s1:#E4D3BC;--s2:#CDB89C;--s3:#A9916F;--s4:#7E6A50;
  --rob:#C4686B;--robt:#16191A;--onband:rgba(253,253,253,.24);--onband2:rgba(253,253,253,.2);
  --scrim:rgba(22,25,26,.0);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#121514;--sheet:#1A1E1D;--band:#2E4A47;--cr:#25241F;--sd:#3A3127;--sdt:#F3E2CC;
    --ro:#E3979A;--rog:#16191A;--rot:#E3979A;--ink:#EEEBE2;--mu:#A4ACA9;
    --gh:rgba(238,235,226,.20);--ln:rgba(255,255,255,.08);--ok:#63C496;--tile:#2B2E2A;
    --nav:#222826;--navb:rgba(255,255,255,.06);--navs:0 10px 30px rgba(0,0,0,.4);--navi:#A9B2AF;
    --pill:#9CC0BC;--pillt:#121514;--eb:#9CC0BC;--ob:#EEEBE2;--obt:#EEEBE2;--ht:rgba(238,235,226,.16);
    --s1:#4A4134;--s2:#6B5D49;--s3:#8E7B60;--s4:#B49F80;
    --rob:#E3979A;--robt:#16191A;--onband:rgba(253,253,253,.14);--onband2:rgba(253,253,253,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121514;--sheet:#1A1E1D;--band:#2E4A47;--cr:#25241F;--sd:#3A3127;--sdt:#F3E2CC;
  --ro:#E3979A;--rog:#16191A;--rot:#E3979A;--ink:#EEEBE2;--mu:#A4ACA9;
  --gh:rgba(238,235,226,.20);--ln:rgba(255,255,255,.08);--ok:#63C496;--tile:#2B2E2A;
  --nav:#222826;--navb:rgba(255,255,255,.06);--navs:0 10px 30px rgba(0,0,0,.4);--navi:#A9B2AF;
  --pill:#9CC0BC;--pillt:#121514;--eb:#9CC0BC;--ob:#EEEBE2;--obt:#EEEBE2;--ht:rgba(238,235,226,.16);
  --s1:#4A4134;--s2:#6B5D49;--s3:#8E7B60;--s4:#B49F80;
  --rob:#E3979A;--robt:#16191A;--onband:rgba(253,253,253,.14);--onband2:rgba(253,253,253,.12);
}

/* base.css */
/* Shell, type and shared components. Visual spec: the approved Compound-style
   mockups (widget_v4). Sizes are px to match the spec at 390pt wide. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--band);color:var(--ink);font:15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--eb);outline-offset:2px;border-radius:10px}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Icons: inline sprite, <svg class="i"><use href="#i-name"/></svg> */
.i{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.125em;overflow:visible}

/* ---------- Shell ---------- */
#app{position:fixed;inset:0;background:var(--band);overflow:hidden}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  background:var(--page);transform-origin:50% 0;
  transition:transform .56s cubic-bezier(.32,.72,0,1),border-radius .56s cubic-bezier(.32,.72,0,1),background .3s}
#view[data-tone="cream"]{background:var(--cr)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.tb{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  height:calc(56px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--band);color:var(--ob);transition:background .3s,color .3s,opacity .3s}
#view[data-tone="cream"] .tb{color:var(--ink)}
.tbb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:14px}
.wm{font-family:Figtree,Inter,system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:inherit}
.av{width:38px;height:38px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;position:relative}
#view[data-tone="cream"] .av{background:var(--sheet)}
.av .bdg{position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;background:var(--ro);box-shadow:0 0 0 2px var(--band)}

#strip:empty{display:none}
#strip{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--band);color:var(--ob);padding-bottom:8px}
#view[data-tone="cream"] #strip{color:var(--ink)}
.strip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border-radius:14px;padding:8px 12px;background:var(--onband)}
.strip .i{font-size:16px}

.hero{position:relative;background:var(--band);color:var(--ob);min-height:40px;padding-bottom:28px;overflow:hidden}
.hero:empty{min-height:40px}
.sheet{position:relative;z-index:1;background:var(--sheet);border-radius:28px 28px 0 0;margin-top:-28px;padding-top:22px;
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));min-height:calc(100% - 96px)}
#view[data-tone="cream"] .hero{display:none}
#view[data-tone="cream"] .sheet{background:transparent;margin-top:0;border-radius:0;padding-top:8px}
#view.nonav .sheet{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* Floating nav */
.nv{position:fixed;z-index:8;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;max-width:520px;margin:0 auto;background:var(--nav);border-radius:33px;
  border:1px solid var(--navb);box-shadow:var(--navs);padding:6px;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .3s}
.nv.off{transform:translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
.nvi{position:relative;display:flex;height:100%}
.nvp{position:absolute;top:0;bottom:0;left:0;right:80%;border-radius:27px;background:var(--pill)}
.nvp.none{opacity:0}
.nv button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--navi);position:relative;z-index:1;transition:color .3s;border-radius:27px}
.nv button .i{font-size:22px}
.nv button[aria-current]{color:var(--pillt)}

/* Side menu (sits on the band behind the view) */
#menu{position:absolute;inset:0;color:var(--obt);padding-top:env(safe-area-inset-top,0px);overflow-y:auto;visibility:hidden}
#app.mo #menu{visibility:visible}
#app.mo #view{transform:translateY(calc(100% - 132px - env(safe-area-inset-bottom,0px)));border-radius:28px 28px 0 0;overflow:hidden;cursor:pointer;
  box-shadow:0 -12px 40px rgba(0,0,0,.12)}
#app.mo #view .tb{opacity:0}
#app.mo .nv{transform:translateY(calc(100% + 40px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
.mhd{display:flex;align-items:center;justify-content:space-between;height:56px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbody{padding-top:14px}
.smr{opacity:0;transform:translateX(-18px);transition:opacity .3s,transform .56s cubic-bezier(.32,.72,0,1)}
#app.mo .smr{opacity:1;transform:none}
.mr{display:flex;align-items:center;gap:14px;min-height:56px;width:100%;color:var(--obt)}
.mi{width:36px;height:36px;border-radius:12px;background:var(--onband2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.mt{flex:1;font-size:17px;font-weight:600;line-height:1.2}.mt small{display:block;font-size:13px;font-weight:400;opacity:.85}
.mr>.i{font-size:18px}

/* ---------- Type ---------- */
.ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--eb);font-weight:800}
.hero .ey,.on-band .ey{color:var(--obt)}
.dp{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.02em}
.tn{font-variant-numeric:tabular-nums}
.hl{margin:6px 0 0;font-size:32px;line-height:1.06;font-weight:300;letter-spacing:-.02em}.hl b{font-weight:800}
.h2{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin-top:6px}
.mu{color:var(--mu)}
.small{font-size:13px}
.sec{margin-top:22px}
.sec>.ey:first-child{margin-bottom:10px}
.stack>*+*{margin-top:12px}
.stack8>*+*{margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Components ---------- */
.card{border-radius:26px;padding:20px;position:relative;overflow:hidden;background:var(--cr)}
.card.sand{background:var(--sd);color:var(--sdt);--eb:var(--sdt);--mu:var(--sdt)}
.card.line{background:transparent;border:1.5px solid var(--ln)}
.card.rose{background:var(--rob);color:var(--robt);--eb:var(--robt);--mu:var(--robt)}
.card.tight{padding:14px 16px;border-radius:20px}
.il{position:absolute;pointer-events:none}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.lk{stroke:var(--ob);stroke-opacity:.34;fill:none}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;font-size:13px;font-weight:600;background:var(--sheet);color:var(--ink);white-space:nowrap;text-decoration:none;max-width:100%}
.chip .i{font-size:16px}
.chip.warn{background:transparent;border:1.5px solid var(--ro);color:var(--rot)}
.chip.rose{background:var(--rob);color:var(--robt)}
.chip.dk2{background:var(--ink);color:var(--page)}
.chip.cr{background:var(--cr)}
.chip.ghost{background:transparent;border:1.5px solid var(--ln)}
.chip.ob{background:var(--onband);color:var(--obt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.neutral{background:var(--mu)}.dot.stale,.dot.warn{background:var(--ro)}

.fab{width:52px;height:52px;border-radius:50%;background:var(--ro);color:var(--rog);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tile{background:var(--tile);border-radius:18px;padding:11px 13px;min-width:0;position:relative}
.tile small{display:block;font-size:13px;color:var(--mu)}
.tile b{display:block;font-size:22px;font-weight:800;margin:2px 0 1px}
.tile.ring{box-shadow:inset 0 0 0 2px var(--ro)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.rw{display:flex;gap:12px;align-items:flex-start;min-width:0}
.rw.c{align-items:center}
.rw>div{min-width:0}
.ic{width:40px;height:40px;border-radius:13px;background:var(--cr);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.card .ic{background:var(--sheet)}
.rw b{display:block;font-size:15px;font-weight:800}
.rw small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.box{background:var(--sheet);border-radius:18px;padding:10px 12px}

.cn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cn>div{background:var(--cr);border-radius:16px;padding:10px 11px;min-width:0}
.cn small{display:block;font-size:12px;color:var(--mu);font-weight:600}
.cn b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .w{box-shadow:inset 0 0 0 1.5px var(--ro)}.cn .w b{color:var(--rot)}

.ps{display:inline-flex;padding:4px;border-radius:22px;background:var(--onband);gap:2px}
.ps button{height:34px;padding:0 16px;border-radius:17px;font-size:14px;font-weight:800;color:var(--obt);display:flex;align-items:center;transition:background .3s,color .3s}
.ps button[aria-pressed="true"]{background:var(--sheet);color:var(--ink)}
.seg{display:inline-flex;padding:4px;border-radius:22px;background:var(--cr);gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:700;color:var(--mu);display:flex;align-items:center;gap:6px;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

.co{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:11px 14px;font-size:13px;font-weight:600;line-height:1.35;background:var(--sd);color:var(--sdt)}
.co .i{font-size:18px;margin-top:-1px}
.co.rose{background:var(--rob);color:var(--robt)}
.co.plain{background:var(--cr);color:var(--ink)}
.op{background:var(--cr);border-radius:20px;padding:9px 12px}
.mta{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.hatch{background:repeating-linear-gradient(135deg,var(--ht) 0 4px,transparent 4px 8px)}

/* Banners */
.bn{border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;background:var(--rob);color:var(--robt)}
.bn .i{font-size:20px;margin-top:1px}
.bn b{display:block;font-size:15px;font-weight:800}
.bn span{display:block;font-size:13px;font-weight:600}
.bn .bx{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.bn .bx .chip{height:30px;background:rgba(22,25,26,.12);color:inherit}
.bn.neutral{background:var(--cr);color:var(--ink)}
.bn.neutral .bx .chip{background:var(--sheet)}

/* Forms */
.fld{display:block}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
.inp{display:block;width:100%;height:50px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sheet);padding:0 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--eb)}
.inp.bad{border-color:var(--ro)}
.err{font-size:13px;font-weight:600;color:var(--rot);margin:6px 0 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;background:var(--ink);color:var(--page);font-weight:700;font-size:15px}
.btn.alt{background:var(--cr);color:var(--ink)}
.btn.rose{background:var(--ro);color:var(--rog)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--cr);color:var(--ink);flex:none}

/* Toast */
#toast{position:fixed;z-index:20;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;
  background:var(--ink);color:var(--page);font-size:14px;font-weight:600;padding:10px 16px;border-radius:18px;pointer-events:none;
  transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1);max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Motion helpers */
.sw{transition:transform .56s cubic-bezier(.32,.72,0,1),opacity .26s ease}
@keyframes flash{0%{background-color:var(--rob)}100%{background-color:transparent}}
.chg{animation:flash 1.6s ease-out 1}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.32,.72,0,1) both}
.skel{background:var(--cr);border-radius:12px;color:transparent!important}

#__err{position:fixed;z-index:99;left:8px;right:8px;top:8px;background:#B00020;color:#fff;font:12px/1.3 ui-monospace,monospace;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}

/* screens/airports.css */
/* Airports screens (#airports, #airport/<code>). Roots: .ap-hero (hero) and
   .ap-pg (body). Every selector starts with one of them. Colours are tokens. */

/* ---------- hero ---------- */
.ap-hero{position:relative;padding-top:4px;min-height:236px}
.ap-hero .ap-ps{position:relative;z-index:1}
.ap-hero .ap-ps button{height:44px;min-width:58px;padding:0 15px;border-radius:22px;justify-content:center;gap:6px;font-size:15px;letter-spacing:.02em}
.ap-hero .ap-nd{width:7px;height:7px;border-radius:50%;background:var(--ro);flex:none}
.ap-hero .ap-ps button[aria-pressed="true"] .ap-nd{background:var(--rot)}
.ap-hero .ap-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ap-hero .ap-top{position:relative;z-index:1;margin-top:18px}
.ap-hero .ap-ey{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-hero .ap-code{font-size:104px;margin:10px 0 0 -4px;color:var(--ob);letter-spacing:-.035em}
.ap-hero .ap-sub{margin:12px 0 0;max-width:72%;color:var(--ob)}
.ap-hero .ap-sub b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.ap-hero .ap-sub span{font-size:13px;font-weight:600;opacity:.88}
.ap-hero .ap-sub>span{display:block;margin-top:3px}
.ap-hero .ap-il{right:-6px;top:78px;width:128px;height:138px}
.ap-hero.ap-e{min-height:0}
.ap-hero.ap-e .hl{color:var(--ob)}

/* ---------- body: shared bits ---------- */
.ap-pg .ap-anc{scroll-margin-top:76px}
.ap-pg .ap-note{margin:0 0 10px;font-size:13px;color:var(--mu);line-height:1.4}
.ap-pg .ap-subh{margin:18px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.ap-pg .ap-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;min-width:0}
.ap-pg .ap-sh .ey{flex:none}
.ap-pg .ap-shs{font-size:13px;color:var(--mu);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ap-pg .ap-c44{height:44px;border-radius:22px;padding:0 16px;font-size:14px}
.ap-pg .ap-ml{margin-top:12px}
.ap-pg .ap-chev{font-size:20px;color:var(--mu);flex:none;align-self:center}
.ap-pg .ic .i{font-size:20px}

/* visit switch */
.ap-pg .ap-seg{display:flex;width:100%;margin-bottom:14px}
.ap-pg .ap-seg button{flex:1;height:44px;border-radius:20px;justify-content:center;font-size:14px;white-space:nowrap;padding:0 8px}

/* tiles */
.ap-pg .ap-cn b{font-size:18px}
.ap-pg .ap-chk{margin:8px 2px 0;font-size:13px;color:var(--mu)}
.ap-pg .ap-cos{margin-top:14px}
.ap-pg .co .ap-il2{display:flex;align-items:center;width:fit-content;min-height:44px;margin-top:8px;padding:0 16px;border-radius:22px;
  background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}

/* your flights here */
.ap-pg .ap-fl{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px;border-radius:20px;background:var(--cr);color:var(--ink);text-decoration:none;min-width:0}
.ap-pg .ap-fl .ic{background:var(--sheet)}
.ap-pg .ap-fl b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.ap-pg .ap-fl small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.ap-pg .ap-fc{flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.ap-pg .ap-fl .chip.cr{background:var(--sheet)}

/* jump row */
.ap-pg .ap-jump{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 0;padding:0 20px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ap-pg .ap-jump::-webkit-scrollbar{display:none}
.ap-pg .ap-j{display:inline-flex;align-items:center;gap:6px;flex:none;height:44px;padding:0 15px;border-radius:22px;background:var(--cr);color:var(--ink);font-size:14px;font-weight:700}
.ap-pg .ap-j .i{font-size:17px;color:var(--eb)}

/* ---------- steps ---------- */
.ap-pg .ap-steps{list-style:none;margin:0;padding:0}
.ap-pg .ap-st{display:grid;grid-template-columns:50px 34px minmax(0,1fr);column-gap:10px}
.ap-pg .ap-tm{font-size:14px;font-weight:800;text-align:right;padding-top:8px;white-space:nowrap}
.ap-pg .ap-sd{position:relative}
.ap-pg .ap-sd::before{content:'';position:absolute;left:16px;top:36px;bottom:2px;width:2px;border-radius:1px;background:var(--ln)}
.ap-pg .ap-st:last-child .ap-sd::before{display:none}
.ap-pg .ap-si{position:relative;width:34px;height:34px;border-radius:50%;background:var(--cr);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:17px}
.ap-pg .ap-sb{padding:6px 0 18px;min-width:0}
.ap-pg .ap-sb b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-sb small{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.4}
.ap-pg .ap-sb .ap-x{color:var(--ink);font-weight:600}
.ap-pg .ap-mn{display:flex!important;align-items:center;gap:5px}
.ap-pg .ap-in{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:var(--rot)}
.ap-pg .ap-st.done .ap-tm,.ap-pg .ap-st.done .ap-sb b{color:var(--mu)}
.ap-pg .ap-st.done .ap-si{background:var(--eb);color:var(--sheet)}
.ap-pg .ap-st.done .ap-sd::before{background:var(--eb);opacity:.5}
.ap-pg .ap-st.next .ap-si{background:var(--ro);color:var(--rog);box-shadow:0 0 0 4px var(--rob)}
.ap-pg .ap-st.next .ap-tm{color:var(--rot)}
.ap-pg .ap-st.wn .ap-si{background:var(--sd);color:var(--sdt)}

/* ---------- terminal map ---------- */
.ap-pg .ap-mv{--ap-ground:var(--cr);--ap-hall:var(--sheet);--ap-edge:var(--gh);
  position:relative;width:100%;min-height:240px;max-height:460px;border-radius:22px;overflow:hidden;background:var(--ap-ground);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;outline-offset:3px}
.ap-pg .ap-mv.zoomed{box-shadow:inset 0 0 0 2px var(--eb)}
.ap-pg .ap-mv:active{cursor:grabbing}
.ap-pg .ap-svg{display:block;width:100%;height:100%}
.ap-pg .ap-svg .m-bg{fill:var(--ap-ground)}
.ap-pg .ap-svg .m-wall{stroke:var(--ap-edge);fill:none}
.ap-pg .ap-svg .m-gate{fill:var(--eb)}
.ap-pg .ap-svg .m-sec{fill:var(--ink)}
.ap-pg .ap-svg .m-food{fill:var(--s3)}
.ap-pg .ap-svg .m-label{fill:var(--mu);font-weight:800;font-family:Inter,system-ui,sans-serif;letter-spacing:.02em}
.ap-pg .ap-svg .m-route{fill:none;stroke:var(--eb);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ap-pg .ap-svg .m-you{fill:var(--ro)}
.ap-pg .has-rt .m-route{display:none}
.ap-pg .ap-rc{fill:none;stroke:var(--sheet);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ap-pg .ap-rt{fill:none;stroke:var(--ro);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 8;
  vector-effect:non-scaling-stroke;animation:ap-march 1.2s linear infinite}
@keyframes ap-march{to{stroke-dashoffset:-20}}

/* pins (HTML overlay so text stays sharp and readable at every zoom) */
.ap-pg .ap-pins{position:absolute;inset:0;pointer-events:none}
.ap-pg .ap-pin{position:absolute;left:0;top:0;width:0;height:0}
.ap-pg .ap-pi{position:absolute;left:0;top:0;display:flex;align-items:center;white-space:nowrap;transform:translateY(-50%)}
.ap-pg .ap-pl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1;border-radius:9px;padding:5px 8px}
.ap-pg .ap-you{z-index:3}
.ap-pg .ap-you .ap-pi{left:-10px}
.ap-pg .ap-you .ap-pl{margin-left:6px;background:var(--ink);color:var(--page);box-shadow:0 2px 8px var(--gh)}
.ap-pg .ap-you.fl .ap-pi{left:auto;right:-10px;flex-direction:row-reverse}
.ap-pg .ap-you.fl .ap-pl{margin-left:0;margin-right:6px}
.ap-pg .ap-dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--ro);box-shadow:0 0 0 3px var(--sheet),0 2px 8px var(--gh);flex:none}
.ap-pg .ap-you.you .ap-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--ro);animation:ap-pulse 1.8s cubic-bezier(.2,.6,.4,1) infinite}
.ap-pg .ap-you.via .ap-dot{background:var(--eb);width:16px;height:16px;margin:0 2px}
.ap-pg .ap-you.via .ap-pl{background:var(--sheet);color:var(--ink)}
@keyframes ap-pulse{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.8);opacity:0}}
.ap-pg .ap-poi{z-index:2}
.ap-pg .ap-poi .ap-pi{left:-13px}
.ap-pg .ap-pb{width:26px;height:26px;border-radius:50%;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;
  font-size:15px;flex:none;box-shadow:0 0 0 1.5px var(--ln),0 1px 4px var(--gh)}
.ap-pg .ap-poi.k-security .ap-pb{color:var(--rot)}
.ap-pg .ap-poi.k-baggage .ap-pb,.ap-pg .ap-poi.k-taxi .ap-pb,.ap-pg .ap-poi.k-bus .ap-pb{color:var(--ink)}
.ap-pg .ap-poi .ap-pl{display:none;margin-left:4px;background:var(--sheet);color:var(--ink);box-shadow:0 1px 4px var(--gh)}
.ap-pg .ap-poi.lb .ap-pl{display:block}
.ap-pg .ap-poi.fl .ap-pi{left:auto;right:-13px;flex-direction:row-reverse}
.ap-pg .ap-poi.fl .ap-pl{margin-left:0;margin-right:4px}
.ap-pg .ap-gn{z-index:1}
.ap-pg .ap-gn .ap-pi{transform:translate(-50%,-50%);min-width:24px;justify-content:center;padding:3px 5px;border-radius:8px;
  background:var(--eb);color:var(--sheet);font-size:12px;font-weight:800;line-height:1}

/* tools under the map */
.ap-pg .ap-tools{display:flex;align-items:center;gap:8px;margin-top:10px}
.ap-pg .ap-tb{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;min-width:44px;border-radius:22px;
  background:var(--cr);color:var(--ink);font-size:14px;font-weight:700;flex:none;transition:opacity .2s}
.ap-pg .ap-tb .i{font-size:20px}
.ap-pg .ap-gt{padding:0 16px 0 13px;background:var(--ink);color:var(--page);min-width:0;flex:0 1 auto}
.ap-pg .ap-gt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-pg .ap-tb[disabled]{opacity:.38;cursor:default}
.ap-pg .ap-cap{margin:10px 2px 0;font-size:13px;color:var(--mu);min-height:18px}
.ap-pg .ap-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--mu);font-weight:600}
.ap-pg .ap-key span{display:inline-flex;align-items:center;gap:6px}
.ap-pg .ap-k{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.ap-pg .ap-k.you{background:var(--ro)}
.ap-pg .ap-k.rt{width:16px;height:4px;border-radius:2px;background:var(--ro)}
.ap-pg .ap-k.gt{width:8px;height:8px;background:var(--eb)}
.ap-pg .ap-k.sc{border-radius:2px;background:var(--ink)}
.ap-pg .ap-k.fd{width:8px;height:8px;background:var(--s3)}
.ap-pg .ap-notes{margin:12px 0 0;padding:0 0 0 18px;font-size:13px;line-height:1.45;color:var(--ink)}
.ap-pg .ap-notes li+li{margin-top:4px}
.ap-pg .ap-src{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:13px;color:var(--mu);line-height:1.4}
.ap-pg .ap-src .i{font-size:16px;margin-top:1px}
.ap-pg .ap-nomap{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--cr)}
.ap-pg .ap-nomap>.i{font-size:24px;color:var(--eb);margin-top:2px}
.ap-pg .ap-nomap b{display:block;font-size:15px;font-weight:800}
.ap-pg .ap-nomap small{display:block;font-size:13px;color:var(--mu);margin-top:2px}

/* ---------- security ---------- */
.ap-pg .ap-ck{padding:14px;border-radius:20px;background:var(--cr)}
.ap-pg .ap-ck .ic{background:var(--sheet)}
.ap-pg .ap-cks{margin-top:10px}
.ap-pg .ap-cks .chip.cr{background:var(--sheet)}
.ap-pg .ap-ok .i{color:var(--ok)}
.ap-pg .ap-dl{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.ap-pg .ap-dl>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:baseline}
.ap-pg .ap-dl dt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.ap-pg .ap-dl dd{margin:0;font-size:14px;font-weight:600;line-height:1.35}
.ap-pg .ap-cn2{margin:8px 0 0;font-size:13px;color:var(--mu);line-height:1.4}

/* ---------- food, services, links ---------- */
.ap-pg .ap-list{display:flex;flex-direction:column}
.ap-pg .ap-fd,.ap-pg .ap-sv{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln);min-width:0}
.ap-pg .ap-list>:first-child{border-top:0}
.ap-pg .ap-fd b,.ap-pg .ap-sv b,.ap-pg .ap-lk b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-fd small,.ap-pg .ap-sv small,.ap-pg .ap-lk small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.4}
.ap-pg .ap-fd .ap-fn{color:var(--ink)}
.ap-pg .ap-near{flex:none;max-width:36%;padding:5px 9px;border-radius:12px;background:var(--cr);font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ap-pg .ap-near.me{background:var(--eb);color:var(--sheet)}
.ap-pg .ap-lk{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-top:1px solid var(--ln);color:var(--ink);text-decoration:none}

/* ---------- ground ---------- */
.ap-pg .ap-gr{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:20px;background:var(--cr);color:var(--ink);text-decoration:none;min-width:0}
.ap-pg .ap-list>.ap-gr+.ap-gr{margin-top:8px}
.ap-pg .ap-gr .ic{background:var(--sheet)}
.ap-pg .ap-gr b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.ap-pg .ap-gr small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.4}
.ap-pg .ap-gr .ap-gd,.ap-pg .ap-gr .ap-bd{display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.ap-pg .ap-gd .i{color:var(--ok);margin-top:2px;flex:none}
.ap-pg .ap-bd .i{color:var(--rot);margin-top:2px;flex:none}
.ap-pg .ap-tr{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px;margin-bottom:10px;border-radius:20px;background:var(--sd);color:var(--sdt);text-decoration:none}
.ap-pg .ap-tr .ic{background:var(--sheet)}
.ap-pg .ap-tr b{display:block;font-size:15px;font-weight:800}
.ap-pg .ap-tr small{display:block;font-size:13px;margin-top:2px;opacity:.85}
.ap-pg .ap-tr .ap-chev{color:var(--sdt)}

/* ---------- facts, tips ---------- */
.ap-pg .ap-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap-pg .ap-fact{background:var(--cr);border-radius:18px;padding:11px 13px;min-width:0}
.ap-pg .ap-fact small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.ap-pg .ap-fact b{display:block;font-size:17px;font-weight:800;margin-top:2px;line-height:1.2;overflow-wrap:anywhere}
.ap-pg .ap-fact span{display:block;font-size:13px;color:var(--mu);margin-top:3px;line-height:1.35}
.ap-pg .ap-tips{list-style:none;margin:6px 0 0;padding:0}
.ap-pg .ap-tips li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:6px 0}
.ap-pg .ap-tips .i{font-size:17px;color:var(--eb);flex:none;margin-top:2px}
.ap-pg .ap-cav .i{color:var(--rot)}

/* screens/flights.css */
/* Flights screens. Roots: .fl (#flights), .fx (#flight/<leg>), .cx (#connect/<dir>),
   .st (#seats/<leg>); hero roots .fl-hero, .cx-h, .st-h. Every selector starts with one. */

/* ---------- shared bits ---------- */
.fl .fl-lk,.fx .fl-lk,.cx .fl-lk,.st .fl-lk,
.fl .bn .bx .fl-lk,.fx .bn .bx .fl-lk,.cx .bn .bx .fl-lk,.st .bn .bx .fl-lk{height:44px;border-radius:22px;padding:0 15px}
.fl .fl-lk .i,.fx .fl-lk .i,.cx .fl-lk .i,.st .fl-lk .i{font-size:16px}
.fl .fl-lk.cr2,.cx .fl-lk.cr2,.st .fl-lk.cr2{background:var(--cr)}
.fl .fl-btn{height:44px;border-radius:22px;padding:0 16px}
.fl .bn .bx .fl-btn{height:44px;background:var(--sheet);color:var(--ink)}

/* Row card used for links and facts (cream on white sheets, white on the cream detail page). */
.fx .fx-row,.cx .fx-row,.st .fx-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:12px;border-radius:20px;
  background:var(--sheet);color:var(--ink);text-decoration:none;min-width:0}
.cx .fx-row,.st .fx-row{background:var(--cr)}
.cx .fx-row .ic,.st .fx-row .ic{background:var(--sheet)}
.fx .fx-row b,.cx .fx-row b,.st .fx-row b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.fx .fx-row small,.cx .fx-row small,.st .fx-row small{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.fx .fx-go>.i:last-child,.cx .fx-go>.i:last-child,.st .fx-go>.i:last-child{font-size:20px;color:var(--mu);flex:none}

/* ---------- #flights hero ---------- */
.fl-hero{padding-top:6px}
.fl-hero .hl{max-width:340px}
.fl-hero .fl-hchips{margin-top:16px}

/* ---------- #flights body ---------- */
.fl .fl-chg{margin-bottom:6px}
.fl .fl-chg span+span{margin-top:3px}
.fl .fl-dir:first-of-type{margin-top:8px}
.fl .fl-dir+.fl-dir{margin-top:34px}
.fl .fl-dh{display:flex;align-items:flex-end;gap:10px}
.fl .fl-dh .ey{margin-bottom:4px}
.fl .fl-sum{margin-top:12px}
.fl .fl-note{margin-top:12px}
.fl .fl-note span+span{margin-top:6px}
.fl .fl-legs{margin-top:12px}

/* ticket */
.fl .fl-tk{display:block;position:relative;overflow:hidden;background:var(--cr);color:var(--ink);text-decoration:none;
  border-radius:24px;padding:14px 16px 14px}
.fl .fl-tk.bad{box-shadow:inset 0 0 0 2px var(--ro)}
.fl .fl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.fl .fl-no{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fl .fl-no .mu{font-weight:600}
.fl .fl-top .chip{flex:none}
.fl .fl-mid{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;margin-top:12px}
.fl .fl-end{min-width:0}
.fl .fl-end.r{text-align:right}
.fl .fl-code{display:block;font-size:46px;line-height:1}
.fl .fl-old{display:block;font-size:13px;line-height:18px;color:var(--mu);margin-top:6px}
.fl .fl-old.ph{visibility:hidden}
.fl .fl-t{display:block;font-size:20px;font-weight:800;margin-top:6px;white-space:nowrap}
.fl .fl-old+.fl-t{margin-top:0}
.fl .fl-t.late{color:var(--rot)}
.fl .fl-end small{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-path{display:flex;flex-direction:column;align-items:center;width:76px;padding-top:12px}
.fl .fl-pl{position:relative;display:flex;justify-content:center;width:100%;height:24px}
.fl .fl-line{position:absolute;left:0;right:0;top:11px;border-top:2px dashed var(--gh)}
.fl .fl-pl .i{position:relative;font-size:22px;width:34px;padding:0 6px;color:var(--eb);background:var(--cr)}
.fl .fl-path small{font-size:13px;color:var(--mu);white-space:nowrap;font-weight:700;margin-top:6px}
.fl .fl-meta{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--ln)}
.fl .fl-meta::before,.fl .fl-meta::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--sheet)}
.fl .fl-meta::before{left:-26px}
.fl .fl-meta::after{right:-26px}
.fl .fl-meta div{min-width:0}
.fl .fl-meta small{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-meta b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fl-meta b.mu{font-weight:600;font-size:15px}

/* connection strip between tickets */
.fl .fl-cx{display:flex;align-items:center;gap:12px;min-height:44px;margin:8px 10px;padding:10px 12px;border-radius:18px;
  border:1.5px dashed var(--ln);color:var(--ink);text-decoration:none}
.fl .fl-cx>.i:first-child{width:36px;height:36px;padding:8px;border-radius:12px;background:var(--cr);flex:none;color:var(--eb)}
.fl .fl-cx>.i:last-child{font-size:20px;color:var(--mu);flex:none}
.fl .fl-cx b{display:block;font-size:15px;font-weight:800}
.fl .fl-cx small{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.fl .fl-cx .fl-lv{font-weight:800;color:var(--ok)}
.fl .fl-cx.tight .fl-lv{color:var(--rot)}
.fl .fl-cx.tight{border-color:var(--ro)}
.fl .fl-cx.risk{background:var(--rob);color:var(--robt);border-color:transparent}
.fl .fl-cx.risk small,.fl .fl-cx.risk .fl-lv,.fl .fl-cx.risk>.i:last-child{color:var(--robt)}
.fl .fl-cx.risk>.i:first-child{background:var(--sheet);color:var(--rot)}

.fl .fl-ci{margin-top:14px}
.fl .fl-ci b{font-size:15px}
.fl .fl-dir.done .fl-tk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ln)}
.fl .fl-dir.done .fl-path .i{background:var(--sheet)}
.fl .fl-foot{margin-top:30px}

/* ---------- #flight/<leg> (cream page) ---------- */
#view[data-screen="flight"] .tb,#view[data-screen="flight"] #strip{background:var(--cr)}
#view[data-screen="flight"] .strip{background:var(--sheet)}
.fx{padding-top:4px}
.fx .fx-codes{display:flex;align-items:flex-end;gap:12px;margin-top:12px;min-width:0}
.fx .fx-from{font-size:min(27vw,112px);color:var(--ink);flex:none}
.fx .fx-to{min-width:0;padding-bottom:2px}
.fx .fx-to .ey{color:var(--mu);margin-bottom:8px}
.fx .fx-to .dp{display:block;font-size:min(17vw,70px);color:var(--gh)}
.fx .fx-gap{margin-top:12px}
.fx .fx-bn span+span{margin-top:4px}
.fx .fx-stat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:18px}
.fx .fx-nc{font-weight:600}

.fx .fx-times{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end;margin-top:22px}
.fx .fx-times .r{text-align:right}
.fx .fx-tw{display:block;font-size:13px;color:var(--mu);font-weight:600}
.fx .fx-tw s{color:var(--mu)}
.fx .fx-t{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.fx .fx-tz{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.fx .fx-mid{text-align:center;padding-bottom:4px;min-width:0}
.fx .fx-mid small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:4px;white-space:nowrap}
.fx .fx-dash{position:relative;height:24px}
.fx .fx-dash::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--gh)}
.fx .fx-dash>span{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;padding:0 4px;background:var(--cr);color:var(--ink);font-size:22px;transition:left .6s ease}

.fx .fx-tiles{margin-top:20px}
.fx .fx-tiles .tile b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .fx-tiles .tile small .i{font-size:13px;vertical-align:-2px}
.fx .fx-tl{display:block;color:var(--ink);text-decoration:none}
.fx .fx-tl .fx-ln{display:flex;align-items:center;gap:2px;color:var(--eb);font-weight:700}
.fx .fx-tl .fx-ln .i{font-size:15px}
.fx .fx-rows{margin-top:12px}
.fx .fx-lv{font-weight:800;color:var(--ok)}
.fx .fx-lv.tight,.fx .fx-lv.risk{color:var(--rot)}
.fx .fx-log{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.35;background:var(--sheet);border-radius:20px;padding:14px 16px}
.fx .fx-log .mu{font-weight:600;white-space:nowrap}
.fx .fx-none{margin:0}
.fx .fx-links{margin-top:26px}
.fx .fx-src{margin-top:14px}
.fx .fx-nf{margin:10px 0 8px}
.fx .btn{margin-top:16px}

/* ---------- #connect/<dir> ---------- */
.cx-h{position:relative;min-height:196px;padding-top:4px}
.cx-h .cx-hub{right:-14px;top:6px;width:156px;height:156px}
.cx-h .cx-hub .cx-hot{stroke:var(--ob);stroke-opacity:1}
.cx-h .cx-core{fill:var(--onband2)}
.cx-h .cx-off{fill:var(--onband)}
.cx-h .cx-on{fill:var(--ro)}
.cx-h .cx-txt text{fill:var(--ob);font:800 14px Inter,system-ui,sans-serif}
.cx-h .cx-txt .cx-ont{fill:var(--rog)}
.cx-h .ey,.cx-h .cx-big,.cx-h .cx-lvl{position:relative}
.cx-h .cx-big{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.cx-h .cx-big .dp{font-size:112px}
.cx-h .cx-big .cx-u{font-size:32px;letter-spacing:0}
.cx-h .cx-big .cx-unk{color:var(--onband)}
.cx-h .cx-big.was .dp{opacity:.5}
.cx-h .cx-big.was .tn{text-decoration:line-through;text-decoration-thickness:6px}
.cx-h .cx-lvl{margin-top:16px}
.cx-h .chip.cx-lvl:not(.rose):not(.warn){background:var(--sheet)}
.cx-h .chip.warn.cx-lvl{background:var(--sheet);border-color:var(--ro)}

.cx .cx-bn{margin-bottom:14px}
.cx .cx-sum{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.cx .cx-tl{margin-top:14px}
.cx .cx-barw{position:relative;margin:6px 0}
.cx .cx-bar{display:flex;height:26px;border-radius:13px;overflow:hidden;background:var(--cr)}
.cx .cx-bar span{display:block;height:100%}
.cx .cx-s1{background:var(--pill)}
.cx .cx-s2{background:var(--sd)}
.cx .cx-s3{background-color:var(--cr)}
.cx .cx-mk{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ro)}
.cx .cx-mk.land{background:var(--ink)}
.cx .cx-up,.cx .cx-dn{position:relative;height:40px}
.cx .cx-up>span,.cx .cx-dn>span{position:absolute;white-space:nowrap}
.cx .cx-up>span{bottom:0}
.cx .cx-dn>span{top:0}
.cx .cx-up small,.cx .cx-dn small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--eb)}
.cx .cx-up b,.cx .cx-dn b{display:block;font-size:16px;font-weight:800}
.cx .cx-doors small,.cx .cx-doors b{color:var(--rot)}
.cx .cx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cx .cx-grid small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--eb)}
.cx .cx-grid b{display:block;font-size:16px;font-weight:800}
.cx .cx-th{margin:12px 0 0;line-height:1.4}
.cx .cx-rows .rw b{line-height:1.25}
.cx .cx-chips{margin-top:22px}
.cx .cx-wx{white-space:normal;height:auto;min-height:32px;padding-top:6px;padding-bottom:6px}

/* ---------- #seats/<leg> ---------- */
.st-h{padding-top:6px}
.st-h .st-cfg{margin:10px 0 0;font-size:14px;font-weight:600;line-height:1.35;color:var(--ob);max-width:340px}
.st .st-gap{margin-bottom:14px}
.st .st-mine .st-ic{background:var(--ro);color:var(--rog)}
.st .st-mine .rw b{font-size:17px}
.st .st-why{display:flex !important;align-items:flex-start;gap:6px;margin-top:6px !important}
.st .st-why .i{font-size:15px;flex:none;margin-top:1px}
.st .st-why.good .i{color:var(--ok)}
.st .st-why.avoid .i{color:var(--rot)}
.st .st-key{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:20px;font-size:13px;font-weight:600;color:var(--mu)}
.st .st-key>span{display:inline-flex;align-items:center;gap:6px}
.st .st-key .st-s{display:inline-block;width:16px;height:16px;border-radius:5px;flex:none}
.st .st-key .st-x{display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--ro)}
.st .st-map{margin-top:14px;padding:16px 14px 18px;border-radius:64px 64px 26px 26px;background:var(--cr)}
.st .st-nose{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--mu);padding-top:6px}
.st .st-cab{margin-top:16px}
.st .st-cn{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.st .st-row{position:relative;display:flex;align-items:center;margin-top:5px}
.st .st-head{margin-top:0}
.st .st-g{flex:var(--n) 1 0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;min-width:0}
.st .st-head .st-g span{text-align:center;font-size:13px;font-weight:800;color:var(--mu)}
.st .st-ai{flex:none;width:34px;text-align:center;font-size:13px;font-weight:700;color:var(--mu)}
.st .st-s{height:28px;border-radius:8px 8px 5px 5px;background:var(--sheet);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;min-width:0}
.st .st-s.first{background:var(--s1)}
.st .st-s.xl{background:var(--sd)}
.st .st-s.good{box-shadow:inset 0 0 0 2px var(--ok)}
.st .st-s.bad{background-image:repeating-linear-gradient(135deg,var(--ht) 0 4px,transparent 4px 8px)}
.st .st-s.me{background:var(--ro);color:var(--rog);box-shadow:0 0 0 2px var(--cr),0 0 0 4px var(--ro)}
.st .st-key .st-s.me{box-shadow:none}
.st .st-s.gone{visibility:hidden}
.st .st-row.exit::before,.st .st-row.exit::after{content:"";position:absolute;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--ro)}
.st .st-row.exit::before{left:-10px}
.st .st-row.exit::after{right:-10px}
.st .st-note{margin:10px 0 0;line-height:1.35}
.st .st-li{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4}
.st .st-li .i{font-size:17px;flex:none;margin-top:1px;color:var(--eb)}
.st .st-li.good .i{color:var(--ok)}
.st .st-li.bad .i{color:var(--rot)}
.st .st-add{margin-top:2px}

.fl .chip.rose .dot,.fx .chip.rose .dot,.cx-h .chip.rose .dot,.cx .chip.rose .dot{background:var(--robt)}
.fx .fx-times.off .fx-t{color:var(--mu);text-decoration:line-through;text-decoration-thickness:3px}
.fx .fx-times.off .fx-dash span{opacity:.4}
.fx .tile.fx-off b{color:var(--mu)}
.fl a.btn,.fx a.btn,.cx a.btn,.st a.btn{text-decoration:none}
.fx .bn.neutral{background:var(--sheet)}
.fx .bn.neutral .bx .chip{background:var(--cr)}
.fx .fx-times .fx-x .fx-t{color:var(--mu);text-decoration:line-through;text-decoration-thickness:3px;font-size:26px}
.fx .fx-times .fx-x .fx-tw{white-space:nowrap}

/* screens/food.css */
/* Food screen (#food). Every selector starts with .fd- */

/* ---------- hero ---------- */
.fd-hero{padding-top:4px}
.fd-big{margin:8px 0 0 -3px;font-size:min(118px,30vw);color:var(--ob)}
.fd-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fd-stats .chip{height:34px;font-size:14px}

/* ---------- search row ---------- */
.fd-srow{display:flex;align-items:center;gap:10px}
.fd-search{position:relative;flex:1;min-width:0}
.fd-si{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--mu);pointer-events:none}
.fd-search .fd-q{padding:0 46px 0 44px;text-overflow:ellipsis}
.fd-q::placeholder{color:var(--mu);opacity:1}
.fd-q::-webkit-search-cancel-button,.fd-q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.fd-qx{position:absolute;right:3px;top:3px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mu);border-radius:14px}
.fd-fbtn{position:relative;flex:none;width:50px;height:50px;border-radius:16px;background:var(--cr);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:23px}
.fd-fn{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ro);color:var(--rog);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--sheet)}

/* ---------- quick chips (horizontal) ---------- */
.fd-chips,.fd-acs{display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin-left:calc(-1 * max(20px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));
  padding-left:calc(max(20px,env(safe-area-inset-left,0px)) - 3px);padding-right:calc(max(20px,env(safe-area-inset-right,0px)) - 3px)}
.fd-chips::-webkit-scrollbar,.fd-acs::-webkit-scrollbar{display:none}
.fd-chips{margin-top:8px}
.fd-qc{flex:none;height:44px;display:flex;align-items:center;padding:0 3px;border-radius:18px}
.fd-qcp{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;background:var(--cr);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s}
.fd-qcp .i{font-size:17px;color:var(--eb)}
.fd-qc[aria-pressed="true"] .fd-qcp{background:var(--ink);color:var(--page)}
.fd-qc[aria-pressed="true"] .fd-qcp .i{color:inherit}
.fd-qc[aria-disabled="true"]{cursor:default}
.fd-qc[aria-disabled="true"] .fd-qcp{opacity:.42}
.fd-n{font-size:13px;font-weight:600;color:var(--mu)}
.fd-qc[aria-pressed="true"] .fd-n{color:inherit;opacity:.72}
.fd-od{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

/* ---------- view + sort bar ---------- */
.fd-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.fd-seg{flex:none}
.fd-seg button{height:40px;padding:0 13px;border-radius:20px}
.fd-seg button .i{font-size:18px}
.fd-sort{position:relative;flex:0 1 auto;min-width:0;display:flex;align-items:center;height:48px;border-radius:24px;background:var(--cr);color:var(--ink)}
.fd-sort select{-webkit-appearance:none;appearance:none;border:0;margin:0;background:transparent;height:48px;max-width:100%;min-width:0;
  padding:0 34px 0 38px;border-radius:24px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-overflow:ellipsis}
.fd-sic,.fd-sch{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.fd-sic{left:13px;font-size:18px;color:var(--eb)}
.fd-sch{right:12px;font-size:16px;color:var(--mu)}

/* ---------- results head ---------- */
.fd-rh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-top:12px}
.fd-cnt{margin:0;font-size:14px;color:var(--mu)}
.fd-cnt b{color:var(--ink);font-weight:800}
.fd-lnk{display:inline-flex;align-items:center;height:44px;padding:0 6px;font-size:14px;font-weight:700;color:var(--eb);white-space:nowrap;flex:none;border-radius:12px}
.fd-ac{flex:none;height:44px;display:flex;align-items:center;padding:0 3px;border-radius:17px}
.fd-ac>span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 13px;border-radius:17px;background:var(--pill);color:var(--pillt);font-size:13px;font-weight:700;white-space:nowrap}
.fd-ac .i{font-size:15px}
.fd-note{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:6px;padding:2px 6px 2px 14px;border-radius:16px;background:var(--cr);font-size:13px;font-weight:600;line-height:1.35}
.fd-note>.i{font-size:18px;color:var(--eb)}
.fd-note .grow{padding:6px 0}

/* ---------- cards ---------- */
.fd-list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fd-gh{margin:12px 2px 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--eb);font-weight:800}
.fd-gh:first-child{margin-top:4px}
.fd-card{position:relative;display:flex;align-items:stretch;min-height:152px;border-radius:22px;background:var(--cr);color:var(--ink);text-decoration:none;overflow:hidden;transition:transform .2s}
.fd-card:active{transform:scale(.985)}
.fd-card:focus-visible{border-radius:22px}
.fd-th{position:relative;flex:none;width:104px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:color-mix(in srgb,var(--fb) 24%,var(--cr));color:var(--fb);font-size:30px}
.fd-th img,.fd-pth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fd-ki{opacity:.75}
.fd-cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:12px 14px 13px}
.fd-nm{font-size:16px;font-weight:800;line-height:1.22;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fd-rt{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap;min-width:0}
.fd-rt b{font-weight:800;font-size:14px}
.fd-stars{display:inline-flex;gap:1px;font-size:14px;color:var(--ro)}
.fd-mu{color:var(--mu)}
.fd-meta{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-st{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:2px;min-width:0}
.fd-oc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--sheet);font-size:13px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fd-closing{color:var(--rot)}
.fd-closing .fd-od{background:var(--ro)}
.fd-closed,.fd-unk{color:var(--mu)}
.fd-closed .fd-od,.fd-unk .fd-od{background:var(--mu)}
.fd-unk .fd-od{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mu)}
.fd-away{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.fd-away .i{font-size:15px}
.fd-ord{font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd-ord b{font-weight:800;color:var(--eb)}
.fd-bdgs{display:flex;flex-wrap:wrap;gap:5px;max-height:26px;overflow:hidden;margin-top:3px}
.fd-bdg{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px 0 7px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap;
  background:color-mix(in srgb,var(--fb) 15%,var(--sheet));color:var(--ink)}
.fd-bdg .i{font-size:15px;color:var(--fb)}

/* ---------- empty states ---------- */
.fd-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 8px 12px;text-align:center}
.fd-eic{width:64px;height:64px;border-radius:22px;background:var(--cr);color:var(--eb);font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.fd-empty p{margin:0;max-width:310px;font-size:15px;line-height:1.42;color:var(--mu)}
.fd-ebtns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.fd-hint{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;margin-top:4px}
.fd-hint p{display:flex;align-items:flex-start;gap:8px;max-width:330px;padding:10px 14px;border-radius:16px;background:var(--cr);color:var(--ink);font-size:14px;text-align:left}
.fd-hint p .i{font-size:18px;color:var(--eb);margin-top:1px}
.fd-foot{margin:24px 8px 0;font-size:13px;line-height:1.45;color:var(--mu);text-align:center}
.fd-mapph{height:1px}

/* ---------- filter sheet ---------- */
.fd-modal{position:fixed;inset:0;z-index:12}
.fd-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--robt) 48%,transparent);opacity:0;transition:opacity .28s ease;cursor:default}
.fd-modal.on .fd-scrim{opacity:1}
.fd-panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:calc(100% - 52px - env(safe-area-inset-top,0px));
  background:var(--sheet);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:var(--navs);transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1)}
.fd-modal.on .fd-panel{transform:none}
.fd-phd{flex:none;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--ln)}
.fd-grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--gh);margin:0 auto 6px}
.fd-phr{display:flex;align-items:center;gap:10px;min-height:46px}
.fd-on{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:var(--pill);color:var(--pillt);font-size:13px;font-weight:800}
.fd-x{width:44px;height:44px;flex:none;border-radius:14px;background:var(--cr);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px}
.fd-pb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:2px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px))}
.fd-sec{margin-top:18px}
.fd-sec>.ey{margin:0 0 4px 2px}
.fd-opts{display:flex;flex-wrap:wrap;gap:0 6px}
.fd-opt{display:inline-flex;align-items:center;height:44px;max-width:100%;border-radius:19px}
.fd-op{display:inline-flex;align-items:center;gap:7px;height:38px;max-width:100%;padding:0 14px;border-radius:19px;background:var(--cr);color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
.fd-opt[aria-pressed="true"] .fd-op{background:var(--ink);color:var(--page)}
.fd-opt[aria-pressed="true"] .fd-n{color:inherit;opacity:.72}

.fd-pf{flex:none;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--ln)}

.fd-mbot{position:absolute;z-index:2;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.fd-mrow{display:flex;align-items:center;gap:8px;pointer-events:auto}
.fd-mrow .fd-seg{background:var(--sheet);box-shadow:var(--navs)}

.fd-mcount:not(:empty){flex:0 1 auto;display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:18px;background:var(--sheet);box-shadow:var(--navs);
  font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* screens/place.css */
/* Place screen (#place/<alias>). Every selector starts with .pl- */

/* ---------- hero: photos ---------- */
.pl-hero{padding-top:2px}
.pl-galw{position:relative;margin:0 -20px}
.pl-gal{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 20px;scroll-padding:0 20px;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pl-gal::-webkit-scrollbar{display:none}
/* lets the last photo snap to the left edge like the others */
.pl-gal::after{content:"";flex:0 0 calc(16% - 10px)}
.pl-ph{position:relative;display:block;flex:0 0 84%;height:250px;border-radius:24px;overflow:hidden;scroll-snap-align:start;background:var(--onband2)}
.pl-ph.pl-one{flex-basis:100%}
.pl-gal:has(.pl-one)::after{display:none}
.pl-ph .pl-img,.pl-dimg .pl-img{display:block;width:100%;height:100%;object-fit:cover}
.pl-cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:15px;background:var(--sheet);color:var(--ink);font-size:13px;font-weight:600}
.pl-cap span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl-cap b{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--eb);flex:none}
.pl-cnt{position:absolute;top:10px;left:30px;display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;
  background:var(--sheet);color:var(--ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
.pl-cnt .i{font-size:15px;color:var(--eb)}
.pl-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:120px;border-radius:24px;
  background:var(--onband2);color:var(--obt);font-size:14px;font-weight:600}
.pl-none .i{font-size:28px;opacity:.8}

/* a photo that could not load */
.pl-bad .pl-img{visibility:hidden}
.pl-badm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;
  text-align:center;font-size:13px;font-weight:600;color:var(--obt);background:var(--onband2)}
.pl-badm .i{font-size:24px;opacity:.8}
.pl-dimg .pl-badm{color:var(--mu);background:var(--cr)}
.pl-lb .pl-badm{background:transparent;font-size:15px;color:var(--ob)}

/* ---------- hero: title + status ----------
   Text on the translucent --onband fill uses --obt (as base .chip.ob does): white on it
   is about 2.2:1 in the light theme, --obt is over 7:1. */
.pl-ttl{margin-top:20px}
.pl-name{margin:12px 0 0;padding-top:2px;color:var(--ob);text-wrap:balance;overflow-wrap:break-word}
.pl-t60{font-size:60px}.pl-t50{font-size:50px}.pl-t42{font-size:42px}.pl-t36{font-size:36px}.pl-t30{font-size:30px}.pl-t26{font-size:26px}
.pl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:14px;font-size:15px;font-weight:600}
.pl-rate{display:inline-flex;align-items:center;gap:7px}
.pl-rate b{font-weight:800}
.pl-stars{display:inline-flex;gap:1px;font-size:16px}
.pl-sep{opacity:.6}
.pl-where{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:15px;line-height:1.35}
.pl-where .i{font-size:17px;margin-top:1px}
.pl-stat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.pl-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:700;
  background:var(--onband);color:var(--obt);white-space:nowrap;max-width:100%}
.pl-chip .i{font-size:17px}
.pl-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pl-ok{background:var(--sheet);color:var(--ink)}
.pl-ok .pl-dot{background:var(--ok)}
.pl-soon{background:var(--rob);color:var(--robt)}
.pl-shut .pl-dot,.pl-na .pl-dot{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
button.pl-ask{height:44px;border-radius:22px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--onband)}
button.pl-ask[disabled]{opacity:.7}

/* ---------- sheet ---------- */
.pl-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-acts.pl-n1{grid-template-columns:1fr}.pl-acts.pl-n2{grid-template-columns:repeat(2,1fr)}.pl-acts.pl-n3{grid-template-columns:repeat(3,1fr)}
.pl-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;border-radius:18px;background:var(--cr);
  color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;min-width:0}
.pl-act .i{font-size:23px;color:var(--eb)}
.pl-sec{margin-top:30px}
.pl-acts+.pl-sec{margin-top:26px}
.pl-sec>.h2{margin-bottom:12px}
.pl-sum{margin:0;font-size:16px;line-height:1.5}
.pl-facts{margin-top:16px;border-radius:22px;background:var(--cr);padding:2px 16px}
.pl-fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.pl-fact+.pl-fact{border-top:1px solid var(--ln)}
.pl-fact>div{min-width:0}
.pl-fact small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--eb)}
.pl-fact div>span{display:block;font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.pl-fi{width:34px;height:34px;border-radius:12px;background:var(--sheet);color:var(--eb);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pl-good,.pl-also{margin-top:16px}
.pl-lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--eb);margin-bottom:8px}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px}
.pl-tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 13px;border-radius:17px;background:var(--cr);color:var(--ink);
  font-size:14px;font-weight:600;line-height:1.2;max-width:100%}
.pl-tag .i{font-size:16px;color:var(--eb)}
.pl-tag.pl-warn{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ro);color:var(--rot)}
.pl-tag.pl-warn .i{color:var(--rot)}

/* what to order */
.pl-dishes{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.pl-dishes::-webkit-scrollbar{display:none}
.pl-dish{flex:0 0 148px;display:flex;flex-direction:column;gap:3px;scroll-snap-align:start;text-align:left;min-width:0;border-radius:18px}
.pl-dimg{position:relative;display:block;width:148px;height:148px;border-radius:18px;overflow:hidden;background:var(--cr);margin-bottom:7px}
.pl-dnone{display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--mu)}
.pl-dish b{font-size:15px;font-weight:800;line-height:1.25}
.pl-dish small{font-size:13px;color:var(--mu);line-height:1.35}

/* people love / watch out / tips */
.pl-ops{display:grid;gap:10px}
.pl-h3{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:17px;font-weight:800}

.pl-list{list-style:none;margin:0;padding:0}

.pl-tips{list-style:none;margin:0;padding:0}

/* hours */
.pl-hrs{border-radius:22px;background:var(--cr);padding:14px 16px 8px}

.pl-note{display:flex;gap:8px;align-items:flex-start;margin:4px 0 6px;padding-top:10px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);font-weight:600}

/* details */
.pl-attrs{margin-bottom:16px}
.pl-quiet{margin:0 0 16px;font-size:14px;color:var(--mu)}
.pl-loc{border-radius:22px;overflow:hidden;background:var(--cr)}
.pl-map{position:relative;height:180px;background:var(--band)}

.pl-mapa{position:absolute;inset:0;z-index:1}

.pl-pin{background:none;border:0}

.pl-addr{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px}

.pl-copy{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--eb);flex:none}
.pl-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pl-link{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 14px;border-radius:16px;background:var(--cr);color:var(--ink);
  text-decoration:none;font-size:14px;font-weight:700;min-width:0}

.pl-foot{display:flex;align-items:center;justify-content:center;gap:6px;margin:34px 0 0;font-size:13px;color:var(--mu);text-align:center}

/* not found */
.pl-miss{padding:14px 0 10px}

/* ---------- full-screen photo viewer ----------

.pl-lb-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

.pl-lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pl-lb-track::-webkit-scrollbar{display:none}
